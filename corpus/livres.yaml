    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 5

    note: >
      OUVERT LE 2026-09-08. L16.C01 remplace l'amorce et ouvre LE TEXTE DONT LE
      DISPOSITIF TIRE SON SECOND RESSORT DE REFLUX -- S. Gesell, The Natural
      Economic Order, traduction Philip Pye, original allemand de 1916, regime
      a_verifier. LE CORPUS LE CITAIT DEPUIS L1.C08 EN AYANT ECRIT DANS LE MEME
      CHAPITRE QU'IL NE L'AVAIT PAS OUVERT.
      LE TAUX EXISTE ET IL EST MOTIVE : "Free-Money loses ONE-THOUSANDTH of its
      face value WEEKLY, or about 5 % annually" -- 5,2 % en version dollar, 5,4 %
      en version britannique -- ET LE TAUX EST IMPRIME SUR LE BILLET, en 52 cases
      datees ou le detenteur colle un timbre hebdomadaire. LA CONCEPTION
      D'ORIGINE SATISFAIT DONC PAR CONSTRUCTION LA CONDITION QUE L19.C03 A
      ETABLIE LA VEILLE : on ne peut pas decider apres coup le taux d'un billet
      dont les cases sont deja imprimees. LE CORPUS N'A JAMAIS FIXE DE TAUX ; SON
      ANCETRE EN AVAIT UN, CHIFFRE, MOTIVE ET GRAVE DANS L'OBJET.
      LE MOTIF N'EST PAS ECOLOGIQUE : "the purpose of Free-Money is to BREAK THE
      UNFAIR PRIVILEGE ENJOYED BY MONEY [...] namely THAT IT IS INDESTRUCTIBLE".
      C'est un argument de JUSTICE DANS L'ECHANGE et non de preservation de la
      nature. LE DISPOSITIF EMPLOIE L'INSTRUMENT POUR UNE FIN AUTRE QUE CELLE QUI
      L'A FAIT CONCEVOIR -- ce n'est pas une objection, mais le corpus ne peut
      plus se reclamer de cette filiation sans preciser qu'il en retient LE
      MECANISME ET NON LA RAISON.
      ET LE RESULTAT DU CHAPITRE : LA REGLE D'EMISSION EST INCOMPATIBLE. Le
      bureau emetteur est "bound to adapt the issue of money [...] in such a
      manner that THE GENERAL LEVEL OF PRICES REMAINS STABLE" ; il "will ISSUE
      MORE MONEY WHEN THE PRICES OF GOODS TEND TO FALL, and WITHDRAW MONEY WHEN
      PRICES TEND TO RISE". LA QUANTITE EMISE EST COMMANDEE PAR UN INDICE DE PRIX
      ET PAR RIEN D'AUTRE. Sous le dispositif elle est commandee par LA
      QUALIFICATION REGENERATIVE. LES DEUX REGLES NE PEUVENT PAS GOUVERNER LE MEME
      EMETTEUR : si les prix baissent et qu'aucune activite regenerative n'est
      qualifiee, l'une commande d'emettre et l'autre l'interdit. LE CORPUS HERITE
      LE RESSORT DE REFLUX SANS HERITER LA REGLE D'EMISSION, ALORS QUE L'AUTEUR
      LES TENAIT ENSEMBLE -- chez lui la fonte accelere la circulation, la regle
      de prix regle la quantite, ET LES DEUX VISENT LA STABILITE. QUESTION
      OUVERTE ET NON TRANCHEE : la fonte a-t-elle les effets qu'on lui prete
      lorsqu'elle est associee a une regle d'emission qui n'est pas celle pour
      laquelle elle a ete concue ? AUCUN CHAPITRE NE L'A DEMANDE.
      TROIS PRECISIONS QUI COMPOSENT AVEC LE LIVRE 19. Le retrait est AUTOMATIQUE
      et non un reflux -- "all that the Currency Office has to do [...] is TO DO
      NOTHING. Any surplus CONSUMES ITSELF AUTOMATICALLY". L'unite N'EST JAMAIS
      REMBOURSEE -- "Free-Money is NOT REDEEMED by the Currency Office", de sorte
      que la question du passif se pose a cette conception aussi et que son auteur
      ne la traite pas. ET UNE CONVERGENCE A CENT DIX ANS D'ECART : "with public
      treasuries the loss is only nominal, since THE STATE PROFITS BY THE
      DEPRECIATION OF THE TOTAL CIRCULATION" -- L19.C03 a tranche la veille, par
      la norme statistique, la bifurcation que L11.C01 avait laissee ouverte ;
      L'AUTEUR LA TRANCHAIT DEJA EN 1916, EN UNE PHRASE, DANS LE MEME SENS.
      GRILLE FIXEE A CINQ QUESTIONS, dont la premiere est celle que ce chapitre
      ouvre et que personne n'avait posee.
      RESERVES : LA REPONSE A L'OBJECTION DE FUITE N'EST PAS OUVERTE ALORS QUE LE
      CORPUS SAIT QU'ELLE EXISTE -- L1.C10 ecrit que l'auteur "y repondait par la
      reforme fonciere (Freiland)", et le chapitre n'a ouvert que la partie sur la
      MONNAIE et non celle sur la TERRE, qui est dans le meme volume ;
      ACQUISITION DE RANG 1 DU LIVRE. Le statut de la TRADUCTION n'est pas etabli
      -- l'original est dans le domaine public, le document ne porte aucune
      mention de licence, et les formulations citees sont celles du traducteur.
      AUCUNE ARCHITECTURE COMPAREE N'EST INSTRUITE alors que c'est la fonction du
      livre : monnaies souveraines, credit bancaire, monnaies-marchandises,
      monnaies locales, cryptoactifs, stablecoins, MNBC, unites de compensation,
      projets supranationaux -- LE CHAPITRE EN OUVRE UNE, ET C'EST L'ANCETRE
      DIRECT DU DISPOSITIF. Et AUCUNE EVALUATION EMPIRIQUE N'EST OUVERTE : Worgl
      est employe comme precedent depuis L1.C08 sans qu'aucun travail sur cette
      experience soit lu -- LE CORPUS TIENT UNE CONCEPTION ET AUCUN RESULTAT, CE
      QUI EST EXACTEMENT CE QU'IL REPROCHE AILLEURS.
      L16.C02 OUVRE LA MOITIE DU VOLUME QUE LE PRECEDENT AVAIT LAISSEE FERMEE, ET
      Y TROUVE LA REPONSE QUE LE CORPUS SAVAIT EXISTER SANS L'AVOIR LUE.
      LA REPONSE A L'OBJECTION DE FUITE : LA TERRE CESSE D'ETRE ACHETABLE.
      Nationalisation integrale ("all special private or public rights over land
      are abolished"), indemnisation totale en titres publics, puis location "by
      way of PUBLIC AUCTION in which EVERY INHABITANT OF THE GLOBE, without
      exception, can compete" ; et la rente "goes to the public treasury and is
      DISTRIBUTED MONTHLY IN EQUAL SHARES TO MOTHERS according to the number of
      their young children". C'EST UNE REPONSE STRUCTURELLE ET NON INCITATIVE :
      on ne dissuade pas la fuite vers la terre, ON SUPPRIME LE REFUGE. C'est un
      instrument de COMPOSITION -- exactement celui dont L26.C05 a etabli que le
      dispositif ne dispose pas.
      LES DEUX REFORMES SONT INSEPARABLES ET L'AUTEUR L'ECRIT : "we propose to
      introduce the money reform SIMULTANEOUSLY WITH THE NATIONALISATION OF THE
      LAND". L'articulation est meme financiere : la baisse du taux d'interet
      eteint la dette de nationalisation "in less than 20 years". LE CORPUS NE
      PEUT DONC PAS PRENDRE LA MONNAIE FONDANTE SEULE ET TENIR L'OBJECTION POUR
      REPONDUE. SECOND EMPRUNT PARTIEL EN DEUX CHAPITRES : L16.C01 a etabli qu'il
      prend le ressort de reflux SANS la regle d'emission, celui-ci qu'il prend la
      monnaie SANS la terre -- ET DANS LES DEUX CAS CE QU'IL LAISSE EST CE QUI
      RENDAIT L'ENSEMBLE COHERENT.
      LE PRIX EST ENORME. La reforme est ABSOLUE ET MONDIALE : "no private
      individual, NO STATE, no society may retain any kind of privileges over the
      land [...] there are NO RIGHTS OF NATIONS, NO PREROGATIVES OF SOVEREIGNTY,
      NO RIGHTS OF SELF-DETERMINATION OF STATES". Le Livre 20 tient la
      souverainete pour la contrainte de base et le Livre 25 a etabli que le droit
      differencie entre Etats souverains sans calculer ; CETTE REFORME NE NEGOCIE
      PAS AVEC LA SOUVERAINETE, ELLE LA NIE SUR LA TERRE.
      ET LA CONTRADICTION EST DIRECTE AVEC UN INSTRUMENT DU CORPUS. La meme page :
      "NO NATION HAS THE RIGHT TO ERECT BOUNDARIES AND TO LEVY IMPORT-DUTIES [...]
      Free-Land also implies UNIVERSAL FREE-TRADE and COMPLETE ELIMINATION OF ALL
      TARIFF BOUNDARIES". L11.C24 CONSTRUIT UN BAREME AUX FRONTIERES. ALTERNATIVE
      : ou le corpus garde ce bareme et n'a AUCUNE reponse a l'objection de fuite,
      ou il prend la reponse et perd l'instrument. IL NE PEUT PAS GARDER LES DEUX,
      ET IL NE LE SAVAIT PAS. A40 EST POSE. Quatrieme atteinte a L11.C24 en trois
      jours, ET LA SEULE QUI NE SOIT PAS UNE COMPLICATION MAIS UNE
      INCOMPATIBILITE.
      UN DETAIL QUI N'EN EST PAS UN ET QUI TOUCHE LE LIVRE 25 : la rente fonciere
      est redistribuee "in equal shares TO MOTHERS according to the number of
      their young children", SANS CONDITION DE NATIONALITE. C'est une cle de
      repartition entierement EXPLICITE, UNIVERSELLE ET NON NEGOCIEE, dont le
      critere n'est ni la detention, ni la responsabilite, ni la capacite : C'EST
      LA CHARGE D'ENFANTS. Le Livre 25 a cherche une telle cle pendant six
      chapitres ; le corpus ne l'adopte pas, IL ENREGISTRE QU'ELLE EXISTE DANS LA
      TRADITION DONT IL SE RECLAME ET QU'IL NE L'AVAIT JAMAIS RENCONTREE.
      RESERVES : aucune critique de cette reforme fonciere n'est ouverte alors
      qu'il y en a -- la nationalisation integrale du sol, l'abolition des droits
      de douane et la negation des prerogatives de souverainete ONT ETE DISCUTEES
      ET COMBATTUES PENDANT UN SIECLE ; l'extinction de la dette de
      nationalisation en moins de vingt ans repose sur un enchainement NON VERIFIE
      -- elle suppose que la reforme monetaire fasse tomber le taux d'interet a
      zero, these centrale de l'auteur que le chapitre n'a pas instruite ; et
      AUCUNE APPLICATION N'EST OUVERTE -- ces deux reformes n'ont jamais ete mises
      en oeuvre ensemble, LE CORPUS SAIT SEULEMENT QUE LA REPONSE EST COHERENTE,
      PAS QU'ELLE FONCTIONNE.
      L16.C03 SOLDE LA RESERVE QUE LE CORPUS PORTAIT DEPUIS L1.C08 ET QU'IL AVAIT
      REDECLAREE DEUX FOIS LA MEME NUIT : employer une experience historique comme
      precedent sans avoir jamais ouvert un travail sur elle. Source ouverte : I.
      Fisher, Stamp Scrip, 1933, chapitres IV a VII -- TRANSCRIPTION HTML hebergee
      par une page universitaire et non fac-simile de l'original, regime
      a_verifier.
      LE DISPOSITIF REEL N'EST PAS CELUI DU CONCEPTEUR. Taux de 1 % PAR MOIS,
      soit 12 % l'an, la quand le concepteur proposait un millieme par semaine
      (5,2 % l'an) : LE CORPUS SE TROUVE DEVANT DEUX REFERENCES QUI NE S'ACCORDENT
      PAS, DANS UN RAPPORT DE PLUS DU DOUBLE. Emission de 32 000 schillings
      (environ 4 500 dollars), immediatement corrigee -- "this amount was later
      found to be IN EXCESS of the actual need [...] ONLY ABOUT 1/3 OF THE ISSUE
      OR LESS WAS KEPT IN CIRCULATION". Canal d'emission : LE SALAIRE PUBLIC, 50 %
      pour les agents municipaux et 100 % pour les ouvriers d'urgence -- ce n'est
      pas une qualification d'activite mais UNE DEPENSE PUBLIQUE PAYEE DANS
      L'UNITE.
      LA SORTIE ETAIT TARIFEE, ET C'EST LA TROISIEME VOIE QUE A40 CHERCHAIT.
      "There was to be NO FINAL REDEMPTION ; but every holder [...] AT ANY TIME ;
      but for such redemption A SERVICE CHARGE OF TWO PER CENT had to be paid. As
      the stamp was only 1 per cent, the disadvantages of redemption at 2 per cent
      were [...] GREATER than the probable disadvantages of going on at 1 per
      cent." LA FUITE N'EST PAS EMPECHEE : ELLE EST RENDUE PLUS CHERE QUE LE
      SEJOUR. A40 a donc TROIS branches et non deux. MAIS LA TROISIEME N'EST PAS
      GRATUITE : elle exige UN GUICHET DE RACHAT, donc que l'emetteur detienne de
      quoi racheter -- la commune tenait un fonds de garantie a la caisse
      d'epargne locale. LE LIVRE 19 A PASSE SEPT CHAPITRES A ETABLIR QUE L'ACTIF
      DE L'EMETTEUR EST LE POINT LE PLUS INCERTAIN DU DOSSIER. La troisieme
      branche deplace donc la question de la fuite VERS LA QUESTION DE L'ACTIF,
      c'est-a-dire vers A37 -- QUATRIEME RAISON DE TRANCHER A37.
      LES RESULTATS SONT PLUS MODESTES QUE LA LEGENDE. Arrieres d'impots
      recouvres -- 4 542 schillings des le premier mois, sur un stock qui montait
      de 21 000 en 1926 a 118 000 en 1931 ; travaux publics de 100 000 schillings
      au second semestre 1932 ; solde bancaire local retourne de 6 591 schillings.
      ET L'EMPLOI, QUI EST LE MOTIF DE L'OPERATION : "permanent jobs were given to
      FROM 30 TO 50 of the 1500 unemployed" -- DEUX A TROIS POUR CENT. Le corpus
      ne conclut pas a l'echec : recouvrer des arrieres et executer cent mille
      schillings de travaux dans une commune de quatre mille habitants EN
      QUELQUES MOIS N'EST PAS RIEN. IL CONCLUT QUE L'EXEMPLE NE PEUT PLUS ETRE
      INVOQUE SANS CES CHIFFRES.
      CE QUI A REFUSE EST LE PROBLEME DE FRONTIERE EN MINIATURE : "the only cases
      of permanent refusal [...] are THE POST OFFICE AND THE RAILROAD, both of
      which are government institutions WITH INTERESTS PRIMARILY OUTSIDE OF THE
      VICINITY". Ce ne sont pas des acteurs marginaux mais LES DEUX RESEAUX QUI
      RELIENT LA COMMUNE AU RESTE DU PAYS. LE PROBLEME DU PERIMETRE N'APPARAIT PAS
      AVEC L'ECHELLE : IL EST LA DES QUATRE MILLE TROIS CENTS HABITANTS.
      TROIS PRECISIONS. LA FONTE EST UNE RESSOURCE, troisieme confirmation apres
      la norme statistique (L19.C03) et le concepteur (L16.C01) -- ici c'est LA
      PRATIQUE, les timbres etant vendus par la ville et le produit affecte a son
      action sociale. IL Y AVAIT UN FONDS DE GARANTIE, de sorte que l'unite
      n'etait PAS sans contrepartie. Et LE PROMOTEUR REFUSE LA THEORIE DE
      L'INVENTEUR -- "there is much in Gesell's philosophy to which, as an
      economist, I CANNOT SUBSCRIBE, especially his theory of interest" : ON PEUT
      DONC TENIR L'INSTRUMENT SANS LA THEORIE, ET QUELQU'UN L'A FAIT.
      RESERVES : LA QUALITE DE LA PREUVE EST FAIBLE ET C'EST LE POINT PRINCIPAL --
      information tenue d'un economiste envoye sur place, chiffres issus du rapport
      du maire a son gouvernement regional, rotation de vingt fois par mois
      DECLAREE PAR LE MAIRE ET RAPPORTEE EN TROISIEME MAIN, aucune contre-expertise
      ni serie statistique autrichienne ni travail academique posterieur ouverts ;
      le corpus a lu UNE TRANSCRIPTION et non l'original ; l'auteur est un
      partisan qui publie un manuel pour propager l'instrument ; et L'ECHELLE
      INTERDIT TOUTE EXTRAPOLATION -- 4 300 habitants, environ 4 500 dollars dont
      un tiers en circulation, quelques mois.
      L16.C04 PAIE UNE DETTE QUE LE CORPUS AVAIT DECLAREE SANS LA PAYER : le
      debat sur la monnaie numerique de banque centrale de detail, dont L21.C03
      avait etabli que le dispositif l'herite tout entier. Source ouverte : BCE,
      Report on a digital euro, octobre 2020, regime citation_seule -- l'editeur
      autorise la reproduction educative et NON COMMERCIALE, ce qui est
      incompatible avec la licence du corpus.
      LA FONTE EST ECRITE COMME UNE SPECIFICATION DE CONCEPTION. Exigence 8 :
      l'instrument "should be an attractive means of payment, but SHOULD BE
      DESIGNED SO AS TO AVOID ITS USE AS A FORM OF INVESTMENT and the associated
      risk of LARGE SHIFTS FROM PRIVATE MONEY (for example bank deposits) TO
      DIGITAL EURO". Deux moyens envisages : "REMUNERATING DIGITAL EURO HOLDINGS
      AT A VARIABLE RATE OVER TIME, possibly using A TIERED REMUNERATION SYSTEM,
      or by LIMITING THE QUANTITY". UNE REMUNERATION VARIABLE QUI DECOURAGE LA
      DETENTION EST UNE FONTE, QUEL QUE SOIT LE NOM QU'ON LUI DONNE -- et le
      corpus la tient ici pour la deuxieme zone monetaire du monde.
      TROISIEME MOTIF EN QUATRE CHAPITRES POUR LE MEME MECANISME : justice dans
      l'echange chez le concepteur, emploi local dans l'application, PROTECTION DU
      SECTEUR BANCAIRE ici, regeneration sous le dispositif. L'INSTRUMENT EST
      INDIFFERENT A LA FIN QU'ON LUI DONNE -- bonne nouvelle pour son transport,
      RAISON DE PLUS DE NE PAS HERITER DES PROPRIETES QU'ON LUI PRETE AILLEURS. Et
      une difference de degre : ici l'objectif n'est pas de faire circuler mais
      D'EMPECHER QUE L'INSTRUMENT ATTIRE TROP -- LE DISPOSITIF N'A JAMAIS ENVISAGE
      QUE SON UNITE SOIT TROP ATTRACTIVE.
      LA CONTREPARTIE A L'ACTIF EST EXIGEE PAR L'EMETTEUR LUI-MEME : "to the
      extent that it increases the size of the balance sheet, THE EUROSYSTEM WOULD
      NEED TO ACQUIRE ASSETS (loans or securities) TO BE HELD AGAINST DIGITAL
      EURO". C'EST LE RESULTAT DU LIVRE 19, ECRIT PAR UNE BANQUE CENTRALE A PROPOS
      DE SON PROPRE INSTRUMENT FUTUR -- deux autorites independantes sur le meme
      point. Et le rappel sur le seigneuriage est utile : le revenu d'emission
      nait de l'ECART entre remuneration des actifs et des passifs, "the rate is
      zero for banknotes" -- UNE UNITE QUI FOND PORTE UN TAUX DE PASSIF NEGATIF,
      DONC ELARGIT CET ECART, ce qui est la proposition de L19.C03 en termes de
      banque centrale.
      LE PERIMETRE RECOIT UNE REPONSE DE CONCEPTION. Exigence 13 : conditions
      specifiques d'acces pour les non-residents, sous forme de "LIMITS ON OR
      ADEQUATE REMUNERATION POLICIES". La ou l'application de 1932 avait SUBI le
      refus de la poste et du chemin de fer, le projet de 2020 REGLE le probleme.
      Et la condition qui le rend possible est nommee : "anonymity may have to be
      RULED OUT [...] in order to limit the scope of users". IDENTIFIER LE
      DETENTEUR EST LA CONDITION DE PLAFONNER SA DETENTION -- meme exigence que
      L19.C05 avait tiree de la definition de l'unite institutionnelle, PAR DEUX
      CHEMINS ENTIEREMENT DIFFERENTS. LE PRIX EST LA VIE PRIVEE, il est explicite,
      ET LE DISPOSITIF NE L'A JAMAIS CHIFFRE.
      LA GRILLE COMMENCE A MONTRER QUELQUE CHOSE. Quatre architectures ouvertes,
      six colonnes : LE TAUX (5,2 % par conception, 12 % en application, variable
      et a paliers en projet, NON FIXE sous le dispositif) ; LA REGLE D'EMISSION
      (indice de prix, depense publique locale, politique monetaire, qualification
      regenerative) ; LA CONTREPARTIE A L'ACTIF (non traitee, fonds de garantie,
      ACQUISITION EXIGEE, AUCUNE) ; LA SORTIE (supprimee par la reforme fonciere,
      tarifee a 2 %, plafonnee et modulee, NON TRAITEE) ; LE PERIMETRE (mondial
      par principe, subi, regle par residence, coalition) ; ET LE MOTIF (justice
      dans l'echange, emploi local, protection bancaire, regeneration). LE
      DISPOSITIF EST LA SEULE DES QUATRE DONT TROIS COLONNES SUR SIX SONT VIDES --
      ce n'est pas un jugement, c'est l'etat d'une conception inachevee, ET LA
      GRILLE DIT EXACTEMENT OU.
      RESERVES : le corpus tient un rapport de 2020 ET RIEN DE CE QUI A SUIVI --
      phase d'investigation, phase de preparation, proposition legislative ; les
      parametres envisages ont pu etre abandonnes ou modifies, ACQUISITION DE RANG
      1 ET ELLE EST PUBLIQUE. Le chapitre NE COMPARE PAS DEUX INSTRUMENTS DE MEME
      NATURE et le declare : ce qui se transporte est LE MECANISME, PAS LE REGIME.
      Aucune critique du projet n'est ouverte alors que le debat sur la
      desintermediation, la vie privee et la programmabilite est nourri --
      LE CORPUS TIENT LE DOCUMENT D'UN EMETTEUR SUR SON PROPRE PROJET. Et la
      grille est ESQUISSEE ET NON CONSTRUITE : le registre demande neuf familles,
      CINQ MANQUENT.
      L16.C05 CLOT LA PREMIERE TRANCHE A CINQ CHAPITRES, TROIS SOURCES OUVERTES
      DE PREMIERE MAIN, ET LA FONCTION DU LIVRE EST REMPLIE POUR UN QUART :
      quatre architectures instruites sur les neuf familles demandees.
      LE RESULTAT CENTRAL : LE CORPUS EMPRUNTE PAR MORCEAUX, ET IL LAISSE CHAQUE
      FOIS LA PIECE QUI TENAIT L'ENSEMBLE. Premier emprunt partiel : il prend le
      ressort de reflux ET LAISSE LA REGLE D'EMISSION, alors que celle-ci
      commandait la quantite par un indice de prix et non par une qualification.
      Second : il prend la monnaie ET LAISSE LA TERRE, alors que la reforme
      fonciere est ce qui ferme le refuge que la monnaie fondante ouvre et que
      l'auteur les proposait SIMULTANEMENT. CE N'EST PAS UNE FAUTE -- un
      instrument peut etre extrait de son systeme -- MAIS CELA INTERDIT DE SE
      RECLAMER DE LA FILIATION POUR HERITER DES PROPRIETES. Le corpus doit
      demontrer que la fonte fonctionne SOUS SON PROPRE REGIME, ET IL NE L'A PAS
      FAIT.
      QUATRE MOTIFS POUR UN MECANISME EN UN SIECLE : justice dans l'echange
      (1916), emploi local (1932), protection du secteur bancaire (2020),
      regeneration (dispositif). L'INSTRUMENT EST INDIFFERENT A LA FIN QU'ON LUI
      DONNE -- favorable a son transport, ET INTERDISANT D'HERITER DES PROPRIETES
      QU'ON LUI PRETE AILLEURS. Le corpus ne peut plus dire "la fonte a fait ses
      preuves" : IL DOIT DIRE A QUELLE FIN, SOUS QUELLE REGLE, ET A QUELLE
      ECHELLE.
      CE QUE LA TRANCHE DONNE : deux taux de reference et non un ; une reponse a
      l'objection de fuite QUI NE COUTE PAS LA PROPRIETE FONCIERE (sortie tarifee
      au-dessus du cout de detention) ; la condition de representabilite de
      L19.C03 REALISEE PHYSIQUEMENT en 1916, le taux etant imprime sur le billet ;
      et TROIS CONFIRMATIONS INDEPENDANTES que la fonte est une RESSOURCE -- la
      norme statistique, le concepteur, la pratique.
      CE QU'ELLE ETABLIT CONTRE LUI : A40 est pose et il est dur, la reponse a la
      fuite interdisant expressement le bareme aux frontieres -- QUATRIEME
      ATTEINTE A L11.C24 EN TROIS JOURS ET LA SEULE QUI SOIT UNE INCOMPATIBILITE ;
      la contrepartie a l'actif est exigee PAR DEUX AUTORITES INDEPENDANTES ; le
      precedent invoque depuis L1.C08 est PLUS MODESTE QUE SA LEGENDE -- trente a
      cinquante emplois sur mille cinq cents ; et LE PROBLEME DU PERIMETRE
      N'APPARAIT PAS AVEC L'ECHELLE, IL EST LA DES QUATRE MILLE TROIS CENTS
      HABITANTS.
      LA GRILLE, TELLE QU'ELLE SORT DES SOURCES ET NON D'UNE THEORIE. Six
      colonnes : LE TAUX (5,2 % / 12 % / variable a paliers / NON FIXE) ; LA
      REGLE D'EMISSION (indice de prix / depense publique locale / politique
      monetaire / qualification regenerative) ; LA CONTREPARTIE A L'ACTIF (non
      traitee / fonds de garantie / acquisition exigee / AUCUNE) ; LA SORTIE
      (supprimee par la reforme fonciere / tarifee a 2 % / plafonnee et modulee /
      NON TRAITEE) ; LE PERIMETRE (mondial sans frontiere / subi / regle par
      residence / coalition) ; LE MOTIF (justice dans l'echange / emploi local /
      protection bancaire / regeneration). LE DISPOSITIF EST LA SEULE DES QUATRE
      DONT TROIS COLONNES SUR SIX SONT VIDES -- LE TAUX, LA CONTREPARTIE, LA
      SORTIE. Ce n'est pas un jugement mais l'etat d'une conception inachevee, ET
      LA GRILLE DIT EXACTEMENT OU TRAVAILLER.
      RESERVES : CINQ DES NEUF FAMILLES DEMANDEES NE SONT PAS OUVERTES --
      cryptoactifs, stablecoins, unites de compensation, projets supranationaux,
      monnaies-marchandises -- ET LE DERNIER POINT EST LE PLUS GENANT, LE
      DISPOSITIF ETANT LUI-MEME UN PROJET SUPRANATIONAL SANS AUCUN AUTRE POUR
      COMPARAISON. AUCUNE CRITIQUE D'AUCUNE DES TROIS SOURCES N'EST OUVERTE :
      elles sont soit l'auteur d'une conception, soit son promoteur, soit
      l'emetteur d'un projet parlant de lui-meme -- LA TRANCHE NE TIENT AUCUN
      ADVERSAIRE, meme defaut que celui declare la meme nuit par L17.C06. Et LES
      TROIS SOURCES POSENT CHACUNE UN PROBLEME DE TEXTE : une traduction au
      statut non etabli, une transcription qui n'est pas le fac-simile, un
      rapport de 2020 sans aucune suite ouverte.
      LE LIVRE A ETE OUVERT POUR SITUER LE DISPOSITIF PARMI LES ARCHITECTURES
      EXISTANTES. IL SE REFERME EN AYANT ETABLI QU'IL EMPRUNTE A SON ANCETRE DEUX
      PIECES SUR QUATRE, QUE LE MEME MECANISME A SERVI QUATRE FINS DIFFERENTES EN
      UN SIECLE, ET QUE SUR LES SIX COLONNES QUI PERMETTENT DE COMPARER IL EN
      LAISSE TROIS VIDES. CE QU'IL A GAGNE N'EST PAS UNE PLACE DANS LA TYPOLOGIE :
      C'EST LA LISTE DE CE QU'IL DOIT DECIDER POUR EN AVOIR UNE.
  - livre: 17
    titre: "Après la croissance : décroissance, post-croissance et prospérité sans croissance"
    collection: cahier-comparatif
    fonction: >
      Comparer les théories et expériences de l'après-croissance, du Bonheur
      national brut à la décroissance, puis tester leur concrétisation
      institutionnelle
    motifs:
      - "discipline — théories de l'après-croissance et indicateurs au-delà du PIB"
      - "objection — P9 : sortir de l'exigence de croissance de l'encours sans contraction"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 6

    note: >
      OUVERT LE 2026-09-08. L17.C01 remplace l'amorce et ouvre la revue
      systematique de reference sur le decouplage -- Haberl, Wiedenhofer, Virag,
      Kalt, Plank, Brockway et al., Environmental Research Letters 2020, 835
      ARTICLES EVALUES PAR LES PAIRS, CC BY 3.0, regime libre.
      CE QUE LA REVUE ETABLIT. Le decouplage RELATIF est frequent pour les
      matieres et les gaz a effet de serre "BUT NOT FOR USEFUL EXERGY" ; et
      l'energie primaire ne se decouple "LARGELY TO THE EXTENT to which the
      conversion of primary energy to useful exergy is improved" -- ce qui
      rejoint le deplacement etabli par L26.C01 et L26.C03, ou l'exergie
      commande. Le decouplage ABSOLU de longue duree est RARE, et il s'affaiblit
      des qu'on compte ce qui est importe ("WEAKLIER" sur les emissions de
      consommation). CONCLUSION SANS AMBIGUITE : "large rapid absolute
      reductions [...] CANNOT BE ACHIEVED THROUGH OBSERVED DECOUPLING RATES,
      hence decoupling needs to be COMPLEMENTED BY SUFFICIENCY-ORIENTED
      STRATEGIES AND STRICT ENFORCEMENT OF ABSOLUTE REDUCTION TARGETS".
      OU LE DISPOSITIF SE RANGE : NULLE PART. La taxonomie du champ compte trois
      classes -- green growth, degrowth, others. LE DISPOSITIF N'ENTRE DANS
      AUCUNE DES DEUX PREMIERES : il ne soutient pas que le decouplage suffit, et
      L18.C04 le lui interdit ; il ne donne aucune priorite a la reduction du
      produit, ET IL EMET. LA TAXONOMIE N'A PAS DE CASE POUR UN INSTRUMENT
      D'ALLOCATION -- ce n'est pas une critique du dispositif mais un fait sur la
      litterature, qui classe des STRATEGIES et non des INSTRUMENTS. Il en
      resulte que LE DISPOSITIF SE RECLAME D'UNE TRADITION QUI NE LE
      RECONNAITRAIT PAS COMME SIEN, et qu'il devra soit revendiquer la troisieme
      case soit etablir qu'un instrument d'allocation est une strategie d'un
      genre distinct -- ce qui est un travail, pas une declaration.
      F14 RECOIT UNE CONFIRMATION EXTERNE, ET ELLE NE VIENT PAS D'UNE SOURCE
      HOSTILE. La revue nomme les instruments necessaires : "moratoria on
      resource extraction and new infrastructures", "bans on harmful
      activities", "INSTEAD OF JUST PUTTING A PRICE ON RESOURCES AND EMISSIONS".
      MORATOIRES, INTERDICTIONS, FERMETURES -- MOT POUR MOT LA LISTE QUE L26.C05
      AVAIT DECLAREE MANQUANTE, produite par un autre chemin a partir d'une
      statistique energetique. Cela repare la faiblesse la plus immediate de F14,
      qui reposait sur une seule annee ; CELA NE L'ARBITRE PAS.
      ET UN RESULTAT FAVORABLE, DIT SANS LE MINORER. La revue nomme l'obstacle
      principal a la sobriete : "states have so far REFRAINED from strategies of
      sufficiency as these may contradict their claimed STRUCTURAL DEPENDENCE ON
      ECONOMIC GROWTH for the generation of TAX REVENUE". C'EST EXACTEMENT
      L'OBSTACLE QUE LE DISPOSITIF PRETEND DESSERRER, ET P9 RECOIT ICI L'ENONCE
      DE SON VERROU. Ce que cela donne : la question de P9 est la bonne question.
      Ce que cela ne donne pas : que le dispositif la desserre reste
      entierement a demontrer.
      GRILLE FIXEE A CINQ QUESTIONS, dont la cinquieme est le coeur du livre et
      n'a jamais ete posee frontalement : LA SOBRIETE EST-ELLE COMPATIBLE AVEC
      UNE EMISSION ? Le dispositif ajoute du pouvoir d'achat ; la sobriete
      demande de reduire la production et la consommation.
      RESERVES : AUCUN AUTEUR DU CHAMP N'EST OUVERT -- ni Daly, ni Jackson, ni
      Kallis, ni Hickel, ni Parrique, ni aucun texte du Bonheur national brut ;
      le corpus ouvre UNE REVUE qui classe et resume, et non le champ lui-meme,
      DONC IL TIENT LA CARTE ET NON LE TERRAIN, et L26.C01 a montre l'avant-veille
      ce que coute de tenir la critique sans l'original. Le premier motif du
      registre -- indicateurs au-dela du PIB -- n'est pas touche, ni les
      experiences que la fonction assignee appelle "concretisation
      institutionnelle". La source ouverte est UN MANUSCRIT ACCEPTE et non la
      version de record. Et AUCUNE CRITIQUE DE CETTE REVUE N'EST OUVERTE, alors
      qu'elle partage un auteur avec la revue sur le rebond ouverte en L26.C04 --
      MEME RISQUE QUE CELUI DECLARE PAR L24.C05 POUR LES LIMITES PLANETAIRES, ET
      PAS MIEUX TRAITE.
      L17.C02 REPARE LA RESERVE PRECEDENTE EN OUVRANT LE TEXTE DE POSITION QUE LA
      REVUE CITE COMME REFERENCE DE LA SOBRIETE -- Parrique, Barth, Briens,
      Kerschner, Kraus-Polk, Kuokkanen et Spangenberg, "Decoupling Debunked",
      European Environmental Bureau 2019, regime a_verifier. IL SOUMET LE
      DISPOSITIF AUX SEPT RAISONS, ET LE RESULTAT N'EST UNIFORME SUR AUCUNE.
      RAISON 1, LA DEPENSE ENERGETIQUE CROISSANTE : NON TOUCHEE, mais elle donne
      LA CAUSE que L26.C02 n'avait pas -- "cheaper options are generally used
      first, the extraction of remaining stocks then becoming a MORE
      RESOURCE- AND ENERGY-INTENSIVE PROCESS". LE CORPUS TENAIT LES DEUX MOITIES
      ET NE LES AVAIT PAS JOINTES : la reserve s'etend parce que le prix rend
      rentables des teneurs plus faibles, ET DES TENEURS PLUS FAIBLES COUTENT PLUS
      D'ENERGIE.
      RAISON 2, LE REBOND : AGGRAVEE par le dispositif, pour la raison de
      comptabilite etablie en L26.C04 -- le pouvoir d'achat n'est pas libere, il
      est emis.
      RAISON 3, LE DEPLACEMENT DE PROBLEME : PARTIELLEMENT REPONDUE, ET C'EST LA
      SEULE. Un bareme qui note neuf dimensions separement ne peut pas, par
      construction, ameliorer l'une en degradant l'autre sans que cela paraisse.
      Reponse PARTIELLE : elle suppose que le bareme existe, soit renseigne et
      soit opposable, TROIS CONDITIONS DONT AUCUNE N'EST ACQUISE.
      RAISON 4, L'IMPACT DES SERVICES : NON TOUCHEE, ET C'EST LA PLUS DANGEREUSE
      POUR CE DISPOSITIF. "The service economy can only exist ON TOP OF the
      material economy, NOT INSTEAD OF IT. Services have a significant footprint
      that often ADDS TO, rather than substitute, that of goods." CE QUE LE
      DISPOSITIF FINANCE EST UN SERVICE. AUCUN CHAPITRE DU CORPUS NE TIENT
      L'INTENSITE MATERIELLE D'UN SERVICE DE REGENERATION, et L26.C06 avait deja
      declare cette question non ouverte.
      RAISON 5, LA LIMITE DU RECYCLAGE : NON TOUCHEE, ET UNE PRECISION QUE LE
      CORPUS AVAIT FAILLI MANQUER. Le resultat de L26.C01 vaut pour un ETAT
      STATIONNAIRE ; celui-ci vaut pour une ECONOMIE EN EXPANSION. LES DEUX NE SE
      CONTREDISENT PAS -- un cycle ferme peut entretenir un stock constant, il ne
      peut pas alimenter une croissance du stock. LE RESULTAT DE L26.C01 NE PEUT
      DONC JAMAIS ETRE INVOQUE POUR SOUTENIR QU'UN SYSTEME MATERIEL PEUT CROITRE.
      RAISON 6, LE CHANGEMENT TECHNIQUE INSUFFISANT : C'EST F14, MOT POUR MOT --
      le progres technique "is NOT DISRUPTIVE ENOUGH as it FAILS TO DISPLACE other
      undesirable technologies". SECONDE CONFIRMATION EXTERNE EN DEUX CHAPITRES,
      INDEPENDANTE DE LA PREMIERE. LE CORPUS TIENT DESORMAIS F14 PAR TROIS
      CHEMINS : une statistique d'une annee, une revue de 835 articles, et une
      these militante.
      RAISON 7, LE DEPLACEMENT DES COUTS : INSTRUMENT NOMME, NON CONSTRUIT --
      L11.C24, qui a recu en deux jours DEUX complications independantes.
      BILAN : une raison partiellement repondue, une aggravee, deux non touchees,
      une dotee d'un instrument nomme et non construit, une qui est F14, et une
      qui recoit une precision sans reponse. Le texte ouvert RENVERSE LA CHARGE DE
      LA PREUVE -- "the burden of proof rests on decoupling advocates [...]
      unless adequate and convincing demonstrations are brought against EACH AND
      ALL of the abovementioned arguments". Le dispositif n'est pas une these de
      decouplage et n'est pas vise directement, MAIS L'EXIGENCE SE TRANSPOSE SANS
      EFFORT : celui qui soutient qu'une allocation produit un effet physique doit
      le demontrer objection par objection. LE CORPUS EN A TRAITE UNE ET DEMIE SUR
      SEPT.
      RESERVES : le rapport ouvert est UN TEXTE DE POSITION edite par une
      organisation de plaidoyer, il defend une these et renverse lui-meme la
      charge de la preuve -- LE CORPUS N'A OUVERT AUCUNE REFUTATION, et les
      reponses de l'ecole de la croissance verte existent ; le chapitre SITUE ET
      N'INSTRUIT PAS, n'etablissant l'ampleur d'aucune des sept ; et la plus
      dangereuse reste entiere.
      L17.C03 REPOND A LA QUESTION 5, QUI EST LE COEUR DU LIVRE, PAR UNE REPONSE
      CONDITIONNELLE ET UN RESULTAT DEFAVORABLE QUE LE CORPUS N'ATTENDAIT PAS.
      Source ouverte : Keysser et Lenzen, Nature Communications 2021,
      modelisation comparee des trajectoires a 1,5 degre, regime libre.
      L'ECHANGE EST DECLARE PAR LA SOURCE. Les trajectoires du groupe d'experts
      "rely on combinations of CONTROVERSIAL NEGATIVE EMISSIONS and UNPRECEDENTED
      TECHNOLOGICAL CHANGE, while ASSUMING CONTINUED GROWTH in GDP" ; les
      trajectoires de decroissance "MINIMIZE MANY KEY RISKS for feasibility and
      sustainability" ; "HOWEVER, SUBSTANTIAL CHALLENGES REMAIN REGARDING
      POLITICAL FEASIBILITY". MOINS DE RISQUE TECHNIQUE CONTRE PLUS DE RISQUE
      POLITIQUE -- un echange, non une superiorite.
      LE VERROU EST NOMME, ET C'EST P9 DANS D'AUTRES MOTS : "[a]bandoning
      economic growth seems POLITICALLY IMPOSSIBLE", parce que cela "implies
      significant changes to current capitalist socioeconomic systems IN ORDER TO
      OVERCOME ITS GROWTH IMPERATIVES". DEUX SOURCES INDEPENDANTES OUVERTES LE
      MEME JOUR DESIGNENT LE MEME OBSTACLE SOUS DEUX NOMS.
      PREMIERE FORMULATION POSITIVE DE LA PLACE DU DISPOSITIF, ET ELLE REPOND A
      LA QUESTION 2. LA SOBRIETE DEMANDE AUX ETATS DE RENONCER A LA CROISSANCE ;
      LE DISPOSITIF ENTREPREND DE RETIRER A LA CROISSANCE SA NECESSITE. Ce ne sont
      pas les memes operations et elles visent le meme verrou PAR DEUX COTES
      OPPOSES. Le dispositif n'est pas une STRATEGIE DE TRAJECTOIRE : c'est une
      operation sur LA CONTRAINTE qui rend la trajectoire obligatoire. Le corpus
      revendique donc la troisieme case et peut dire pourquoi -- CE QUI LE SITUE
      SANS ETABLIR QU'IL FONCTIONNE.
      LE PRIX EST DOUBLE. LE DISPOSITIF NE REDUIT RIEN -- F14, confirme depuis par
      deux sources independantes -- de sorte que sobriete et dispositif NE SONT
      PAS SUBSTITUABLES, et le corpus doit cesser de laisser entendre que l'un
      tiendrait lieu de l'autre. Et LA COMPATIBILITE N'EST PAS ACQUISE MAIS
      CONDITIONNELLE, avec un critere formulable : le dispositif est compatible
      avec la sobriete SI ET SEULEMENT SI l'effet regeneratif finance excede
      l'effet d'addition induit -- depense de second tour, empreinte materielle
      des services finances, capacite ajoutee sans retrait. LE CORPUS POSE DONC UN
      CRITERE QU'IL NE SAIT PAS APPLIQUER, ce qui est mieux que de n'en poser
      aucun et n'est pas une reponse.
      LE RESULTAT DEFAVORABLE, ET IL VIENT DE L'AILE LA PLUS RADICALE DU PROJET
      ECOLOGIQUE. La source enonce que "political feasibility is SOFTER THAN
      SOCIO-TECHNICAL FEASIBILITY" et en tire un argument POUR la decroissance.
      APPLIQUE AU DISPOSITIF, LE MEME ARGUMENT SE RETOURNE : le dispositif fait le
      mouvement inverse, il demande MOINS de renoncement politique et PLUS
      D'INGENIERIE INSTITUTIONNELLE. SI L'ASYMETRIE TIENT, LE DISPOSITIF ECHANGE
      DU MOU CONTRE DU DUR -- il troque un obstacle repute franchissable par la
      mobilisation contre un ensemble d'obstacles de construction, de coordination
      et de droit, DONT AUCUN NE SE FRANCHIT PAR LA MOTIVATION. Objection versee a
      F6, SOUS CONDITION D'OUVERTURE DU TRAVAIL DONT L'ASYMETRIE EST TIREE --
      c'est une CITATION et non un resultat mesure, acquisition de rang 1.
      ET LA SOURCE DIT CONTRE ELLE-MEME : budget carbone pour "a 50 % CHANCE" de
      tenir 1,5 degre, scenarios incluant encore "a 10 % chance of reaching
      catastrophic warming of 3 °C" ; porter la probabilite a 66 % retire 160
      GtCO2, les retroactions du systeme Terre 100 de plus, et le methane et le
      protoxyde d'azote ne sont pas comptes. LE CORPUS EN TIRE UNE CONSEQUENCE DE
      PLUS QUE LES AUTEURS : si le budget reel est plus etroit, LE CRITERE DE
      COMPATIBILITE DEVIENT PLUS EXIGEANT, et un dispositif qui ajoute avant de
      regenerer dispose de moins de marge qu'il ne le croit.
      RESERVES : aucune trajectoire du groupe d'experts n'est ouverte -- LE CORPUS
      TIENT UNE COMPARAISON DONT IL NE TIENT QU'UN DES DEUX TERMES, et la source
      est un plaidoyer explicite ; le travail dont l'asymetrie mou/dur est tiree
      n'est pas ouvert alors qu'il porte le resultat le plus defavorable du
      chapitre ; le critere de compatibilite N'EST PAS CHIFFRABLE PAR LE CORPUS ;
      et LA QUESTION 4 DE LA GRILLE -- tester la concretisation institutionnelle
      des experiences -- N'EST TOUJOURS PAS COMMENCEE, trois chapitres restant
      dans les modeles et les textes.
      L17.C04 REPOND A LA QUESTION 4 EN OUVRANT UNE LOI EN VIGUEUR : le
      Well-being of Future Generations (Wales) Act 2015, 56 pages, lue dans le
      texte, regime a_verifier -- le document porte "Crown copyright 2015" et
      aucune mention de licence n'a ete relevee dans ses pages.
      CE QUE LE LEGISLATEUR A ECRIT, ET C'EST PLUS QUE LE CORPUS N'ATTENDAIT.
      "Each public body MUST CARRY OUT SUSTAINABLE DEVELOPMENT" ; sept objectifs
      definis dans le texte de loi lui-meme ; ET LA DEFINITION DE LA PROSPERITE Y
      INTEGRE LA LIMITE PHYSIQUE -- "an innovative, productive and LOW CARBON
      society WHICH RECOGNISES THE LIMITS OF THE GLOBAL ENVIRONMENT". UN
      LEGISLATEUR A ECRIT DANS UNE LOI QUE LA PROSPERITE RECONNAIT LES LIMITES DE
      L'ENVIRONNEMENT MONDIAL. Et un septieme objectif impose une consideration
      EXTRATERRITORIALE -- "takes account of whether doing such a thing may make a
      positive contribution to GLOBAL WELL-BEING" : c'est la premiere fois que le
      corpus rencontre en droit positif une obligation de considerer l'effet
      exterieur d'une decision interieure, et elle vise exactement le mecanisme
      que L17.C02 a identifie comme la septieme raison de douter du decouplage.
      LE PRINCIPE PORTE L'INCOMMENSURABILITE EN FORME FAIBLE : le corps public
      doit considerer "how steps taken by the body MAY CONTRIBUTE TO MEETING ONE
      OBJECTIVE BUT MAY BE DETRIMENTAL TO MEETING ANOTHER". C'EST F13 EN DROIT
      POSITIF -- la loi n'agrege pas, elle oblige a REGARDER le conflit, et elle
      ne dit pas comment le trancher.
      CE QUE TOUT CELA OBLIGE REELLEMENT, ET LA REPONSE EST COURTE. Un corps
      public doit suivre les recommandations du commissaire "UNLESS -- (a) the
      public body IS SATISFIED that there is good reason [...] or (b) IT DECIDES
      ON AN ALTERNATIVE COURSE OF ACTION". La premiere echappatoire est
      SUBJECTIVE, c'est le debiteur qui juge ; LA SECONDE NE PORTE AUCUNE
      CONDITION. Et la seule obligation qui ne souffre aucune exception est que "a
      public body MUST PUBLISH its response [...] the response MUST INCLUDE THE
      BODY'S REASONS". TOUTE L'ARCHITECTURE SE RESOUT EN UNE SEULE OBLIGATION DURE
      : PUBLIER SES RAISONS. Le corpus ne presente pas cela comme un scandale --
      une obligation de s'expliquer publiquement produit une trace, expose a la
      contradiction et donne prise -- MAIS CE N'EST PAS UNE OBLIGATION DE
      RESULTAT, et le texte le dit lui-meme en ecrivant "SEEKS TO ensure".
      PRECISION VERSEE A LA REGLE DE METHODE DU 2026-09-07 : QUAND LE DROIT
      INSTITUTIONNALISE UN OBJECTIF DE LONG TERME, IL OBLIGE A S'EXPLIQUER, NON A
      REUSSIR. Un seul cas est ouvert : ce n'est pas une regle generale.
      AVERTISSEMENT ET CONTRE-AVERTISSEMENT POUR LE DISPOSITIF. La difference
      entre les deux cas est DECISIVE ET FAVORABLE AU DISPOSITIF : la-bas la
      publication est LA SANCTION, ici la qualification est LA CONDITION D'UN
      PAIEMENT -- un regime qui conditionne un VERSEMENT n'a pas la faiblesse d'un
      regime qui conditionne une EXPLICATION. Mais CETTE LOI NE FERME RIEN NON
      PLUS : elle ne retire aucune autorisation, n'interdit aucune activite,
      n'arrete aucune installation.
      EXTENSION DE F14 PROPOSEE, NON ARBITREE. TROIS INSTITUTIONS EXAMINEES EN
      TROIS JOURS PRODUISENT DE L'ORIENTATION SANS PRODUIRE DE FERMETURE -- le
      bareme ecologique europeen, cette loi, et le dispositif lui-meme. TROIS
      CONCEPTEURS DIFFERENTS, TROIS FINS DIFFERENTES, TROIS JURIDICTIONS
      DIFFERENTES, ET LE MEME MANQUE. L'absence d'instrument de composition n'est
      peut-etre PAS un defaut de conception du dispositif mais UN TRAIT DE LA
      FORME "INCITATION" ELLE-MEME. Consequence ambigue : cela ATTENUE le reproche
      adresse au dispositif et AGGRAVE la consequence -- si aucune incitation ne
      ferme, la fermeture ne viendra jamais d'une incitation. UN SEUL
      CONTRE-EXEMPLE SUFFIRAIT A REFUTER, et les mecanismes de rachat pour
      destruction en sont des candidats evidents QUE LE CORPUS N'A PAS OUVERTS.
      RESERVES : AUCUN BILAN D'APPLICATION N'EST OUVERT et c'est le manque
      principal -- ni rapports du commissaire, ni examens de l'auditeur general,
      ni rapports annuels des corps publics ; UNE LOI EN VIGUEUR DEPUIS DIX ANS A
      PRODUIT UNE MATIERE QUE LE CORPUS N'A PAS REGARDEE, et ce qu'elle a
      effectivement change n'est pas etabli. Un seul cas est ouvert quand le
      registre en nomme un autre. Et le chapitre N'ETABLIT PAS QUE LA FORME
      OBSERVEE ETAIT LA SEULE DISPONIBLE : le corpus tient UN CHOIX, NON UNE
      NECESSITE.
      L17.C05 REPOND A LA QUESTION 3, LA SEULE QUE LES QUATRE PRECEDENTS AVAIENT
      LAISSEE ENTIERE, EN OUVRANT LE RAPPORT QUI A FONDE LE MOUVEMENT DES
      INDICATEURS AU-DELA DU PIB -- Stiglitz, Sen et Fitoussi 2009, 291 pages,
      regime a_verifier. LA QUESTION ETAIT MAL POSEE : la Commission ne
      recommande AUCUN indicateur unique de remplacement, ELLE RECOMMANDE UN
      TABLEAU DE BORD, et elle exige que la soutenabilite soit tenue SEPAREE du
      bien-etre present.
      L'IMAGE QU'ELLE EMPLOIE EST CELLE QUE LE CORPUS A CONSTRUITE TROIS JOURS
      PLUS TOT PAR UN AUTRE CHEMIN : "when driving a car, A METER THAT ADDED UP IN
      ONE SINGLE NUMBER THE CURRENT SPEED OF THE VEHICLE AND THE REMAINING LEVEL
      OF GASOLINE WOULD NOT BE OF ANY HELP TO THE DRIVER". C'EST F13 SOUS FORME
      D'IMAGE, ECRIT PAR UNE COMMISSION OFFICIELLE EN 2009.
      ET LA DISTINCTION QUE LE CORPUS N'AVAIT PAS NOMMEE. "The WEAK approach to
      sustainability considers that GOOD PERFORMANCE IN SOME DIMENSIONS CAN
      COMPENSATE FOR LOW PERFORMANCE IN OTHERS [...] The STRONG approach argues
      that sustainability requires SEPARATELY MAINTAINING the quantity or quality
      of many different environmental items." F13 EST LA POSITION DE
      SOUTENABILITE FORTE, ET ELLE PORTE CE NOM DEPUIS AU MOINS 2009. Le corpus
      l'a posee comme un falsifieur SANS SAVOIR QU'IL TRANCHAIT UNE CONTROVERSE
      CONSTITUEE. F13 N'EST PAS UNE DECOUVERTE DU CORPUS : C'EST UNE ADHESION A
      UNE ECOLE -- amendement verse au protocole. Et L24.C05 doit etre tempere :
      "la reponse est metrologique et non morale, et c'est ce qui la rend solide"
      -- LA SOLIDITE INVOQUEE TENAIT A CE QUE LA POSITION PARAISSAIT TIREE DES
      DONNEES, alors qu'elle est une position theorique disputee. NEUF UNITES
      HETEROGENES N'INTERDISENT PAS D'AGREGER : ELLES OBLIGENT A CHOISIR UNE CLE,
      ET LE REFUS DE CHOISIR EST LUI-MEME UN CHOIX.
      CE QUE LA COMMISSION INTERDIT A L'INDEX MONETAIRE. Il "should remain
      essentially focused on ECONOMIC ASPECTS of sustainability", l'environnement
      relevant d'"a separate follow-up based on a well-chosen set of PHYSICAL
      INDICATORS" -- la raison etant technique et non doctrinale : l'agregation
      bute "due to the LACK OF RELEVANT MARKET PRICES" pour la plupart des actifs
      naturels. TROISIEME FOIS EN TROIS JOURS QUE L'HYPOTHESE D'UN PRIX UNIQUE DE
      L'IMPACT EST ATTEINTE, PAR TROIS CHEMINS INDEPENDANTS : L24.C04 lui retire
      la fongibilite de l'EFFET, L26.C03 celle du COUT, et celui-ci L'EXISTENCE
      MEME D'UN PRIX.
      LE PRIX DE CETTE POSITION, ENONCE PAR LA COMMISSION ELLE-MEME : les tableaux
      de bord "lack what has made GDP a success: THE POWERFUL ATTRACTION OF A
      SINGLE HEADLINE FIGURE". OR LE DISPOSITIF DOIT EMETTRE UN MONTANT. Un
      tableau de bord informe, IL NE DECIDE PAS COMBIEN VERSER. La Commission n'a
      pas de solution a ce conflit et le dit ; SEIZE ANS PLUS TARD LE CORPUS N'A
      RIEN DE MIEUX, et il ne peut plus presenter la cle d'agregation comme un
      probleme technique en attente d'une solution : C'EST UN ARBITRAGE QUE
      PERSONNE N'A RESOLU.
      ET UNE COMMANDE QUE LE CORPUS CROYAIT FERMEE SE ROUVRE. La recommandation 11
      exige des composantes "INTERPRETABLE AS VARIATIONS OF SOME UNDERLYING
      STOCKS". L26.C02 avait ferme la question des stocks PAR LA NEGATIVE en
      refutant les reserves minerales ; MAIS CE QUE LA COMMISSION DEMANDE N'EST
      PAS UNE RESERVE EXPLOITABLE, C'EST UN STOCK AU SENS DES COMPTES -- capital
      naturel, surface forestiere, biomasse, aquifere -- dont on suit la
      VARIATION. LE CORPUS A REPONDU TROP VITE : la commande de L24.C05 etait mal
      formulee et sa refutation etait juste POUR CE QU'ELLE VISAIT ; la demande
      sous-jacente tient toujours. Routee au Livre 18.
      RESERVES : le rapport a SEIZE ANS et sa recommandation 11 dit elle-meme
      "under the current state of the art" -- aucune suite n'est ouverte, dont un
      rapport de suivi des memes auteurs ; LE CORPUS N'A PAS OUVERT LA POSITION
      ADVERSE, l'ecole de la soutenabilite FAIBLE n'etant representee par aucun
      texte lu -- CE QUI EST EXACTEMENT LE REPROCHE QU'IL S'EST ADRESSE SUR
      GEORGESCU-ROEGEN, A FRONT RENVERSE ; et aucun indicateur concret n'est
      instruit, le chapitre etablissant UNE STRUCTURE et non un contenu.
      L17.C06 CLOT LA PREMIERE TRANCHE A SIX CHAPITRES, CINQ SOURCES OUVERTES DE
      PREMIERE MAIN, ET LES CINQ QUESTIONS DE LA GRILLE RECOIVENT UNE REPONSE.
      MAIS LES DEUX RESULTATS LES PLUS LOURDS NE PORTENT PAS SUR L'OBJET DU LIVRE
      : ILS ATTEIGNENT DEUX FALSIFIEURS DU CORPUS, EN SENS CONTRAIRES.
      F13 CHANGE DE STATUT. Pose le 2026-09-07 a partir de neuf variables sans
      commune mesure et tenu pour un resultat tire des donnees, IL TRANCHE EN
      REALITE UNE CONTROVERSE CONSTITUEE : c'est la position de SOUTENABILITE
      FORTE, opposee depuis longtemps a la position FAIBLE. F13 N'EST PAS UNE
      DECOUVERTE, C'EST UNE ADHESION -- cela ne le refute pas, mais cela oblige le
      corpus a l'assumer comme un choix, ET IL N'A LU AUCUN TEXTE DES DEUX ECOLES.
      L24.C05 est tempere en consequence.
      F14 EST CONFIRME TROIS FOIS ET S'ELARGIT PEUT-ETRE. Trois confirmations
      independantes : la conclusion d'une revue de 835 articles ("strict
      enforcement of absolute reduction targets", "instead of just putting a
      price") ; la sixieme des sept raisons ("fails to DISPLACE") ; et une loi en
      vigueur qui, malgre sept objectifs legaux et un commissaire, NE FERME RIEN.
      EXTENSION PROPOSEE, NON ARBITREE : trois institutions examinees en trois
      jours produisent toutes DE L'ORIENTATION SANS FERMETURE -- trois
      concepteurs, trois fins, trois juridictions, ET LE MEME MANQUE. La
      consequence est ambigue : cela ATTENUE le reproche adresse au dispositif et
      AGGRAVE la consequence.
      CE QUE LA TRANCHE DONNE. SA PREMIERE DESCRIPTION POSITIVE -- la sobriete
      demande aux Etats de renoncer a la croissance, LE DISPOSITIF ENTREPREND DE
      RETIRER A LA CROISSANCE SA NECESSITE, ce qui explique enfin pourquoi la
      taxonomie du champ n'a pas de case pour lui : elle classe des STRATEGIES et
      il n'en est pas une. UNE DIFFERENCE FAVORABLE ETABLIE SUR PIECE -- dans la
      loi ouverte la publication est LA SANCTION, sous le dispositif la
      qualification est LA CONDITION D'UN PAIEMENT. Et UNE JONCTION QUI NE COUTE
      RIEN : la cause du comportement des reserves, que L26.C02 avait constate
      sans l'expliquer.
      CE QU'ELLE ETABLIT CONTRE LUI. L'ECHANGE DU MOU CONTRE LE DUR, venu de
      l'aile la plus radicale du projet ecologique, pose sous condition
      d'ouverture du travail dont l'asymetrie est tiree. LA TROISIEME
      COMPLICATION DE L11.C24 EN TROIS JOURS -- apres la fongibilite de l'EFFET et
      celle du COUT, c'est L'EXISTENCE MEME D'UN PRIX qui lui est retiree, "lack
      of relevant market prices". Et LA RAISON 4, NON TOUCHEE ET LA PLUS
      DANGEREUSE : "the service economy can only exist ON TOP OF the material
      economy" -- ce que le dispositif finance est UN SERVICE, et le corpus ne
      tient l'intensite materielle d'aucun service de regeneration.
      UNE COMMANDE FERMEE TROP VITE EST ROUVERTE. L26.C02 avait refute les
      reserves minerales ; la demande sous-jacente tient toujours, la Commission
      voulant des composantes "interpretable as variations of some underlying
      STOCKS" -- non une reserve exploitable mais UN STOCK AU SENS DES COMPTES.
      LE CORPUS A REPONDU TROP VITE ET IL L'ECRIT ; question routee au Livre 18.
      RESERVES : AUCUNE POSITION ADVERSE N'EST OUVERTE et c'est la faiblesse
      principale -- ni l'ecole de la croissance verte, ni celle de la
      soutenabilite faible, ni une trajectoire du groupe d'experts ; LES CINQ
      SOURCES TIRENT DANS LE MEME SENS et deux partagent un auteur avec une source
      deja employee par le Livre 26. LE CORPUS A CONSTRUIT UNE TRANCHE A CHARGE ET
      IL L'ECRIT. Trois sources sur cinq sont en regime a_verifier -- LA
      PROPORTION LA PLUS DEFAVORABLE DES QUATRE TRANCHES OUVERTES CETTE SEMAINE.
      Et aucun chiffrage n'est produit, le critere de compatibilite pose en
      L17.C03 restant inapplicable.
      LE LIVRE A ETE OUVERT POUR SITUER LE DISPOSITIF DANS LA TRADITION DONT IL SE
      RECLAME. IL SE REFERME EN AYANT ETABLI QUE CETTE TRADITION NE LE
      RECONNAITRAIT PAS COMME SIEN, QUE L'UN DE SES PROPRES FALSIFIEURS EST UNE
      POSITION PARTISANE QU'IL N'A PAS INSTRUITE, ET QU'IL ECHANGE DES OBSTACLES
      MOUS CONTRE DES OBSTACLES DURS. ET IL LUI A DONNE, POUR LA PREMIERE FOIS,
      UNE PHRASE QUI DIT CE QU'IL FAIT.
  - livre: 18
    titre: "Comptabilités écologiques, sociales et biophysiques"
    collection: cahier-disciplinaire
    fonction: >
      Comparer les méthodes qui rendent visibles les dépendances, destructions
      et régénérations écologiques et sociales, puis les articuler à NEMO IMS
    motifs:
      - "discipline — comptabilité : CARE-TDL, comptabilité nationale au-delà du PIB, flux physiques, biodiversité, audit"
      - "objection — L1.C09 : le lexique comptable comme règle de l'architecture invisible"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 17
    note: >
      OUVERT LE 2026-09-07, sur décision de l'auteur portant la comparaison :
      comptabilité conventionnelle contre CARE/TDL, CSRD, comptabilité
      multicapitaux. PREMIER RÉSULTAT, ET IL EST DÉFAVORABLE : le repli vers
      l'annexe que le corpus tenait depuis IPSAS 51 est CONDITIONNÉ AU
      CONTRÔLE, et ce qui s'applique à défaut est IPSAS 48, dont les deux
      branches donnent UNE CHARGE mesurée à la valeur comptable des ressources
      transférées. À QUOI S'AJOUTE UNE CONVERGENCE : la CSRD loge l'information
      dans le rapport de gestion, sous assurance limitée, expliciment exclue de
      l'opinion d'audit sur les comptes. Deux systèmes normatifs indépendants
      ont choisi de PUBLIER PLUTÔT QUE DE RECONNAÎTRE.
      MANQUE BLOQUANT POUR LA COMPARAISON ANNONCÉE : CARE/TDL n'est pas ouvert.
      Quatre textes de ses auteurs sont localisés en dépôt ouvert sur HAL et le
      téléchargement a échoué sur une épreuve anti-robot, non contournée :
      PDF à fournir par l'auteur. La comptabilité multicapitaux n'est instruite
      par aucune pièce, et la bibliothèque n'en tient aucune.
      PREMIÈRE TRANCHE CLOSE À SIX CHAPITRES LE 2026-09-07, LA PASSE RESTANT
      OUVERTE faute de CARE/TDL. RÉSULTAT PRINCIPAL : le corpus cherchait une
      MESURE, l'obstacle est un TITRE. IPSAS 47 par. 19 énonce que la capacité
      d'exclure ou de réguler l'accès distingue l'actif d'une entité des biens
      publics auxquels toutes les entités ont accès : ce qui fait qu'une chose
      est un commun est ce qui l'empêche d'être l'actif de quiconque, et
      réguler ne vaut pas contrôler. Neuvième condition de falsification F9
      posée en conséquence, portant sur le titre et non sur la mesure, avec sa
      sortie nommée - droit réel inhérent de L6.C06 couplé à la valorisation à
      bénéficiaire nommé de L11.C16 - dont le corpus tient les deux moitiés et
      pas le lien. La question léguée est de DROIT DES BIENS et non de
      statistique, et elle est adressée au Livre 6.
      SECONDE TRANCHE, LE SOIR DU 2026-09-07 : l'auteur ayant fourni trois
      pieces sur CARE/TDL et AfME, F9 EST REVISEE - elle etait trop forte.
      CARE porte les capitaux naturel et humain AU PASSIF en dette de capital,
      avec un simple cout d'usage a l'actif et la mention expresse qu'il n'y a
      pas de propriete de l'homme et de la nature ; AfME constitue un collectif
      d'acteurs sans titulaire. Une comptabilite ecologique peut donc se tenir
      sans propriete ni exclusion, et F9 porte desormais sur LE REFERENTIEL
      APPLICABLE ET L'ENTITE COMPTABLE, non sur le titre.
      MAIS DEUX RESULTATS DEFAVORABLES VIENNENT AVEC : le signe de la
      contrepartie s'inverse, la nature etant chez CARE un creancier et non une
      garantie, de sorte que regenerer eteint une dette au lieu de produire un
      actif mobilisable ; et le concepteur du modele ecarte expressement le
      bareme, ecrivant qu'il y a autant de couts carbone que d'entreprises et
      aucun marche mondial fonde sur un prix du carbone. LE MODELE LE PLUS
      PROCHE DES INTENTIONS DU CORPUS EST CELUI QUI CONTREDIT L11.C13, et la
      position du bareme doit etre argumentee contre lui.
      La comparaison annoncee par le plan est donc COMMENCEE mais non close :
      les articles scientifiques restent inaccessibles, aucune critique
      academique de CARE n'est instruite, et la maturite du modele est classee
      FAIBLE par le comite de praticiens qui l'a compare.
      TROISIEME TRANCHE, L18.C09 : le State of Finance for Nature 2026 du PNUE
      donne au corpus L'ORDRE DE GRANDEUR QU'IL N'AVAIT JAMAIS TENU. En 2023,
      7 300 milliards de dollars de flux directement dommageables a la nature
      contre 220 milliards vers les solutions fondees sur la nature, rapport de
      plus de 30 pour 1, besoin porte a 571 milliards en 2030 : ECART D'ENVIRON
      351 MILLIARDS PAR AN, soit moins de 5 pour cent des flux contraires. Le
      probleme n'est pas que l'argent manque, c'est qu'il va dans l'autre sens.
      Cible chiffree versee a L11 pour toute calibration.
      MAIS LE RAPPORT DESIGNE LUI-MEME UN CONCURRENT MOINS COUTEUX : les
      subventions dommageables depassent 2 000 milliards par an, sont deja des
      deniers publics deja votes, et EN REORIENTER UN SIXIEME COUVRE L'ECART -
      sans institution nouvelle, sans traite, sans unite, sans bareme mondial.
      D'ou F10, LA SUPERFLUITE, posee le meme jour : le corpus a eprouve toute
      la journee si le dispositif PEUT fonctionner, jamais s'il est NECESSAIRE.
      F10 ne se refute par aucun des travaux menes jusqu'ici : mieux instruire
      les normes rend le dispositif plus solide sans le rendre plus necessaire.
      Il se refute par une comparaison d'instruments, et le corpus n'en a
      conduit aucune.
      C'est aussi ici que se traite la comptabilité écosystémique nationale
      dont dépend toute l'allocation de L1.C18 § 5 : si le solde national ne
      peut pas être calculé avec une incertitude compatible avec un versement,
      le mécanisme ne fonctionne pas.
      CHAINE DES TROIS LIVRES BIOPHYSIQUES, ARRETEE PAR L'AUTEUR LE 2026-09-07 ET
      INSCRITE SANS TOUCHER AUX NUMEROS -- convention paragraphe 3, l'ordre et le
      sens se changent dans collection et motifs, jamais par renumerotation :
      L26 ETABLIT LES CONTRAINTES PHYSIQUES, puis L24 DETERMINE LES CONDITIONS ET
      SEUILS A MAINTENIR, puis L18 ORGANISE LEUR MESURE. Le numero n'est pas un
      rang : la chaine est logique, l'ordre de declaration est chronologique, et
      les deux ne coincident pas.
  - livre: 20
    titre: "Droit international public, droit monétaire et commercial de la réforme"
    collection: cahier-disciplinaire
    fonction: >
      Établir sous quel régime juridique NEMO IMS peut exister, ce que le droit
      positif lui interdit aujourd'hui, et par quelles voies ce droit devrait
      évoluer pour le rendre possible — la question n'étant pas seulement la
      conformité du dispositif au droit, mais l'évolution du droit avec lui
    motifs:
      - "falsifieur — F4, seul falsifieur du corpus sans livre depuis l'établissement de la table de routage"
      - "objection — L1.C27 § 4 : le livre affirme que l'équivalence stricte « garantit sa conformité aux règles du commerce international », et l'affirmation n'est pas instruite"
      - "verrou — articles 123 et 130 du traité sur le fonctionnement de l'Union européenne, que L1.C18 § 6 déclare à trancher AVANT tout exposé du mécanisme d'émission"
      - "manque — L7.C01 et L7.C03 : le corpus ne tient AUCUNE source de droit international public, et c'est une lacune de nature différente de celles du Livre 11, qui étaient économiques"
    statut: en-cours
    chapitres_annonces: 23
    chapitres_acquis: 25
    note: >
      PASSE 1 CLOSE LE 2026-09-06, VINGT-TROIS CHAPITRES, LE JOUR MÊME DE
      L'OUVERTURE. Le livre est clos par L20.C23. SIX INSTRUMENTS ONT ÉTÉ
      OUVERTS PAR TÉLÉCHARGEMENT DIRECT le même jour, sous la règle levée par
      l'auteur : traité de Maastricht, statuts du SEBC, statuts du Fonds
      (1944), accord de Marrakech, accord général sur les tarifs douaniers
      (1947), convention sur le droit de la mer (1982) ET SON ACCORD
      D'APPLICATION DE 1994, règlement d'ajustement carbone aux frontières,
      et un arrêt de 2022. ZÉRO SOURCE DOCTRINALE — la limite que L20.C01
      s'était fixée en ouvrant n'a pas été franchie.
      RÉSULTAT GÉNÉRAL, ET IL N'ÉTAIT PAS ATTENDU : les verrous procéduraux
      sont FAIBLES. La prohibition du financement monétaire vise trois
      opérations de crédit, non l'émission ; le monopole d'émission porte sur
      un support ; l'article 20 des statuts du SEBC, logé dans la liste
      révisable à la majorité qualifiée SANS avis conforme du Parlement,
      autorise le conseil des gouverneurs à décider aux deux tiers de tout
      autre moyen opérationnel de contrôle monétaire ; et un accord monétaire
      avec une organisation internationale se conclut à la majorité qualifiée
      en LIANT la banque centrale. TOUTE LA DIFFICULTÉ SE CONCENTRE EN UN
      POINT : la hiérarchie des objectifs (L20.C03).
      DEUX RÉSULTATS QUI CORRIGENT LE LIVRE 7. La double majorité que L7.C06
      croyait construire existe depuis 1944 (trois cinquièmes des membres,
      quatre cinquièmes des voix) et elle est plus exigeante que chacun de ses
      deux critères. La formule « 250 voix de base + une par tranche de
      quote-part » atteint le résultat de la racine carrée de L7.C09 par une
      ADDITION, donc de façon négociable — et s'érode par la seule croissance
      des quotes-parts, ce qui donne la piste la plus vraisemblable pour le
      3,3 % que L7.C02 constatait sans l'expliquer.
      RÉSULTAT DUR, ET IL VAUT AVERTISSEMENT : le seul précédent documenté de
      sanctuarisation juridique — art. 311 § 6 de la convention de 1982,
      interdiction d'amender le principe du patrimoine commun ET d'être partie
      à tout accord y dérogeant — A ÉTÉ CONTOURNÉ EN DOUZE ANS par un accord
      d'application se déclarant prioritaire en cas d'incompatibilité, SANS
      ÊTRE VIOLÉ. La condition sine qua non que pose L7.C13 est réalisable et
      elle n'est pas stable.
      DEUX BLANCS SORTENT OUVERTS : la qualification juridique de l'unité
      émise (aucune, en soixante-dix-huit chapitres), et la protection des
      cadres techniques contre leur PROPRE institution — trois textes, trois
      techniques, le même angle mort ; la demande routée par L7.C10 § 5 sort
      DÉPLACÉE ET NON RÉSOLUE.
      PREMIÈRE ACQUISITION DE LA PASSE SUIVANTE, AVANT TOUTE AUTRE : la
      convention de Vienne sur le droit des traités, réclamée par onze
      chapitres de ce livre.
      OUVERT LE 2026-09-06 SUR DÉCISION DE L'AUTEUR. Le corpus proposait déjà ce
      matricule depuis protocoles/plan-directeur-propose.md, sous un objet plus
      étroit — « Droit monétaire et commercial de la réforme ». L'auteur a
      élargi : « un livre sur le droit international public et son éventuelle
      évolution avec NEMO IMS ». L'élargissement est retenu et il change la
      nature du livre : il ne s'agit plus seulement de vérifier la conformité
      d'un dispositif à un droit donné, mais d'instruire ce que ce droit devrait
      devenir. Le Livre 6 traite le droit DE LA NATURE ; le droit international
      public, monétaire et commercial est un corpus distinct, avec ses sources
      et ses juridictions.
      TROIS BLOCS À INSTRUIRE, tels que les chapitres antérieurs les ont fait
      apparaître. L'EXISTENCE : traité constitutif, personnalité juridique d'une
      organisation émettrice, immunités, régime des différends — L7.C01 et
      L7.C03 établissent que le corpus n'a rien. L'INTERDICTION : articles 123
      et 130, statuts des banques centrales et du Fonds, voies de révision.
      LA CONFORMITÉ : l'ajustement aux frontières au regard du droit du commerce
      international, question ouverte par L1.C27 § 4 et reprise par L11.C24.
      LE LIVRE 19 RESTE PROPOSÉ ET NON DÉCLARÉ — comptabilité monétaire de
      l'émission sans dette, P55 et P56. Son matricule n'est pas brûlé par la
      présente déclaration : les matricules ne se réattribuent pas, et 19
      demeure disponible pour l'objet auquel la proposition le destine.

  - livre: 19
    titre: "Comptabilité monétaire de l'émission à contrepartie collective"
    collection: cahier-technique
    fonction: >
      Établir les écritures complètes d'une émission à contrepartie collective — chez
      l'émetteur, chez la banque centrale nationale, chez le bénéficiaire — et
      dire ce que l'unité est à l'actif comme au passif de chacun
    motifs:
      - "écart de registre corrigé le 2026-09-07 — le matricule est réservé PAR LE PLAN DIRECTEUR et manquait à cette projection ; convention § 3, le plan tranche"
      - "arbitrage — A30 et A35 laissent ouvert ce que l'unité est AU PASSIF, et deux livres y ont buté : L10.C06 et L18.C06"
      - "objection — L11.C02 : l'écriture du Symposium laisse les fonds propres négatifs du montant émis, et l'analogie qui la justifiait était fausse"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 9
    note: >
      MATRICULE DÉCLARÉ LE 2026-09-07, ET C'EST UNE CORRECTION D'ECART, NON UNE
      CREATION. Le plan directeur reserve ce numero a la comptabilite monetaire
      de l'emission sans dette ; la presente projection ne le portait pas, et un
      commentaire de fin de fichier presumait meme le numero libre. La regle du
      paragraphe 3 impose que le plan tranche : le registre est corrige.
      CE LIVRE PORTE CE QUE LA REVUE CONTRADICTOIRE DU 2026-09-07 A DESIGNE
      COMME LE TROISIEME DES CINQ OBJETS A VERROUILLER : le passif. Trois jeux
      d'ecritures completes et separes -- emetteur, banque centrale nationale,
      beneficiaire -- avec les branches destruction, accumulation et fonds
      propres negatifs assumes. Sans lui, ni A30 ni A35 ne peuvent se clore.
      RELU CONTRE LA REVISION 2025 LE 2026-09-08 PAR L19.C09, ET C'EST LA
      PREMIERE FOIS QU'UNE TRANCHE DU CORPUS EST RECONTROLEE CONTRE UNE EDITION
      NOUVELLE DE SA SOURCE. L'appui principal de chacun des six premiers
      chapitres a ete compare, LES DEUX EDITIONS OUVERTES EN TEXTE. Quatre
      tiennent. Deux ont bouge, en sens contraire : la definition de l'unite
      institutionnelle est assouplie sur le passif, et LA FORMULE DU CREANCIER
      COLLECTIF A DISPARU du traitement des droits de tirage speciaux. L19.C05
      APPELLE UNE REVISION DE FOND : son raisonnement est confirme par la
      redaction meme de la revision, mais sa matiere n'est plus dans la norme en
      vigueur.
      OUVERT LE 2026-09-08. L19.C01 remplace l'amorce et ouvre le SYSTEM OF
      NATIONAL ACCOUNTS 2008 -- publication conjointe de la Commission
      europeenne, du FMI, de l'OCDE, des Nations unies et de la Banque mondiale,
      719 pages, lue dans le texte, regime a_verifier.
      QUATRE ENONCES QUI COMMANDENT LE LIVRE. UN PASSIF SUPPOSE DEUX PARTIES :
      "a liability is established when one unit (THE DEBTOR) is obliged [...] to
      provide a payment or series of payments to another unit (THE CREDITOR)",
      et la creance correspondante est INCONDITIONNELLE. IL N'EXISTE AUCUN
      PASSIF NON FINANCIER : "there are NO NON-FINANCIAL LIABILITIES recognized
      in the SNA" -- ce qui ferme d'avance l'echappatoire d'une obligation
      ecologique tenue pour un passif. L'EXCEPTION EST UNIQUE ET CE N'EST PAS
      UNE MONNAIE : "gold bullion held as a reserve asset is THE ONLY financial
      asset with NO CORRESPONDING LIABILITY". ET LA MONNAIE FIDUCIAIRE EST UN
      PASSIF A LA VALEUR FACIALE : "notes and coins are treated as LIABILITIES
      AT FULL FACE VALUE", le cout de fabrication etant "NOT NETTED against the
      receipts from issuing the currency" -- IL N'Y A DONC AUCUN BENEFICE A
      L'EMISSION DANS LES COMPTES NATIONAUX.
      ET UNE CATEGORIE QUE LE CORPUS N'AVAIT PAS VUE : LE PASSIF CONSTRUCTIF.
      "A liability may be established NOT BY CONTRACT but by long and
      well-recognized custom [...] the creditor has A VALID EXPECTATION OF
      PAYMENT, despite the lack of a legally binding contract." C'EST LA SEULE
      PORTE PAR LAQUELLE UNE EMISSION SANS DETTE ENTRE DANS LA NOMENCLATURE SANS
      ETRE RECLASSEE, et elle n'est pas gratuite : elle dispense du CONTRAT, non
      de la DETTE.
      RESULTAT SUR LE LEXIQUE AVANT LA CONCEPTION. "SANS DETTE" RECOUVRE DEUX
      PROPOSITIONS QUE LE CORPUS CONFONDAIT SOUS UN SEUL MOT. Que l'unite ne
      soit la creance de PERSONNE EN PARTICULIER -- tenable, et la norme lui
      offre une categorie. Que l'unite ne soit LE PASSIF DE PERSONNE -- beaucoup
      plus difficile, la norme ne connaissant qu'un seul actif financier sans
      passif et ce n'est pas une monnaie. LE CORPUS DOIT DIRE LAQUELLE DES DEUX
      IL SOUTIENT ET NE PEUT PLUS EMPLOYER L'EXPRESSION SANS PRECISER.
      CE QUE LE CHAPITRE RELEVE DANS LE CORPUS : L10.C06 paragraphe 5 ecrivait
      deja "le corpus n'a jamais dit ce que l'unite est au passif, et A30 ne l'a
      pas tranche non plus" ; et L21.C03 A ECRIT LES QUATRE JEUX D'ECRITURES
      SANS NOMMER L'INSTRUMENT -- il a dit OU l'unite s'inscrit, pas CE QU'ELLE
      EST.
      GRILLE FIXEE A CINQ QUESTIONS : existe-t-il un precedent d'institution
      internationale creant une unite allouee sans contrepartie prealable ; qui
      est le creancier si c'est la societe entiere ; les fonds propres negatifs
      sont-ils un probleme comptable ou prudentiel ; que fait la banque centrale
      nationale de l'"actif transitoire" que L21.C03 a repris sans referentiel ;
      et le reflux est-il une EXTINCTION DE PASSIF ou une RECETTE.
      RESERVES : le SNA est une norme STATISTIQUE et non un referentiel de
      comptes d'entite -- il dit comment un instrument est CLASSE, pas comment
      l'emetteur l'INSCRIT, et confondre les deux serait le pas de trop ; aucun
      referentiel de banque centrale n'est relu a cette lumiere ; et LA VERSION
      2025 DE LA NORME N'EST PAS OUVERTE, acquisition de rang 1 -- une norme
      revisee peut deplacer l'enonce sur lequel ce livre s'appuie, ET CELLE DE
      2008 A PRECISEMENT DEPLACE CELLE DE 1993.
      L19.C02 REPOND A LA QUESTION 1 DE LA GRILLE : LE PRECEDENT EXISTE, IL
      FONCTIONNE DEPUIS UN DEMI-SIECLE, ET LA NORME A TRANCHE DEUX FOIS EN SENS
      CONTRAIRES. Les droits de tirage speciaux sont "international reserve
      assets CREATED BY the International Monetary Fund and ALLOCATED to its
      members", donnant a leur detenteur un "ASSURED AND UNCONDITIONAL RIGHT to
      obtain other reserve assets". Une institution internationale, une creation
      sans contrepartie prealable, une allocation a des participants designes, un
      droit d'obtenir de la monnaie nationale : LE CIRCUIT DE L11.C01 ET L21.C03,
      A L'ECHELON DES AUTORITES MONETAIRES.
      LE PASSIF A ETE RECONNU EN 2008, ET C'EST UN CHANGEMENT DE NORME.
      L'annexe des revisions porte l'intitule "LIABILITY IN SPECIAL DRAWING
      RIGHTS RECOGNIZED" -- un intitule qui dit "desormais reconnu" enonce que la
      version anterieure ne le reconnaissait pas. PENDANT QUINZE ANS LA NORME
      MONDIALE A TRAITE CET INSTRUMENT COMME UN AVOIR SANS PASSIF EN REGARD, ET
      ELLE A CHANGE D'AVIS. Le corpus ne peut donc PAS invoquer ce precedent pour
      soutenir qu'une emission sans passif est representable : c'est precisement
      la representation qui a ete retiree.
      LE CREANCIER EST COLLECTIF, ET LA NORME L'ECRIT : "SDRs are ASSETS WITH
      MATCHING LIABILITIES but the assets represent CLAIMS ON THE PARTICIPANTS
      COLLECTIVELY AND NOT ON THE IMF". A35 A ETE ARBITRE EN ETABLISSANT QUE LA
      SOCIETE ENTIERE PORTE LA DETTE ; LA MEME CONSTRUCTION EST ECRITE DANS LA
      NORME STATISTIQUE MONDIALE DEPUIS 2008 ET LE CORPUS L'IGNORAIT. Ce n'est
      pas une confirmation de justesse -- une norme statistique ne juge pas une
      conception -- MAIS C'EST LA PREUVE QUE LA CONSTRUCTION EST REPRESENTABLE.
      L'EMETTEUR N'EST PAS LE DEBITEUR, ET CELA DEPLACE UNE OBJECTION TENUE POUR
      ACQUISE. Sous ce traitement le Symposium n'aurait PAS de fonds propres
      negatifs : le passif serait chez les beneficiaires, collectivement.
      L11.C02, L21.C03 et L21.C01 reposent tous trois sur une premisse que ce
      precedent ne partage pas. REGLE DU PAS DE TROP APPLIQUEE : le corpus a
      etabli qu'un traitement existe sous lequel l'objection tombe, IL N'A PAS
      ETABLI QUE CE TRAITEMENT S'APPLIQUE. L'OBJECTION EST CONDITIONNEE, ET LA
      CONDITION EST A37.
      LE PRIX EST ECRIT NOIR SUR BLANC. La norme range l'instrument parmi les
      "DEBT INSTRUMENTS such as Special Drawing Rights (SDRs) on the IMF, loans,
      most debt securities, deposits". Et l'allocation porte interet : "SDRs
      attract interest but NO SERVICE CHARGE, as interest PAID BY participants
      holding MORE than their allocation EXACTLY MATCHES the interest OWING TO
      participants holding LESS". UN PARTICIPANT QUI DETIENT EXACTEMENT SON
      ALLOCATION A UN INTERET NET NUL ; CELUI QUI L'A DEPENSEE PAIE. L'ALLOCATION
      EST GRATUITE, L'USAGE NE L'EST PAS -- et ce n'est pas un defaut du
      mecanisme, C'EST SA CONCEPTION.
      ET CELA RECOUPE LE REFLUX COLLECTIF PAR L'AUTRE FACE : les deux repondent
      au meme probleme -- rendre couteux ce qui a ete donne -- par le meme point
      d'application, LA TRANSACTION ET NON LA DETENTION. UNE DIFFERENCE COMMANDE
      TOUT LE RESTE ET N'EST PAS TRANCHEE : ici le prelevement est un TRANSFERT
      entre participants, sous le dispositif la fonte DETRUIT. Un transfert
      laisse l'encours inchange, une destruction le reduit, ET LE CORPUS N'A
      JAMAIS COMPARE LES DEUX.
      LA OU LE PRECEDENT S'ARRETE, LE CHAPITRE S'ARRETE. L'instrument est detenu
      "EXCLUSIVELY BY OFFICIAL HOLDERS" et le beneficiaire du dispositif est un
      PRESTATAIRE PRIVE. C'est la meme frontiere que L21.C03 avait rencontree par
      un autre chemin : DEUX CHAPITRES, DEUX NORMES DIFFERENTES, UNE SEULE ET
      MEME LIMITE -- le circuit ne trouve pas de place pour un beneficiaire prive
      au niveau ou il l'a place.
      RESERVES : les statuts du Fonds ne sont pas ouverts, acquisition de rang 1,
      et L20.C09 avait deja enregistre ce manque ; la cle d'allocation n'est pas
      instruite alors que c'est la question que le Livre 25 pose au dispositif ;
      le manuel de balance des paiements n'a pas ete ouvert, deux telechargements
      ayant echoue sur une page d'erreur -- AUCUNE DETECTION DE ROBOT N'EST EN
      CAUSE, c'est un echec d'acquisition ordinaire.
      L19.C03 REPOND A LA QUESTION 5 ET TRANCHE DU MEME COUP LA BIFURCATION QUE
      L11.C01 AVAIT INSTRUITE SANS LA TRANCHER. La norme offre TROIS classements
      a un prelevement : le TRANSFERT ("without receiving from the latter any
      good, service or asset in return as a direct counterpart"), l'EXTINCTION
      ("financial assets are extinguished WHEN THE DEBTOR HAS FULFILLED the
      financial obligation"), et la DISPARITION ECONOMIQUE ("to allow certain
      assets to enter and leave the SNA OTHER THAN BY TRANSACTIONS"). LES TROIS
      NE SONT PAS INTERCHANGEABLES -- le premier fait une ressource, le deuxieme
      ne fait rien pour personne mais reduit un passif, le troisieme detruit sans
      profiter -- ET "REFLUX" DESIGNE INDIFFEREMMENT LES TROIS DANS LE CORPUS.
      CE QUI TRANCHE N'EST PAS LE MECANISME MAIS LE MOMENT. Une variation de
      principal INSCRITE DANS LES TERMES est un INTERET : "the payment owing to
      indexation should be recorded as INTEREST (property income)". Une reduction
      DECIDEE APRES COUP est une repudiation : "the UNILATERAL REPUDIATION OF
      DEBT BY A DEBTOR is also not a transaction and IS NOT RECOGNIZED IN THE
      SNA", et la raison est donnee -- "because there is NO MUTUAL AGREEMENT
      between the parties". Le contre-exemple confirme : une remise de dette est
      enregistrable PARCE QU'ELLE EST CONVENUE, "via A CONTRACTUAL ARRANGEMENT
      with the debtor".
      TROIS RESULTATS. F7 CHANGE DE NATURE : un prelevement discretionnaire n'est
      pas seulement peu credible, IL N'EST PAS ENREGISTRABLE, et la preference
      pour la regle devient une CONDITION DE REPRESENTABILITE. "SANS INTERET"
      TOMBE COMME "SANS DETTE" ETAIT TOMBE EN L19.C01 : une unite qui fond selon
      une regle ecrite est, sous la norme, UNE UNITE PORTANT INTERET DE SIGNE
      NEGATIF -- deuxieme correction de lexique en trois chapitres, et de la meme
      espece, ce que la norme retire n'etant pas le mecanisme mais LE MOT.
      ET UNE ALTERNATIVE DONT LES DEUX BRANCHES SE PAIENT. SI L'UNITE EST LE
      PASSIF DE L'EMETTEUR : fonds propres negatifs, MAIS la fonte est un interet
      negatif sur SA PROPRE DETTE et n'exige AUCUNE competence fiscale -- c'est
      exactement la branche que L10.C06 jugeait "la plus favorable" et qu'il ne
      pouvait pas ouvrir. SI ELLE NE L'EST PAS (traitement de L19.C02) : pas de
      fonds propres negatifs, MAIS la fonte redevient un transfert exigeant une
      competence fiscale que le dispositif n'a pas. LE CORPUS NE PEUT PAS PRENDRE
      LES DEUX AVANTAGES, ET C'EST A37 QUI DECIDE. A37 devient en deux chapitres
      LA QUESTION LA PLUS CHERE DU CORPUS : elle decide des fonds propres ET de
      la competence necessaire au reflux.
      RESERVES : l'extension aux unites monetaires d'une regle enoncee pour des
      TITRES DE DETTE INDEXES est une inference du corpus, plausible et NON LUE ;
      les deux ressorts du reflux ne sont PAS DE MEME NATURE sous la norme -- le
      demurrage porte sur la DETENTION et releve du revenu de la propriete, le
      reflux transactionnel porte sur l'ECHANGE et releve du transfert -- et seul
      le premier est instruit ; aucun referentiel de comptes d'entite n'est
      ouvert, le resultat portant sur la REPRESENTABILITE et non sur
      l'AUDITABILITE ; et LE CAS OU LE DETENTEUR ACCEPTE n'est pas instruit,
      alors qu'il pourrait rouvrir la branche que ce chapitre ferme.
      L19.C04 REPOND A LA QUESTION 4 : L'"ACTIF TRANSITOIRE" DU CAHIER TECHNIQUE
      N'EXISTE PAS DANS LA NOMENCLATURE, ET LE PROBLEME NE DISPARAIT PAS -- IL
      CHANGE DE BILAN. La definition meme de l'actif contient le mot qui tranche :
      "an asset [...] is a means of CARRYING FORWARD VALUE FROM ONE ACCOUNTING
      PERIOD TO ANOTHER". Un poste qui, par construction, ne franchit aucune
      cloture NE REPORTE RIEN.
      DES TROIS CASES OU CE POSTE POURRAIT ENTRER, DEUX SE FERMENT. ACTIF
      FINANCIER : il exige une contrepartie, "gold bullion held as a reserve
      asset is THE ONLY financial asset with NO CORRESPONDING LIABILITY", donc un
      DEBITEUR -- et il n'existe que DEUX candidats, l'emetteur ou la
      collectivite des participants, SANS TROISIEME. ACTIF NON FINANCIER DE LA
      CATEGORIE CONTRATS ET LICENCES : la condition est que l'accord "RESTRICTS
      the general use or supply of products covered", ce qu'un certificat qui
      ATTESTE un service rendu ne fait pas -- il constate, il n'exclut personne de
      rien. CETTE FERMETURE APPUIE LE TRANCHAGE QUE L21.C03 AVAIT FAIT "SANS
      REFERENTIEL" SUR LE PREMIER JEU D'ECRITURES.
      TROISIEME CASE : L'ABSENCE D'ACTIF, ET ELLE DEPLACE. La banque centrale
      nationale aurait alors emis cent de monnaie -- un passif a la valeur
      faciale, la norme l'exige -- EN REGARD DE RIEN, et ses fonds propres
      baissent de cent. CE N'EST PAS UN ADOUCISSEMENT MAIS UNE AGGRAVATION : une
      institution A CREER peut recevoir des statuts qui accommodent des fonds
      propres negatifs ; UNE BANQUE CENTRALE EXISTANTE ne le peut pas sans que son
      statut, son actionnaire public et son regime de distribution soient en
      cause -- ET IL FAUDRAIT L'OBTENIR DANS CHAQUE PAYS PARTICIPANT, UN PAR UN.
      "TRANSITOIRE" NE RESOUT RIEN : IL DEPLACE, ET VERS LE BILAN LE PLUS
      DIFFICILE A MODIFIER DES TROIS.
      RESULTAT LE PLUS SOLIDE DU LIVRE A CE STADE. LA MEME BIFURCATION APPARAIT
      POUR LA TROISIEME FOIS, SUR UN TROISIEME BILAN, PAR TROIS CHEMINS
      INDEPENDANTS -- L19.C02 au bilan de l'emetteur, L19.C03 dans la nature du
      reflux, L19.C04 au bilan de la banque centrale nationale. AUCUN DES TROIS
      NE PERMET DE L'EVITER ET AUCUN NE LA TRANCHE, PARCE QU'ELLE NE SE TRANCHE
      PAS PAR LA COMPTABILITE : elle se tranche par le statut de l'emetteur,
      c'est-a-dire par A37. Ce n'est pas une reponse, mais L'ETABLISSEMENT QUE LA
      QUESTION EST UNIQUE ET QU'ELLE COMMANDE TROIS ECRITURES QUE LE CORPUS
      CROYAIT INDEPENDANTES.
      ET UNE EXPOSITION QUE LE CORPUS N'AVAIT JAMAIS NOMMEE : si la banque
      centrale nationale porte une creance sur l'emetteur, ELLE Y EST EXPOSEE,
      et il s'agit d'un actif sans marche ni notation dont elle ne peut etablir ni
      la valeur ni la liquidite. REGLE DU PAS DE TROP APPLIQUEE : le passage
      d'une ecriture comptable a une question prudentielle et statutaire est
      MARQUE ET NON FRANCHI, et route vers L10.C07, non relu a cette lumiere.
      RESERVES : aucun referentiel de banque centrale n'est ouvert et C'EST LA
      TROISIEME FOIS EN TROIS CHAPITRES QUE LE CORPUS LE DECLARE ; le mot
      "transitoire" n'est pas defini par la source qui l'emploie -- ni duree, ni
      extinction, ni presence a une cloture -- de sorte que le chapitre instruit
      les DEUX lectures sans trancher, ET C'EST A L'AUTEUR DE DIRE LAQUELLE IL
      RETIENT, LES DEUX NE COUTANT PAS LA MEME CHOSE ; et rien n'etablit qu'une
      banque centrale puisse porter a son actif une creance sur un DEBITEUR
      COLLECTIF NON IDENTIFIE, ce que le traitement de L19.C02 supposerait.
      L19.C05 REPOND A LA QUESTION 2 ET DEBLOQUE LE DERNIER POINT DE A30. UN
      DEBITEUR COLLECTIF N'EXISTE PAS DANS LA NORME : une unite institutionnelle
      est "an economic entity that is capable, IN ITS OWN RIGHT, of owning
      assets, INCURRING LIABILITIES", et un passif oppose DEUX UNITES NOMMEES. "LA
      SOCIETE ENTIERE" NE SIGNE PAS, NE PAIE PAS, NE PEUT ETRE NI POURSUIVIE NI
      LIBEREE -- prise a la lettre, la formule de A35 NE DESIGNE AUCUN DEBITEUR.
      CE QUI SAUVE LA CONSTRUCTION. Le precedent fait porter la creance "on the
      participants COLLECTIVELY", et cela fonctionne parce que CHAQUE PARTICIPANT
      EST LUI-MEME UNE UNITE, individuellement obligee pour sa propre part --
      "interest PAID BY participants holding MORE than their allocation exactly
      matches the interest OWING TO participants holding LESS". LE
      "COLLECTIVEMENT" EST UNE AGREGATION, PAS UNE ENTITE. Un debiteur collectif
      comme TOTALITE n'est pas representable ; comme SOMME DE DEBITEURS
      IDENTIFIES, il l'est parfaitement, ET CE N'EST PAS UNE VERSION AFFAIBLIE DU
      PREMIER MAIS AUTRE CHOSE.
      ET LE CORPUS TENAIT DEJA LA REPONSE SANS L'AVOIR VUE. L19.C03 a etabli
      qu'une fonte inscrite dans les termes est un INTERET DU PAR LE DETENTEUR. LE
      DEBITEUR N'EST DONC PAS LA SOCIETE : C'EST LE DETENTEUR, A PROPORTION DE CE
      QU'IL DETIENT. Chaque detenteur est une unite institutionnelle, chacun est
      oblige pour sa part, et la somme de ces obligations EST la dette collective.
      LE POINT BLOQUANT DE A30 RECOIT SON MECANISME, ET IL EST SIMPLE. L'assiette
      qui garantit la dette EST L'ENCOURS DETENU. Or le dispositif vise a faire
      CIRCULER la monnaie plutot qu'a la faire dormir -- c'est la raison d'etre du
      demurrage. PLUS IL REUSSIT, MOINS IL Y A D'ENCAISSES OISIVES ; MOINS IL Y A
      D'ENCAISSES, PLUS L'ASSIETTE EST ETROITE. CE QUI GARANTIT LA DETTE
      COLLECTIVE S'ERODE QUAND LE DISPOSITIF REUSSIT PARCE QUE LA GARANTIE EST
      L'ENCOURS ET QUE LE SUCCES LE REDUIT. Le point n'est pas leve : IL EST
      EXPLIQUE -- et une objection qui a un mecanisme est attaquable quand une
      objection sans mecanisme ne l'etait pas.
      DEUX CONSEQUENCES LATERALES, DONT UNE FAVORABLE. LA REPARTITION DE LA CHARGE
      NE SUIT AUCUN CRITERE POLITIQUE : ELLE SUIT LA DETENTION -- le Livre 25
      cherchait une cle que le droit ne donne pas, et il en existe une QUE
      PERSONNE N'A CHOISIE. Et QUI NE DETIENT RIEN NE DOIT RIEN : la dette n'est
      collective qu'en ce qu'aucun debiteur n'est designe a l'avance, NUL N'ETANT
      ENGAGE SANS AVOIR RECU -- le corpus ne l'avait pas enonce.
      ET UN CRITERE NOUVEAU SUR LE NOEUD DE PRELEVEMENT : seul un noeud qui
      IDENTIFIE UN DETENTEUR ET MESURE SA POSITION produit une dette
      representable. FRAPPER LES RESERVES BANCAIRES DEPLACE DONC LE DEBITEUR VERS
      LES BANQUES, et le corpus devrait alors ecrire que CE SONT ELLES qui portent
      la dette collective -- ce qu'il n'a jamais ecrit.
      RESERVES : les statuts du precedent ne sont pas ouverts, l'obligation
      individuelle etant INFEREE d'un flux d'interet observable et non lue ;
      l'identite entre detenteur et debiteur n'est etablie que SOUS LA BRANCHE DU
      DEMURRAGE, le reflux transactionnel frappant celui qui TRANSACTE et non
      celui qui DETIENT -- deux ressorts, deux debiteurs, deux natures comptables,
      et L11.C09 n'est pas relu a cette lumiere ; l'erosion est DECRITE ET NON
      MESUREE, seul le simulateur du Livre 13 pouvant la chiffrer et il n'existe
      pas ; et AUCUNE CONSEQUENCE DISTRIBUTIVE N'EST TIREE, le corpus ne tenant
      aucune donnee sur la distribution des encaisses.
      L19.C06 REPOND A LA QUESTION 3 EN LA SCINDANT : ELLE MELANGEAIT TROIS
      REGISTRES QUE LE CORPUS TRAITAIT COMME UN SEUL.
      REGISTRE COMPTABLE : REGLE, ET FAVORABLE. La norme ecrit qu'une entite "is
      seen to have A NET WORTH (WHICH COULD BE POSITIVE OR NEGATIVE)". DES FONDS
      PROPRES NEGATIFS SONT REPRESENTABLES, ce n'est ni une anomalie ni une
      infraction, et aucun ajustement n'est requis.
      REGISTRE PRUDENTIEL : OUVERT ET CONDITIONNE POUR LA QUATRIEME FOIS. Le
      principe 15 et le ratio de levier ne s'appliquent pas a qui que ce soit
      mais A DES ENTITES QUALIFIEES, et savoir si l'emetteur en est une EST A37.
      QUATRIEME FOIS EN CINQ CHAPITRES QUE A37 DECIDE -- il decide qui porte le
      passif (C02), si le reflux exige une competence fiscale (C03), quel bilan
      porte le deficit (C04), et si l'objection prudentielle s'applique (C06). CE
      N'EST PLUS UNE QUESTION OUVERTE PARMI D'AUTRES : C'EST LE NOEUD DE TOUT LE
      LIVRE. Et le corpus enregistre qu'AUCUN TEXTE ETABLISSANT LE CHAMP
      D'APPLICATION DE CES REGLES N'EST OUVERT, de sorte que l'objection est EN
      SUSPENS -- ce qui n'est pas la meme chose qu'etre refutee.
      REGISTRE STATUTAIRE : OUVERT, ET PERSONNE NE L'AVAIT NOMME. Une situation
      nette negative met en cause UN ACTIONNAIRE, UNE REGLE DE DISTRIBUTION ET UNE
      CONTINUITE D'EXPLOITATION, non un superviseur. C'EST LE SEUL DES TROIS
      REGISTRES OU LE DISPOSITIF DISPOSE D'UN DEGRE DE LIBERTE, tant que
      l'institution reste a creer.
      ET UN FAIT DE CLASSEMENT QUE LE CORPUS IGNORAIT. "For purposes of the SNA,
      international organizations are treated as units that are RESIDENT IN THE
      REST OF THE WORLD" ; elles sont "resident in AN ECONOMIC TERRITORY OF THEIR
      OWN and not of the economy in which they are physically located" ; et il
      serait "IN PRINCIPLE possible [...] to compile A FULL SET OF ACCOUNTS FOR
      THEM" -- une possibilite de principe qu'on prend la peine d'enoncer est une
      pratique qui n'a pas lieu. LE BILAN DE L'EMETTEUR N'ENTRE DANS LES COMPTES
      DE PERSONNE, ni du pays ou il siege ni d'aucun membre, ET SES FONDS PROPRES
      NEGATIFS NE FIGURENT DANS AUCUN COMPTE NATIONAL. Cela eclaire aussi
      l'exception du paragraphe 22.151 : la norme ne classe un producteur non
      marchand parmi les societes que dans UN SEUL CAS NOMME, LA BANQUE CENTRALE.
      UNE CORRECTION DE CE QUE CE LIVRE A ECRIT LE JOUR MEME. L19.C02 lisait
      "claims on the participants collectively and not on the IMF" comme une
      DOCTRINE sur qui porte la dette. SI LE DEBITEUR EST HORS DE TOUTE ECONOMIE,
      AUCUN COMPTE NATIONAL NE PEUT PORTER LE PASSIF -- ET LES COMPTES DOIVENT
      POURTANT BOUCLER. Assigner la creance aux participants pourrait donc etre UN
      ARTEFACT DE RESIDENCE et non une these sur la dette. Le corpus ne peut pas
      trancher, la source enoncant le traitement sans le motiver, MAIS IL NE PEUT
      PLUS INVOQUER CE PRECEDENT COMME UNE VALIDATION DE A35 SANS PORTER CETTE
      RESERVE.
      CE QUE L'INVISIBILITE DONNE ET CE QU'ELLE COUTE. Elle donne qu'aucune
      statistique publique ne fera apparaitre le deficit et qu'aucune regle
      nationale ne s'y appliquera de ce fait -- avantage reel. ELLE COUTE PLUS
      LOURD : une institution dont le bilan n'entre dans aucun compte national
      N'EST SURVEILLEE PAR AUCUNE STATISTIQUE PUBLIQUE. CE N'EST PAS UNE
      PROTECTION, C'EST UNE ABSENCE DE CONTROLE -- et le corpus a passe un livre
      entier, le 14, a soutenir que la preuve doit etre gouvernee. LE DISPOSITIF
      NE PEUT PAS SE RECLAMER A LA FOIS DE L'INVISIBILITE STATISTIQUE ET DE LA
      REDEVABILITE : s'il veut la seconde, IL DOIT LA PRODUIRE LUI-MEME.
      RESERVES : l'explication par la residence est UNE HYPOTHESE DU CORPUS,
      marquee comme telle, et elle demanderait les travaux preparatoires de la
      revision de 2008, non ouverts ; aucune regle prudentielle n'est ouverte
      dans le chapitre, de sorte que le champ d'application reste inconnu ; le
      registre statutaire est NOMME ET NON INSTRUIT ; et l'invisibilite
      statistique est ETABLIE quand ses consequences sur la surveillance sont UNE
      INFERENCE -- routee vers L7 et L14, non instruite ici.
      L19.C07 CLOT LA PREMIERE TRANCHE A SEPT CHAPITRES, UNE SEULE SOURCE OUVERTE
      DE PREMIERE MAIN, ET LES CINQ QUESTIONS DE LA GRILLE RECOIVENT TOUTES UNE
      REPONSE -- AUCUNE N'ETANT CELLE QUE LE CORPUS ATTENDAIT.
      CE QUE LA TRANCHE COUTE : DEUX MOTS, ET CE SONT DEUX MOTS CENTRAUX. "SANS
      DETTE" recouvrait deux propositions -- pas de creancier contractuel, pas de
      passif -- DONT SEULE LA PREMIERE EST TENABLE. "SANS INTERET" en recouvrait
      deux aussi, ET UNE FONTE ECRITE DANS LES TERMES EST UN INTERET DE SIGNE
      NEGATIF. Dans les deux cas, CE QUE LA NORME RETIRE N'EST PAS LE MECANISME,
      C'EST LE NOM : le dispositif fonctionne exactement comme le corpus le
      decrit, il ne peut plus se decrire avec ces mots-la sans preciser. PERTE DE
      COMMUNICATION ET NON DE CONCEPTION -- reelle, ces deux expressions portant
      la revendication du livre, et irreversible tant que la norme est celle-ci.
      CE QUE LA TRANCHE DONNE. LE POINT BLOQUANT DE A30 RECOIT SON MECANISME --
      l'assiette qui garantit la dette est l'encours detenu, et le succes du
      dispositif l'erode ; le point n'est pas leve, IL EST EXPLIQUE, et une
      objection qui a un mecanisme est attaquable quand une objection sans
      mecanisme ne l'etait pas. LA BIFURCATION DE L11.C01 EST TRANCHEE SOUS
      CONDITION : le reflux est une RESSOURCE et non une destruction, si le taux
      est ecrit avant l'emission. F7 RECOIT UNE SECONDE RAISON QUI NE DEPEND
      D'AUCUNE ANTICIPATION. LA BRANCHE FAVORABLE DE L10.C06 EST OUVERTE. Et une
      propriete favorable que personne n'avait enoncee : QUI NE DETIENT RIEN NE
      DOIT RIEN -- nul n'est engage sans avoir recu.
      LE RESULTAT STRUCTUREL, ET IL COMMANDE LA SUITE. A37 DECIDE QUATRE FOIS, SUR
      QUATRE OBJETS QUE LE CORPUS CROYAIT INDEPENDANTS : qui porte le passif, si
      le reflux exige une competence fiscale, quel bilan porte le deficit, et si
      l'objection prudentielle s'applique. CE N'EST PLUS UN ARBITRAGE PARMI
      D'AUTRES : C'EST LE NOEUD DU LIVRE ET PROBABLEMENT DU DISPOSITIF. AUCUNE
      COMBINAISON DES BRANCHES N'EST FAVORABLE, et le corpus l'a etabli PAR TROIS
      CHEMINS INDEPENDANTS. Ce n'est pas une reponse : c'est l'etablissement que
      LA QUESTION EST UNIQUE.
      RESERVES DECLAREES. UNE SEULE SOURCE POUR SIX CHAPITRES, ET C'EST LA
      FAIBLESSE PRINCIPALE -- aucune contradiction n'est possible dans ces
      conditions, les tranches des Livres 24 et 26 tenant chacune plusieurs
      sources quand celle-ci n'en tient qu'une. LA SOURCE EST UNE NORME
      STATISTIQUE ET NON UN REFERENTIEL DE COMPTES D'ENTITE : toute la tranche
      porte sur la REPRESENTABILITE, AUCUNE LIGNE SUR L'AUDITABILITE. LA REVISION
      DE 2025 N'EST PAS OUVERTE, et la tranche etablit elle-meme pourquoi c'est
      grave -- UNE NORME QUI A DEJA CHANGE D'AVIS UNE FOIS SUR CE POINT PRECIS
      PEUT EN CHANGER ENCORE ; acquisition de rang 1 du livre. Et AUCUN
      REFERENTIEL DE BANQUE CENTRALE N'A ETE OUVERT, le corpus l'ayant declare
      TROIS FOIS sans y remedier, de sorte que le jeu d'ecritures de la banque
      centrale nationale reste appuye sur le seul Cahier technique de l'auteur.
      LE CORPUS SORT DE CETTE TRANCHE AVEC DEUX MOTS EN MOINS, UN MECANISME EN
      PLUS, UNE BIFURCATION TRANCHEE, ET UNE SEULE QUESTION QUI EN COMMANDE
      QUATRE. C'EST PLUS QU'IL N'EN AVAIT EN ENTRANT, ET C'EST MOINS QU'IL
      N'ESPERAIT.

  - livre: 21
    titre: "La plomberie financière mondiale"
    collection: cahier-disciplinaire
    fonction: >
      Comprendre comment les paiements, titres, garanties et devises circulent
      réellement — par quels bilans et quelles infrastructures une transaction
      mondiale devient-elle définitive
    motifs:
      - "discipline — infrastructures de marché : messagerie, compensation, règlement, dépositaires, contreparties centrales"
      - "manque — L5.C02 a instruit SEPT des vingt-quatre principes du PFMI et le corpus n'a ouvert aucune infrastructure existante : ni coût, ni délai, ni volume d'équilibre"
      - "objection — L5.C09 : l'infrastructure fournit le rail de la séquence d'entrée, et le corpus ne sait pas où l'unité s'y logerait"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 8
    architecture: >
      Douze chapitres proposés par l'auteur : message, paiement, compensation et
      règlement comme quatre opérations distinctes ; monnaie de banque
      commerciale et monnaie de banque centrale ; banques correspondantes et
      paiements transfrontaliers ; SWIFT, messagerie, pouvoir de connexion et
      sanctions ; CLS et le règlement des opérations de change ; Clearstream,
      Euroclear et les dépositaires centraux ; chambres de compensation et
      contreparties centrales ; pension livrée et financement garanti ;
      collatéral, décotes, appels de marge et réutilisation ; dépositaires
      globaux et chaînes de propriété ; concentration, panne, cyberattaque et
      continuité ; et où l'unité se logerait exactement dans cette plomberie.
    note: >
      FRONTIERE AVEC LE LIVRE 10, POSEE PAR L'AUTEUR ET A TENIR : le Livre 10
      compare les systemes bancaires et les banques centrales NATIONAUX ; le
      Livre 21 etudie LES RESEAUX TRANSNATIONAUX QUI LES RELIENT. Les PFMI de la
      BRI confirment que systemes de paiement, depositaires, systemes de
      reglement et contreparties centrales forment des infrastructures critiques
      DISTINCTES. Source d'entree deja au Drive : BIS-PFMI-2012.pdf, dont dix-sept
      principes restent non instruits.
      OUVERT LE 2026-09-07 PAR L21.C01, qui remplace l'amorce et instruit QUATRE
      PRINCIPES DE PLUS -- 4, 5, 15 et 16 -- portant le total a onze sur
      vingt-quatre.
      RESULTAT PRINCIPAL, ET IL EST UNE COLLISION FRONTALE. LE PRINCIPE 15 exige
      de toute infrastructure qu'elle detienne des "liquid net assets FUNDED BY
      EQUITY" suffisants pour poursuivre son activite EN CONTINUITE
      D'EXPLOITATION et pour financer UNE LIQUIDATION ORDONNEE. Or L11.C02
      etablit des FONDS PROPRES NEGATIFS DU MONTANT EMIS, et la correction du
      meme jour a retire l'analogie qui presentait ce resultat comme ordinaire.
      UNE ENTITE QUI EMET EN DONNANT NE SATISFAIT PAS UN PRINCIPE CONCU POUR UNE
      ENTITE QUI ABSORBE SES PERTES SUR SON CAPITAL.
      ISSUE JAMAIS ECRITE PAR LE CORPUS : SEPARER L'EMETTEUR DE L'INFRASTRUCTURE
      -- avec son cout, puisque CE QUI REND L'INFRASTRUCTURE CONFORME EST CE QUI
      LA REND INDIFFERENTE A L'UNITE QU'ELLE TRANSPORTE.
      SECOND RESULTAT : le test de risque minimal que le corpus croyait propre a
      l'actif de reglement EST LA REGLE GENERALE DU TEXTE -- principes 4, 5, 9 et
      16 l'appliquent aux expositions, au collateral, au reglement et aux
      investissements. IL N'EXISTE AUCUNE POCHE DU BILAN D'UNE INFRASTRUCTURE OU
      LOGER UN ACTIF DONT LA VALEUR DEPEND D'UN ETAT ECOLOGIQUE. Et le principe 5
      ajoute LES LIMITES DE CONCENTRATION, alors que le dispositif suppose une
      contrepartie homogene.
      RESERVE CENTRALE : la qualification de l'emetteur comme infrastructure
      n'est pas etablie, et tout le chapitre lui est conditionnel.
      L21.C02 : trois principes de plus -- 7, 12 et 20 -- portant le total a
      QUATORZE SUR VINGT-QUATRE.
      L21.C03 SOLDE LA RESERVE PRINCIPALE DES DEUX PREMIERS CHAPITRES : il ecrit
      les ecritures d'une operation complete, entite par entite, et instruit
      QUATRE PRINCIPES DE PLUS -- 3, 8, 13 et 22 -- portant le total a DIX-HUIT
      SUR VINGT-QUATRE.
      RESULTAT NON CHERCHE : LE CIRCUIT COMPTE QUATRE BILANS ET NON TROIS. Le
      Cahier fait sortir la monnaie nationale au passif de la banque centrale au
      benefice du prestataire ; or une banque centrale n'ouvre pas de compte a
      une entreprise ordinaire. Il faut donc LA BANQUE DU PRESTATAIRE, que le
      corpus n'avait jamais placee dans le circuit d'emission -- ou bien une
      MONNAIE NUMERIQUE DE BANQUE CENTRALE DE DETAIL, que le dispositif
      presupposerait sans l'avoir nommee.
      DIVERGENCE TRANCHEE CONTRE LA SOURCE : le Cahier porte deux actifs au
      Symposium face au passif emis, L11.C02 n'en porte aucun. Le corpus tient
      L11.C02 -- un certificat qui n'est le droit d'obtenir rien de personne et
      une creance sur un debiteur que A35 dissout ne sont pas des actifs. LA
      REVENDICATION DE CONTINUITE COMPTABLE TOMBE DES LA PREMIERE ECRITURE.
      PRINCIPE 8 : le caractere definitif est acquis GRATUITEMENT sur la jambe
      qui paie le prestataire, et IMPOSSIBLE sur la jambe qui lie l'emetteur a
      la banque centrale, faute de date de valeur.
      PRINCIPE 13 : les procedures de defaillance sont INAPPLICABLES -- non
      violees -- au risque central du dispositif, tous leurs outils supposant
      une position a deboucler qu'un service consomme par le monde n'est pas.
      La question revient donc a LA QUALIFICATION DE L'ENSEMBLE.
      DEUX ACQUIS FAVORABLES. Principe 22 : les normes de communication
      existent et il suffit de les accommoder -- avec la consequence que la
      qualification voyage HORS du message, dans un registre separe, ce qui
      deplace la charge sur L11.C13 et L11.C25. Principe 3 : LE DISPOSITIF
      POSSEDE UN PLAN DE LIQUIDATION ORDONNEE PAR CONSTRUCTION, ET C'EST LA
      FONTE -- resultat que le corpus ne cherchait pas. Son prix est le
      renoncement a la discretion sur le bareme, puisqu'un plan de liquidation
      s'annonce et se tient (L11.C11, L11.C23).
      ACQUISITION DE RANG 1 : le cadre du ratio de levier de Bale III et le sort
      des reserves de banque centrale dans la mesure d'exposition -- le corpus
      pose sans l'etablir que le cout en fonds propres du dispositif serait
      porte par les banques des prestataires.
      L21.C04 FERME CETTE ACQUISITION PAR LECTURE DIRECTE DU CADRE CONSOLIDE DE
      BALE, ET LA FERME CONTRE LE DISPOSITIF. LEV30.8 : "Banks must include ALL
      BALANCE SHEET ASSETS in their leverage ratio exposure measure". LEV20.7 :
      minimum de 3 % en capital de premiere categorie, "AT ALL TIMES". Et la
      version d'origine de 2014, fouillee integralement, NE MENTIONNE PAS UNE
      SEULE FOIS LES BANQUES CENTRALES, tout en ecrivant que "netting of loans
      and deposits is NOT ALLOWED".
      LA SEULE DEROGATION SE REFERME SUR ELLE-MEME. LEV30.7 autorise une
      exemption TEMPORAIRE, en CIRCONSTANCES MACROECONOMIQUES EXCEPTIONNELLES,
      pour FACILITER LA POLITIQUE MONETAIRE -- trois conditions dont le
      dispositif ne remplit aucune -- et impose a la juridiction qui l'utilise
      d'augmenter le minimum "COMMENSURATELY to offset the impact". Elle
      RELOCALISE le cout, elle ne le supprime pas.
      PREMIERE GRANDEUR D'ORDRE DU COTE DE L'EMISSION, ET C'EST UN RATIO DONC IL
      CROIT A LA VITESSE DE L'AMBITION : TROIS DE FONDS PROPRES BANCAIRES DE
      PREMIERE CATEGORIE PAR CENT D'UNITES EN CIRCULATION.
      PORTEE BORNEE, ET LE CHAPITRE LA DIT : CRE20.7 pondere a 0 % les
      expositions sur les banques centrales, donc les reserves ne consomment
      AUCUN capital pondere et le levier est la seule contrainte qui les
      atteigne -- il ne mord que pour les banques deja a leur limite, c'est-a-
      dire les plus grandes, qui portent en outre le coussin de LEV40. LE
      DISPOSITIF SERAIT LE PLUS COUTEUX A HEBERGER POUR EXACTEMENT LES
      INSTITUTIONS DONT IL AURAIT BESOIN.
      RESULTAT DE CONCEPTION NON CHERCHE : le capital immobilise vaut 3 % de
      l'ENCOURS, et l'encours vaut le flux multiplie par la duree avant reflux.
      LA VITESSE DE LA FONTE COMMANDE DONC LA CHARGE IMPOSEE AU SYSTEME
      BANCAIRE -- argument pour une fonte rapide, direction que le corpus
      n'avait jamais empruntee, et qui contredit L11.C09 et L21.C03.
      L21.C05 OUVRE LA PREMIERE INFRASTRUCTURE EXISTANTE QUE LE CORPUS TIENNE --
      les regles publiques de l'infrastructure mondiale de reglement des
      operations de change, telechargees et lues -- ET LE RESULTAT JOUE EN
      PARTIE POUR LE DISPOSITIF.
      DIX CONDITIONS CUMULATIVES a l'admission d'une monnaie (regle 3.1.2). DEUX
      SONT FERMEES PAR DEFINITION a un emetteur non etatique : le critere (h)
      exige un compte special chez "the relevant Central Bank", defini comme
      "the central monetary authority OF THE COUNTRY THAT ISSUES such Eligible
      Currency" ; le critere (g) apprecie l'etat de droit "IN THE JURISDICTION
      OF SUCH CURRENCY" et la VOLATILITE HISTORIQUE, qu'une unite neuve n'a pas.
      Le critere (e) referme le seuil d'activation. Le critere (a) met la porte
      entre les mains des occupants -- deux actionnaires doivent la demander.
      RESULTAT LE PLUS NEUF, ET IL FRAPPE LA CONCEPTION : le critere (b) exige
      TROIS FOURNISSEURS DE LIQUIDITE, qui detiennent un stock -- ET LA FONTE
      FAIT DE LA DETENTION UNE PERTE CALCULEE. Aucune autre exigence instruite
      n'avait cette propriete ; les autres sont des couts qui s'achetent.
      RENVERSEMENT, ET C'EST LE RESULTAT PRINCIPAL. Sous le regime arbitre le
      2026-09-05, L'ALLOCATION NE CIRCULE PAS : ce qui circule est de la monnaie
      nationale ordinaire, DEJA ELIGIBLE. AUCUNE MONNAIE NOUVELLE NE DEMANDE A
      ENTRER, donc aucun des dix criteres n'est opposable, et le dispositif n'a
      besoin d'aucune infrastructure.
      TRI EXPLICITE DE CE QUI SURVIT. L21.C04 survit INTEGRALEMENT -- le cout en
      fonds propres bancaires ne depend pas de la nature de l'unite, et c'est le
      seul resultat inconditionnel du livre. L21.C03 survit partiellement. LES
      PRINCIPES 7, 12, 15 ET 20 TOMBENT COMME OBJECTIONS et ne subsistent que
      pour la branche ou l'unite circulerait.
      PRIX DU SOULAGEMENT : CE QUI EXEMPTE LE DISPOSITIF DES CONTRAINTES
      D'INFRASTRUCTURE EST EXACTEMENT CE QUI LE PRIVE DU TITRE DE MONNAIE. F12,
      L'INDISCERNABILITE, est propose a l'auteur sur ce fondement -- non pose,
      car il touche la revendication centrale du livre.
      L21.C06 REPOND A LA QUESTION QUE L21.C05 DECLARAIT DECISIVE, en ouvrant la
      directive 98/26/CE sur le caractere definitif du reglement. LA JAMBE
      EMETTEUR / BANQUES CENTRALES PEUT ETRE UN SYSTEME, ET ELLE NE L'EST PAS DE
      PLEIN DROIT.
      TROIS CONDITIONS (article 2 a). Trois participants ou davantage avec
      regles communes et procedures normalisees : remplie. Regie par la loi d'un
      Etat membre ou l'un des participants au moins a son siege : remplissable,
      au prix d'un rattachement national. DESIGNEE ET NOTIFIEE A LA COMMISSION
      PAR CET ETAT, "APRES QUE CET ETAT MEMBRE S'EST ASSURE DU CARACTERE ADEQUAT
      DES REGLES DE FONCTIONNEMENT DU SYSTEME" : LA PROTECTION N'EST PAS UN
      DROIT, C'EST UNE DECISION. Et les "regles de fonctionnement" incluraient
      LE BAREME DE FONTE, la cle de qualification et les conditions du reflux --
      point de controle le plus concret que le corpus ait rencontre.
      PIECE MANQUANTE REVELEE PAR LE TEXTE : L'ARTICLE 2 b) FERME LA LISTE DES
      PARTICIPANTS POSSIBLES, et l'emetteur n'y entre que par la porte de
      l'"organisme public". LE CORPUS N'A JAMAIS DIT QUELLE EST LA FORME
      JURIDIQUE DU SYMPOSIUM. A37 est pose a l'auteur.
      ACQUIS FAVORABLE, ET LE CORPUS REFUSE DE LE MINORER : l'article 3 par. 3
      et l'article 5 DELEGUENT AUX REGLES DU SYSTEME la definition du moment de
      l'introduction et de l'irrevocabilite, et les protegent. L'exigence du
      principe 8 des PFMI, que L21.C03 tenait pour impossible sur cette jambe,
      DEVIENT UN TRAVAIL DE REDACTION SOUS CONDITION DE DESIGNATION.
      ASYMETRIE QUI DECIDE DE L'ARGUMENT : une banque centrale ne fait pas
      defaut dans sa propre monnaie, donc LE SEUL PARTICIPANT SUSCEPTIBLE DE
      FAIRE DEFAUT EST L'EMETTEUR. La designation protege LA BANQUE CENTRALE
      CONTRE LE DEFAUT DU SYMPOSIUM. Le dispositif en a besoin non pour sa
      securite mais POUR ETRE ACCEPTABLE A SES CONTREPARTIES -- exactement les
      institutions qu'il doit convaincre.
      L21.C07 CLOT LA PREMIERE TRANCHE A SEPT CHAPITRES, et il en donne le
      verdict. LA TRANCHE A COMMENCE PAR DES COLLISIONS ET ELLE FINIT PAR UN
      TRI.
      CE QU'ELLE ETABLIT CONTRE : un cout INCONDITIONNEL et un seul -- trois de
      fonds propres bancaires de premiere categorie par cent d'unites en
      circulation ; un guichet CONCRET -- la designation comme systeme, ou un
      superviseur national jugerait les regles de fonctionnement, bareme de
      fonte compris ; une exigence qui frappe LA CONCEPTION et non
      l'exploitation -- les fournisseurs de liquidite que la fonte rend
      perdants ; et une divergence tranchee contre la source, la revendication
      de continuite comptable tombant des la premiere ecriture.
      CE QU'ELLE ETABLIT POUR, ET LE CORPUS LE COMPTE : le renversement, aucune
      infrastructure n'etant necessaire sous l'architecture arbitree ; le plan
      de liquidation ordonnee que le dispositif possede par construction ; le
      moment definitif atteignable, le droit deleguant aux regles du systeme et
      les protegeant ; les normes de communication qui se contentent d'etre
      accommodees ; et la participation en paliers, reelle et massive -- un
      membre direct pour cinq cents utilisateurs indirects.
      DEUX CHOSES COMMANDENT LE RESTE ET SONT OUVERTES : A37, la forme juridique
      de l'emetteur ; F12, l'indiscernabilite. Et TROIS ROUTES INDEPENDANTES
      exigent desormais la meme chose -- le principe 13 inapplicable, la
      derogation de levier ouverte a la politique monetaire, la definition du
      participant fermee a ce qui n'est pas un organisme public : LES TROIS
      BUTENT SUR LA QUALIFICATION DE L'ENSEMBLE, que L10.C06 tient pour non
      tranchee.
      AUTOCRITIQUE DE METHODE VERSEE A LA PASSE 2 : "LIRE LE CORPUS AVANT
      D'OUVRIR LA NORME". Le corpus a oppose une norme externe pendant quatre
      chapitres avant de relire ce que sa propre architecture exigeait.
      SUITE DU LIVRE SUSPENDUE A UN ARBITRAGE PLUS QU'A UN TRAVAIL : si
      l'allocation ne circule pas, les chapitres restants portent sur une
      plomberie que le dispositif n'emprunte pas ; si l'auteur ouvre la branche
      ou l'unite circule, les douze chapitres annonces reprennent leur sens et
      les dix criteres d'admission deviennent le programme. LE PRINCIPE 12 FRAPPE LE POINT FAIBLE : le
      reglement definitif d'une obligation doit intervenir SI ET SEULEMENT SI
      celui de l'obligation liee intervient aussi ; or L3.C09 etablit que
      l'unite NE REGLE PAS, donc toute operation utile suppose un echange contre
      une monnaie qui regle, ET CET ECHANGE DOIT ETRE CONDITIONNEL DANS LES DEUX
      SENS. Le dispositif a besoin d'un MECANISME DE REGLEMENT CONTRE UNE AUTRE
      VALEUR, objet distinct du rail, jamais nomme.
      LE PRINCIPE 7 PRODUIT UNE CONSEQUENCE IRONIQUE : une infrastructure
      transportant une unite non immediatement convertible devrait detenir des
      liquidites DANS LES MONNAIES MEMES QUE LE DISPOSITIF ENTEND CONCURRENCER,
      et l'exigence est CUMULATIVE -- l'extension du reseau AUGMENTE le cout de
      liquidite au lieu de le diluer.
      LE PRINCIPE 20 REND LA CONTRAINTE JURIDIQUE MULTIPLICATIVE : croitre par
      PALIERS est bon marche, croitre par LIENS exige une base juridique
      nouvelle dans toutes les juridictions du lien.
      POINT FAVORABLE PORTE : ces trois exigences portent sur LES CONDITIONS DE
      CIRCULATION et non sur la conception de l'unite -- aucune ne demande ce
      qu'elle vaut ni ce qui la gage. Ce sont des exigences d'exploitation, ET
      ELLES S'ACHETENT. A compter comme un COUT, non comme un obstacle -- mais
      le corpus n'en a chiffre aucun.

  - livre: 22
    titre: "Le pouvoir de la finance non bancaire"
    collection: cahier-disciplinaire
    fonction: >
      Étudier ceux qui allouent le capital hors du crédit bancaire classique —
      qui décide de l'allocation du capital lorsqu'il ne s'agit plus
      principalement des banques
    motifs:
      - "discipline — gestion d'actifs, fonds de pension, assureurs, fonds souverains, fonds monétaires, fonds spéculatifs, capital-investissement, crédit privé"
      - "manque — le corpus raisonne sur les banques et les États, et n'a jamais instruit l'acteur qui détient environ la moitié des actifs financiers mondiaux"
      - "objection — L5.C09 : la protection de l'entrée expire quand la couche déplace des flux, et le corpus ne sait pas qui réagirait ni comment"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 7
    architecture: >
      Périmètre proposé par l'auteur : gestion active, passive et indicielle ;
      séparation entre propriétaire économique et gestionnaire ; agences de
      conseil en vote et gouvernance actionnariale ; fonds de pension et
      obligations de rendement ; assureurs et engagements de long terme ; fonds
      monétaires et quasi-monnaie ; fonds spéculatifs, levier et dérivés ;
      capital-investissement et crédit privé ; titrisation et véhicules hors
      bilan ; liens entre banques et finance non bancaire ; appels de marge,
      ventes forcées et risques systémiques ; finance verte, politique de vote
      et écoblanchiment ; et réaction de ces acteurs à l'unité et à des fontes
      différenciées.
    note: >
      REGLE DE TRAITEMENT POSEE PAR L'AUTEUR ET A TENIR : les gestionnaires
      dominants figurent comme ETUDES DE CAS, jamais comme sujet du livre.
      Construire le livre autour d'un nom personnaliserait un mecanisme
      structurel et exposerait le corpus au soupcon de recit conspirationniste.
      LA QUESTION EST : QUI DECIDE DE L'ALLOCATION DU CAPITAL QUAND CE NE SONT
      PLUS PRINCIPALEMENT LES BANQUES.
      ORDRES DE GRANDEUR FOURNIS PAR L'AUTEUR, DESORMAIS VERIFIES SUR PIECE : ce
      secteur represente environ la moitie des actifs financiers mondiaux
      recenses par le Conseil de stabilite financiere, et les seuls dispositifs
      de retraite capitalises des pays de l'OCDE representaient 69 800 milliards
      de dollars fin 2024. Trois references d'entree nommees : FSB, suivi mondial
      2025 ; FSB, vulnerabilites du credit prive 2026 ; OCDE, Pension Markets in
      Focus 2025.
      OUVERT LE 2026-09-07 PAR L22.C01, qui remplace l'amorce. LES ORDRES DE
      GRANDEUR DE L'AUTEUR SONT ETABLIS SUR PIECE par le rapport de suivi
      mondial 2025 du Conseil de stabilite financiere, telecharge et lu, donnees
      au 31 decembre 2024 : ACTIFS FINANCIERS MONDIAUX 503,7 MILLIERS DE
      MILLIARDS DE DOLLARS -- banques centrales 34,1 (6,8 %), banques 191,3
      (38,0 %), institutions financieres publiques 21,5 (4,3 %), SECTEUR NON
      BANCAIRE 256,8, SOIT 51,0 %, en croissance de 9,4 %, "growing at DOUBLE
      THE PACE OF THE BANKING SECTOR". Mesure etroite 76,3, soit 15,4 %.
      RESULTAT QUI JUSTIFIE LE LIVRE, ET IL EST DIRIGE CONTRE LE CORPUS
      LUI-MEME. La source definit ce secteur NEGATIVEMENT -- "all financial
      institutions that are NOT central banks, banks, or public financial
      institutions". Or TOUS LES INSTRUMENTS QUE LE CORPUS A INSTRUITS
      s'adressent aux trois categories exclues : Bale oblige les banques, les
      PFMI les infrastructures, la prohibition du financement monetaire et le
      Federal Reserve Act des banques centrales, la directive 98/26/CE des
      systemes designes dont les participants sont par definition fermee des
      etablissements de credit ou des organismes publics. AUCUN N'ATTEINT LE
      SECTEUR QUI DETIENT 51 % DES ACTIFS FINANCIERS MONDIAUX. Le corpus a
      oppose au dispositif, pendant vingt et un livres, des contraintes portant
      sur MOINS DE LA MOITIE du systeme financier, sans jamais le dire.
      CONSEQUENCE DE CONCEPTION, ET ELLE EST L'OBJECTION PRINCIPALE DU
      CHAPITRE : le noeud de perception retenu en L11.C02 -- les reserves
      deposees a la banque centrale -- EXEMPTE PAR CONSTRUCTION TOUTE ENTITE
      SANS COMPTE DE BANQUE CENTRALE, et L11.C27 etablit que l'autre assiette
      est la CONSOMMATION FINALE, dont les actifs financiers ne relevent pas.
      EXCLUSION DE PERIMETRE A DEUX VERROUS. Contrepoids porte : la fonte n'a
      jamais eu pour objet de taxer la finance -- mais alors le dispositif doit
      renoncer a l'argument du reequilibrage entre finance et economie reelle.
      CANAUX DE REACTION : la source decrit un mecanisme SANS DECIDEUR --
      portefeuilles qui se recouvrent, pertes de valorisation correlees, ventes
      simultanees. LA REACTION NE SERAIT PAS UNE OPPOSITION MAIS UNE
      PROPAGATION, et l'on ne negocie pas avec une propagation. Correction de
      L5.C09, qui demandait "qui reagirait".
      REGLE DE TRAITEMENT DE L'AUTEUR TENUE : aucune firme n'est nommee ; la
      concentration est rapportee dans les termes de la source.
      L22.C02 N'OUVRE AUCUNE SOURCE NOUVELLE : IL COMPOSE TROIS RESULTATS DEJA
      ACQUIS ET LE PRODUIT EST UNE OBJECTION QUE LE CORPUS N'AVAIT PAS VUE. Ce
      qui circule est de la monnaie nationale ordinaire (L11.C01). L'assiette de
      la fonte est la consommation finale (L11.C27), l'autre noeud etant les
      reserves (L11.C02). Le secteur qui detient 51 % des actifs financiers n'a
      ni compte de banque centrale ni consommation finale (L22.C01).
      RESULTAT : LE REFLUX SUIT LA DEPENSE, PAS LA MONNAIE. La monnaie emise est
      frappee TANT QU'ELLE EST DEPENSEE et cesse de l'etre des qu'elle est
      EPARGNEE -- epargner, c'est acquerir un actif financier, ce qui n'est une
      consommation finale dans aucun pays, sans faille ni contournement. CE QUI
      SEDIMENTE EST SORTI DES DEUX ASSIETTES.
      UN TERME MANQUAIT A LA FORMULE DE L11.C02 par. 5, ET IL EST NOMME : LE
      NOMBRE DE PASSAGES TAXABLES AVANT SEDIMENTATION. Reflux cumule sur une
      emission = montant emis x nombre moyen de passages taxables x taux moyen.
      Ce nombre est decide par le comportement d'epargne des beneficiaires
      successifs, NON PAR LE DISPOSITIF. C'est la formulation la plus dure de F1
      que le corpus ait ecrite, et F1 est renforce en consequence.
      ASYMETRIE GEOGRAPHIQUE ETABLIE SUR PIECE : "Banks represented 58.6% of
      total financial assets in EMEs, while they represented 32.4% in AEs". LA
      PART DE LA RICHESSE QUI ECHAPPE A UN PRELEVEMENT SUR LES RESERVES EST
      NETTEMENT PLUS GRANDE DANS LES ECONOMIES AVANCEES -- ce n'est pas une
      intention, c'est une propriete de l'assiette, et elle va contre
      l'intention declaree du dispositif. Deux reserves la bornent.
      TROISIEME INSTRUMENT NOMME SANS ETRE INSTRUIT : un prelevement sur les
      encours detenus hors du systeme bancaire. IL SUPPOSE DE SAVOIR QUI DETIENT
      -- ce que le repli sur les reserves servait precisement a eviter. LA
      COMMODITE DU PREMIER INSTRUMENT ET L'IMPUISSANCE DU TROISIEME ONT LA MEME
      CAUSE.
      CONTREPOIDS FRANC : toute taxe sur la consommation presente cette fuite.
      Ce qui est propre au dispositif est que L'INSTRUMENT NE DOIT PAS RAPPORTER
      MAIS BOUCLER. La fuite est ordinaire ; la consequence de la fuite ne l'est
      pas.
      L22.C03 OUVRE LE BAREME DE QUALIFICATION QUI EXISTE DEJA EN DROIT POSITIF
      -- reglement (UE) 2020/852 -- QUE LE CORPUS N'AVAIT JAMAIS LU alors qu'il
      en concoit un depuis le onzieme livre. L'objet qu'il croyait devoir
      inventer EST DEJA NOMME : article 9 f), "protection et restauration de la
      biodiversite et des ecosystemes", precise par l'article 15. Point d'appui,
      non objection.
      SA STRUCTURE A QUATRE CONDITIONS CUMULATIVES ; CELLE DU CORPUS N'EN A
      QU'UNE. Article 3 : contribution substantielle ; ABSENCE DE PREJUDICE
      IMPORTANT A AUCUN des six objectifs ; GARANTIES MINIMALES ; criteres
      d'examen technique.
      PREMIERE PIECE MANQUANTE, LA PLUS GRAVE : l'article 17 apprecie le
      prejudice "compte tenu du CYCLE DE VIE". Sans ce test, un bareme fonde sur
      la seule contribution PAIE CE QUI REGENERE D'UN COTE ET DETRUIT DE
      L'AUTRE. Et l'omission est PLUS grave chez le dispositif : le reglement
      decide d'un LABEL, le bareme decide d'une EMISSION MONETAIRE.
      DEUXIEME PIECE MANQUANTE, ET ELLE EST SOCIALE : l'article 18 exige
      l'alignement sur les principes directeurs de l'OCDE et des Nations unies,
      les huit conventions fondamentales de l'OIT et la Charte internationale
      des droits de l'homme. Rien dans L11.C13 n'empeche de qualifier un projet
      conduit en violation du droit du travail ou sur des terres prises a leurs
      occupants -- ce qui touche le coeur de la these du dispositif.
      ONZE EXIGENCES DE L'ARTICLE 19 : DEUX JOUENT POUR LE CORPUS, UNE CONTRE.
      Le point c) concede que les criteres "sont quantitatifs et comprennent des
      seuils DANS LA MESURE DU POSSIBLE et, A DEFAUT, SONT QUALITATIFS" -- F2 est
      nuance en consequence, sa lecture la plus dure ne survivant pas. Le point
      i) exige de tenir compte "du risque de creer des INCITATIONS
      CONTRADICTOIRES", c'est-a-dire F3 inscrit dans un reglement. Le point j)
      exige une EGALITE DE TRAITEMENT afin d'eviter toute distorsion de
      concurrence, QUE LE BAREME DU DISPOSITIF NE PEUT PAS SATISFAIRE puisqu'il
      distorde par dessein.
      QUI ARRETE LE BAREME : L'ARTICLE 20 DONNE UNE REPONSE EN VIGUEUR A LA
      QUESTION DE L11.C11. Une plateforme composee "dans un souci d'equilibre"
      de cinq groupes -- institutions publiques dont l'AGENCE DES DROITS
      FONDAMENTAUX, secteur prive, SOCIETE CIVILE, experts personnels, MONDE
      ACADEMIQUE. Elle NE DECIDE PAS, ELLE CONSEILLE, et elle peut conseiller de
      MODIFIER LE REGLEMENT LUI-MEME.
      RESERVE PRINCIPALE : le corpus tient L'ARCHITECTURE du bareme, PAS SES
      SEUILS. Les actes delegues portant les criteres d'examen technique ne sont
      pas ouverts -- acquisition de rang 1 pour le Livre 11.
      L22.C04 FERME CETTE ACQUISITION EN OUVRANT LE REGLEMENT DELEGUE (UE)
      2023/2486, ANNEXE IV, SECTION 1.1 -- conservation des habitats, des
      ecosystemes et des especes, Y COMPRIS LEUR RESTAURATION, c'est-a-dire
      l'activite meme du dispositif. ET LE RESULTAT RENVERSE LA QUESTION : IL
      N'Y A AUCUN SEUIL CHIFFRE.
      QUATRE EXIGENCES, TOUTES PROCEDURALES. Description initiale cartographiee
      avec inventaire des especes et tailles de population. Plan de gestion a
      ONZE RUBRIQUES, actualise au moins tous les dix ans, incluant objectifs
      intermediaires, menaces, mesures d'absence de prejudice, ANALYSE DES
      QUESTIONS SOCIALES ET CONSULTATION DES PARTIES INTERESSEES, programme de
      suivi a indicateurs, et LE FINANCEMENT NECESSAIRE Y COMPRIS L'AUDIT. Audit
      par un ORGANISME TIERS INDEPENDANT au demarrage puis au moins tous les dix
      ans, sans conflit d'interets, AVEC RAPPORT PUBLIE. GARANTIE DE PERMANENCE
      par classement en aire protegee, plan reglementaire, OU ACCORD CONTRACTUEL
      PUBLIC OU PRIVE.
      LE DROIT POSITIF NE MESURE PAS LA REGENERATION : IL CERTIFIE UN PROCEDE.
      F2 EST PRECISE ET NON LEVE. Ce que le deplacement gagne : l'applicabilite
      la ou aucun indicateur consensuel n'existe. Ce qu'il coute : LA
      GRADUATION -- un procede certifie est BINAIRE, alors que le dispositif doit
      dire COMBIEN. L'ECART ENTRE LES DEUX EST EXACTEMENT CE QUE LE DISPOSITIF
      DOIT PRODUIRE EN PROPRE.
      PIECE MANQUANTE DECISIVE, EN UNE PHRASE DU TEXTE (point 6.1) : "La
      COMPENSATION des incidences d'une autre activite economique est EXCLUE
      [...] Seuls les GAINS NETS DE BIODIVERSITE [...] peuvent etre consideres
      comme une contribution substantielle." SANS ELLE, LE DISPOSITIF PAIERAIT
      DEUX FOIS LE MEME HECTARE et subventionnerait l'activite dommageable.
      F9 EST RESTREINT A SON TERRAIN COMPTABLE. La qualification n'exige AUCUN
      droit reel -- un simple contrat suffit a garantir la permanence. La
      comptabilisation, elle, exige un controle qui ressemble a la propriete. LE
      CORPUS AVAIT CONFONDU LES DEUX EXIGENCES.
      FAIT DE CLASSIFICATION VERSE AU LIVRE 13 : ces activites "ne relevent
      d'AUCUN CODE NACE SPECIFIQUE". L'ACTIVITE QUE LE DISPOSITIF VEUT PAYER
      N'EST PAS UNE CATEGORIE STATISTIQUE.
      COUT DU DOSSIER : le corpus ne l'a jamais estime, et il fixe UNE TAILLE
      MINIMALE DE PROJET QUALIFIABLE qui exclut les petits operateurs, donc
      vraisemblablement ceux du Sud. Contrepoids prevu par le texte lui-meme :
      les audits peuvent etre mutualises avec toute certification existante.
      L22.C05 VERIFIE SUR LE TEXTE DE LA SOURCE LE CHIFFRE AVANCE PAR L'AUTEUR
      ET DECLARE NON VERIFIE PAR LE REGISTRE : IL EST EXACT. OCDE, "Pension
      Markets in Focus 2025", ouvert par lecture directe : "Assets totalled USD
      69.8 TRILLION at end-2024, including USD 63.1 trillion managed by pension
      providers and USD 6.7 trillion in public pension reserve funds", plus 2,9
      hors OCDE. Croissance de 11,6 % en 2023 et 7,1 % en 2024.
      LE TROISIEME INSTRUMENT DE REFLUX RECOIT SES DEUX PREMIERES
      CARACTERISATIONS, ET ELLES SONT OPPOSEES.
      GEOGRAPHIQUEMENT IL EST JUSTE : "North America recorded USD 48.2 trillion
      [...] OVER 70% of the total assets accumulated globally in 87
      jurisdictions" ; l'Asie a la part la plus faible rapportee a son PIB
      (12,5 %) et l'Afrique la plus faible en valeur. UN PRELEVEMENT SUR CES
      ENCOURS CORRIGE L'ASYMETRIE que L22.C02 reprochait aux deux autres
      instruments -- il est le seul des trois dont l'assiette suit LA RICHESSE
      ACCUMULEE plutot que le circuit de paiement.
      SOCIALEMENT IL EST BRUTAL : les regimes garantis par un employeur ne
      pesent plus que 31,9 % des actifs de retraite a fin 2024, contre 39,7 %
      dix ans plus tot, et le mouvement continue. DANS UN REGIME A COTISATIONS
      DEFINIES IL N'Y A PAS DE GARANT : la perte est integralement supportee par
      le futur retraite. Le seul instrument capable de fermer la fuite du reflux
      est celui dont l'incidence est LA PLUS DIRECTE ET LA MOINS AMORTIE.
      A38 EST POSE A L'AUTEUR : l'epargne retraite est-elle de la
      thesaurisation ? Frapper rend l'instrument efficace et penalise l'epargne
      essentielle ; exempter respecte L11.C18 et vide l'instrument de sa partie
      la mieux mesuree. Troisieme voie indiquee : un seuil PAR PERSONNE, qui
      demande la consolidation par detenteur.
      PORTE RELEVEE DANS LE TEXTE DE LA SOURCE, AVEC SA LIMITE : ces encours
      sont decrits comme "a potential source of investment that can support the
      real economy", et la qualification d'une activite de restauration existe
      deja en droit AVEC SON PLAN DE FINANCEMENT (L22.C04). Le dispositif
      pourrait en etre une DESTINATION plutot qu'y PRELEVER. Mais un
      investisseur cherche un rendement, et la regeneration d'un commun n'en
      produit pas : LA PORTE DONNE SUR L'ESSENTIEL INSOLVABLE.
      L22.C06 REPOND A LA QUESTION PLACEE EN TETE DU LIVRE -- qui decide de
      l'allocation du capital quand ce ne sont plus les banques -- ET LA REPONSE
      DEPLACE LA QUESTION. Pour la part des encours qui suit un indice, LA
      DECISION D'ALLOCATION N'EST PRISE PAR PERSONNE : ELLE EST APPLIQUEE PAR
      UNE REGLE de selection et de ponderation.
      PREUVE PAR LE DROIT, non par des donnees de marche que le corpus ne tient
      pas. Le reglement (UE) 2019/2089 cree deux categories -- indices "
      transition climatique" et "accord de Paris" de l'Union -- dont les actifs
      sont "selectionnes, ponderes ou EXCLUS" selon une trajectoire de
      decarbonation, constituees "conformement aux NORMES MINIMALES definies
      dans les actes delegues". Ses motifs disent l'objectif : "REORIENTER LES
      FLUX DE CAPITAUX" (cons. 6), "CANALISER LES FLUX DE CAPITAUX" (cons. 8),
      la qualite des indices influant "sur le bon fonctionnement du marche
      interieur" (cons. 10). UN LEGISLATEUR QUI VEUT REORIENTER DES CAPITAUX
      LEGIFERE SUR LA REGLE DE COMPOSITION D'UN INDICE, NON SUR LE COMPORTEMENT
      DES INVESTISSEURS.
      SYMETRIE QUE LE CORPUS NE TENAIT PAS : LA TAXONOMIE QUALIFIE L'ACTIVITE,
      LES INDICES DE L'UNION QUALIFIENT L'ALLOCATION -- meme legislateur, meme
      annee, meme technique : une definition, des normes minimales par acte
      delegue, UNE DENOMINATION PROTEGEE.
      CONSEQUENCE SUR LA THEORIE DU CHANGEMENT : UNE REGLE NE SE NEGOCIE PAS,
      ELLE SE MODIFIE. Il n'y a personne a convaincre, donc personne a
      affronter. L'objection de L5.C09 -- qui reagirait -- devient "qui ecrit la
      regle et selon quelle procedure". Cela deplace l'effort du dispositif d'un
      terrain ou il est faible vers un terrain ou il ne s'est jamais presente,
      et ou son travail de dossier et de preuve compte.
      LIMITE DECISIVE, POSEE EN MEME TEMPS QUE LE LEVIER : un indice reoriente
      des capitaux ENTRE EMETTEURS COTES. L'objet du dispositif n'en est pas un
      -- L22.C04 a etabli que cette activite ne releve d'aucun code NACE et est
      exercee par tout type d'operateur. L'INDICE ATTEINT LES 51 % ET PAS
      L'OBJET : il peut retirer du capital au degeneratif, non en donner au
      regeneratif. C'est L1.C15 rencontre a nouveau -- l'essentiel est
      insolvable, donc il n'est pas indexable. Complementarite jamais envisagee
      par le corpus : le levier indiciel fait la moitie negative du programme,
      le dispositif la moitie positive.
      LECON PRISE SUR F3 : le legislateur, confronte a des etiquettes de qualite
      inegale sous un meme nom (cons. 11) et visant "la prevention de
      l'ECOBLANCHIMENT" (cons. 9), N'A PAS RENONCE A L'INDICATEUR : IL A PROTEGE
      LA DENOMINATION ET FIXE UN PLANCHER. Reponse institutionnelle a un
      probleme que le corpus posait comme epistemique.
      TENSION VERSEE AU LIVRE 14 : l'annexe III impose de RENDRE PUBLIQUE toute
      la methodologie -- facteurs de selection et de ponderation, criteres
      d'exclusion -- "TOUT EN GARANTISSANT [...] la protection des savoir-faire
      et des informations commerciales non divulgues". LA REGLE QUI DECIDE DE
      L'ALLOCATION EST PUBLIQUE DANS SON PRINCIPE ET PROTEGEE DANS SA PARTIE
      DECISIVE.
      L22.C07 CLOT LA PREMIERE TRANCHE A SEPT CHAPITRES, cinq sources ouvertes
      de premiere main, trois textes de droit positif lus dans leur texte.
      PREMIER RESULTAT, ET IL VISE LE CORPUS : tous les instruments qu'il a
      instruits pendant vingt et un livres portent sur 49,0 % DES ACTIFS
      FINANCIERS MONDIAUX. REVISION DE PORTEE DECLAREE, non faite : chaque
      chapitre opposant une contrainte prudentielle ou infrastructurelle devra
      dire a quel perimetre elle s'applique. TRAVAIL DE PASSE 2.
      CONTRE LE DISPOSITIF : le reflux n'atteint pas la moitie du systeme
      financier, par deux verrous independants ; un terme manquait a la formule
      du rendement et le dispositif ne le commande pas ; l'assiette la plus
      praticable est geographiquement injuste ; trois pieces manquent au bareme
      -- absence de prejudice, garanties sociales, exclusion de la compensation ;
      et le seul instrument capable de fermer la fuite frappe des individus sans
      garant.
      AU CREDIT DU DISPOSITIF, ET DEUX POINTS N'ETAIENT PAS CHERCHES : l'objet
      est deja nomme en droit ; LA LECTURE LA PLUS DURE DE F2 NE SURVIT PAS, le
      legislateur admettant les criteres qualitatifs et les criteres reels ne
      contenant aucun seuil ; le droit CERTIFIE UN PROCEDE plutot qu'il ne
      mesure, au prix de la graduation ; F9 EST RESTREINT A SON TERRAIN
      COMPTABLE ; le troisieme instrument est geographiquement juste ; ET UN
      LEVIER EXISTE QUE LE CORPUS N'AVAIT JAMAIS EXAMINE -- la norme d'indice,
      seul instrument instruit portant directement sur les 51 %, avec sa borne :
      il retire du capital au degeneratif, il n'en donne pas au regeneratif.
      LECON DE METHODE : F3 a une reponse institutionnelle -- proteger la
      denomination et fixer un plancher -- la ou le corpus le posait comme un
      probleme epistemique. ET RENVERSEMENT DU MEME ORDRE QU'AU LIVRE 21 : LE
      CORPUS EST ENTRE DANS CE LIVRE POUR MESURER UN POUVOIR, IL EN SORT AVEC UN
      OUTILLAGE.
      RESTENT SEPT DES TREIZE CHAPITRES PROPOSES : conseil en vote et
      gouvernance actionnariale, assureurs et engagements longs, fonds
      monetaires et quasi-monnaie, levier et derives, capital-investissement et
      credit prive, titrisation et vehicules hors bilan, appels de marge et
      ventes forcees.

  - livre: 23
    titre: "Fiscalité mondiale, finance offshore et opacité"
    collection: cahier-disciplinaire
    fonction: >
      Examiner qui peut lever le reflux et comment les capitaux peuvent
      l'éviter — au nom de quelle compétence, avec quels moyens de contrôle, et
      contre quels mécanismes de contournement
    motifs:
      - "arbitrage — A35 : la fonte est levée sur les agents, et le corpus n'a jamais dit QUI LA LÈVE NI DE QUEL TITRE"
      - "manque — l'ANCRAGE FISCAL, constaté et reporté par arbitrage le 2026-09-04, dont ce livre est la résolution : le registre avait retenu le livre propre comme recommandation"
      - "objection — L10.C06 pose un arbre de qualification à six branches et huit critères, et le corpus n'en tient aucun"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 7
    architecture: >
      Quinze chapitres proposés par l'auteur : impôt, taxe, contribution,
      redevance, frais de réseau et règle monétaire ; souveraineté fiscale et
      consentement au prélèvement ; ressources propres des organisations
      internationales ; douanes, prélèvements frontaliers et mécanisme carbone ;
      conventions fiscales et répartition du droit d'imposer ; prix de transfert
      et déplacement des bénéfices ; paradis fiscaux et juridictions de secret ;
      sociétés écrans, trusts et véhicules spéciaux ; bénéficiaires effectifs ;
      échange automatique d'informations ; blanchiment et flux illicites ;
      arbitrage réglementaire et concurrence fiscale ; incidence, qui supporte
      finalement le prélèvement ; convention fiscale des Nations unies en
      négociation ; et application à la fonte avec ses possibilités de
      contournement.
    note: >
      PREMIER DE L'ORDRE DE PRIORITE ARRETE PAR L'AUTEUR -- 23, 21, 22, 24, 25 --
      PARCE QU'IL TRANCHE LA DIFFICULTE OUVERTE LE 2026-09-07. L'arbitrage A35 a
      etabli que la societe entiere porte la dette et que le reflux passe par des
      fontes graduees ; L10.C06 a montre que la qualification de ce prelevement
      n'est pas acquise et a pose un arbre a six branches ; ET LE PROBLEME DU
      SECTEUR PUBLIC, chasse du cote de l'actif, EST REVENU DU COTE DU
      PRELEVEMENT. Ce livre porte le quatrieme des cinq objets a verrouiller.
      CE LIVRE RESOUT UN ARBITRAGE REPORTE. Le manque "ancrage fiscal" avait ete
      constate le 2026-09-04, trois options examinees -- livre propre, rattachement
      a L3, rattachement a L7 -- et LE LIVRE PROPRE ETAIT LA RECOMMANDATION. La
      decision differee est prise.
      PRECEDENT INSTITUTIONNEL NOMME PAR L'AUTEUR : la convention-cadre fiscale
      en negociation aux Nations unies, particulierement pertinente puisqu'elle
      montre comment une competence fiscale se construit a l'echelle mondiale.
      Seconde reference : les travaux OCDE et Forum mondial sur les beneficiaires
      effectifs et leurs difficultes persistantes.
      OUVERT LE 2026-09-07 PAR L23.C01, qui remplace l'amorce. FRONTIERE FIXEE
      ET A TENIR : le Livre 11 demande COMMENT ON PERCOIT, le Livre 20 demande
      SI LE TRAITE LE PERMET, le Livre 23 demande AU NOM DE QUOI ON EST FONDE A
      ETABLIR L'OBLIGATION -- et si l'assiette est atteignable. LA SECONDE
      MOITIE N'EST PORTEE PAR PERSONNE, et c'est le contenu reellement neuf :
      une assiette peut etre juridiquement irreprochable et FACTUELLEMENT VIDE.
      DEUX RESULTATS DEJA ACQUIS FIXENT LA DIFFICULTE, ET ILS SONT DEFAVORABLES.
      L11.C21 : le mecanisme de perception se transporte, LE MOTIF NE SE
      TRANSPORTE PAS -- l'alignement d'interets qui fait tenir la TVA est ce que
      le dispositif retire. Et le mode d'echec n'est pas le refus mais LA
      PERCEPTION SANS ZELE, qui n'est ni visible ni sanctionnable. Le probleme
      n'est donc pas d'obtenir le droit de lever, C'EST D'OBTENIR QUE QUELQU'UN
      AIT INTERET A LEVER EFFECTIVEMENT.
      UN RESULTAT FAVORABLE EST PORTE : L20.C20 etablit que le reglement
      d'ajustement aux frontieres ecarte un marche de certificats POUR UN MOTIF
      JURIDIQUE de non-discrimination -- premier argument NON ECONOMIQUE en
      faveur d'un bareme que le corpus ait rencontre, et il vient d'un texte en
      vigueur.
      QUATRE QUESTIONS OPPOSABLES AUX SIX BRANCHES DE QUALIFICATION : au nom de
      quoi ; par qui et avec quel interet a bien percevoir ; sur quelle assiette
      REELLEMENT ATTEIGNABLE ; et POURQUOI LEVER PLUTOT QUE SUPPRIMER, cette
      derniere imposee par F10.
      UNE BRANCHE ECHAPPE A CE LIVRE : si l'unite est celle de l'emetteur, la
      fonte peut n'etre qu'une REGLE MONETAIRE sans competence fiscale. Le Livre
      19 porte cette question, ET CE LIVRE NE PEUT PAS CONCLURE AVANT LUI.
      FONDS DOCUMENTAIRE VIDE : aucune source fiscale ouverte, aucune donnee sur
      l'evasion tenue. Le chapitre d'ouverture pose une grille sur un fonds vide,
      et il le declare.
      L23.C02 : LE MANDAT DES NATIONS UNIES POUR UNE CONVENTION-CADRE FISCALE
      EST OUVERT, et il donne deux resultats opposes. DEFAVORABLE : son principe
      9 b) preserve "le droit souverain de chaque Etat Membre de decider de ses
      politiques et pratiques fiscales" -- LA CONVENTION ORGANISE UNE
      COOPERATION ET NE CREE AUCUNE COMPETENCE DE LEVER. Le precedent
      institutionnel que l'auteur avait designe n'en est pas un pour cette
      question, et la charge se deplace sans se lever : si la competence reste
      nationale, le defaut d'alignement de L11.C21 est CONFIRME DANS SA
      STRUCTURE. FAVORABLE : le mandat a ete adopte par 110 VOIX CONTRE 8, apres
      le rejet de QUATRE AMENDEMENTS DES PAYS DEVELOPPES a des majorites
      voisines de deux contre un -- CONTRE-EXEMPLE AU SCHEMA DE F6, "la
      disposition qui contraint le creancier est la disposition qui saute".
      Mecanisme nomme et bornant le resultat : UNE ASSEMBLEE UNIVERSELLE VOTE
      PAR TETE, et le nombre bat le poids LA OU LA PROCEDURE COMPTE LES ETATS,
      nulle part ailleurs.
      L23.C03 : LE PROJET ZERO DE CONVENTION EST OUVERT, et F8 est applique pour
      la premiere fois A UNE NEGOCIATION EN COURS. Les trois etages sont reunis
      -- obligations de comportement, verification AUTO-ADMINISTREE, conciliation
      qui ne lie pas -- ET POURTANT LE TEXTE N'EST PAS DESARME : son article 25
      tient en une ligne, "No reservations may be made to this Convention".
      D'OU UNE CORRECTION DE F8 : IL DECRIT UNE TECHNIQUE, PAS UNE FATALITE. Un
      instrument peut etre faible sur ses obligations de fond ET STRICT SUR SES
      CONDITIONS D'ADHESION -- les deux axes sont independants et le corpus les
      avait implicitement lies.
      ET LES DEUX CHIFFRES QUI DECIDERAIENT DE L'ARMEMENT SONT DES CROCHETS
      VIDES : seuil de majorite pour amender, nombre de ratifications requises.
      La question n'est pas eludee, elle est EXPLICITEMENT DIFFEREE ET VISIBLE
      COMME TELLE.
      TROISIEME ACQUIS, DEFAVORABLE : la verification auto-administree est LE
      POINT COMMUN DE TOUS LES INSTRUMENTS INSTRUITS -- celui-ci, la perception
      nationale de L11.C21, le traite desarme de L6.C09. Dans les trois cas,
      CELUI QUI DOIT APPLIQUER EST CELUI QUI DECLARE. Le corpus n'a jamais
      rencontre un instrument ou UN TIERS verifie, sauf l'ajustement aux
      frontieres de L20.C20 -- et son dispositif repose sur une qualification
      verifiable.
      L23.C04 : LA TRANSPARENCE QUE LE CORPUS SUPPOSAIT A ETE INVALIDEE. CJUE,
      grande chambre, 22 novembre 2022, C-37/20 et C-601/20 : est INVALIDE
      l'obligation de rendre les informations sur les beneficiaires effectifs
      "accessibles dans tous les cas a tout membre du grand public", INGERENCE
      GRAVE aux articles 7 et 8 de la Charte. ET LE MOTIF VISE UNE PROPRIETE,
      NON UNE MALADRESSE : il est INHERENT a une telle publicite que
      l'information atteigne un nombre potentiellement illimite de personnes,
      dont certaines poursuivent des fins etrangeres a l'objectif. TOUTE
      PUBLICITE PRODUIT L'ACCES DE QUI N'A PAS LE MOTIF.
      LES DEUX ATTENUATIONS ECARTEES SONT CELLES QUE LE CORPUS AURAIT PROPOSEES
      -- inscription en ligne prealable, derogations exceptionnelles.
      CONSEQUENCE POUR LE DISPOSITIF : la tracabilite dont L11.C13 fait dependre
      la lutte contre la fraude a la qualification rencontre une limite DE
      DROITS FONDAMENTAUX, et cette limite vise LA PUBLICITE -- or la publicite
      est ce qui fait echapper une verification a celui qu'elle controle.
      L23.C03 venait d'etablir que partout CELUI QUI APPLIQUE EST CELUI QUI
      DECLARE : LE CORPUS PERD LE REMEDE AU MOMENT OU IL EN IDENTIFIE LE BESOIN.
      SEULE VOIE COMPATIBLE DEJA TENUE : la certification par un tiers
      independant de L20.C20, qui ne passe pas par la publicite -- et qui
      suppose un tiers certificateur QUI N'EXISTE PAS PARTOUT.
      L23.C05 : LE MECANISME D'ALIGNEMENT EXISTE ET IL EST EN VIGUEUR. Decision
      (UE, Euratom) 2020/2053 : les Etats retiennent 25 % A TITRE DE FRAIS DE
      PERCEPTION sur les ressources propres traditionnelles. Le percepteur est
      interesse AU RECOUVREMENT, non a l'assiette declaree -- exactement ce qui
      manquait a L11.C21.
      MAIS LA SERIE HISTORIQUE, PORTEE PAR LE TEXTE, LIMITE L'ACQUIS : 10 % avant
      2001, 25 % jusqu'en 2014, 20 % jusqu'en 2021, 25 % ensuite -- ET LE
      CONSIDERANT NE MOTIVE LE TAUX PAR AUCUN CALCUL DE COUT. Un taux qui double,
      redescend d'un cinquieme puis remonte n'est pas la compensation d'une
      depense mesuree : C'EST UNE VARIABLE DE NEGOCIATION BUDGETAIRE. Le
      mecanisme d'alignement existe, ET SON PARAMETRE EST L'OBJET DU MARCHANDAGE
      QU'IL DEVAIT NEUTRALISER. Borne toutefois : ce qui se negocie est le
      NIVEAU, non le PRINCIPE.
      UNE DISTINCTION NON FAITE JUSQU'ICI EST VERSEE : la retention ne porte QUE
      sur les ressources traditionnelles, qui supposent UN ACTE DE CONTROLE a la
      frontiere ; ni le taux d'appel sur la TVA ni celui de 0,80 EUR par kilo de
      dechets plastiques n'en donnent. ON INTERESSE CELUI QUI DOIT CONTROLER, ON
      N'INTERESSE PAS CELUI QUI DOIT CALCULER -- ce qui departage le bareme aux
      frontieres du reflux transactionnel.
      L23.C06 : L'ARBRE DE QUALIFICATION EST EMPRUNTE POUR LA PREMIERE FOIS, ET
      QUATRE BRANCHES SUR SIX TOMBENT. Redevance -- la fonte croit avec le
      dommage cause a des tiers, celui qui paie le plus NUIT le plus. Frais de
      reseau -- s'y soustraire signifierait SORTIR DE L'ECONOMIE MONETAIRE.
      Obligation conventionnelle -- un agent qui utilise une monnaie n'a rien
      souscrit ; ouverte entre Etats, FERMEE a l'egard des agents.
      RESTENT L'IMPOT AFFECTE ET LA REGLE MONETAIRE, et elles ne different pas
      par leur effet economique mais PAR LEUR AUTORITE ET LEUR VOIE D'ADOPTION.
      La branche fiscale herite des QUATRE obstacles du livre, et F10 y frappe le
      plus fort. LA BRANCHE MONETAIRE LES EVITE TOUS, parce qu'une decote ne
      preleve rien sur un patrimoine exterieur : elle modifie la valeur d'un
      instrument que l'emetteur a cree.
      MAIS ELLE BUTE SUR DEUX POINTS. Le passif -- elle exige que l'unite soit
      celle de l'emetteur, question qu'A30 et A35 laissent ouverte et que le
      LIVRE 19 porte. Et la mecanique -- UNE DECOTE NE FRAPPE QUE L'ENCOURS,
      tandis que la gradation selon l'impact suppose de frapper LA TRANSACTION.
      LA BRANCHE LA PLUS FAVORABLE JURIDIQUEMENT EST LA MOINS COMPATIBLE AVEC LA
      MECANIQUE ARBITREE. ARBITRAGE A36 OUVERT.
      PREMIERE TRANCHE CLOSE A SEPT CHAPITRES LE 2026-09-07, LA PASSE RESTANT
      OUVERTE. TROIS QUESTIONS SUR QUATRE INSTRUITES, quatre sources ouvertes.
      AU NOM DE QUOI : repondu, defavorablement. PAR QUI : repondu a moitie.
      QUELLE ASSIETTE : le resultat le plus dur -- le corpus PERD LE REMEDE AU
      MOMENT OU IL EN IDENTIFIE LE BESOIN, et la seule voie compatible qu'il
      tienne est DEPOURVUE D'OPERATEURS. POURQUOI LEVER PLUTOT QUE SUPPRIMER :
      NON INSTRUITE -- les trois premieres s'instruisent sur des textes, celle-ci
      s'instruit sur UNE HISTOIRE, celle des reformes de subventions, dont le
      corpus n'a aucune source ni methode. F10 reste donc non traite bien qu'il
      soit route sur ce livre.
      LA SECONDE MOITIE DE LA FONCTION N'EST PAS COMMENCEE : sept des quinze
      chapitres proposes portent sur LE CONTOURNEMENT -- prix de transfert,
      juridictions de secret, societes ecrans, trusts, echange automatique,
      blanchiment, arbitrage reglementaire -- ET AUCUN N'EST ECRIT. Consequence
      inscrite : TOUT RENDEMENT CALCULE AUJOURD'HUI SERAIT BRUT, une assiette
      decretee et non une assiette atteinte.

  - livre: 24
    titre: "Les conditions matérielles de la vie"
    collection: cahier-disciplinaire
    fonction: >
      Donner au corpus son socle biophysique complet — établir CE QUI DOIT ÊTRE
      MAINTENU et QUELS SEUILS NE PEUVENT PAS ÊTRE COMPENSÉS FINANCIÈREMENT
    motifs:
      - "discipline — climat, biodiversité, eau, sols, cycles de l'azote et du phosphore, énergie, minerais, alimentation, dépendances matérielles"
      - "manque — L18 explique COMMENT MESURER ; aucun livre ne dit CE QU'IL FAUT MAINTENIR, et L5.C08 raisonne sur des catégories vides"
      - "objection — L18.C04 : la transition exige plus de trois milliards de tonnes de minéraux, et le corpus ne tient aucune nomenclature d'activités"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 5
    note: >
      FRONTIERE AVEC LE LIVRE 18, POSEE PAR L'AUTEUR : la comptabilite
      ecologique du Livre 18 explique COMMENT MESURER ; le Livre 24 etablit CE
      QUI DOIT ETRE MAINTENU ET QUELS SEUILS NE PEUVENT PAS ETRE COMPENSES
      FINANCIEREMENT. C'est la difference entre une metrologie et une norme de
      substance -- et le corpus a passe une journee sur la premiere sans jamais
      poser la seconde.
      SOURCES DEJA AU DRIVE ET NON INSTRUITES : PNUE Global Resources Outlook
      2024, instruit en partie ; SEEA, chapitres 9 a 11 non instruits.
      CHAINE DES TROIS LIVRES BIOPHYSIQUES, ARRETEE PAR L'AUTEUR LE 2026-09-07 ET
      INSCRITE SANS TOUCHER AUX NUMEROS -- convention paragraphe 3, l'ordre et le
      sens se changent dans collection et motifs, jamais par renumerotation :
      L26 ETABLIT LES CONTRAINTES PHYSIQUES, puis L24 DETERMINE LES CONDITIONS ET
      SEUILS A MAINTENIR, puis L18 ORGANISE LEUR MESURE. Le numero n'est pas un
      rang : la chaine est logique, l'ordre de declaration est chronologique, et
      les deux ne coincident pas.
      OUVERT LE 2026-09-07 PAR L24.C01, qui remplace l'amorce et ouvre par
      telechargement direct l'actualisation 2023 du cadre des limites
      planetaires (Richardson et al., Science Advances, eadh2458). DROITS :
      CC BY-NC 4.0, INCOMPATIBLE AVEC LA LICENCE DU CORPUS -- regime
      citation_seule, comme les documents IPSAS. La source est citee avec
      attribution et NE SERA PAS VERSEE AU DEPOT.
      LE SOCLE EST POSE : neuf variables de controle, avec valeur holocene,
      limite, seuil de haut risque et valeur actuelle. SIX DES NEUF LIMITES SONT
      DEPASSEES. Climat 417 ppm contre 350 ; diversite genetique plus de 100
      extinctions par million d'especes-annees contre 10 ; appropriation de la
      production primaire 30 % contre 10 ; phosphore 22,6 Tg/an contre 11 ;
      azote 190 contre 62 ; forets 60 % contre 75 ; eau bleue 18,2 % contre
      10,2 ; eau verte 15,8 % contre 11,1. Entites nouvelles : LIMITE ZERO.
      REPONSE A LA QUESTION QUE L'AUTEUR A PLACEE EN TETE DU LIVRE -- quels
      seuils ne peuvent pas etre compenses financierement -- ET ELLE EST
      METROLOGIQUE, NON MORALE. LES NEUF VARIABLES SONT EXPRIMEES DANS NEUF
      UNITES SANS AUCUNE COMMUNE MESURE, et le cadre ne comporte ni total, ni
      indice composite, ni ponderation. IL N'EXISTE AUCUN TAUX DE CHANGE ENTRE
      CES DIMENSIONS. Payer pour du carbone ne rend pas d'azote. Une
      compensation suppose une equivalence, une equivalence suppose une unite
      commune, IL N'Y EN A PAS.
      CONSEQUENCE POUR LE DISPOSITIF : IL EMET UN SCALAIRE CONTRE UN VECTEUR.
      Toute emission proportionnee a "la regeneration" suppose une agregation
      que la science refuse de faire -- ET C'EST PLUS PROFOND QUE F2, qui dit
      qu'on mesure mal, la ou ceci dit qu'il n'y a rien vers quoi agreger. F13,
      L'INCOMMENSURABILITE, est propose a l'auteur sur ce fondement.
      CAS TYPE DU SEUIL NON COMPENSABLE, FOURNI PAR LE CADRE : les entites
      nouvelles, limite ZERO. Aucun montant ne rend testee retroactivement une
      molecule deja rejetee.
      TROIS APPORTS FAVORABLES, ET ILS SONT CONSIDERABLES. UNE DEFINITION
      QUANTITATIVE DE "REGENERATIF" que L11.C13 n'avait pas : est regenerative
      une activite qui rapproche une variable de controle de sa limite. LA
      RAISON D'ETRE PHYSIQUE DU DISPOSITIF EST ECRITE DANS LA SOURCE : "The NPP
      required to support future societies must [...] increasingly be generated
      through ADDITIONAL PRODUCTION OF NPP above the Holocene baseline." ET LA
      REGLE DES GAINS NETS EST CONFIRMEE PAR LA PHYSIQUE, la meme phrase
      excluant la production affectee aux puits de carbone.
      EXIGENCE DE RIGUEUR RETENUE CONTRE LE REGISTRE DRAMATIQUE : "boundary
      positions do not demarcate or predict singular threshold shifts" -- une
      limite n'est pas un point de rupture, c'est un point de precaution, et la
      zone au-dela est une "zone of INCREASING RISK".
      RESERVE PRINCIPALE ET ACQUISITION DE RANG 1 : LE CORPUS TIENT UN CADRE,
      PAS UN CONSENSUS. Aucune critique publiee de ces neuf limites n'est
      ouverte. Et LES MATERIAUX N'Y SONT PAS -- le socle reste incomplet, la
      source qui le complete etant au Drive.
      L24.C02 OUVRE LA SOURCE QUI APPORTE LA DIMENSION MANQUANTE -- Rockstrom,
      Gupta, Qin, Lade et al., "Safe and just Earth system boundaries", Nature
      619, 2023, CC BY 4.0 donc COMPATIBLE avec la licence du corpus. Deux
      limites par domaine, SURE et JUSTE, et "the STRICTER of the safe or just
      boundaries sets the integrated safe and just ESB".
      RESULTAT CENTRAL, ET IL VISE LE DISPOSITIF : "justice considerations
      CONSTRAIN the integrated ESBs MORE THAN SAFETY considerations for climate
      and atmospheric aerosol loading" -- LES GENS SUBISSENT UN DOMMAGE
      SIGNIFICATIF AVANT QUE LE SYSTEME TERRE NE SE DESTABILISE. Pour le climat,
      limite sure 1,5 degre, LIMITE JUSTE "AT OR BELOW 1.0", deja franchie. A
      1,5 : plus de 200 millions de personnes exposees a des temperatures sans
      precedent, plus de 500 millions a l'elevation du niveau de la mer. UN
      DISPOSITIF QUI SE JUSTIFIE PAR LA JUSTICE ET SE CALIBRE SUR LA SECURITE
      MANQUE SON PROPRE MOTIF D'UN DEMI-DEGRE.
      SEPT DES HUIT limites globales sont deja franchies, et au moins deux
      limites regionales sur plus de la moitie des terres. Aerosols : 85 % de la
      population mondiale exposee au-dela de la limite, 4,2 millions de deces
      annuels, "vulnerable groups being affected disproportionately more WHILE
      POLLUTING LESS" -- la proposition qui fonde la these du dispositif est
      desormais tenue CHIFFREE et non plus en enonce.
      F13 EST RESTREINT LE JOUR MEME DE SA PROPOSITION. Les auteurs ecrivent
      qu'un retour en deca de la limite juste "may not be achievable in the
      foreseeable future" et que "ADAPTATIONS AND COMPENSATIONS [...] WILL BE
      NECESSARY". LA COMPENSATION ENTRE DIMENSIONS DU SYSTEME TERRE EST
      IMPOSSIBLE ; LA COMPENSATION D'UN DOMMAGE SUBI PAR DES PERSONNES EST
      POSSIBLE ET NECESSAIRE. Le corpus confondait les deux.
      OBJET ENTIER MANQUANT AU DISPOSITIF, NOMME PAR CE CHAPITRE : L11.C13
      qualifie ce qui REGENERE ; une part de ce qu'il faut financer REPARE. LE
      CORPUS N'A AUCUN BAREME DE REPARATION, et A35 y conduisait sans qu'il le
      voie -- une partie de la dette est deja echue.
      REPONSE PARTIELLE A LA QUATRIEME QUESTION DE L24.C01 : plusieurs limites
      SONT sous-globales et ne s'allouent pas -- 20 % d'alteration des debits
      "in ALL rivers globally", budget mondial de 7 630 km3/an respecte sur 66 %
      des terres seulement ; recharge des nappes 16 000 km3/an, niveaux en
      declin dans 47 % des bassins ; azote 61 Tg/an, phosphore 4,5 a 9,0 Tg/an,
      l'agriculture representant 90 % des apports.
      LE COULOIR EST NOMME ET VERSE AU LIVRE 25 : un plancher d'acces minimal a
      l'eau, l'alimentation, l'energie et les infrastructures, sous un plafond
      de pression. LE PLAFOND EST TENU ET QUANTIFIE ; LE PLANCHER NE L'EST PAS.
      ACQUISITION DE RANG 1 TOUJOURS OUVERTE, ET L'ECHEC EST DECLARE : la
      critique du cadre (Biermann et Kim, 2020) est hebergee derriere UNE
      VERIFICATION ANTI-ROBOT, ET LE CORPUS NE CONTOURNE PAS UNE DETECTION DE
      ROBOT. RISQUE A PORTER TANT QUE L'ACQUISITION N'EST PAS FAITE : LES DEUX
      SOURCES OUVERTES PARTAGENT PLUSIEURS AUTEURS ET UN MEME PROGRAMME DE
      RECHERCHE -- le corpus tient deux etages d'une meme ecole et aucune
      contradiction.
      L24.C03 FERME LA TROISIEME QUESTION OUVERTE DE L24.C01 -- les materiaux --
      en ouvrant le rapport du PNUE deja au Drive. DROITS : reproduction
      autorisee pour usage educatif ou non lucratif avec attribution, INTERDITE
      pour tout usage commercial sans autorisation ecrite -- REGIME
      CITATION_SEULE, la clause etant incompatible avec la licence du corpus.
      LE CHIFFRE QUE L18.C04 PORTAIT EST VERIFIE : "over three billion tonnes of
      energy transition minerals and metals" pour rester sous 2 degres d'ici
      2050. ET LA PHRASE SUIVANTE AJOUTE UNE TENAILLE : "Aiming for 1.5 degre TO
      MAXIMIZE CLIMATE JUSTICE would mean EVEN GREATER DEMAND." VISER LA LIMITE
      JUSTE PLUTOT QUE LA LIMITE SURE AUGMENTE LA DEMANDE DE MINERAUX -- la
      justice climatique coute de la matiere.
      RESULTAT PRINCIPAL, ET IL MODIFIE LA PORTEE DE F13 SANS L'ENTAMER.
      L'extraction et la transformation des ressources materielles comptent pour
      PLUS DE 55 % DES EMISSIONS et 40 % des effets sanitaires des particules ;
      avec le changement d'usage des terres, plus de 60 % ; et la biomasse seule
      pour PLUS DE 90 % de la perte de biodiversite et du stress hydrique lies
      aux terres. LES NEUF DIMENSIONS N'ONT AUCUNE UNITE COMMUNE MAIS ELLES ONT
      UN DETERMINANT COMMUN, ET IL SE COMPTE EN TONNES. L'ABSENCE D'UNITE
      COMMUNE N'IMPLIQUE PAS L'ABSENCE DE LEVIER COMMUN.
      ASYMETRIE QUI EN RESULTE, PORTEE COMME UN RESULTAT : le reflux trouve son
      assiette -- une fonte graduee par l'intensite materielle a desormais un
      fondement physique, ce que A35 suggerait sans le fonder -- ET L'EMISSION NE
      TROUVE RIEN, reduire un tonnage n'etant pas restaurer un milieu. LA
      MATIERE MESURE UNE PRESSION, PAS UNE REGENERATION.
      GRANDEURS : usage materiel multiplie par plus de trois en cinquante ans,
      croissance de plus de 2,3 % par an, de 100 a 160 MILLIARDS DE TONNES d'ici
      2060 sans action -- "far exceeding what is required to meet essential human
      needs for all in line with the SDGs". Quatre systemes -- bati, mobilite,
      alimentation, energie -- font 90 % de la demande. Et "there has so far
      been NO EVIDENCE OF WIDESPREAD ABSOLUTE DECOUPLING at the global level".
      INEGALITE CHIFFREE POUR LA SECONDE FOIS EN DEUX CHAPITRES : les pays a
      haut revenu utilisent SIX FOIS plus de matiere par habitant et sont
      responsables de DIX FOIS plus d'impacts climatiques par habitant que les
      pays a faible revenu, et "through global trade, high-income countries
      DISPLACE environmental impacts to all other income country groups".
      F10 RECOIT SA FORME LA PLUS DOCUMENTEE, DANS UNE SOURCE QUI NE LUI EST PAS
      HOSTILE : mobilite -50 % de stocks materiels, -50 % d'energie, -60 %
      d'emissions ; batiment -25 % de stocks, -30 % d'energie et d'emissions ;
      alimentation -5 % de terre. AUCUNE NE DEMANDE UNE MONNAIE NOUVELLE. Mais
      la meme source dit ce qui bloque -- subventions dommageables,
      financiarisation des marches de matieres premieres, concentration du
      pouvoir de decision -- CE QUI DEPLACE F10 : la question n'est plus "une
      monnaie est-elle necessaire" mais "qu'est-ce qui debloque des mesures dont
      l'efficacite est etablie et que personne ne prend".
      RESERVES : les gains chiffres sont DES SORTIES DE MODELE, et le corpus n'a
      ouvert ni le modele ni ses hypotheses ; le pied materiel agrege des tonnes
      d'effets tres inegaux ; aucune donnee de STOCK n'est tenue, seulement des
      flux, et c'est le Livre 26 qui devra les etablir.
      L24.C04 N'OUVRE AUCUNE SOURCE NOUVELLE : IL RELIT CELLES DE L24.C01 ET
      L24.C02 ET Y TROUVE UN RESULTAT QUE CES DEUX CHAPITRES AVAIENT LAISSE
      PASSER. "Meeting the global ESB sums to a global alteration budget of
      7 630 km3 per year [...] GLOBALLY AGGREGATED RIVER FLOW ALTERATIONS ARE
      CURRENTLY LESS THAN THIS FIGURE ; HOWEVER, WE ARE OUTSIDE THE GLOBAL ESB
      because the subglobal safe ESB is only met for 66 % of land area and less
      than half of the global population." L'AGREGAT MONDIAL EST DANS LE BUDGET,
      ET LE MONDE EST HORS DE LA LIMITE. Meme constat sur les nappes : somme des
      recharges (16 000 km3/an) tenue, 47 % DES BASSINS EN DECLIN.
      UN BUDGET MONDIAL N'EST PAS UNE QUANTITE PARTAGEABLE : c'est la somme
      arithmetique d'une CONJONCTION DE CONTRAINTES LOCALES, et cette somme peut
      etre tenue pendant que la conjonction est violee. LE CHIFFRE EST UNE
      CONSEQUENCE, PAS UNE REGLE. Sous un budget, un excedent quelque part
      finance un deficit ailleurs ; sous une conjonction, il ne finance rien.
      LE MEME TRAIT RELU DANS LA SOURCE DE L24.C01 : le phosphore est "a global
      average, but REGIONAL DISTRIBUTION IS CRITICAL FOR IMPACTS" ; l'azote agit
      comme une "valve" mondiale mais "regional distribution [...] is critical" ;
      et la limite des forets est "a weighted average of the three individual
      BIOME boundaries" -- tropical 85 %, tempere 50 %, boreal 85 %. Les limites
      sures et justes supposent en outre "the REDISTRIBUTION of nutrients from
      OVER-FERTILIZED to UNDER-FERTILIZED regions" -- un deplacement physique,
      non une compensation comptable.
      F13 RECOIT UNE SECONDE FACE, SPATIALE. Pour huit des neuf dimensions, UNE
      AMELIORATION EN UN LIEU NE COMPENSE PAS UNE DEGRADATION EN UN AUTRE.
      L'EXCEPTION EST LE CLIMAT -- une tonne a le meme effet partout -- et c'est
      pourquoi un marche mondial y est concevable et pas ailleurs. Le corpus
      refuse de surgeneraliser.
      CONSEQUENCE POUR LE DISPOSITIF : IL DOIT EMETTRE SOUS CONTRAINTE DE LIEU,
      ET NON SEULEMENT SOUS CONTRAINTE DE MONTANT. Verser un montant FONGIBLE
      contre un effet NON FONGIBLE en ferait un INSTRUMENT DE DEPLACEMENT DES
      DOMMAGES : on paie la restauration la ou elle est bon marche, et l'on ne
      repare pas la ou le seuil est franchi. Trois exigences posees et non
      resolues : la qualification doit porter la localisation ; la priorite doit
      aller aux lieux ou la limite est franchie ; et l'emission ne peut pas etre
      arbitree par le seul cout -- CE QUI EST LE CONTRAIRE D'UN RAISONNEMENT
      D'EFFICACITE.
      ET CELA COMPLIQUE SERIEUSEMENT L11.C24 : un ajustement aux frontieres
      fonde sur un PRIX UNIQUE de l'impact suppose exactement la fongibilite que
      ce chapitre ecarte.
      ACQUISITION DE RANG 1 DU CHAPITRE : aucun regime juridique de l'eau n'est
      ouvert, ni les conventions sur les cours d'eau transfrontaliers, alors
      qu'un plafond hydrique se respecte bassin par bassin.
      L24.C05 CLOT LA PREMIERE TRANCHE A CINQ CHAPITRES, trois sources ouvertes
      de premiere main, ET LES DEUX FONCTIONS ASSIGNEES AU LIVRE SONT REMPLIES
      DANS LEUR PRINCIPE : ce qui doit etre maintenu est etabli, et la question
      des seuils non compensables recoit une reponse METROLOGIQUE ET NON MORALE.
      TROIS RESULTATS QUE LE CORPUS N'ATTENDAIT PAS. La justice contraint plus
      que la securite ET ELLE COUTE DE LA MATIERE -- viser 1,5 degre plutot que
      2 "to maximize climate justice would mean EVEN GREATER DEMAND" de
      mineraux : les deux objectifs ne sont pas convergents. Pas d'unite commune
      MAIS UN DETERMINANT COMMUN qui se compte en tonnes, d'ou l'asymetrie la
      plus utile de la tranche pour la conception -- LE REFLUX TROUVE SON
      ASSIETTE, L'EMISSION NE TROUVE PAS SON ECHELLE. Et UN BUDGET MONDIAL N'EST
      PAS PARTAGEABLE, d'ou la contrainte de lieu.
      CE QUE LA TRANCHE DONNE AU DISPOSITIF : une definition quantitative de
      "regeneratif" que L11.C13 n'avait pas ; sa raison d'etre physique ecrite
      dans la source la plus citee du domaine ("ADDITIONAL PRODUCTION OF NPP
      above the Holocene baseline") ; et la regle des gains nets confirmee par
      la physique.
      CE QU'ELLE ETABLIT CONTRE LUI : l'emission d'un scalaire contre un vecteur
      a neuf composantes sans metrique ; F10 dans sa forme la plus documentee,
      par une source qui ne lui est pas hostile ; et la contrainte de lieu, qui
      interdit d'arbitrer l'emission par le cout.
      CE QUI RESTE. L'ACQUISITION DE RANG 1 N'EST TOUJOURS PAS FAITE et le
      risque est declare : les deux sources principales partagent plusieurs
      auteurs et un meme programme de recherche -- LE CORPUS TIENT DEUX ETAGES
      D'UNE MEME ECOLE ET AUCUNE CONTRADICTION. Aucune donnee de STOCK, seulement
      des flux, la contrainte restant une contrainte de DEBIT et non
      d'EPUISEMENT -- c'est le Livre 26 qui devra l'etablir. Aucun regime
      juridique des ressources n'est ouvert, ce qui fait de cette tranche la
      seule entierement scientifique et statistique quand les quatre livres
      ecrits autour d'elle le meme jour sont entierement juridiques --
      DESEQUILIBRE DECLARE.
      ET LA CLE DE REPARTITION N'EXISTE NULLE PART : L24.C04 etablit qu'un
      budget mondial n'est meme pas partageable pour huit dimensions sur neuf,
      L25.C05 que le droit differencie sans calculer. LE CORPUS TIENT
      L'IMPOSSIBILITE DE LA QUESTION TELLE QU'IL LA POSAIT, ET PAS LA REPONSE A
      LA QUESTION REFORMULEE -- qui n'est plus "comment partager un budget" mais
      "COMMENT PRIORISER DES LIEUX".
  - livre: 25
    titre: "Répartition, besoins essentiels et justice sociale"
    collection: cahier-disciplinaire
    fonction: >
      Tester qui paie réellement le dispositif et qui reçoit ses bénéfices —
      ménages, revenus, patrimoine, accès aux besoins essentiels, services
      publics, inégalités territoriales, travail de soin, acceptabilité
      politique
    motifs:
      - "objection — L11.C09 a découvert la question de l'incidence sans pouvoir la traiter, et A35 la rend décisive : la fonte est modulée par la décision de chacun"
      - "arbitrage — A34 : un barème qui dit vrai EXCLUT CEUX QUI NE PEUVENT PAS PAYER, et l'exclusion est maximale là où le signal doit être le plus fort"
      - "manque — L5.C09 a enregistré comme un MANQUEMENT que la contrainte de rédaction exigeait des coûts humains et qu'aucun chapitre n'en produit"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 7
    note: >
      MOTIF ARRETE PAR L'AUTEUR, ET IL EST UNE CONDITION D'ECHEC : un systeme
      peut etre ECOLOGIQUEMENT COHERENT ET DEVENIR POLITIQUEMENT IMPOSSIBLE s'il
      frappe les personnes qui n'ont pas la possibilite de modifier leur
      consommation. C'est exactement ce que A34 a etabli et que L1.C15 nomme
      l'essentiel insolvable.
      CE LIVRE PORTE LA DETTE DECLAREE PAR L5.C09 : la contrainte de redaction
      arretee le 2026-09-04 exigeait des COUTS HUMAINS, et aucun chapitre du
      Livre 5 n'en a produit -- manquement enregistre, non reserve. Il porte
      aussi la question renvoyee a L11.C09 par l'arbitrage A35 : QUI PAIE
      EFFECTIVEMENT une fonte graduee, repercussion comprise.
      OUVERT LE 2026-09-07 PAR L25.C01, qui remplace l'amorce et etablit une
      chose que le corpus n'avait pas vue : LE PLANCHER SOCIAL N'EST PAS UN
      CHOIX DE MODELISATION A FAIRE, C'EST UNE OBLIGATION JURIDIQUE EN VIGUEUR
      DEPUIS LE 3 JANVIER 1976. Le Pacte international relatif aux droits
      economiques, sociaux et culturels est ouvert par lecture directe.
      LE CONTENU DU PLANCHER EST ENUMERE : niveau de vie suffisant incluant
      nourriture, habillement et logement, et "continuous improvement of living
      conditions" (art. 11 par. 1) ; droit d'etre a l'abri de la faim (11 par.
      2) ; meilleur etat de sante physique et mentale possible (12) ; securite
      sociale (9) ; education (13) ; travail (6).
      ASYMETRIE DE NATURE ENTRE LES DEUX BORDS DU COULOIR : LE PLAFOND
      ECOLOGIQUE EST UN NIVEAU, LE PLANCHER SOCIAL EST UNE TRAJECTOIRE.
      L'article 2 par. 1 oblige a agir "TO THE MAXIMUM OF ITS AVAILABLE
      RESOURCES, with a view to ACHIEVING PROGRESSIVELY the full realization of
      the rights".
      LA CHARNIERE QUE LE CORPUS CHERCHAIT : "au maximum de ses ressources
      disponibles". UN DISPOSITIF QUI CREE DES RESSOURCES MODIFIE CE QUE CES
      MOTS DESIGNENT, et la question devient juridique et non seulement
      economique. Trois lectures possibles -- restrictive, extensive,
      intermediaire -- et LE CORPUS NE TRANCHE PAS, la reponse dependant des
      observations generales du Comite, NON OUVERTES : ACQUISITION DE RANG 1.
      Le meme article oblige a agir "INDIVIDUALLY AND THROUGH INTERNATIONAL
      ASSISTANCE AND CO-OPERATION" : LE PACTE NE CONCOIT PAS LA REALISATION DE
      CES DROITS COMME UNE AFFAIRE PUREMENT NATIONALE.
      UNE REGLE DE REPARTITION MONDIALE FIGURE DANS LE TEXTE, INDEXEE SUR LE
      BESOIN ET NON SUR LA CAPACITE DE PAYER (art. 11 par. 2 b) : "to ensure AN
      EQUITABLE DISTRIBUTION OF WORLD FOOD SUPPLIES IN RELATION TO NEED". Le
      corpus croyait cet objet a construire. Et l'alinea precedent rattache la
      production alimentaire aux RESSOURCES NATURELLES -- le lien entre plancher
      social et plafond ecologique est DANS LE TEXTE. TENSION NON RESOLUE PAR LE
      PACTE : la biomasse compte pour plus de 90 % de la perte de biodiversite
      et du stress hydrique lies aux terres (L24.C03).
      LA CLAUSE DE LIMITATION EST OPPOSABLE A L'INSTRUMENT DU DISPOSITIF (art.
      4) : limitations "determined by law", "compatible with the nature of these
      rights", et "SOLELY FOR THE PURPOSE OF PROMOTING THE GENERAL WELFARE IN A
      DEMOCRATIC SOCIETY". LE SEUIL D'EXEMPTION DE L11.C18 N'EST DONC PAS UNE
      BONNE PRATIQUE : DANS LES ETATS PARTIES, C'EST UNE CONDITION DE LICEITE.
      ET UNE BORNE QUE MEME CE TEST NE FRANCHIT PAS (art. 1 par. 2) : "In NO
      CASE may a people be deprived of ITS OWN MEANS OF SUBSISTENCE" -- clause
      placee avant tout le reste, redigee sans exception.
      QUATRE QUESTIONS RESTENT, ET UNE CINQUIEME EST NEE DU CHAPITRE : le
      contenu quantifie du plancher ; ce que doit a qui celui qui a cause ; LA
      REPARATION, objet entier que le dispositif n'a pas et que L24.C02 a
      revele ; la cle de repartition du plafond ; et le dispositif rend-il le
      plancher plus atteignable, et pour qui.
      L25.C02 FERME A MOITIE L'ACQUISITION DE RANG 1, en ouvrant l'observation
      generale n. 3 du Comite. RESERVE D'EDITION PORTEE : le texte a ete lu sur
      UNE REPRODUCTION ACADEMIQUE (bibliotheque des droits de l'homme de
      l'universite du Minnesota), NON sur le document original E/1991/23. Le
      corpus la tient pour fiable et NON pour la source.
      PREMIER RESULTAT, ET IL CORRIGE UNE FORMULATION ECRITE LE JOUR MEME : LE
      PLANCHER N'EST PAS UNE PURE TRAJECTOIRE. Il comporte UN NOYAU DUR --
      "a MINIMUM CORE OBLIGATION to ensure the satisfaction of, at the very
      least, MINIMUM ESSENTIAL LEVELS of each of the rights [...] upon EVERY
      State party" -- et un Etat ou "any significant number of individuals is
      deprived of essential foodstuffs, of essential primary health care, of
      basic shelter and housing, or of the most basic forms of education" manque
      PRIMA FACIE a ses obligations. LE PLANCHER EST UNE TRAJECTOIRE AU-DESSUS
      D'UN NIVEAU, ET LE BORD INFERIEUR DU COULOIR N'EST PAS MOU.
      DEUXIEME RESULTAT : LA CHARGE DE LA PREUVE EST RENVERSEE. Un Etat qui
      impute son manquement au manque de ressources "MUST DEMONSTRATE THAT EVERY
      EFFORT HAS BEEN MADE TO USE ALL RESOURCES THAT ARE AT ITS DISPOSITION [...]
      AS A MATTER OF PRIORITY". Et meme quand les ressources sont "demonstrably
      inadequate", l'obligation demeure de "strive to ensure the widest possible
      enjoyment".
      REGLE "LE PAS DE TROP" APPLIQUEE LA OU ELLE COMPTE LE PLUS : le texte
      etablit une obligation renforcee d'EMPLOYER ce dont on dispose ; IL NE DIT
      PAS qu'un Etat doive CREER des ressources nouvelles ni adherer a un
      mecanisme qui lui serait offert. LA LECTURE EXTENSIVE N'EST PAS ETABLIE, et
      la question qui decide du sort du dispositif dans ce livre reste ouverte.
      TROISIEME RESULTAT, ET C'EST UN ORDRE D'EMPLOI DES INSTRUMENTS QUE LE
      CORPUS N'AVAIT PAS : "ANY DELIBERATELY RETROGRESSIVE MEASURES [...] would
      need to be FULLY JUSTIFIED [...] IN THE CONTEXT OF THE FULL USE OF THE
      MAXIMUM AVAILABLE RESOURCES." UN PRELEVEMENT A INCIDENCE REGRESSIVE N'EST
      PAS INTERDIT, MAIS IL VIENT APRES LES INSTRUMENTS QUI PESENT SUR CEUX QUI
      PEUVENT PAYER. Le seuil d'exemption de L11.C18 cesse d'etre un reglage
      pour devenir une etape obligee d'un raisonnement juridique.
      REGULARITE RELEVEE ENTRE LES DEUX BORDS DU COULOIR : le noyau dur est un
      NIVEAU EN DROIT ET IL N'EST PAS CHIFFRE, le texte procedant PAR CONSTAT DE
      PRIVATION. C'est la seconde fois en une journee que le corpus rencontre ce
      procede -- L22.C04 avait etabli que le bareme ecologique CERTIFIE UN
      PROCEDE et ne mesure pas. LE DROIT REFUSE LE CHIFFRE ET LE REMPLACE PAR
      UNE PROCEDURE, DES DEUX COTES. Or LE DISPOSITIF DOIT PRODUIRE UN MONTANT :
      il demande aux deux bords une precision que ni l'un ni l'autre ne fournit.
      RESTE OUVERT : le CONTENU des droits -- observations generales n. 4, 12, 14
      et 15 -- et l'acquisition n'est donc close qu'a moitie ; le document
      officiel ; et aucune donnee d'application.
      L25.C03 OUVRE L'ACCORD DE PARIS tel que l'Union l'a publie (JO L 282/4,
      CELEX 22016A1019(01)) ET Y TROUVE DEUX CHOSES OPPOSEES.
      UN PRECEDENT DE DROIT POSITIF POUR LA STRUCTURE MEME DU DISPOSITIF.
      Article 9 par. 1 : "Les pays developpes Parties FOURNISSENT des ressources
      financieres pour venir en aide aux pays en developpement Parties". La
      redaction n'est pas hortative, et le contraste interne le prouve -- le
      par. 2 dit "sont invitees [...] a titre volontaire", le par. 3 emploie
      "devraient". Et le par. 4 precise "la necessite de prevoir des ressources
      d'origine PUBLIQUE et SOUS FORME DE DONS pour l'adaptation". DONNER SANS
      CREANCE, POUR UN OBJET ECOLOGIQUE, ENTRE ETATS, SUR FONDS PUBLICS : CELA
      EXISTE EN DROIT.
      CONSEQUENCE, ET C'EST LE RESULTAT PRINCIPAL : LE DISPOSITIF N'A PAS A
      CREER CETTE OBLIGATION, ELLE EXISTE DEJA. CE QU'IL PROPOSE EST UN MOYEN DE
      LA TENIR. Toute sa defense se deplace : il n'a pas a etablir qu'il faut
      donner, mais QU'IL DONNE MIEUX, PLUS, OU PLUS SUREMENT que ce qui existe.
      Reserve : l'article 9 oblige a FOURNIR et ne dit pas D'OU VIENNENT les
      ressources -- c'est exactement l'espace que le dispositif pretend occuper.
      SUR LA REPARATION, LE MEME TRAITE NE DONNE RIEN. Article 8 : "reconnaissent
      la necessite", "devraient", "dans le cadre de LA COOPERATION ET DE LA
      FACILITATION". LE CORPUS ETABLIT PAR LECTURE, NON PAR OUI-DIRE, CE QUE
      L'ARTICLE NE CONTIENT PAS : aucune responsabilite, aucune indemnisation,
      aucun montant, aucun debiteur designe. LE PASSAGE DE L'OBLIGATOIRE AU
      FACULTATIF SE FAIT EXACTEMENT AU MOMENT OU L'ON PASSE DE L'AIDE A LA
      REPARATION. L'objet que L24.C02 revelait manquant au dispositif MANQUE
      AUSSI AU DROIT CLIMATIQUE.
      F13 RECOIT UN TROISIEME REGIME. L'article 8 par. 4 range parmi les
      domaines de cooperation "les pertes et prejudices IRREVERSIBLES ET
      PERMANENTS" et "LES PERTES AUTRES QU'ECONOMIQUES". Entre dimensions du
      systeme Terre : aucune conversion. Pour un dommage ECONOMIQUE subi par des
      personnes : conversion possible et necessaire. POUR LES PERTES AUTRES
      QU'ECONOMIQUES : LE DROIT LES NOMME SANS LES CONVERTIR. Une unite
      monetaire unique ne peut pas etre l'instrument de tout ce qui doit etre
      repare, ET CE N'EST PAS LE CORPUS QUI LE DECIDE.
      DEUX ACQUISITIONS ONT ECHOUE ET LE CHAPITRE LES DECLARE : l'avis
      consultatif de la Cour internationale de justice du 23 juillet 2025 sur
      les obligations des Etats en matiere de changement climatique, et la
      decision 1/CP.21. LES DEUX SITES SONT PROTEGES PAR UNE VERIFICATION
      ANTI-ROBOT, ET LE CORPUS NE LA CONTOURNE PAS. Demande adressee a l'auteur
      au protocole des sources.
      L25.C04 OUVRE LE REGLEMENT (UE) 2023/955 INSTITUANT LE FONDS SOCIAL POUR
      LE CLIMAT, ET Y TROUVE A34 ECRIT PAR UN LEGISLATEUR. Considerant 11 : la
      hausse des prix affecte "DE MANIERE DISPROPORTIONNEE" les menages "qui
      consacrent une grande partie de leurs revenus a l'energie et aux
      transports", qui "n'ont pas acces a des solutions [...] alternatives et
      abordables" et qui "pourraient ne pas disposer des moyens financiers pour
      investir". LE CORPUS N'A PAS CONSTRUIT UNE OBJECTION : IL A REDECOUVERT UN
      PROBLEME IDENTIFIE ET TRAITE. A34 est reel, nomme, ET NON REDHIBITOIRE.
      MECANISME : LE PRELEVEMENT FINANCE SA PROPRE COMPENSATION. Le Fonds est
      alimente par les recettes de mise aux encheres du dispositif de prix
      lui-meme, "recettes affectees externes", pour un maximum de 65 000 000 000
      EUR du 1er janvier 2026 au 31 decembre 2032. Les deux montants co-varient
      dans le bon sens. DEUX BORNES : l'enveloppe tombe a 54 600 000 000 EUR si
      le dispositif de prix est reporte a 2028 ; ET LE PRELEVEMENT EST
      PERMANENT, LA COMPENSATION EST BORNEE A SEPT ANS.
      LE CRITERE QUE L11.C18 CHERCHAIT, ET CE N'EST PAS LE REVENU : le "menage
      vulnerable" est celui qui est sensiblement touche par les prix ET "QUI NE
      DISPOSE PAS DES MOYENS NECESSAIRES POUR RENOVER LE BATIMENT QU'IL OCCUPE".
      LE CRITERE EST LE REVENU ET L'INCAPACITE D'AGIR SUR LA CAUSE. Et la
      "precarite en matiere de transport" est definie aussi par LE MANQUE
      D'ACCES aux transports necessaires aux activites essentielles -- un
      signal-prix ne peut rien contre un defaut d'acces, ET IL L'AGGRAVE.
      DEUX REGLES DE CONCEPTION QUE LE CORPUS N'AVAIT PAS. L'aide directe au
      revenu est "TEMPORAIRE et DIMINUE AU FIL DU TEMPS", limitee a l'incidence
      directe, conditionnee a la presence d'investissements, ET PLAFONNEE A
      37,5 % du plan : LA COMPENSATION NE DOIT PAS DEVENIR UNE RENTE, ELLE DOIT
      FINANCER LA CAPACITE DE SORTIR DU SIGNAL. Et l'article 9 par. 2 impose
      "les dispositions legales et contractuelles necessaires pour garantir que
      L'INTEGRALITE DU BENEFICE EST TRANSFEREE" -- L'INCIDENCE SE TRAITE PAR LE
      DROIT PLUTOT QUE PAR L'ESPERANCE.
      GEOGRAPHIE INATTENDUE, ET ELLE CORRIGE CELLE DU CORPUS. Cle de repartition
      (annexe II) : Pologne 17,60 % soit 11,4 milliards, Roumanie 9,25 % soit
      6,0, Hongrie 4,33 % -- contre Pays-Bas 1,11 %, Autriche 0,89 %, Suede
      0,62 %, Malte 0,07 %. LA VULNERABILITE AU SIGNAL-PRIX N'EST PAS ALIGNEE
      SUR LE CLIVAGE NORD-SUD : elle a une geographie INTERNE A UN BLOC RICHE.
      C'est le seul exemple d'allocation effective que le corpus tienne, alors
      que L24.C01 et L24.C02 laissaient ouverte exactement cette question.
      LIMITE PRINCIPALE : LE CORPUS TIENT LA COMPENSATION ET PAS L'INSTRUMENT.
      Il ne sait pas combien le prelevement PREND, seulement combien il REND. La
      question de proportion reste entiere -- ACQUISITION DE RANG 1.
      L25.C05 CHERCHE LA REGLE QUI CONVERTIT LES FAITS EN OBLIGATIONS, ET LA
      TROUVE : l'Accord de Paris "SERA APPLIQUE conformement a L'EQUITE et au
      principe des RESPONSABILITES COMMUNES MAIS DIFFERENCIEES ET DES CAPACITES
      RESPECTIVES" (art. 2 par. 2). CE N'EST PAS UN PREAMBULE : c'est dans
      l'article qui fixe l'objet, et il gouverne la lecture de tous les autres,
      y compris l'article 9 sur le financement.
      MEME STRUCTURE QUE LE PACTE DE 1966 : "son NIVEAU D'AMBITION LE PLUS ELEVE
      POSSIBLE, compte tenu de ses responsabilites [...] et de ses capacites"
      (art. 4 par. 3) repond a "au maximum de ses ressources disponibles". DEUX
      TRAITES, DEUX DOMAINES, UNE OBLIGATION INDEXEE SUR LA CAPACITE PROPRE DE
      L'OBLIGE.
      TROIS RESULTATS FAVORABLES AU DISPOSITIF. La CONDITIONNALITE de l'article
      4 par. 5 : "un appui renforce [...] LEUR PERMETTRA DE PRENDRE DES MESURES
      PLUS AMBITIEUSES" -- un mecanisme qui augmente l'appui produit de
      l'EXIGIBILITE, non de la charite. L'article 2 par. 1 c) donne un FONDEMENT
      CONVENTIONNEL au levier indiciel trouve en L22.C06 : "rendre LES FLUX
      FINANCIERS COMPATIBLES" est un objectif de l'Accord au meme rang que la
      limitation de temperature. Et l'article 2 par. 1 b) place un PLANCHER
      ALIMENTAIRE a l'interieur de l'objectif climatique -- "d'une maniere qui ne
      menace pas la production alimentaire".
      CE QUE LA REGLE NE DONNE PAS : ELLE DIFFERENCIE, ELLE NE CALCULE PAS. Elle
      dit que les obligations different selon les responsabilites et les
      capacites ; ELLE NE DIT PAS DE COMBIEN. Aucun des textes ouverts par le
      corpus ne dit combien chacun doit.
      REGULARITE SUR QUATRE CORPS DE REGLES OUVERTS EN UN JOUR, ET ELLE EST
      VERSEE A LA PASSE 2 COMME REGLE DE METHODE : le bareme ecologique CERTIFIE
      UN PROCEDE sans mesurer ; le noyau dur des droits sociaux SE CONSTATE sans
      etre chiffre ; le cadre des limites planetaires JUXTAPOSE sans agreger ;
      le droit climatique DIFFERENCIE sans repartir. QUATRE FOIS LE DROIT REFUSE
      LE NOMBRE. ET QUATRE FOIS LE DISPOSITIF EN A BESOIN. "LE DROIT DONNE LES
      CATEGORIES, PAS LES CHIFFRES" -- avec sa borne : le droit chiffre ailleurs
      (3 % de levier, 37,5 % de plafond, 65 milliards d'enveloppe), et la
      regularite vaut pour la repartition entre souverainetes d'un effort dont
      personne n'a la mesure.
      L25.C06 CLOT LA PREMIERE TRANCHE A SIX CHAPITRES, cinq textes ouverts de
      premiere main, deux traites et un reglement lus dans leur texte. RESULTAT
      QUE LE CORPUS N'ATTENDAIT PAS : PRESQUE TOUT CE QUE CE LIVRE DEVAIT
      CONSTRUIRE EXISTE DEJA EN DROIT.
      CE QUI ETAIT DEJA LA : le plancher social est une obligation en vigueur
      depuis 1976, au contenu enumere, avec une clause absolue placee avant tout
      le reste ; il a UN NOYAU DUR opposable sans consideration de richesse ; la
      charge de prouver l'impossibilite pese sur l'Etat ; l'obligation de DONNER
      SANS CREANCE pour un objet ecologique existe, sur fonds publics et sous
      forme de dons ; et A34 est ecrit par un legislateur, qui en a tire un
      fonds, un critere d'exemption, une regle de decroissance et une obligation
      contractuelle de transmission integrale.
      CE QUE LA TRANCHE N'A TROUVE NULLE PART : LE NOMBRE. Et L25.C05 a etabli
      que ce n'est pas un accident mais une regularite sur quatre corps de
      regles, versee a la passe 2 sous le titre "LE DROIT DONNE LES CATEGORIES,
      PAS LES CHIFFRES".
      CONTRE LE DISPOSITIF : la clause de limitation du Pacte est opposable a
      son instrument ; le droit ORDONNE les instruments, le prelevement regressif
      venant APRES ceux qui pesent sur ceux qui peuvent payer ; l'objet
      "reparation" manque au dispositif ET au droit climatique ; et une partie
      de ce qui est perdu N'A PAS DE PRIX -- F13 tient trois regimes.
      A SON CREDIT, ET C'EST LE RESULTAT LE PLUS UTILE : SA JUSTIFICATION SE
      DEPLACE. Il n'a pas a etablir qu'il faut donner -- un traite l'etablit --
      MAIS QU'IL DONNE MIEUX, PLUS OU PLUS SUREMENT QUE CE QUI EXISTE. Son effet
      est juridiquement reconnu ("un appui renforce [...] leur permettra de
      prendre des mesures plus ambitieuses"). Le levier indiciel de L22.C06 a un
      fondement conventionnel (art. 2 par. 1 c). Et A34 n'est pas redhibitoire.
      CE QUE LA TRANCHE N'A PAS FAIT, ET C'EST DECLARE : LA FONCTION DECLAREE DU
      LIVRE N'EST PAS REMPLIE. Elle est de tester qui paie reellement et qui
      recoit ; la tranche a produit des regles, des criteres et des mecanismes,
      ET AUCUNE DONNEE DE REPARTITION. LA DETTE DECLAREE PAR L5.C09 N'EST PAS
      SOLDEE : aucun cout humain n'est chiffre, et le manquement est desormais
      porte par deux livres.
      TROISIEME RENVERSEMENT DE LA JOURNEE, APRES CEUX DES LIVRES 21 ET 22 : le
      corpus est entre dans ce livre pour construire une theorie de la
      repartition ; il en sort en ayant constate qu'elle est largement ecrite,
      qu'elle est opposable, ET QU'ELLE NE CONTIENT AUCUN CHIFFRE. CE QUI RESTE
      A FAIRE N'EST PAS DE LA FONDER : C'EST DE LA CALCULER.

  - livre: 26
    titre: "Thermodynamique, énergie et processus économique"
    collection: cahier-disciplinaire
    fonction: >
      Établir ce que les lois de la thermodynamique imposent à un processus
      économique, et ce qu'elles interdisent à toute conception monétaire qui
      prétend régénérer — la question n'étant pas ce que le dispositif coûte,
      mais ce que l'énergie et la matière rendent possible
    motifs:
      - "manque — `entropie` figure au vocabulaire depuis la première occurrence L1.C03 et AUCUN LIVRE NE LE PORTE ; le concept est employé dans six chapitres du Livre 1 et un du Livre 2, sans instruction"
      - "discipline — économie biophysique : Georgescu-Roegen, analyse énergétique, retour énergétique sur investissement, exergie, dissipation"
      - "objection — L18.C04 : aucune preuve de découplage absolu généralisé n'est observée, et le corpus ne sait pas si l'obstacle est économique ou THERMODYNAMIQUE"
      - "objection — `effet_rebond` et `jevons_monetaire` sont au vocabulaire ; le corpus les invoque sans tenir l'argument physique qui les fonde"
      - "falsifieur — F11, LA CONTRAINTE PHYSIQUE, posé le 2026-09-07 sur arbitrage de l'auteur : ce livre est le seul qui puisse l'établir ou le réfuter"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 13
    note: >
      FRONTIERE AVEC LES LIVRES 18 ET 24, A TENIR. Le Livre 18 explique COMMENT
      MESURER ; le Livre 24 etablit CE QUI DOIT ETRE MAINTENU ; le Livre 26
      etablit CE QUE LES LOIS PHYSIQUES RENDENT POSSIBLE. Metrologie, norme de
      substance, et contrainte physique sont trois choses distinctes, et le
      corpus les a jusqu'ici confondues sous le mot "limites".
      POURQUOI CE LIVRE EST DANGEREUX POUR LE DISPOSITIF, et c'est son interet.
      Le corpus tient que le probleme est un defaut d'ORIENTATION DES FLUX
      MONETAIRES -- L18.C09 vient d'en donner la mesure, 7 300 milliards contre
      220. SI L'OBSTACLE EST THERMODYNAMIQUE ET NON MONETAIRE, alors reorienter
      les flux ne suffit pas, et le dispositif traite un symptome. C'est une
      condition d'echec d'une nature que les dix falsifieurs existants ne
      couvrent pas : ils portent sur ce que le dispositif peut faire et sur son
      utilite marginale, aucun sur CE QUE LA PHYSIQUE AUTORISE.
      A INSTRUIRE EN PRIORITE : la these de Georgescu-Roegen, que le corpus cite
      quatre fois dans L1.C03 SANS L'AVOIR OUVERTE.
      CHAINE DES TROIS LIVRES BIOPHYSIQUES, ARRETEE PAR L'AUTEUR LE 2026-09-07 ET
      INSCRITE SANS TOUCHER AUX NUMEROS -- convention paragraphe 3, l'ordre et le
      sens se changent dans collection et motifs, jamais par renumerotation :
      L26 ETABLIT LES CONTRAINTES PHYSIQUES, puis L24 DETERMINE LES CONDITIONS ET
      SEUILS A MAINTENIR, puis L18 ORGANISE LEUR MESURE. Le numero n'est pas un
      rang : la chaine est logique, l'ordre de declaration est chronologique, et
      les deux ne coincident pas.
      OUVERT LE 2026-09-08, ET LE PREMIER CHAPITRE COÛTE AU CORPUS UNE
      PROPOSITION QU'IL TENAIT. L26.C01 remplace l'amorce et ouvre R. U. Ayres,
      INSEAD Working Paper 98/38, mai 1998, regime citation_seule. RESULTAT :
      "the fourth law has no status in physics", et une economie de recyclage
      integral est "PERFECTLY CONSISTENT with the second law of thermodynamics,
      provided only that a sufficient exergy flux is available from outside the
      system". L'ENONCE DE L1.C17 PARAGRAPHE 4 -- "le corpus retient que LE
      RECYCLAGE COMPLET EST IMPOSSIBLE" -- EST FAUX ET A ETE RETIRE LE JOUR
      MEME. L1.C03 n'avait pas a l'etre : il delimitait deja la portee de
      l'argument. LE CORPUS ETAIT PRUDENT LA OU IL EXPOSAIT L'ARGUMENT ET
      IMPRUDENT LA OU IL S'EN SERVAIT.
      CE QUI SUBSISTE EST UN DEPLACEMENT ET NON UNE SUPPRESSION. La source
      maintient qu'un reservoir de matiere inactive est necessaire, qu'il ne
      peut pas etre vide et qu'il est "likely to be VERY LARGE in mass terms" ;
      sa taille vaut Mi/Ma = we/d, et d ne peut pas etre nul. LA CONTRAINTE
      PHYSIQUE CHANGE DE NATURE : un FLUX D'EXERGIE a fournir et un STOCK
      IMMOBILISE a detenir, l'un et l'autre chiffrables.
      F11 EST RESTREINT LE JOUR DE L'OUVERTURE DU LIVRE QUI DOIT LE TESTER. Sa
