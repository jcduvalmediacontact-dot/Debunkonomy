  - livre: 5
    titre: "Trajectoires et transitions"
    collection: cahier-technique
    fonction: >
      Comparer les voies d'entrée de NEMO IMS, organiser sa transition
      sectorielle et institutionnelle et tester ses alternatives dans
      différents scénarios
    motifs:
      - "rouage — conditions d'instauration et d'adoption effective de NEMO IMS"
      - "discipline — économie politique du changement institutionnel"
      - "objection — aucune promesse du registre ne couvre l'adoption : le corpus établit qu'un dispositif est concevable, jamais comment on y vient"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 10
    architecture: >
      PASSE 1 CLOSE LE 2026-09-07 À DIX CHAPITRES. L'architecture annoncée
      — trente-six chapitres en six parties, une par voie — n'a pas survécu à
      l'instruction : deux des six voies ne sont pas des voies, et trois des
      quatre restantes ne sont pas des alternatives mais des pièces qui se
      composent. `chapitres_annonces` passe à null par application de
      l'arbitrage A33. Six chapitres d'instruction, un de transition
      sectorielle, un de comparaison, un de portée, un d'ouverture.
    note: >
      Arbitré le 2026-09-04 : la formulation du plan l'emporte. On écrit
      « fenêtre de crise », non « effondrement » ni « révolution ». Ces voies
      s'analysent comme des scénarios, avec leurs conditions, leurs
      probabilités et leurs coûts humains — jamais comme des espérances. Un
      corpus qui paraîtrait compter sur l'effondrement perdrait la recevabilité
      qu'il cherche, et la perdrait auprès des lecteurs qu'il vise en premier.
      Contrainte de rédaction opposable à tout chapitre de ce livre.

      CLOSE LE 2026-09-07, ET LE RÉSULTAT EST MIXTE — à lire avant de rouvrir
      le livre. ACQUIS : « aucune voie » est devenu « quatre voies, dont une
      dominée et trois composables » — l'infrastructure fournit le rail, la
      coalition l'émission, la région le périmètre de vérification ; le
      mécanisme de croissance qui manquait à L7.C12 est trouvé (participation
      en paliers) ; un mode d'échec est nommé (le désarmement) ; et la
      transition sectorielle est traitée pour la première fois.
      NON ACQUIS : F6 n'est pas levée — déplacée sur sa première branche,
      NON TRAITÉE sur la seconde, écartée sur aucune. Le motif est le meilleur
      résultat du livre retourné : une couche qui ne retire rien à personne
      n'expose à aucune représaille ET ne rend coûteuse la position de
      personne. La sortie est dans une SECONDE PHASE — celle où la couche
      épaissit et déplace des flux — qu'aucun chapitre du corpus n'écrit.
      MANQUEMENT DÉCLARÉ : la contrainte de rédaction ci-dessus exigeait des
      probabilités et des coûts humains. Aucun chapitre du livre n'en produit,
      et L5.C09 l'enregistre comme un manquement, non comme une réserve —
      l'omission allège les quatre voies, et le plus la voie régionale, seule
      des quatre où l'échec atteint des habitants plutôt que des promoteurs.
      MANQUE DÉCISIF POUR LA PASSE 2 : aucun précédent d'entrée n'est
      instruit, et aucun cas d'installation d'une couche monétaire additionnelle
      — le corpus a comparé quatre voies sans tenir un seul cas.
      La transition INSTITUTIONNELLE, nommée par la fonction ci-dessus au même
      titre que la sectorielle, n'est pas traitée : le corpus ne tient aucune
      source sur la transformation d'administrations existantes.

  - livre: 6
    titre: "Droits de la nature et des écosystèmes — débunker les verrous juridiques de l'ordre extractif"
    collection: cahier-disciplinaire
    fonction: "Identifier et lever les verrous juridiques de l'ordre extractif"
    motifs:
      - "discipline — droit : personnalité juridique des entités naturelles, verrous de l'ordre extractif"
      - "objection — P17 : représenter une entité sans volonté par définition statutaire de son intérêt"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 13
    methode: "protocole propre — protocole éditorial, versions maîtresses, dossier de recherche, archives"
    architecture: "Valider définitivement les épisodes 12 à 21."
    note: >
      PASSE 1 OUVERTE LE 2026-09-06 : QUATRE CHAPITRES, ET LA SITUATION EST
      INÉDITE DANS LE CORPUS. La matière arrive AVEC SON PROPRE APPAREIL DE
      CONTRÔLE — protocole éditorial v06, registre transversal v04 (quarante-
      six entrées), checklists en fichiers séparés, état de clôture de
      session. 771 368 caractères copiés depuis le Drive.
      CET APPAREIL EST PLUS STRICT QUE CELUI DU CORPUS SUR TROIS POINTS, et
      les quatre chapitres écrits sont ceux qui les versent. (1) LA DISCIPLINE
      DES CINQ DONNÉES (A.1) : pour toute affaire, distinguer le montant
      réclamé, accordé, les intérêts, l'état des recours et la somme
      effectivement payée — « le récit ne doit jamais fondre ces cinq strates
      en un chiffre unique ». LE CORPUS NE DÉTIENT AUCUN CHIFFRE CONFORME :
      ses grandeurs sont toutes en valeur unique. (2) SIX ÉTATS DE CERTITUDE
      AU LIEU DE TROIS (B.1) — fait documenté, allégation d'une partie,
      conclusion d'un tribunal, inférence de l'auteur, position normative,
      plus LE POINT NON ÉTABLI : « ne jamais le convertir en négation [...]
      une étude associative ou un article général ne peuvent jamais établir
      une exhaustivité négative ». LE CORPUS CONFOND INFÉRENCE ET POSITION
      NORMATIVE sous `::hypothese::` — or un verdict porte sur des inférences,
      jamais sur des positions normatives. (3) DATATION OBLIGATOIRE des
      données évolutives, « actuellement » et « à ce jour » proscrits.
      RÉSULTAT LE PLUS IMPORTANT POUR TOUT LE CORPUS (L6.C04) : l'état de
      clôture recense TREIZE FAITS JURIDIQUES ÉTABLIS FAUX dans les rapports
      de défrichage commandés à des modèles externes — décision de justice
      inexistante, SENS DE TROIS ARRÊTS INVERSÉ, étude ministérielle fabriquée
      à partir de billets de blog commerciaux, procédure infructueuse racontée
      comme aboutie, quatre erreurs sur une seule ligne. Trois traits communs :
      ce ne sont pas des approximations mais DES OBJETS CONSTRUITS ; elles
      portent sur CE QUI REND UN FAIT CITABLE (numéro, juridiction, année,
      partie, article, sens, issue) ; AUCUNE N'EST DÉTECTABLE PAR LA LECTURE.
      D'où la règle F.6, plus stricte que celle du corpus : « un rapport de
      défrichage n'est jamais cité comme source — ni en primaire, ni en
      secondaire, ni en bibliographie ». ET UN DISPOSITIF QUI A CORRIGÉ :
      exiger la source primaire entre parenthèses après chaque mention « sûr »
      — une contrainte de FORME, non une consigne de fond.
      LEÇON SYMÉTRIQUE, versée par l'auteur : « CONTREDIRE UNE AFFIRMATION
      EXIGE LE MÊME NIVEAU DE PREUVE QUE L'AFFIRMER » — une affirmation exacte
      ayant été écartée à tort sur un commentaire secondaire.
      REGISTRE TRANSVERSAL v04 OUVERT LE 2026-09-07, fourni par l'auteur :
      114 022 caractères, SOIXANTE-TROIS entrées numérotées, deux parties et
      une annexe. Le bloc 45-63 A ÉTÉ FUSIONNÉ depuis l'état de clôture, mais
      L'HISTORIQUE DES VERSIONS S'ARRÊTE À v04 et ne décrit que les entrées 1
      à 44 bis : le document ne se décrit plus lui-même. Quatre qualifications
      définies — fait vérifié, discordance, inférence, NON RÉSOLU, ce dernier
      opérationnalisant le sixième état du protocole. Vingt-sept RÈGLES DE
      RÉDACTION, dont deux interdictions de citer, respectées dès L6.C05.
      Des NUMÉROS CONSERVÉS VIDES appliquent aux faits la règle du matricule. C'est l'appareil de vérité du livre, et un
      bloc de DIX-SEPT entrées, numérotées 45 à 63, attend d'y être collé
      (la numérotation comporte des « bis » : le compte de la source fait foi,
      non l'arithmétique).
      DIX ÉPISODES SUR VINGT ET UN NE SONT PAS AU MÊME NIVEAU DE VALIDATION —
      sept non validés (15 à 21), trois sous réserve nommée (12, 13, 14).
      Onze épisodes maîtres sans réserve, trois validés sous réserve, sept
      rédigés non validés.
      L6.C06, LE 2026-09-07, COMBLE UN MANQUE QUE L20.C16 AVAIT DÉCLARÉ :
      « le corpus généralise depuis un seul cas, et ce cas porte sur des
      ressources minérales ». Le registre en verse TROIS AUTRES, et leurs
      SORTS DIFFÈRENT assez pour livrer une règle. (58) Sections de commune :
      le Conseil d'État, le 3 avril 2026, juge qu'une disposition de 1959 sur
      la création DE PLEIN DROIT n'avait pas été abrogée — chaque fusion de
      1959 à 2013 a donc créé une section qui SUBSISTE FAUTE D'ACTE
      D'EXTINCTION, à une échelle que nul ne connaît. (59) Domaines
      collectifs italiens : LOI N° 168 DU 20 NOVEMBRE 2017 OUVERTE PAR
      TÉLÉCHARGEMENT DIRECT LE 2026-09-07 (consolidé Akoma Ntoso de
      Normattiva, trois articles lus). LE TEXTE DIT PLUS ET AUTRE CHOSE QUE
      LE REGISTRE, ET C'EST LE PREMIER CAS OÙ L'OUVERTURE D'UNE SOURCE
      CORRIGE UNE ENTRÉE DU REGISTRE. Trois énoncés inédits pour le corpus :
      les domaines collectifs sont reconnus « come ORDINAMENTO GIURIDICO
      PRIMARIO delle comunità originarie » ; leur patrimoine naturel est
      « considerato come COMPROPRIETÀ INTER-GENERAZIONALE » ; et l'art. 2
      § 1 écrit que la République « tutela e VALORIZZA » ces biens « a
      beneficio delle collettività locali degli aventi diritto » — le corpus
      n'avait AUCUN TEXTE EN VIGUEUR pour la copropriété intergénérationnelle
      ni pour la valorisation à bénéficiaire nommé. L'art. 3 § 3 confirme au
      mot près inaliénabilité, indivisibilité, inusucapibilité et destination
      perpétuelle — avec le verbe « RESTA » : la loi ne crée pas le régime,
      elle constate qu'il continue. MAIS LE CONSOLIDÉ PORTE UNE MISE À JOUR
      QUE LE REGISTRE NE PORTAIT PAS : la Cour constitutionnelle, ARRÊT
      N° 119 DES 11 MAI-15 JUIN 2023, a déclaré L'ILLÉGITIMITÉ
      CONSTITUTIONNELLE DE L'ART. 3 § 3 « nella parte in cui [...] non
      esclude dal regime della inalienabilità LE TERRE DI PROPRIETÀ DI
      PRIVATI ». Le registre annonçait ce point comme UN DÉBAT sur la
      compression du droit du propriétaire ; L'ISSUE EXISTE, ELLE EST DE
      2023, ET LA COUR A RETRANCHÉ. RÈGLE DE RÉDACTION DU REGISTRE, PORTÉE
      ET MESURÉE PAR LE CHAPITRE : « un commun opposable est un commun qui
      pèse sur des propriétaires réels » — et c'est LÀ QU'IL SERA ATTAQUÉ,
      le régime ayant tenu sur les biens publics et collectifs et cédé en six
      ans sur les biens privés. CE QUI A SURVIVÉ EST D'UNE AUTRE NATURE, et
      c'est le résultat principal du chapitre : la contrainte PAYSAGÈRE de
      l'art. 3 § 6, due à UN AUTRE CODE, « è mantenuto sulle terre ANCHE IN
      CASO DI LIQUIDAZIONE DEGLI USI CIVICI ». UNE SANCTUARISATION TIENT SI
      SES VERROUS NE RELÈVENT PAS DU MÊME TEXTE — réponse à la question que
      L20.C17 laissait ouverte, où les trois registres de 1982 relevaient
      d'un texte unique. S'y ajoute une DÉROGATION BORNÉE (§§ 8-bis à
      8-quater) : transformation irréversible antérieure à une loi de 1985,
      échange à « superficie e valore ambientale equivalenti », et
      contrainte paysagère MAINTENUE sur les terres libérées. (63) Ogiek : violé jugé en
      2017, réparations chiffrées en 2022, et la première décision de
      conformité du 4 décembre 2025 constate QU'AUCUNE SOMME N'A ÉTÉ VERSÉE
      ET QU'AUCUNE DÉLIMITATION N'A ÉTÉ OPÉRÉE — rien d'exécuté au
      30 août 2026. RÈGLE TIRÉE DES TROIS : un commun tient s'il PÈSE SUR UN
      TITULAIRE IDENTIFIÉ et si L'INACTION JOUE POUR LUI ; le cas qui a la
      meilleure déclaration et la plus haute juridiction n'a ni l'une ni
      l'autre. Symétrie relevée avec L11.C29 : là, une dérogation qui expire
      laisse le défaut se rétablir par l'inaction ; ici, un droit qui ne
      s'éteint que par acte fait subsister le commun par l'inaction.
      AUCUN DES DEUX AUTRES TEXTES N'A ÉTÉ LU — le registre le déclare pour
      chacun.
      L6.C07, LE MÊME JOUR, INSTRUIT TROIS TECHNIQUES D'ATTACHEMENT D'UNE
      CHARGE ÉCOLOGIQUE À UN SOL, SÉPARÉES PAR UNE SEULE QUESTION : QUI PEUT
      LA REFUSER. (49) L'OBLIGATION RÉELLE ENVIRONNEMENTALE est l'instrument
      que le corpus cherchait — art. L. 132-3 du code de l'environnement,
      acte authentique, jusqu'à quatre-vingt-dix-neuf ans, CHARGE ATTACHÉE AU
      BIEN QUI PERDURE EN CAS DE CHANGEMENT DE PROPRIÉTAIRE. SON PRIX EST
      MONÉTAIRE, ET LE REGISTRE L'ÉNONCE EN RÈGLE DE RÉDACTION : « l'engagement
      écologique durable est SUBORDONNÉ À L'AUTORISATION DU CRÉANCIER, lequel
      n'a pas intérêt à y consentir puisque LA CHARGE DÉPRÉCIE L'ASSIETTE DE SA
      SÛRETÉ ». APPLICATION DE L1.C07 ET L1.C09 QU'AUCUN DES DEUX N'AVAIT VUE :
      le créancier ne décide pas seulement de ce qui se finance, IL DÉCIDE DE CE
      QUI PEUT ÊTRE PROTÉGÉ. RÈGLE DE CONCEPTION TIRÉE DE LA COMPARAISON DES
      DEUX TIERS : le preneur à bail rural, à qui la loi a écrit une procédure,
      détient un veto BORNÉ (deux mois, silence valant acceptation, refus
      motivé) ; le créancier, sur lequel la loi s'est tue, détient un veto SANS
      LIMITE. UNE PROCÉDURE ÉCRITE BORNE UN VETO ; UN SILENCE DE LA LOI LE REND
      ILLIMITÉ — symétrie de L11.C29 sur les dérogations. RÉSERVE FORTE, portée
      par le registre : le verrou du créancier est une PRATIQUE NOTARIALE, NON
      UNE RÈGLE LÉGALE EXPLICITE, et aucune décision judiciaire n'a tranché ;
      si un juge jugeait le contraire, la conclusion tomberait. (46) LE BAIL
      RÉEL D'ADAPTATION À L'ÉROSION CÔTIÈRE est LE SEUL INSTRUMENT DU CORPUS
      DONT LE TERME EST ÉCRIT PAR UNE VARIABLE PHYSIQUE : durée fixée « en
      fonction de l'état des connaissances quant à l'évolution prévisible du
      recul du trait de côte », résiliation DE PLEIN DROIT au constat que la
      sécurité des personnes ne peut plus être assurée, renaturation finale aux
      frais du preneur, ordre public déclaré — ET IL NE DEMANDE L'ACCORD DE
      PERSONNE. Son objet est pourtant UN RETRAIT, non une conservation : le
      droit français sait écrire une extinction datée mieux qu'une protection
      perpétuelle, et c'est l'inverse du besoin du dispositif. (45) LE SIGNAL —
      le Conseil constitutionnel a jugé en 2018 que l'absence d'expropriation
      ne porte pas atteinte à la propriété, l'expropriation ayant « pour objet
      principal de priver le propriétaire de son bien ». RAPPROCHÉ DE L'ARRÊT
      ITALIEN DE 2023 : DEUX ORDRES JURIDIQUES, UN MÊME PARTAGE — le contrôle
      mord sur l'acte qui impose une charge, non sur le fait qui détruit. UN
      MÉCANISME QUI LAISSE FAIRE EST CONSTITUTIONNELLEMENT PLUS TRANQUILLE
      QU'UN MÉCANISME QUI CONTRAINT.
      L6.C08 INSTRUIT LE SOUS-SOL, ET C'EST LÀ QUE TOUT CE QUI PRÉCÈDE CESSE
      DE MORDRE. (51) Le droit minier français DÉTACHE le sous-sol du sol :
      les substances de mine sont concédables par l'État indépendamment de la
      propriété du sol, et LE PROPRIÉTAIRE N'A AUCUN DROIT D'OPPOSITION à la
      délivrance d'un titre ni à l'ouverture de travaux. LA CHARGE ATTACHÉE AU
      BIEN DE L6.C07 NE DESCEND PAS SOUS LA SURFACE — et le mécanisme est
      général : DÉFINIR UN PÉRIMÈTRE SUFFIT À NEUTRALISER UNE TECHNIQUE DE
      COMMUN FONDÉE SUR LA PROPRIÉTÉ, SANS RIEN ABROGER. Le corpus ne peut pas
      dire si la redevance tréfoncière compense, faute de la connaître.
      (52) LA TECHNIQUE DE FERMETURE QUE L11 CHERCHAIT EXISTE, ET ELLE A PASSÉ
      LE CONTRÔLE CONSTITUTIONNEL : le décret qualifiant un projet d'intérêt
      national majeur peut lui reconnaître une RAISON IMPÉRATIVE D'INTÉRÊT
      PUBLIC MAJEUR, et cette reconnaissance « ne peut être contestée qu'à
      l'occasion d'un recours dirigé contre le décret, DONT ELLE EST
      DIVISIBLE ». Conformité le 5 mars 2025 (n° 2024-1126 QPC), application
      par le Conseil d'État le 30 septembre 2025 (n° 497567, Lebon) en
      CONTRÔLE NORMAL. SUR TROIS CONDITIONS CUMULATIVES ELLE N'EN FERME QU'UNE,
      ET C'EST LA CONDITION NORMATIVE : les deux conditions factuelles —
      absence de solution alternative, état de conservation des espèces —
      restent contestables projet par projet. C'EST LE PARTAGE QUE L11 N'AVAIT
      PAS SU ÉCRIRE : une valeur normative contestable UNE FOIS, à une date,
      contre l'acte qui la pose. LE CORPUS DIT CE QU'IL EN COÛTE : la technique
      a été construite POUR ACCÉLÉRER UNE EXTRACTION, dans une loi dite
      d'industrie verte, et son premier cas d'application est une mine. Forme
      tenue pour transposable, NON PRÉSENTÉE COMME UNE CONQUÊTE.
      (50) GRANT TOWNSHIP — l'ordonnance communale reconnaissant des droits aux
      écosystèmes a été invalidée en 2015 SUR LA COMPÉTENCE, non sur le fond :
      trois motifs de droit de l'État de Pennsylvanie, « LES MOTIFS NE SONT PAS
      CONSTITUTIONNELS », et la même décision juge que la loi pétrolière NE
      PRÉEMPTAIT PAS l'ordonnance. FAIT LE PLUS LOURD : dans cette procédure,
      l'intervention de l'association pétrolière A ÉTÉ ADMISE et celle formée
      AU NOM DE L'ÉCOSYSTÈME REFUSÉE. C'EST P17 DANS SA FORME LA PLUS DURE, et
      elle corrige L6.C05 : un porteur s'est présenté, il a été écarté. Le
      cercle est visible — l'entité ne peut pas défendre en justice l'acte qui
      lui donne qualité pour agir.
      RÈGLE DU CHAPITRE : LA QUESTION N'EST JAMAIS SI UN ÉCOSYSTÈME PEUT AVOIR
      DES DROITS, MAIS QUEL NIVEAU A COMPÉTENCE POUR LES LUI DONNER. Les trois
      régimes qui tiennent ont été posés au niveau compétent (lois nationales
      italienne et néo-zélandaise, décret d'État) ; celui qui est tombé a été
      posé en dessous. CONTRAINTE NOUVELLE SUR LA POLYCENTRICITÉ, juridique
      celle-là, qui s'ajoute à la contrainte économique de L11.C16 : l'échelon
      local peut constater et administrer, IL NE PEUT PAS CRÉER LE TITRE. Et
      réciproque de L20.C12 : CE QUE LE TRAITÉ NE POSE PAS LUI-MÊME, AUCUN
      ÉCHELON INFÉRIEUR NE LE POSERA VALABLEMENT À SA PLACE.
      SÉQUENCE POSTÉRIEURE À 2015 NON EMPLOYÉE — le registre la qualifie de
      fait rapporté sur sources partisanes, à recouper. AUCUN DES TEXTES DE CE
      CHAPITRE N'A ÉTÉ LU, tous publics et gratuits.
      CORROBORATION RELEVÉE APRÈS COUP, sur le texte complet de l'entrée 59 :
      l'arrêt n° 113 de 2018 de la Cour constitutionnelle italienne retient que
      « LA NATURE RÉELLE DU DROIT CIVIQUE RATTACHE LA MATIÈRE À L'ORDRE CIVIL,
      COMPÉTENCE EXCLUSIVE DE L'ÉTAT ». C'est la règle de L6.C08 dite par un
      quatrième ordre juridique : la région ne peut pas légiférer sur le
      commun, l'État seul le peut. L'entrée 59 portait par ailleurs l'alinéa 6
      sur la contrainte paysagère, que L6.C06 a établi sur le texte de la loi.
      L6.C09, LE MÊME JOUR, MET EN REGARD DEUX INSTRUMENTS QUI ÉCHOUENT DE DEUX
      FAÇONS OPPOSÉES. (56) LE TRAITÉ DE L'OMPI DU 24 MAI 2024 crée une
      obligation de divulgation d'origine au bénéfice d'un peuple ou d'une
      communauté identifiée — SEUL BÉNÉFICIAIRE NON ÉTATIQUE NOMMÉ QUE LE
      CORPUS TIENNE — puis lui retire ses remèdes. QUATRE LIMITES, énoncées
      ensemble comme le registre l'exige : pas de vérification imposée aux
      offices ; rectification préalable hors fraude ; AUCUNE INVALIDATION DU
      BREVET NI AUCUN REMÈDE AYANT CET EFFET ; non-rétroactivité. Il N'EST PAS
      EN VIGUEUR : quinze ratifications requises, deux instruments déposés au
      début de 2026, après vingt-cinq ans de négociation et une adoption PAR
      CONSENSUS. RÉSULTAT PRINCIPAL — LE DÉSARMEMENT EST À TROIS ÉTAGES, à
      trois endroits différents du texte : déclencheur resserré par DEUX
      CONDITIONS CUMULATIVES ; constatation neutralisée ; remède exclu par une
      clause RÉDIGÉE PAR L'EFFET, qui ferme d'avance les remèdes non encore
      imaginés — inverse exact de ce que L11.C29 réclame. LE CORPUS S'EN FAIT
      UN TEST CONTRE LUI-MÊME, versé au registre de falsification (F8).
      (57) LA GRADATION INTERAMÉRICAINE apporte à L11.C24 une option de
      conception non considérée : UN SEUIL DÉFINI PAR SA CONSÉQUENCE —
      consentement requis lorsque le projet est « susceptible de mettre en
      péril la subsistance physique, culturelle ou économique » — QUI NE SE
      CONTOURNE PAS PAR LE FRACTIONNEMENT, puisque c'est l'effet qui le
      déclenche. COÛT NOMMÉ : la mesure passe à l'amont, d'où l'exigence
      d'ÉTUDES D'IMPACT PRÉALABLES, qu'il faut que quelqu'un paie et qu'un
      tiers croie. Et la forme de mise en œuvre suit LA STRUCTURE DÉCISIONNELLE
      DU DESTINATAIRE : c'est la place que L6.C08 laissait à l'échelon local —
      poser le titre au niveau compétent, en régler la forme au niveau
      concerné. RÉSERVE : l'obligation est CONSTRUITE PAR INTERPRÉTATION, à
      partir d'un droit de propriété et d'instruments non opposables au
      défendeur ; ce qu'un juge a déduit, un autre peut le déduire autrement.
      TROISIÈME CAS D'INEXÉCUTION DU LIVRE, et l'objet manquant est le même que
      dans le premier : LA DÉLIMITATION FONCIÈRE. Un droit sur un territoire
      sans limites tracées n'a pas d'assiette, et aucune juridiction ne trace
      de limites à la place d'un État.
      L6.C10 RÉUNIT DEUX DÉCISIONS PUBLIQUES QUI PLACENT QUELQUE CHOSE
      AU-DESSUS DU SIGNAL DE PRIX, À DEUX NIVEAUX. (47) Le 31 janvier 2020
      (n° 2019-823 QPC), la protection de l'environnement PASSE DE BUT
      D'INTÉRÊT GÉNÉRAL — qui justifie une atteinte à la liberté d'entreprendre
      — À OBJECTIF DE VALEUR CONSTITUTIONNELLE, QUI ENTRE DANS LA BALANCE À
      ÉGALITÉ DE RANG ; l'antériorité de 2013 (n° 2013-346 QPC) est datée, et
      L'APPORT EST CE PASSAGE. C'EST UN DÉPLACEMENT DE LA CHARGE, NON UN
      RENFORCEMENT DU DEGRÉ — et c'est, en droit national, l'égalisation de
      rang dont L20.C03 avait établi qu'elle était le verrou réel au niveau
      européen. PORTÉE NON MESURÉE : aucune décision d'application n'est
      ouverte. La même décision juge que LE LÉGISLATEUR PEUT TENIR COMPTE DES
      EFFETS PORTÉS À L'ENVIRONNEMENT À L'ÉTRANGER par des activités exercées
      en France — appui que le corpus n'avait pas — MAIS LA LIMITE EST NETTE :
      l'énoncé regarde au-delà de la frontière la conséquence d'un acte
      accompli EN DEÇÀ, non l'inverse, DONC LE CAS DE L'AJUSTEMENT AUX
      FRONTIÈRES N'EST PAS COUVERT.
      (48) Depuis la loi du 13 juillet 1982, le régime des catastrophes
      naturelles repose sur une SURPRIME UNIFORME NON INDEXÉE SUR LE RISQUE,
      réassurée publiquement : UN PRIX QUE LA LOI EMPÊCHE DÉLIBÉRÉMENT DE
      SIGNALER, inverse exact de ce que le dispositif construit. D'OÙ UNE
      CONTRAINTE CONTRE LE CORPUS, JAMAIS FORMULÉE, VERSÉE EN ARBITRAGE A34 :
      un barème qui fait dire au prix la vérité écologique EXCLUT CEUX QUI NE
      PEUVENT PAS LA PAYER, et L1.C21 comme L11.C24 raisonnent sur
      l'orientation des comportements, JAMAIS SUR LES AGENTS QUE LE SIGNAL
      EXCLUT. Le droit français a tranché ce dilemme en 1982, dans l'autre
      sens, et PAR LA LOI. L'ACPR projette à 2050 une multiplication par cinq
      des zones touchées et des primes en hausse jusqu'à 200 % : la
      mutualisation tient tant que la part exposée reste minoritaire, et son
      déplacement NE DÉRÈGLE PAS LE BARÈME, IL DÉPLACE LA FRONTIÈRE ENTRE CEUX
      QUI PAIENT POUR LES AUTRES ET CEUX POUR QUI L'ON PAIE.
      PATRON DE MÉTHODE TENU POUR TRANSPOSABLE À TOUT LE CORPUS, tiré de la
      règle de rédaction la plus exigeante du registre : le corpus n'écrit pas
      que des biens sont devenus inassurables en France ; il écrit que l'accès
      formel est maintenu selon le seul relevé disponible, QUE CE RELEVÉ EXCLUT
      DE SON PÉRIMÈTRE LES PRIX ET LES FRANCHISES, et que c'est par les prix et
      les franchises que l'inassurabilité se manifeste. UNE MESURE QUI CONCLUT
      QUE LE SYSTÈME FONCTIONNE SE LIT D'ABORD SUR SON PÉRIMÈTRE DÉCLARÉ, ET LA
      DÉMONSTRATION NE CONSISTE PAS À CONTREDIRE LE RELEVÉ MAIS À NOMMER CE
      QU'IL NE REGARDE PAS. Le chiffre de 1,7 million de personnes sans
      assurance habitation reste UN POINT NON ÉTABLI, non employé et non
      converti en négation.
      ÉPISODE 18 OUVERT LE 2026-09-07, APRÈS RÉDACTION DE C06 à C10, ET LE
      CONSTAT DE MÉTHODE EST DÉSAGRÉABLE : LE CORPUS DÉTIENT LES VINGT ET UN
      ÉPISODES DEPUIS LE 2026-09-06 ET A ÉCRIT CINQ CHAPITRES DEPUIS LE REGISTRE
      SEUL. Le registre est l'appareil de FAITS ; les épisodes portent
      l'ARGUMENT, et chaque entrée nomme l'épisode qu'elle sert.
      RÈGLE DE MÉTHODE ACQUISE : quand une matière arrive avec À LA FOIS un
      registre de faits et des textes maîtres, LES TEXTES MAÎTRES SE LISENT
      AVANT DE RÉDIGER — le registre ne dit pas ce que l'auteur en tire.
      ÉCART MESURÉ, ET IL JOUE DANS LES DEUX SENS. CE QUE L'ÉPISODE AVAIT ET QUE
      LE CORPUS N'AVAIT PAS : (1) LA DISTINCTION COMMUN / SERVITUDE — « le
      commun attache un droit d'usage à une APPARTENANCE ; la servitude attache
      une charge à un FONDS. L'un crée des SUJETS, l'autre grève des OBJETS » —
      qui EST UNE ERREUR CONCEPTUELLE DE C06 ET C07, corrigée le jour même dans
      les deux chapitres ; (2) la SECONDE raison, STRUCTURELLE, pour laquelle
      l'obligation réelle environnementale n'est pas un commun — elle produit un
      engagement, non une communauté, ni assemblée ni règle de décision ni
      transmission d'une qualité d'usager — RAISON PLUS FORTE QUE CELLE DE C07
      PARCE QU'AUCUN JUGE NE PEUT LA DÉFAIRE ; (3) DEUX TEXTES FRANÇAIS OUVERTS
      ET DORMANTS, art. 714 du code civil et art. L. 110-1 du code de
      l'environnement, « deux formules ouvertes et deux siècles de non-usage » ;
      (4) les autres institutions collectives françaises, énumérées sous réserve
      de régime non vérifié ; (5) la lecture POLITIQUE de l'absence — quatre
      motifs, déclarés par l'épisode comme UNE CONSTRUCTION DE L'AUTEUR non
      vérifiée sur sources nommées — dont le contre-argument démocratique pris au
      sérieux (« un conseil municipal est élu ; une communauté d'ayants droit ne
      l'est pas ») et son effet non voulu : faire du périmètre communal la seule
      échelle possible du commun, alors qu'un pâturage, un versant ou un bassin
      n'ont aucune raison d'épouser les limites administratives — C'EST LA
      CONTRAINTE DE POLYCENTRICITÉ DE L6.C08 PRISE PAR L'AUTRE BOUT, ET MIEUX
      DITE.
      CE QUE LE CORPUS AVAIT ET QUE L'ÉPISODE N'A PAS : l'ARRÊT N° 119 DE 2023,
      que l'épisode décrit encore comme « un débat jurisprudentiel nourri » ;
      l'article 43 de la Constitution ; « ordinamento giuridico primario »,
      « comproprietà inter-generazionale » et « valorizza [...] a beneficio
      delle collettività locali degli aventi diritto » ; le régime de dérogation
      des §§ 8-bis à 8-quater ; et l'affaire Ogiek. LES CHAPITRES NE SONT DONC
      PAS DES DOUBLONS — ils portent le texte de loi que l'épisode déclare ne
      pas avoir lu.
      ÉPISODE 19 OUVERT LE 2026-09-07 ET VERSÉ EN L6.C11. Quatre apports que
      L6.C05 n'avait pas : (1) LA REPRÉSENTATION D'UNE ENTITÉ NATURELLE EST UNE
      ATTRIBUTION D'INTENTION — « un fleuve ne veut rien ; son représentant
      décide de ce qu'il aurait voulu » ; (2) les faits de Te Urewera, plus
      lourds que le résumé : 29 refuges incendiés fin 2022, DIX DE PLUS APRÈS
      L'INJONCTION, condamnation du 14 décembre 2023 atteignant aussi LA
      DIRECTRICE GÉNÉRALE DU DÉPARTEMENT DE LA CONSERVATION, appel retiré sans
      commentaire ; (3) trois architectures — gouvernance conjointe, commission
      paritaire, tuteur administratif — et AUCUNE ACTION DE L'ORGANE INSTITUÉ
      CONTRE L'ÉTAT INSTITUTEUR IDENTIFIÉE, les trois constats étant au SIXIÈME
      ÉTAT ; (4) LE MIROIR, que le corpus n'avait nulle part : le modèle indien
      SUSPENDU LE 7 JUILLET 2017 SUR POURVOI DE L'ÉTAT LUI-MÊME, au motif que la
      personnalité expose les gardiens à répondre DES DOMMAGES CAUSÉS PAR LE
      FLEUVE. LE CORPUS TRAITE LA PERSONNALITÉ COMME UNE CAPACITÉ ET N'A JAMAIS
      EXAMINÉ LE VERSANT PASSIF. S'y ajoute la distinction représentant /
      DEMANDEUR HABILITÉ : le premier trahit, le second s'abstient, et rien ne
      sanctionne celui qui, ayant qualité pour agir, choisit de ne pas agir.
      DEUX CORRECTIONS APPORTÉES À C11 LE JOUR MÊME, SUR RELECTURE
      CONTRADICTOIRE, ET LES DEUX PORTENT SUR DES SUR-AFFIRMATIONS DU CORPUS.
      (a) « Une procédure ne départage pas deux attributions d'intention » EST
      FAUX : le jugement du 14 décembre 2023 a départagé SANS DÉCOUVRIR AUCUNE
      VOLONTÉ DU MILIEU, en appliquant une exigence de procédure et UN STANDARD
      LÉGAL ÉNUMÉRÉ. L'énoncé exact est l'inverse et il est utilisable : une
      procédure arbitre à CONDITION QUE L'INSTRUMENT ÉNUMÈRE LE STANDARD ; ce
      que le juge ne peut pas faire, c'est arbitrer sur le silence de
      l'instrument. (b) L'IMPOSSIBILITÉ STRUCTURELLE POUR UN ORGANE COMPRENANT
      L'ÉTAT D'AGIR CONTRE LUI N'EST PAS DÉMONTRÉE : c'est une INFÉRENCE de
      l'auteur, appuyée sur deux prémisses non vérifiées — le vote par consensus
      et l'absence de règle de déport — et la preuve disponible n'est qu'une
      NON-IDENTIFICATION datée. La réserve rend le résultat plus utile : si
      l'obstacle tient à la règle de décision, IL SE LÈVE PAR LA RÈGLE DE
      DÉCISION — déport obligatoire des membres publics quand l'action vise
      celui qui les nomme, levier plus léger que le représentant ad hoc.
      LE BLOC VALIDÉ EST OUVERT LE 2026-09-07 — épisodes 01 à 03 et entrées 1 à
      13 du registre — ET IL RÉPOND À L20.C17. La passe avait travaillé la
      matière la plus fragile (épisodes 14 à 21, non validés) et laissé de côté
      les onze épisodes maîtres sans réserve. L6.C12 ouvre le rattrapage.
      RÉSULTAT PRINCIPAL, ET IL EST INCONFORTABLE : la technique juridique qui
      RÉSISTE À UN RAPPORT DE FORCES QUI CHANGE existe, elle est documentée, ET
      ELLE PROTÈGE LES INVESTISSEMENTS — art. 47 § 3 du traité sur la Charte de
      l'énergie, VINGT ANS de protection des investissements antérieurs après
      le retrait. Ratifier prend des mois, sortir pleinement peut prendre vingt
      ans. UN MÉCANISME QUI REND UNE DÉCISION RÉSISTANTE À SA RÉVISION EST
      INDIFFÉRENT AU SENS DE CETTE DÉCISION : L7.C13 ne peut pas demander une
      sanctuarisation sans écrire qu'elle armera aussi ceux qui viendront
      après. DEUXIÈME OCCURRENCE DE LA MÊME SYMÉTRIE après la technique de
      fermeture de L6.C08 : les deux outils que le corpus voudrait reprendre
      existent, fonctionnent, ET SERVENT AUJOURD'HUI LA DIRECTION INVERSE DE LA
      SIENNE. Aucun ne porte de valeur propre.
      RÉSULTAT MONÉTAIRE QUE LE CORPUS N'AVAIT NULLE PART : une créance née
      d'une politique écologique DEVIENT UN ACTIF FINANCIER AVANT D'ÊTRE UN
      DROIT ACQUIS — droits économiques monétisés, avance versée contre tranches
      conditionnelles, risque d'annulation assuré. CE QUI DEVIENT FINANÇABLE EST
      LE LITIGE LUI-MÊME, et sa valeur suit la probabilité que l'État perde.
      C'est L1.C09 sur un objet que ce chapitre n'avait pas prévu.
      QUATRE GRANDEURS PORTÉES SOUS LES QUALIFICATIONS QUE LE REGISTRE IMPOSE :
      162 affaires CONNUES au 1er décembre 2023, sans édition postérieure, les
      parties n'étant pas tenues de notifier — plancher dont l'écart au réel
      est inconnu ; l'exposition modélisée (523,5 Md€ à court terme, 1 300 Md€
      en 2050, ~42 % sur les contribuables) qualifiée d'INFÉRENCE et JAMAIS
      PRÉSENTÉE COMME UNE FACTURE ; la sentence Rockhopper de 190 M€ ANNULÉE
      INTÉGRALEMENT le 2 juin 2025 sur motif de procédure — le cas le plus cité
      n'a pas été payé ; et 331,8 M€ versés par DÉCISION ADMINISTRATIVE INTERNE
      hors de tout arbitrage (318,3 + 13,5, sans addition), PREMIÈRE SATISFACTION
      DE LA DISCIPLINE DES CINQ DONNÉES DE L6.C02 DANS LE LIVRE. L'effet du
      mécanisme précède sa mise en œuvre, et un compte des sentences ne le
      mesure pas.
      NON ÉTABLI ET PORTÉ COMME TEL : l'épisode 01 avance que l'autocensure
      préventive pèse plus lourd que les condamnations. C'EST UNE INFÉRENCE DE
      L'AUTEUR ; le corpus ne tient aucune mesure ni aucune méthode, et ne
      convertit pas ce point non établi en négation.
      F4 ÉTENDU (et non F9 créé) : l'arbitrage d'investissement n'apparaissait
      NULLE PART dans falsification.md — vérifié avant d'affirmer, après
      l'incident du même jour sur L11.C10. Recoupe directement L1.C18 § 2 : Équateur 2008,
      Atrato 2016, Te Awa Tupua 2017. C'est le livre qui doit établir ce que
      L1.C18 ne fait qu'énoncer — et le seul qui puisse porter l'obstacle des
      traités relevé en L1.C18 § 6, si l'on ne lui donne pas de livre propre.

  - livre: 7
    titre: "Missions, fonctionnement et organisation du GAÏA Economic Symposium"
    collection: cahier-technique
    fonction: >
      Établir la constitution institutionnelle du GAÏA Economic Symposium :
      légitimité, représentation, organes, décisions, financement, contrôles
      et articulation
    motifs:
      - "rouage — le GES : quatre chambres séparées, qualification, calibration"
      - "discipline — gouvernance des autorités non élues"
      - "objection — P15 (légitimité, versant autorisation), P16 (régime des services), P19b (connaissance dispersée)"
      - "périmètre — P32, P33, P57 et A5, ROUTÉS ICI le 2026-09-06 par arbitrage de l'auteur : ce que le dispositif finance relève de l'institution qui l'arrête"
    statut: defrichage
    chapitres_annonces: 22
    chapitres_acquis: 22
    source: >
      L'économie de l'équilibre, chapitre 7 « Le GAÏA Economic Symposium »
      (p. 131-156). Le dossier Drive du livre 7 est vide.
    architecture: >
      Trente-six chapitres en six parties : fondation et mandat ; membres et
      représentation ; organes et expertise ; décision, financement et action ;
      intégrité, contrôle et recours ; relations extérieures, transition et
      révision.
    note: >
      Les six parties recouvrent exactement ce que L1.C18 laisse ouvert :
      « fondation et mandat » porte l'autorisation démocratique (P15),
      « décision, financement et action » porte la calibration (P18),
      « intégrité, contrôle et recours » porte la capture et le double rôle
      de l'État.
      CHARGE ALOURDIE le 2026-09-06 : le périmètre financé (P32, P33, P57, A5)
      était orphelin depuis l'établissement de la table de routage ; l'auteur
      l'a routé ici. Conséquence à porter au dossier : L11.C13 § 3 a établi que
      décider ce qui qualifie est décider ce qui est financé, de sorte que ce
      livre et le 11 se partagent UNE SEULE décision, vue de l'organe par l'un
      et de la table par l'autre. Le couplage est à double sens et le sens le
      plus chargé va du 11 vers le 7 : neuf acquis de la passe 1 du Livre 11
      sont versés à ce livre et le dispensent de les redécouvrir — voir la
      section des couplages dans protocoles/routage-livres-annexes.md.

  - livre: 8
    titre: "Théories économiques — écoles, controverses et angles morts"
    collection: cahier-comparatif
    fonction: >
      Comparer les grandes traditions économiques mondiales par controverses,
      auteurs repères, apports, angles morts et confrontation à NEMO IMS
    motifs:
      - "discipline — histoire de la pensée économique"
      - "objection — P19b : la connaissance dispersée (Hayek) relève de ce livre"
    statut: defrichage
    chapitres_annonces: 41
    chapitres_acquis: 41
    chapitres_annonces_propose: 36
    architecture: >
      PROPOSITION DU CORPUS, NON FIXEE — ce registre est la projection du plan
      directeur de l'auteur et c'est au plan de trancher. PLAN COMPLET EN
      protocoles/plan-livre-08-propose.md, etabli le 2026-09-06 sur instruction
      de l'auteur : couvrir la pensee economique de Cantillon et Turgot
      jusqu'aux dernieres avancees, nombre de chapitres extensible, construit
      avec recherche web.
      TRENTE-SIX CHAPITRES EN SIX PARTIES, colonne vertebrale CHRONOLOGIQUE et
      controverse par chapitre — les deux se reconcilient : la chronologie donne
      l'ordre, chaque chapitre porte le desaccord que sa periode a ouvert, et
      une troisieme rubrique dit ce que NEMO IMS en herite, lui doit ou
      contredit. I. Avant la discipline (C02-C06) ; II. L'economie politique
      classique (C07-C12) ; III. Les critiques du XIXe (C13-C16) ; IV. La
      revolution marginaliste (C17-C21) ; V. Le siecle keynesien (C22-C27) ;
      VI. Le present (C28-C36).
      CINQ CHAPITRES SONT ECRIVABLES IMMEDIATEMENT sur des sources deja
      ouvertes : C24 (Tinbergen, Mundell), C23 (Keynes CW XXV, Eichengreen),
      C25 (Hayek), C29 (Ostrom), C27 partiellement (Goutsmedt et al.).
      LE COUT D'ACQUISITION EST INCOMPARABLEMENT PLUS FAIBLE QUE CELUI DU
      LIVRE 11 : les quatre premieres parties reposent sur des textes du domaine
      public, tous accessibles. L'obstacle n'est pas l'acces, c'est le temps de
      lecture.
      PROCEDER PAR CONTROVERSES et non par ecoles : une ecole se classe, une
      controverse se teste. Comparer par ecoles inviterait a ranger NEMO IMS parmi les
      heterodoxes ou les post-keynesiens, ce qui ne dit rien de ce qui
      fonctionne dans le dispositif et offre a ses contradicteurs une
      refutation par etiquette. Trois controverses sont deja instruites de fait
      par le Livre 11, avec leurs sources ouvertes : regle contre discretion
      (Tinbergen, Lucas affaibli, Friedman renforce) ; separation contre
      integration en macroprudence (Engone Mve) ; determination centrale contre
      polycentricite (Hayek, Ostrom, Mundell). BIAIS DE SELECTION DECLARE : ce
      sont celles que le Livre 11 a rencontrees, non celles que la discipline
      tiendrait pour principales. D'autres doivent entrer -- neutralite
      monetaire, nature de la monnaie, endogeneite du credit.
    note: >
      OUVERT le 2026-09-06 sur decision de l'auteur, qui en a formule l'objet
      ainsi : comparer la theorie macroeconomique standard avec celle
      preconisee par NEMO IMS. Le corpus a signale que cette formulation
      correspondait a la fonction enregistree de ce livre et non a celle du
      Livre 2, lequel compte deja douze episodes acquis sur la macroprudence
      et vit hors du depot ; l'auteur a tranche pour le 8.
      L8.C01 NE COMPARE RIEN : il etablit que le premier terme de la
      comparaison n'est pas donne. Deux fois le corpus a cherche la doctrine et
      trouve un desaccord -- macroprudence et portee empirique de la critique
      de Lucas -- et les deux fois le desaccord portait sur la portee EMPIRIQUE
      et non sur la validite logique. Il en tire une autocritique : trois
      emplois du corpus restent a reexaminer (P48, L11.C10, L11.C22), tous
      adosses a Friedman ou Kydland-Prescott, dont aucun n'est ouvert.
      RESULTAT FAVORABLE AU DISPOSITIF, source : Tinbergen range le changement
      de structure monetaire en classe (d), ou la recherche empirique est
      declaree presque inexistante. Sur le quantitatif, il n'existe pas de
      theorie standard a lui opposer ; sur le qualitatif, elle s'applique
      pleinement -- et c'est de la que vient l'essentiel de ce que le Livre 11
      a etabli contre lui.

