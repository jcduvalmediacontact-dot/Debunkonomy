    chapitres_acquis: 30
    ecart_signale: >
      2026-09-06 — LE LIVRE DEPASSE SON ANNONCE. Vingt-six chapitres acquis
      pour vingt-cinq annonces. Le vingt-sixieme, L11.C26, rend le livre au
      terme de sa premiere passe : il ne verse aucun resultat neuf et reunit
      quatre structures majeures qui n'etaient consolidees nulle part — les
      sept biais de concentration, les quinze conditions-limites, les cinq
      delais, les six objets qu'un bareme exige. CE REGISTRE EST LA PROJECTION
      DU PLAN DIRECTEUR DE L'AUTEUR : c'est au plan de trancher, non au corpus.
      Signale, non corrige.
    note: >
      ÉLARGI le 2026-09-05, arbitrage de l'auteur. L'arbitrage A8 a établi que
      cinq questions traitées séparément n'en font qu'une : qui pondère, selon
      quelle règle, et cette règle est-elle écrite. Barème de qualification,
      taux de reflux, parités du change, valorisation des communs, pondération
      du tableau de bord — plus le périmètre, puisque décider ce qui qualifie
      est décider ce qui est financé. Priorité 1 du plan : ce livre bloque le
      Livre 13, car on ne calibre pas un dispositif dont les barèmes ne sont
      pas définis.
      LIVRE DE CONCEPTION au sens du préambule : aucune source ne préexiste.
      Le Cahier Technique ne prononce jamais le mot « barème » — zéro
      occurrence sur douze épisodes — et E06 § 6 pose lui-même les questions
      de ce livre en déclarant ne pas y répondre. Frontière avec le Livre 2 :
      le 2 établit ce que le reflux transactionnel FAIT dans l'architecture macroprudentielle,
      le 11 établit COMMENT ON FIXE LES TAUX et sur quelle assiette.
      Les 25 chapitres sont une estimation de passe 1, jamais une cible.

  - livre: 12
    titre: "Comment réaliser les ODD avec NEMO IMS ?"
    collection: cahier-comparatif
    fonction: >
      Évaluer ce que NEMO IMS peut faciliter pour chaque objectif de
      développement durable, ses limites et les politiques complémentaires
      nécessaires
    motifs:
      - "discipline — politiques de développement"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 3

    note: >
      OUVERT LE 2026-09-08 PAR L12.C01, QUI REMPLACE L'AMORCE. Trois sources :
      le rapport officiel de suivi 2025 (citation_seule), une reproduction des
      169 cibles en francais (citation_seule, ET CE N'EST PAS LE TEXTE OFFICIEL
      -- la resolution A/RES/70/1 reste a ouvrir), et le registre.
      L'ETAT DU CADRE, PAR SON PROPRE RAPPORT DE SUIVI. Sur 169 cibles, 139
      seulement ont pu etre evaluees. Parmi elles : 18 % en bonne voie, 17 % en
      progres moderes -- soit 35 % DE PROGRES ADEQUAT ; 48 % de progres
      insuffisant ; ET 18 % QUI ONT REGRESSE sous le niveau de 2015. "Only 35 per
      cent of SDG targets are on track or making moderate progress. Nearly half
      are moving too slowly and, alarmingly, 18 per cent are IN REVERSE." CELA
      REND LA REVENDICATION DU DISPOSITIF PLUS UTILE ET PLUS DIFFICILE A ETABLIR
      : accelerer ce qui recule n'est pas accelerer, c'est renverser, et le
      corpus n'a jamais distingue les deux.
      TRENTE CIBLES NE SE MESURENT PAS, faute de donnees mondiales. TROISIEME
      OCCURRENCE DE LA MEME FORME, apres L22.C04 (l'activite qualifiable n'a
      aucun code d'activite) et L18.C10 (la norme ecosystemique est adoptee et
      peu appliquee).
      LA TENSION INTERNE DU CADRE, ET ELLE VISE LE CORPUS AU CENTRE. L'objectif 8
      promeut "une croissance economique soutenue" et sa CIBLE 8.1 est chiffree :
      "un taux de croissance annuelle du produit interieur brut d'AU MOINS 7 %
      dans les pays les moins avances". Sa CIBLE 8.4 demande l'inverse du meme
      mouvement : "s'attacher a ce que la croissance economique n'entraine plus
      la degradation de l'environnement". LE CADRE CONTIENT DONC UNE CIBLE DE
      CROISSANCE CHIFFREE ET UNE CIBLE DE DECOUPLAGE NON CHIFFREE -- et le corpus
      a etabli ailleurs que la seconde NE SE LAISSE PAS MESURER, la frontiere
      decidant du rendement energetique, la methode du coefficient de rebond, et
      la composition du champ de ce qui est regarde.
      A42 EST ARBITRE LE 2026-09-08 : LA POSITION DU DISPOSITIF EST CELLE D'UNE
      CROISSANCE ET D'UNE DECROISSANCE SELECTIVES. Il ne poursuit ni la croissance
      generale du produit interieur brut ni sa diminution generale. Il cherche la
      CROISSANCE des activites necessaires a l'atteinte des besoins essentiels et
      du plancher social ; la DECROISSANCE des activites qui provoquent les
      depassements ecologiques ou dont l'utilite sociale ne justifie pas les
      dommages ; le MAINTIEN OU LA TRANSFORMATION des activites compatibles avec
      les deux bornes. LA SELECTION S'OPERE PAR ACTIVITE, TERRITOIRE ET PERIODE,
      et LE MOUVEMENT DU PRODUIT EST UN RESULTAT POSSIBLE DE LA TRANSFORMATION,
      PAS SON OBJECTIF. Pour les pays les moins avances, UNE CROISSANCE
      MATERIELLE CIBLEE RESTE POSSIBLE ET SOUVENT NECESSAIRE.
      CE QUE CELA FAIT AUX DEUX CIBLES. La cible 8.1 n'est PAS contestee dans son
      CONTENU pour les pays les moins avances -- une croissance materielle y reste
      necessaire ; C'EST SA FORMULATION EN AGREGAT QUI EST ECARTEE. Et la cible
      8.4 cesse d'etre la question du dispositif, qui ne pilote pas sur le
      couplage entre croissance et degradation mais SUR LA POSITION D'UNE ACTIVITE
      DANS UN COULOIR borne par le plancher social et les plafonds ecologiques.
      ET CE COULOIR N'EST PAS UNE NOUVEAUTE : plancher_social et
      plafond_ecologique figurent au vocabulaire controle DEPUIS L1.C04. Ce n'est
      donc pas le dispositif qui manque de case dans la taxonomie du champ, c'est
      la taxonomie qui manque d'une case QUE LE CORPUS OCCUPE.
      GRILLE DU LIVRE EN SEPT QUESTIONS : ce qu'accelerer veut dire cible par
      cible ; que faire de 8.1 ; ce que le dispositif produit contre ce qu'il
      facilite ; QUELLES CIBLES IL PEUT DEGRADER, question qu'aucun chapitre du
      corpus n'a posee ; comment le constater ; quelles politiques
      complementaires ; et le contrefactuel, meme question que celle declaree la
      plus difficile par L13.C01.
      RESERVES : aucun objectif n'est instruit ; LE TEXTE OFFICIEL DU CADRE N'EST
      PAS OUVERT et aucun libelle cite n'est citable avant verification contre la
      resolution ; et le corpus tient DEUX DOCUMENTS DU MEME EMETTEUR -- un cadre
      onusien et son propre rapport de suivi -- sans aucune critique externe,
      meme defaut que celui ayant coute deux retractations.
  - livre: 13
    titre: "Méthodes, données, scénarios et simulateur NEMO IMS"
    collection: cahier-technique
    fonction: >
      Documenter les hypothèses, données, modèles, scénarios, tests de
      sensibilité et limites du simulateur
    motifs:
      - "rouage — quantification et test du dispositif"
      - "objection — P4, P18 : un simulateur est ce qui permettrait d'éprouver la calibration"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 1
    note: >
      OUVERT LE 2026-09-08 PAR L13.C01, QUI REMPLACE L'AMORCE. CINQ CHAPITRES DE
      QUATRE LIVRES SE TERMINAIENT SUR LA MEME PHRASE : le chiffrage qui deciderait
      n'existe que si un simulateur existe, et il n'existe pas.
      SOURCE OUVERTE : un modele macroeconomique ecologique STOCK-FLUX-FONDS (2016,
      a_verifier, aucune mention de licence dans le document). C'EST EXACTEMENT LA
      FAMILLE QUE L8.C37 AVAIT RECOMMANDEE SANS SAVOIR QU'UN EXEMPLAIRE EXISTAIT, et
      elle procede d'une synthese entre la coherence stocks-flux et l'apparat
      FLUX-FONDS du fondateur ouvert la veille par L26.C07 -- premiere chose que le
      corpus peut heriter de cet auteur sans exceder ce qu'il a ecrit : UN APPAREIL
      DE COMPTABILITE, NON UN LEVIER.
      LE PRECEDENT PORTE SUR UN INSTRUMENT DE LA MEME ESPECE -- un achat d'obligations
      vertes par les banques centrales -- ET SON VERDICT EST L'INSUFFISANCE. Il ameliore
      la stabilite financiere, mais "green QE CANNOT BY ITSELF PREVENT A SUBSTANTIAL
      RISE IN ATMOSPHERIC TEMPERATURE : even with the optimistic value, global warming
      is still HIGHER THAN 3.5 C at the end of the century", et ses auteurs concluent
      que d'autres politiques doivent etre mises en oeuvre CONJOINTEMENT. LE DISPOSITIF
      N'EST PAS REFUTE PAR CE RESULTAT -- il alloue au lieu d'acheter et ne passe pas
      par un rendement obligataire -- MAIS LE CORPUS NE PEUT PLUS SOUTENIR QU'UNE
      REORIENTATION MONETAIRE SUFFISE SANS PRODUIRE UN MODELE QUI LE MONTRE.
      DEUX BOUCLES ATTENUANTES APPARAISSENT DANS LE MODELE. Des dommages plus faibles
      laissent l'activite croitre plus vite, donc pressent les emissions a la hausse --
      LE REBOND Y EST ENDOGENE. Et des dommages plus faibles donnent "LESS INCENTIVES
      for the materialisation of green investment projects" -- LE SUCCES REDUIT LE
      MOTIF DU SUCCES. C'est la QUATRIEME OCCURRENCE d'une meme forme, apres A30, le
      reflux transactionnel et la convention de conversion electrique : UN DISPOSITIF
      QUI AGIT SUR UNE GRANDEUR DONT IL DEPEND PRODUIT MECANIQUEMENT UNE BOUCLE DE CE
      TYPE, et le corpus n'a aucun mecanisme de recalibrage.
      UN PARAMETRE DE COMPORTEMENT COMMANDE LE RESULTAT, et les auteurs le declarent
      puis publient deux jeux de resultats au lieu d'en choisir un. LE DISPOSITIF A UN
      PARAMETRE DE MEME FONCTION -- la sensibilite de l'activite regenerative offerte au
      signal de l'allocation -- ET LE CORPUS NE L'A NI MESURE NI NOMME.
      CINQ CONTRAINTES DE CONCEPTION SONT DESORMAIS INSCRITES DANS CE LIVRE, ecrites
      par cinq chapitres avant qu'il ait un seul chapitre : montrer son propre echec
      (L8.C37) ; aucun coefficient energetique unique mais frontiere, convention et
      plage (L26.C08) ; declarer la methode de tout coefficient de rebond (L26.C09) ;
      dire par quelle rubrique l'activite qualifiee entre dans le produit (L26.C10) ;
      et traiter l'absence de code d'activite (L22.C04). AUCUNE N'EST SATISFAITE PAR LE
      MODELE OUVERT : le corpus tient un patron et cinq exigences que le patron ne
      remplit pas.
      GRILLE DU LIVRE EN HUIT QUESTIONS : famille de modeles ; secteurs et bilans --
      ET LE SIMULATEUR NE PEUT PAS ETRE ECRIT AVANT A37 ; comptabilite physique
      multidimensionnelle ; parametres de comportement et lesquels sont mesures ;
      contrefactuel -- la question la plus difficile, qu'aucune source ouverte ne traite ;
      scenarios et sensibilite ; tests d'echec ; limites declarees.
      RESERVES : aucun modele n'est construit et aucun chiffre n'en sort ; le modele
      ouvert n'est PAS un modele du dispositif, seule sa STRUCTURE se transporte ; sa
      calibration repose sur un espace de parametres que ses auteurs declarent
      insuffisamment explore ; et AUCUNE FAMILLE CONCURRENTE N'EST INSTRUITE -- meme
      defaut qu'aux deux tranches qui ont coute deux retractations au corpus.
      ETAT ANTERIEUR : DEBLOQUE EN PARTIE le 2026-09-06. Ce livre etait bloque par A8 — on ne
      calibre pas un dispositif dont les baremes ne sont pas definis. A8 est
      rendu par L11.C17, et il n'y avait pas cinq baremes mais trois plus une
      entree. CE QUI EST ETABLI, CE SONT LES FORMES ; CE QUI NE L'EST PAS, CE
      SONT LES VALEURS : la decision D2 reste ouverte sur les trois (A19, A20,
      A21) et deux de ces arbitrages remontent au Livre 7. Le Livre 13 peut donc
      etre CONCU, non EXECUTE.
      ET LE CORPUS RETIRE UNE POSITION QU'IL TENAIT DEPUIS L'OUVERTURE DU
      DOSSIER : le chiffrage n'est pas impossible. Il le tenait pour tel faute
      d'elasticites ; Tinbergen (ch. VII) donne la methode — indiquer des
      intervalles de variation pour les coefficients et resoudre aux valeurs
      extremes, plutot qu'attendre la valeur vraie. Un simulateur qui resout aux
      bornes est realisable aujourd'hui ; un simulateur qui attend l'estimation
      ne le sera jamais, F1 relevant de la classe (d).
      Huit acquis et un bon de commande de six chiffrages sont verses a la
      section des couplages de protocoles/routage-livres-annexes.md.

