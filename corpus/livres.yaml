      aucune reponse des heritiers de la bioeconomie n'etant ouverte ;
      L'OUVRAGE DE 1971 N'EST PAS OUVERT et la formulation explicite de la
      quatrieme loi non plus, le corpus tenant l'auteur par un texte de
      synthese ; et LE PROGRAMME EN HUIT POINTS N'A RECU AUCUNE INSTRUCTION DE
      FAISABILITE.
      L26.C08 EXECUTE L'ARBITRAGE A39, RENDU LE 2026-09-08 DANS LA FORME ET NON
      DANS LA VALEUR : aucun coefficient unique, plusieurs frontieres
      comparables, analyse de sensibilite et publication des conventions de
      calcul. Deux sources : la revue d'harmonisation de 2022, deja ouverte par
      L26.C03 mais RELUE POUR SA STRUCTURE DE FRONTIERES, et la revue historique
      de 2011 ecrite par l'inventeur du concept -- les deux libres, mentions
      lues dans les documents.
      RESULTAT PRINCIPAL : LA CHAINE D'AVAL PLAFONNE LE RENDEMENT MEME SI
      L'EXTRACTION EST GRATUITE. En supposant un rendement INFINI a l'extraction,
      le petrole plafonne a 8,7, le gaz a 5,6, le charbon a 10, l'ethanol de mais
      a 1,6 et les granules de bois a 1,6. UNE PART DU DEBAT SUR LA RICHESSE DES
      GISEMENTS EST DONC SANS OBJET POUR LA QUESTION QUE LE CORPUS POSE, puisque
      le dispositif qualifie des activites dont l'energie arrive AU POINT
      D'USAGE. Sur chiffres reels : un gaz de schiste passe de 83 a l'extraction
      a 5,2 au point d'usage, FACTEUR SEIZE ; le petrole conventionnel a une
      mediane de 4,2 ; le charbon dur 8,8.
      ET L'ECART INTERIEUR A UNE FAMILLE PEUT DEPASSER L'ECART ENTRE FAMILLES :
      plaquettes de bois 32, granules de bois 1,6, SOIT UN FACTEUR VINGT DANS LA
      MEME CASE. Objection directe a toute qualification par famille
      technologique : LE BAREME DOIT PORTER SUR DES CHAINES D'APPROVISIONNEMENT.
      LA SENSIBILITE EST PUBLIEE PAR LA SOURCE ET NON CONSTRUITE PAR LE CORPUS :
      deux jeux de resultats selon le facteur de conversion en energie primaire,
      0,3 pour un reseau thermique et 0,7 pour un reseau decarbone. Sous 0,3,
      l'electricite au charbon et au gaz se situe entre 10 et 12, du meme ordre
      que les renouvelables intermittentes et AU-DESSUS du biogaz (2 a 5). ET LA
      CONVENTION DEPEND DE L'ETAT DU RESEAU, DONC DU RESULTAT DE LA TRANSITION --
      UN BAREME CALIBRE AUJOURD'HUI DEVIENT FAUX A MESURE QU'IL REUSSIT, boucle
      de meme forme que celle relevee par L24.C05 sur les stocks.
      CE QUE DIT L'INVENTEUR DU CONCEPT DE SA PROPRE GRANDEUR. Serie historique
      non monotone : 30:1 aux Etats-Unis dans les annees 1950, 20:1 dans les
      annees 1970, 11-18:1 au milieu des annees 2000 ; au niveau mondial 26:1 en
      1992, 35:1 en 1999, 18:1 en 2006 -- ELLE MONTE AVANT DE REDESCENDRE, et
      confondre la tendance seculaire avec la reponse a l'effort de forage serait
      une faute. UNE PREVISION DE LA SOURCE A ETE DEMENTIE PAR LES FAITS : un
      rendement de 1:1 etait extrapole "as soon as about 2022", et nous sommes en
      2026 -- le corpus l'enregistre comme un resultat sur l'extrapolation
      lineaire d'une grandeur non monotone. Dispersion du nucleaire de presque
      60:1 a moins de 1:1, attribuee aux FRONTIERES DE SYSTEME. Et un biais
      d'optimisme d'environ un quart entre etudes conceptuelles (24,6:1) et
      etudes d'exploitation (18,1:1) sur 112 turbines.
      LE JUGEMENT QUE LE CORPUS NE PEUT PAS TAIRE : peu d'etudes depuis les
      annees 1980, souvent "marked more by ADVOCACY THAN OBJECTIVITY", et des
      decisions prises "on a VERY MEAGER ANALYTICAL AND DATA BASE". LE CORPUS NE
      PEUT DONC PAS FONDER UN FALSIFIEUR SUR UNE GRANDEUR DONT L'INVENTEUR
      DECLARE LA BASE DE DONNEES MAIGRE.
      F11 CESSE D'ETRE INDECIDABLE SANS DEVENIR DECIDABLE : IL DEVIENT
      CONDITIONNEL, eprouvable des que frontiere, convention et plage seront
      publiees sur un cas -- et elles ne le sont sur aucun.
      RESERVES DECLAREES : LA QUATRIEME FRONTIERE DEMANDEE PAR L'ARBITRAGE -- LE
      SERVICE FINAL -- N'EST COUVERTE PAR AUCUNE DES DEUX SOURCES, qui s'arretent
      au point d'usage ; elle suppose une comptabilite en travail utile, dont
      L17.C01 a etabli qu'elle est le seul poste ou le decouplage relatif n'est
      PAS observe. LE STOCKAGE N'EST CHIFFRE NULLE PART alors que l'intermittence
      en fait le poste decisif. Et le DEMANTELEMENT n'est present que comme
      mention, la source precisant elle-meme que "not all studies include the
      same scope of analysis".
      L26.C09 ETEND LE RESULTAT DE L26.C03 A UNE SECONDE GRANDEUR : LA FRONTIERE
      DECIDE DU RENDEMENT ENERGETIQUE, LA METHODE DECIDE DU COEFFICIENT DE
      REBOND. Deux sources : un rapport ministeriel britannique de 2026 (libre,
      Open Government Licence v3.0 lue dans le document) et le rapport fondateur
      du champ de 2007 (aucune mention de licence dans le document -- reste
      a_verifier).
      TROIS FAMILLES DE METHODES, TROIS FOURCHETTES QUI SE RECOUVRENT A PEINE :
      equilibre general calculable 18-134 %, macroeconometrique 1-25 %,
      econometrique 20 a plus de 200 % -- ET TOUTES LES ETUDES TROUVENT UN EFFET
      POSITIF. La source attribue l'ecart au perimetre evalue et aux hypotheses
      de modelisation, NON AUX FAITS. Sur l'efficacite materielle, meme forme :
      jusqu'a 77 % dans les secteurs a forte elasticite comme l'automobile,
      environ 10 % au niveau micro et meso pour le ciment ou l'acier. UN CHIFFRE
      PRIS ENTRE 1 % ET PLUS DE 200 % SANS NOMMER SA METHODE N'EST PAS UNE
      INFORMATION.
      ET LE CORPUS APPREND QUE SA SOURCE DE 2021 N'EST PAS INDEPENDANTE. Le
      rapport de 2007 concluait a un rebond economique "AT LEAST 10 % and often
      higher", et a un rebond direct "LESS THAN 30 %" sur les usages domestiques
      et le transport. La revue de 2021 sur laquelle L26.C04 s'appuie conclut a
      plus de la moitie. REVISION D'UN FACTEUR VOISIN DE CINQ -- ET L'AUTEUR DE
      2007 EST CO-AUTEUR DE 2021. Ce n'est pas une confirmation independante mais
      UNE MEME EQUIPE QUI S'EST CORRIGEE A LA HAUSSE EN QUATORZE ANS. Cela se lit
      dans les deux sens, et le corpus ecrit les deux.
      LE RETOUR DE FLAMME N'EST PAS UNE REGLE MAIS LE PRECEDENT VISE LE
      DISPOSITIF. Le rapport de 2007 refuse d'en faire une fatalite -- "no a
      priori reason to believe that backfire is an INEVITABLE outcome" -- mais
      enregistre un cas historique pour les technologies PENETRANTES, machines a
      vapeur et moteurs electriques. OR LE DISPOSITIF NE FINANCE PAS UNE
      TECHNOLOGIE : IL FINANCE UNE QUALIFICATION APPLICABLE A TOUS LES SECTEURS A
      LA FOIS, ce qui est par construction la forme d'une technologie penetrante.
      LE RESULTAT LE PLUS DIRECT TIENT EN UNE PHRASE : "All studies observed a
      POSITIVE relationship between energy efficiency improvements, long-run GDP
      and industry sector output." C'EST JEVONS_MONETAIRE ECRIT PAR UN MINISTERE
      ET SANS LE MOT -- financer l'efficacite, c'est financer de la croissance de
      production, non comme effet pervers occasionnel mais comme regularite de
      l'ensemble des etudes retenues. Une nuance de localisation attenue le point
      sans l'annuler : le rebond semble se produire SURTOUT A L'INTERIEUR DU
      SECTEUR INDUSTRIEL plutot que dans l'economie large, ce qui le rendrait
      ciblable par un instrument sectoriel -- QUE LE DISPOSITIF NE POSSEDE PAS.
      RESERVES DECLAREES : LES TROIS SOURCES DE REBOND DU CORPUS NE SONT PAS
      INDEPENDANTES, deux ayant un auteur commun et la troisieme etant un
      recensement sans estimation propre ; LA BASE EST MINCE -- dix-sept etudes,
      dont quatre des cinq britanniques publiees entre 2007 et 2012, dix-neuf ans
      apres le rapport fondateur ; ET AUCUNE MESURE EX POST N'EXISTE SUR CE QUE
      LE DISPOSITIF FINANCERAIT, toutes les estimations portant sur des
      ameliorations obtenues par le prix, la reglementation ou la technique et
      non par une emission monetaire.
      L26.C10 CLOT LA SEQUENCE DEMANDEE PAR L'AUTEUR -- EROI, PUIS REBOND, PUIS
      DECOUPLAGE -- ET IL TROUVE TROIS FOIS LA MEME STRUCTURE. Deux sources
      libres, mentions lues dans les documents : la moitie manquante de la revue
      systematique du decouplage, dont L17.C01 n'avait ouvert que la partie II,
      et un modele de 2016 declare "entirely unfunded".
      PREMIER RESULTAT, METHODOLOGIQUE. Sur 11 500 articles cribles et 835 etudes
      empiriques analysees, la "vast majority" aborde la question d'un point de
      vue "STATISTICAL-ECONOMETRIC" en "hardly acknowledging THERMODYNAMIC
      PRINCIPLES", et une incompatibilite eventuelle entre croissance et
      changement systemique est "RARELY CONSIDERED". LE CORPUS TIENT DESORMAIS
      TROIS FOIS LA MEME STRUCTURE SUR TROIS GRANDEURS : LA FRONTIERE decide du
      rendement energetique, LA METHODE decide du coefficient de rebond, LA
      COMPOSITION METHODOLOGIQUE DU CHAMP decide de ce qui est regarde en matiere
      de decouplage. DANS LES TROIS CAS, CE QUI EST PUBLIE COMME UNE MESURE EST
      LE PRODUIT D'UNE CONVENTION RAREMENT DECLAREE.
      DEUXIEME RESULTAT, ET IL A ETE CORRIGE LE 2026-09-08 PAR L'AUTEUR. Le
      modele ouvert ici conclut que "PERMANENT DECOUPLING (absolute or relative)
      IS IMPOSSIBLE for essential, NON-SUBSTITUTABLE resources". UNE PREMIERE
      REDACTION PRESENTAIT CE RESULTAT COMME CONTREDISANT FRONTALEMENT LA SOURCE
      DE L26.C01 : C'EST FAUX, ET LES DEUX PROPOSITIONS SONT COMPATIBLES. La
      source de L26.C01 traite du RECYCLAGE D'UN STOCK CONSTANT sous apport
      d'exergie, en regime permanent ; celle-ci traite d'une CROISSANCE
      PERMANENTE butant sur un plancher d'intensite strictement positif. RIEN
      DANS L'UNE N'INTERDIT L'AUTRE. Le corpus l'avait d'ailleurs deja etabli par
      la precision que L17.C02 avait versee a L26.C01, avant de reconstruire la
      controverse ici. CE QUE LA COMPATIBILITE AUTORISE A DIRE, ET CE QU'ELLE
      N'AUTORISE PAS : le regime permanent est le seul etat qui satisfasse LES
      DEUX PROPOSITIONS ETUDIEES, mais cela ne suffit pas a en faire la seule
      possibilite reelle pour le dispositif, LE MODELE ETANT CONDITIONNEL -- un
      pays, un scenario, un plancher argumente, et une classe de ressources
      supposees non substituables dont la liste n'est etablie nulle part. CE QUI
      EST ACQUIS EST PLUS ETROIT ET SUFFIT : le corpus ne peut plus invoquer le
      resultat de L26.C01 pour soutenir une croissance materielle, et il doit
      dire sous quel regime il se place. Trois limites du modele sont ecrites : le plancher d'intensite
      est ARGUMENTE ET NON MESURE ("we argue that"), la demonstration porte sur
      UN SEUL PAYS EXTRACTIF, et la conclusion vise les ressources "non
      substituables" -- or c'est precisement ce que l'autre source conteste. Un
      element renforce sa credibilite : le travail est declare "entirely
      unfunded", ce qui en fait la source du Livre 26 dont l'independance est la
      plus explicitement etablie.
      TROISIEME RESULTAT, ET IL VISE LE DISPOSITIF PAR CONSTRUCTION. La meme
      source enumere TROIS MECANISMES QUI PRODUISENT L'ILLUSION DU DECOUPLAGE :
      substitution d'une ressource par une autre, EXPORTATION de l'impact, et
      "FINANCIALIZATION of one or more components of GDP that involves INCREASING
      MONETARY FLOWS WITHOUT A CONCOMITANT RISE IN MATERIAL AND/OR ENERGY
      THROUGHPUT". EMETTRE CONTRE UNE QUALIFICATION PRODUIT EXACTEMENT CETTE
      CONFIGURATION. Ce n'est pas une accusation de tromperie -- le dispositif ne
      simule pas, il finance ce qu'il juge regeneratif -- MAIS L'INDICATEUR NE
      FAIT PAS LA DIFFERENCE : regeneration reelle et gonflement du denominateur
      monetaire ont la meme signature dans un ratio impact sur produit.
      LE MECANISME NE S'APPLIQUE PAS AU DISPOSITIF SANS UNE DEMONSTRATION QUE
      PERSONNE N'A FAITE, ET LE MOTIF EST COMPTABLE : une emission monetaire n'augmente pas
      le produit interieur brut, la norme statistique definissant celui-ci comme
      le RESULTAT D'UNE PRODUCTION et rangeant l'emission parmi les TRANSACTIONS
      FINANCIERES, qui n'y entrent pas ; et la source parle de la financiarisation
      de COMPOSANTES du produit, non de la creation monetaire. LE CORPUS NE SAIT
      PAS PAR QUELLE RUBRIQUE L'ACTIVITE QUALIFIEE ENTRERAIT DANS LE PRODUIT --
      c'est une DETTE COMPTABLE versee au Livre 19, qui tient la norme de premiere
      main, ET AU LIVRE 13, qui devrait la chiffrer. CE QUI SUBSISTE : le risque
      decrit par la source est reel des lors qu'un financement porte sur une
      production a faible intensite physique, MAIS IL VAUT ALORS POUR TOUT
      FINANCEMENT DE CE TYPE et n'a rien de propre au dispositif.
      UN INDICATEUR A DEUX TERMES PHYSIQUES NE CONVIENDRAIT PAS : il mesurerait
      un rendement technique et non un decouplage, celui-ci se definissant comme
      la relation entre une pression environnementale et une VARIABLE ECONOMIQUE.
      REGLE RETENUE : publier SIMULTANEMENT la PRESSION PHYSIQUE ABSOLUE,
      l'EMPREINTE IMPORTEE et le RATIO pression sur activite. LA PREMIERE EST UN
      TABLEAU MULTIDIMENSIONNEL -- climat, matieres, eau, sols, biodiversite,
      pollutions -- SANS QUOI UNE AMELIORATION SUR UNE PRESSION MASQUE UN REPORT
      VERS UNE AUTRE, qui est le premier des trois mecanismes d'illusion. AUCUNE
      DES TROIS NE SUFFIT SEULE, et leur publication conjointe interdit de
      choisir celle qui arrange. Et le troisieme mecanisme
      pese aussi : un dispositif a perimetre de coalition peut ameliorer le bilan
      de ses membres EN DEPLACANT LA PRODUCTION.
      RESERVES DECLAREES : le modele est calibre sur UN SEUL PAYS ET IL EST
      EXTRACTIF ; la conclusion d'impossibilite repose sur un PLANCHER
      D'INTENSITE ARGUMENTE ET NON MESURE, pose par scenario puis calibre ; et la
      contradiction avec L26.C01 N'EST PAS ARBITREE ET NE PEUT PAS L'ETRE ICI.
