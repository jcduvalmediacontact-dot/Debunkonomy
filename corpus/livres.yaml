  - livre: 10
    titre: "Monnaies, banques, finance et banques centrales dans le monde"
    collection: cahier-comparatif
    fonction: >
      Comparer les architectures monétaires, bancaires et financières
      mondiales, puis établir pour chacune les conditions d'articulation avec
      NEMO IMS
    motifs:
      - "discipline — institutions monétaires et bancaires comparées"
      - "objection — obstacle de droit positif relevé en L1.C18 § 6 (art. 123 et 130 TFUE)"
    statut: en-cours
    chapitres_annonces: null
    chapitres_acquis: 7
    note: >
      OUVERT LE 2026-09-07 pour lever la TROISIEME CONDITION D'A30, restee
      ouverte et dont toute la tranche du Livre 18 est conditionnelle : quel
      referentiel comptable s'applique a l'institution emettrice.
      PREMIER RESULTAT, ET IL RENVERSE UNE CORRECTION DU MEME JOUR. L'orientation
      BCE/2016/34 sur les procedures comptables du SEBC subordonne la
      comptabilisation d'un actif a trois conditions CUMULATIVES : probabilite
      d'un gain ou perte ECONOMIQUE futur pour l'entite declarante, transfert a
      celle-ci de L'ESSENTIEL DES RISQUES ET AVANTAGES, et mesure fiable. AUCUNE
      BRANCHE DE POTENTIEL DE SERVICE. Le test du secteur prive, que le corpus
      croyait avoir abandonne a tort apres l'ouverture du cadre IPSASB, est pour
      une banque centrale CELUI QUI S'APPLIQUE - et il est plus strict qu'IPSAS,
      qui n'exigeait que le controle. S'y ajoutent la valorisation aux prix
      courants du marche, qui reintroduit l'objection de L18.C02, et une prudence
      ASYMETRIQUE : les plus-values latentes ne vont pas au compte de resultat,
      les moins-values y vont - ce qui retire exactement l'avantage attendu
      d'IPSAS 51, dont la contrepartie devait s'apprecier.
      RESERVE CENTRALE : cette orientation lie l'Eurosysteme, non le dispositif.
      Elle est retenue comme le referentiel de banque centrale le plus proche et
      le plus accessible, non comme un referentiel etabli comme applicable.
      FONDS DOCUMENTAIRE : le classement annoncait 42 pieces pour ce livre. La
      verification du 2026-09-07 n'y trouve que des fiches de vulgarisation et
      un document de la BCE - meme surestimation que pour le Livre 3, et ce
      livre devra se construire sur des sources telechargees.
      TRANCHE POURSUIVIE LE MEME SOIR, TROIS CHAPITRES. L'annexe IV porte la
      DEROGATION qui manquait : les titres de creance detenus a des fins de
      politique monetaire echappent au prix de marche, les NON NEGOCIABLES etant
      OBLIGATOIREMENT au cout. Une dette collective y trouve une case, sans
      exposition au marche ni a l'asymetrie de prudence - meilleure nouvelle que
      ce referentiel ait donnee au corpus. MAIS ELLE EXIGE UN TITRE DE CREANCE,
      dont l'ABSENCE fondait l'echappatoire de L20.C02 face a l'article 123
      TFUE : LES DEUX ECHAPPATOIRES DU CORPUS SONT MUTUELLEMENT EXCLUSIVES.
      La jurisprudence Weiss (C-493/17) deplace la tenaille sans la resoudre :
      la sortie par le marche secondaire existe mais porte sur des titres
      NEGOCIABLES, et surtout le point 110 declare incompatible l'intervention
      des lors que les operateurs ONT LA CERTITUDE du rachat. Or LE DISPOSITIF
      REPOSE SUR UNE CERTITUDE - une activite qualifiee sera financee - et c'est
      sa qualite principale. LA CERTITUDE QUI LE FAIT FONCTIONNER EST CELLE QUE
      LA COUR INTERDIT. Porte au protocole sous F4 ter.
      TRANCHE POURSUIVIE : Gauweiler (C-62/14) et le reglement (CE) 3603/93
      ouverts, ET ILS CORRIGENT LE CORPUS DEUX FOIS. Gauweiler point 94 : la
      prohibition a une PORTEE PERSONNELLE - autorites et organismes publics -
      de sorte que L10.C03 avait trop dit en soutenant que la certitude du
      dispositif etait prohibee en elle-meme ; F4 ter revise en consequence.
      MAIS L'OBJECTION CHANGE DE COTE DU BILAN : ce n'est pas la distribution de
      l'emission qui heurte l'article 123, c'est LA CONTREPARTIE inscrite a
      l'actif. Et le reglement 3603/93, article premier par. 1 b) iii), definit
      "autre type de credit" comme TOUTE OPERATION AVEC LE SECTEUR PUBLIC QUI SE
      TRADUIT OU EST SUSCEPTIBLE DE SE TRADUIRE PAR UNE CREANCE SUR CELUI-CI -
      AUCUN INSTRUMENT N'EST EXIGE. L'echappatoire de L20.C02, qui tenait a
      l'absence d'instrument de dette, EST DEFAITE.
      TOUT SE REDUIT DESORMAIS A UNE QUESTION DE CONCEPTION, NON DE DROIT : le
      debiteur de la dette collective releve-t-il du secteur public, lequel
      inclut les entreprises publiques ? Si oui, credit prohibe de plein droit.
      Si non, la prohibition ne l'atteint pas du tout. ARBITRAGE A35 OUVERT --
      c'est la meme question que L18.C06 posait depuis la comptabilite, deux
      livres ayant bute sur un seul silence de conception.
      A35 ARBITRE LE SOIR MEME : la dette est portee par L'ENSEMBLE DE LA
      SOCIETE, le motif etant que la rentabilite n'est pas compatible avec la
      regeneration, et le reflux passant par des fontes graduees selon l'impact.
      L'OBSTACLE JURIDIQUE EST LEVE - la societe entiere n'est aucune des
      institutions de l'article 3, donc pas de creance sur le secteur public - et
      l'echappatoire de L20.C02 est retablie SUR UN MOTIF MEILLEUR QUE LE SIEN :
      l'obstacle n'etait pas l'absence d'INSTRUMENT mais l'ABSENCE DE DEBITEUR.
      MAIS LA MEME PROPRIETE REFERME LA QUESTION COMPTABLE, et IPSAS 47 par. 18
      vise le cas nommement : une intention de lever un prelevement n'est pas un
      evenement passe donnant naissance a un actif. ON NE PEUT PAS N'AVOIR AUCUN
      DEBITEUR ET DETENIR UNE CREANCE RECONNAISSABLE.
      RESULTAT PRINCIPAL : LE DISPOSITIF CHANGE DE BRANCHE DU DROIT. Une emission
      sans debiteur recouvree par un prelevement gradue est une DEPENSE PUBLIQUE
      dont la ressource est un PRELEVEMENT - regime comptable coherent, au prix
      de cesser d'etre adosse. Et le probleme du secteur public ne disparait pas,
      il passe de l'actif au PRELEVEMENT : qui leve la fonte, de quel titre ?
      Nouvelle question la plus urgente du corpus, hors de ce livre.
      DEUXIEME CADRE DE BANQUE CENTRALE OUVERT, sur demande de l'auteur : le
      paragraphe 14(b) du Federal Reserve Act. IL CONTRAINT AUTREMENT -- c'est
      une HABILITATION LIMITATIVE et non un test : la liste enumere ce qu'une
      banque de reserve a le POUVOIR d'acheter, et ce qui n'y figure pas est
      hors de son pouvoir. Une contrepartie ecologique en est exclue AVANT toute
      question comptable. LE CORPUS GENERALISAIT DONC DEPUIS LE CADRE LE PLUS
      PERMISSIF ET LE PLUS FACILE A MODIFIER : une regle comptable se change par
      le normalisateur, une habilitation legale par le legislateur.
      ET LA LISTE CONTIENT LA FIGURE DE L'ARBITRAGE A35 : titres emis "in
      anticipation of the collection of taxes or in anticipation of the receipt
      of ASSURED REVENUES" -- mais bornes a SIX MOIS, a un seul pays, et a des
      recettes ASSUREES. Cette derniere limite rejoint IPSAS 47 par. 18 par une
      autre voie : deux systemes independants exigent que la ressource future
      soit deja acquise en droit, non seulement decidee.
      DEUX CADRES NE SONT PAS UNE COMPARAISON DES PRINCIPALES BANQUES
      CENTRALES : manquent la Banque d'Angleterre et son indemnite du Tresor, la
      Banque du Japon, la Banque populaire de Chine, la BNS, les regles de la
      BRI et du FMI, et le regime d'exception de la section 13(3).
      Le Livre 3 lui réserve l'étude institutionnelle détaillée des banques
      centrales. C'est donc ici que se tranche la question de savoir si le
      Conseil Monétaire Mondial est compatible avec l'indépendance des banques
      centrales, ou s'il exige une révision des traités.

