      valeur, et la composition des frontières est interdite en l'état.

  - id: A40
    objet: "Le barème aux frontières ou la réponse à l'objection de fuite"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      Le corpus ne peut pas garder les deux.
      DÉPLACÉ LE 2026-09-08 PAR L24.C06, ET DANS UN SENS QUI AGGRAVE. La fuite
      n'est pas seulement un risque de contournement par les acteurs : elle est
      une PROPRIÉTÉ de toute limite définie sur un périmètre plus petit que le
      système. « Merely assessing the protection of a regional safe operating
      space might set incentives to export ecological degradation to other
      countries, effectively threatening the preservation of planetary
      boundaries. » La seule réponse rapportée — une étude sur la Suisse, qui
      note que la moitié de l'impact de la consommation nationale a lieu à
      l'étranger — passe par une HYPOTHÈSE ÉTHIQUE EXPLICITE de droits
      environnementaux égaux par personne. Autrement dit par une décision qui
      n'est pas scientifique.

  - id: A41
    objet: "Le mot « entropie » est-il éprouvé ou métaphorique"
    statut: arbitre
    tranche_par: auteur
    note: "Arbitré le 2026-09-08 : cinq conditions de déclaration, application rétrospective."

  - id: A42
    objet: "Que fait le dispositif de la cible 8.1"
    statut: arbitre
    tranche_par: auteur
    note: >
      Croissance, décroissance, maintien ou transformation SÉLECTIFS, par
      activité, territoire et période ; le produit est un résultat possible,
      non un objectif. Corrigé le 2026-09-08 sur quatre points : 8.4 reste
      mondiale ; 8.4 reste un critère de validation ex post ; la sélectivité
      n'est pas une famille sans précédent ; « croissance matérielle ciblée »
      est remplacé.
      APPUI TROUVÉ LE 2026-09-08 PAR L18.C18, ET IL VIENT DU CAMP OPPOSÉ : le
      traité de référence tient que les flux de matières ne seraient utiles que
      DIFFÉRENCIÉS selon leur menace pour les fonctions critiques du capital
      naturel, que sommer des flux au poids donne un indicateur « essentially
      meaningless », et que la différenciation NE SE FAIT PAS. La sélectivité
      n'est donc pas seulement sans singularité : elle est RÉCLAMÉE par
      l'adversaire. CE QUE CELA NE DONNE PAS : savoir qualifier la menace,
      qui reste la difficulté du barème. Le désaccord porte sur ce qu'on fait
      ensuite, non sur ce constat.
      SECOND APPUI LE 2026-09-08 PAR L18.C20, ET IL PORTE SUR LE GESTE MÊME
      D'A42. L'auteur du traité déclare adopter une vue AGNOSTIQUE sur la
      croissance et se concentrer directement sur les problèmes
      environnementaux, écartant la décroissance comme prescription : « environ-
      mental pollution is 'the enemy', not economic growth », et viser la
      croissance pour obtenir un résultat environnemental serait une erreur,
      moins de croissance pouvant être la CONSÉQUENCE de politiques strictes.
      C'est le geste d'A42, énoncé hors du corpus.
      ET IL PORTE UN AVERTISSEMENT POLITIQUE À NE PAS PERDRE : le même auteur
      juge la persuasion des décideurs sur la décroissance « simply hopeless and
      a political non-starter ». SI LE DISPOSITIF EST LU COMME UNE PRESCRIPTION
      DE DÉCROISSANCE, IL HÉRITE DE CE VERDICT, quelle que soit la justesse de
      sa construction. La distinction entre agir sur la grandeur écologique et
      prescrire un niveau de produit est donc une condition de recevabilité, non
      seulement une exactitude.

