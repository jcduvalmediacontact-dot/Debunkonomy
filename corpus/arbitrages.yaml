    tranche_par: auteur
    note: >
      Arbitré le 2026-09-08 DANS LA FORME et non dans la valeur : pas de
      coefficient unique, analyse de sensibilité et conventions publiées.
      Les quatre frontières sont couvertes ; L26.C12 établit qu'à frontière
