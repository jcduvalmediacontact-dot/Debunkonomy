    lie_a: [A35b]
    decision: >
      ARBITRÉ EN DEUX TEMPS. L'INCIDENCE ÉCONOMIQUE du reflux est portée par
      l'ensemble de la société — arbitrage antérieur, dont L10.C06 a corrigé le
      2026-09-07 qu'il décrit l'incidence et NON le porteur. LE PORTEUR est
      arbitré le 2026-09-09 : l'unité est inscrite au PASSIF DE L'ÉMETTEUR.
      RÈGLE DE CONCEPTION, NON QUALIFICATION COMPTABLE VALIDÉE : A35b doit
      identifier l'OBLIGATION PRÉSENTE qui la justifie, faute de quoi le mot
      « passif » sera réexaminé. Identifiant A35 conservé — c'est A35a.
    texte: protocoles/passe-2.md
