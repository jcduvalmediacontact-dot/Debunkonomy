  - id: A36
    objet: "La fonte est-elle un prélèvement ou une décote"
    statut: ouvert
    tranche_par: non-tranche
    note: "Le choix décide de la nature du dispositif."

  - id: A37
    objet: "Forme juridique de l'institution émettrice"
    statut: oriente
    tranche_par: auteur
    note: >
      Rang institutionnel donné par l'auteur. Les statuts du FMI et de la BIRD
      sont ouverts (L20.C24, L20.C25) et répondent sur quatre traits de forme —
      composition, capital, immunités, retrait. RESTENT OUVERTS : le choix de
      la forme elle-même, et le texte CONSOLIDÉ en vigueur n'est pas lu.
    acquisition_bloquante: "Statuts consolidés du FMI et de la BIRD, en vigueur."

  - id: A38
    objet: "L'épargne retraite est-elle de la thésaurisation"
    statut: ouvert
    tranche_par: non-tranche
    note: "Les deux réponses coûtent."

  - id: A39
    objet: "À quelle frontière le corpus calcule un rendement énergétique"
    statut: oriente
    tranche_par: auteur
    note: >
      Arbitré le 2026-09-08 DANS LA FORME et non dans la valeur : pas de
      coefficient unique, analyse de sensibilité et conventions publiées.
      Les quatre frontières sont couvertes ; L26.C12 établit qu'à frontière
      ÉGALE les estimations vont du simple au double. RESTE OUVERTE : la
      valeur, et la composition des frontières est interdite en l'état.

  - id: A40
    objet: "Le barème aux frontières ou la réponse à l'objection de fuite"
    statut: ouvert
    tranche_par: non-tranche
    note: "Le corpus ne peut pas garder les deux."

  - id: A41
    objet: "Le mot « entropie » est-il éprouvé ou métaphorique"
    statut: arbitre
    tranche_par: auteur
    note: "Arbitré le 2026-09-08 : cinq conditions de déclaration, application rétrospective."

  - id: A42
    objet: "Que fait le dispositif de la cible 8.1"
    statut: arbitre
    tranche_par: auteur
    note: >
      Croissance, décroissance, maintien ou transformation SÉLECTIFS, par
      activité, territoire et période ; le produit est un résultat possible,
      non un objectif. Corrigé le 2026-09-08 sur quatre points : 8.4 reste
      mondiale ; 8.4 reste un critère de validation ex post ; la sélectivité
      n'est pas une famille sans précédent ; « croissance matérielle ciblée »
      est remplacé.

