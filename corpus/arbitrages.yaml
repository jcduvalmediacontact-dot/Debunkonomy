    decision: >
      OUVERT, ET LA MATRICE NE L'A PAS REFERMÉ. Une première version prétendait
      le trancher ; l'auteur a relevé le 2026-09-09 qu'elle traitait une
      insuffisance d'actifs comme une inexistence de passif. UNE DETTE
      IMPAYABLE RESTE UNE DETTE. La matrice rend désormais QUATRE RÉSULTATS
      SÉPARÉS — cohérence comptable et liquidité calculées, solvabilité et
      conformité juridique NON ÉVALUÉES. Onze branches, aucune conclusion
      exclusive : une branche non écrite n'est pas rejetée.
    texte: protocoles/passe-2.md
    chapitres: [L10.C06, L19.C02, L19.C06, L19.C10, L1.C31]
    maj: 2026-09-09

