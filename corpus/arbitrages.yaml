  - id: A37
    objet: "Forme juridique de l'institution émettrice"
    statut: oriente
    tranche_par: auteur
    note: >
      Rang institutionnel donné par l'auteur. Les statuts du FMI et de la BIRD
      sont ouverts (L20.C24, L20.C25) et répondent sur quatre traits de forme —
      composition, capital, immunités, retrait. LES ARTICLES XXVI DU FONDS ET
      VI DE LA BANQUE SONT LUS DANS LEUR VERSION EN VIGUEUR depuis le
      2026-09-08 : édition consolidée du 11 mars 2020 pour le premier,
      mention « as amended effective June 27, 2012 » pour le second. NE SONT
      PAS LUS : les statuts CONSOLIDÉS COMPLETS des deux institutions,
      l'ANNEXE J du Fonds et l'ARTICLE II SECTION 5 (ii) de la Banque,
      auxquels ces articles renvoient. RESTE OUVERT AU FOND : le choix de la
      forme elle-même.
    acquisition_bloquante: >
      L'ANNEXE J des statuts du FMI, à laquelle l'article XXVI renvoie pour le
      règlement des comptes à défaut d'accord ; et l'ARTICLE II SECTION 5 (ii)
      des statuts de la BIRD, auquel l'article VI renvoie pour les appels de
      capital. Les articles XXVI et VI eux-mêmes sont ouverts et lus depuis le
      2026-09-08 (L20.C24) ; le corpus tient les articles qui RENVOIENT, non
      les textes AUXQUELS ils renvoient.

  - id: A38
    objet: "L'épargne retraite est-elle de la thésaurisation"
    statut: ouvert
    tranche_par: non-tranche
    note: "Les deux réponses coûtent."

  - id: A39
    objet: "À quelle frontière le corpus calcule un rendement énergétique"
    statut: oriente
    tranche_par: auteur
    note: >
      Arbitré le 2026-09-08 DANS LA FORME et non dans la valeur : pas de
      coefficient unique, analyse de sensibilité et conventions publiées.
      Les quatre frontières sont couvertes ; L26.C12 établit qu'à frontière
      ÉGALE les estimations vont du simple au double. RESTE OUVERTE : la
      valeur, et la composition des frontières est interdite en l'état.

  - id: A40
    objet: "Le barème aux frontières ou la réponse à l'objection de fuite"
    statut: ouvert
    tranche_par: non-tranche
    note: "Le corpus ne peut pas garder les deux."

  - id: A41
    objet: "Le mot « entropie » est-il éprouvé ou métaphorique"
    statut: arbitre
    tranche_par: auteur
    note: "Arbitré le 2026-09-08 : cinq conditions de déclaration, application rétrospective."

  - id: A42
    objet: "Que fait le dispositif de la cible 8.1"
    statut: arbitre
    tranche_par: auteur
    note: >
      Croissance, décroissance, maintien ou transformation SÉLECTIFS, par
      activité, territoire et période ; le produit est un résultat possible,
      non un objectif. Corrigé le 2026-09-08 sur quatre points : 8.4 reste
      mondiale ; 8.4 reste un critère de validation ex post ; la sélectivité
      n'est pas une famille sans précédent ; « croissance matérielle ciblée »
      est remplacé.
      APPUI TROUVÉ LE 2026-09-08 PAR L18.C18, ET IL VIENT DU CAMP OPPOSÉ : le
      traité de référence tient que les flux de matières ne seraient utiles que
      DIFFÉRENCIÉS selon leur menace pour les fonctions critiques du capital
      naturel, que sommer des flux au poids donne un indicateur « essentially
      meaningless », et que la différenciation NE SE FAIT PAS. La sélectivité
      n'est donc pas seulement sans singularité : elle est RÉCLAMÉE par
      l'adversaire. CE QUE CELA NE DONNE PAS : savoir qualifier la menace,
      qui reste la difficulté du barème. Le désaccord porte sur ce qu'on fait
      ensuite, non sur ce constat.

