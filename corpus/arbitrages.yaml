  - id: A37
    objet: "Forme juridique de l'institution émettrice"
    statut: oriente
    tranche_par: auteur
    note: >
      Rang institutionnel donné par l'auteur. Les statuts du FMI et de la BIRD
      sont ouverts (L20.C24, L20.C25) et répondent sur quatre traits de forme —
      composition, capital, immunités, retrait. LES ARTICLES XXVI DU FONDS ET
      VI DE LA BANQUE SONT LUS DANS LEUR VERSION EN VIGUEUR depuis le
      2026-09-08 : édition consolidée du 11 mars 2020 pour le premier,
      mention « as amended effective June 27, 2012 » pour le second. NE SONT
      PAS LUS : les statuts CONSOLIDÉS COMPLETS des deux institutions,
      l'ANNEXE J du Fonds et l'ARTICLE II SECTION 5 (ii) de la Banque,
      auxquels ces articles renvoient. RESTE OUVERT AU FOND : le choix de la
      forme elle-même.
    acquisition_bloquante: >
      L'ANNEXE J des statuts du FMI, à laquelle l'article XXVI renvoie pour le
      règlement des comptes à défaut d'accord. SEULE ACQUISITION ENCORE
      BLOQUANTE POUR A37 AU 2026-09-08, ET LES VOIES AUTOMATISÉES SONT ÉPUISÉES.
      L'édition consolidée servie par la bibliothèque électronique du Fonds
      comporte trente et un chapitres — les trente et un articles — plus une
      pièce liminaire et une pièce de fin ; LA PIÈCE DE FIN NE CONTIENT AUCUNE
      ANNEXE, le mot n'y apparaissant pas une fois. Le site institutionnel
      refuse toute récupération automatisée, y compris de sa page d'index (403).
      CETTE ACQUISITION DEMANDE UNE RÉCUPÉRATION MANUELLE PAR L'AUTEUR.
      L'ARTICLE II SECTION 5 (ii) DE LA BIRD EST OUVERT ET LU LE 2026-09-08
      (L20.C26), dans sa version en vigueur. Il donne quatre règles : la part
      appelable est AFFECTÉE à des obligations nées de l'article IV section
      1 (a) (ii) et (iii) ; la responsabilité est PLAFONNÉE à la portion non
      versée du prix d'émission (section 6) ; les appels sont UNIFORMES sur
      toutes les actions ; la MONNAIE de l'appel suit celle de l'obligation à
      honorer (section 7 (ii)).
      ACQUISITION NOUVELLE, DE RANG 1 ET AU MÊME HÔTE QUI RÉPOND : l'ARTICLE IV
      SECTION 1 (a) (ii) et (iii) de la BIRD, qui définit ce qui déclenche un
      appel. Le corpus peut dire que l'appel est affecté, non à quoi
      exactement.

