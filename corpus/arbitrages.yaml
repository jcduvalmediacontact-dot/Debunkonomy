# Registre des arbitrages et des falsifieurs — état lisible par le contrôle
#
# CRÉÉ LE 2026-09-08 SUR DEMANDE DE L'AUTEUR. Motif : le contrôle annonçait
# « zéro décision en attente » alors que douze arbitrages et falsifieurs sont
# ouverts. Cette indication était exacte et trompeuse : elle ne porte que sur
# les empreintes éditoriales, et ne voit pas les décisions écrites en prose.
#
# CE FICHIER EST UNE PROJECTION, comme livres.yaml l'est du plan directeur.
# LES TEXTES FONT FOI : protocoles/passe-2.md pour les arbitrages,
# protocoles/falsification.md pour les falsifieurs. EN CAS D'ÉCART, LE TEXTE
# TRANCHE ET CE REGISTRE EST CORRIGÉ, JAMAIS L'INVERSE.
#
# statut : ouvert | oriente | arbitre | conditionnel
#   ouvert       — posé, aucune réponse retenue
#   oriente      — une direction est arrêtée, des termes restent à trancher
#   arbitre      — tranché par l'auteur ; la date et la teneur sont dans le texte
#   conditionnel — ne se déclenche que sous une condition qui n'est pas établie
#
# tranche_par : auteur | corpus | non-tranche
#   RÈGLE : le corpus PROPOSE, l'auteur TRANCHE. Une reformulation écrite par
#   le corpus reste `non-tranche` tant que l'auteur ne l'a pas reprise.

revision: 1
etabli_le: 2026-09-08

