    objet: "L'indiscernabilité"
    statut: ouvert
    tranche_par: non-tranche
    decision: "Posé, non instruit."
    texte: protocoles/falsification.md
    maj: 2026-09-08

  - id: F13
    objet: "L'incommensurabilité — la soutenabilité faible"
    statut: oriente
    tranche_par: auteur
    lie_a: [CRITERE-L25, VETO-AGREGATION, TEST-APPORT-PROPRE]
    decision: >
      ARBITRÉ DANS SA RÉPONSE LE 2026-09-09 : renoncer au SCORE MONDIAL UNIQUE,
      employer PLUSIEURS SEUILS NON COMPENSABLES, assumer que la pondération est
      POLITIQUE et contestable. CHAÎNE ARRÊTÉE : seuils physiques en VETO, puis
      priorité sociale et territoriale décidée politiquement, puis MONTANT fixé
      par les coûts réels, les capacités disponibles et la contrainte
      macroéconomique. F13 RESTE OUVERT : le pas de la décision au montant est
      désormais nommé, il n'est pas franchi.
    texte: protocoles/falsification.md
    chapitres: [L1.C31, L24.C01, L24.C02, L24.C06, L18.C18, L18.C19, L18.C25, L18.C28, L18.C29, L18.C31]
    maj: 2026-09-09
    acquisition_bloquante: >
      Estimation de l'élasticité de substitution portant sur LES RESSOURCES en
      général, spécification comparable à Solow, postérieure à 2006. VALEUR DE
      MESURE, AUCUNE VALEUR DE TRANCHE : la non-falsifiabilité est une
      impossibilité de principe, aucune acquisition ne la lèvera.

  - id: F14
    objet: "L'additivité structurelle"
    statut: ouvert
    tranche_par: non-tranche
    decision: "Une EXTENSION de son objet est proposée par L17.C04. NON ARBITRÉE."
    texte: protocoles/falsification.md
    chapitres: [L17.C04]
    maj: 2026-09-08

pieces_de_conception_manquantes:
  - id: CALIBRATION-SUR-CAS-REELS
    objet: "Éprouver A47 sur trois dossiers réels, par deux équipes indépendantes"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [A47, QUALIFICATION-DU-RISQUE]
    decision: >
      OUVERT LE 2026-09-09 PAR L'AUTEUR. LE CORPUS A MONTRÉ QUE A47 NE
      LAISSE AUCUN VIDE LOGIQUE ; IL RESTE À ÉTABLIR QU'ELLE EST APPLICABLE
      PAR DES TIERS. Trois dossiers réels : eau potable — cas favorable —,
      lithium et batteries — portefeuille d'usages concurrents —, stockage
      géologique du CO2 — horizons longs. DEUX ÉQUIPES INDÉPENDANTES, même
      grille. L'instrument discrimine ; LES DONNÉES NE SONT PAS ACQUISES,
      ET LE CORPUS N'EN INVENTERA PAS.
    texte: protocoles/calibration-a47.md
    maj: 2026-09-09
    acquisition_bloquante: >
      Les données des trois dossiers : seuils sanitaires de l'eau potable,
      disponibilité et usages concurrents du lithium, horizons et taux de fuite
      du stockage géologique du CO2. SOURCES OUVERTES EXIGÉES — un résumé ne
      vaut pas ouverture. ET DEUX ÉQUIPES CONSTITUÉES.

  - id: USAGE-DES-INCERTITUDES
    objet: "Ce que l'incertitude emporte — la procédure, non le régime"
    statut: arbitre
    tranche_par: corpus
    lie_a: [A47, QUALIFICATION-DU-RISQUE]
    decision: >
      CONSÉQUENCE DE A47, NON UN ARBITRAGE DISTINCT DE L'AUTEUR — tranchée
      par le corpus le 2026-09-09. A47 prévoit VOLONTAIREMENT que
      l'incertitude n'emporte aucun effet automatique sur le RÉGIME : elle
      modifie LA PROCÉDURE D'INSTRUCTION. Réductible à temps : acquisition.
      Non réductible pour la décision présente et grave : marge de
      précaution. Urgent essentiel : intervention minimale. Robuste :
      grille directe. MESURÉ : un régime, trois procédures.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: QUALIFICATION-DU-RISQUE
    objet: "Les horizons sectoriels, les seuils numériques et leur calibration"
    statut: oriente
    tranche_par: auteur
    lie_a: [A47, A46, MESURE-EXTERIEURE, USAGE-DES-INCERTITUDES, CALIBRATION-SUR-CAS-REELS]
    decision: >
      OUVERT LE 2026-09-09. LA SEULE PIÈCE OUVERTE DE A47 : horizons
      sectoriels, seuil de confiance, DÉLAI UTILE et seuils numériques, à
      fixer PAR DOMAINE selon la procédure d'A47, sans rouvrir son
      principe. ET LE DÉFAUT DE GRILLE N'OUVRE AUCUN DROIT — précision de
      l'auteur : une qualification INCOMPLÈTE n'est pas un risque
      intermédiaire. Ni émission complète ni action irréversible ; études,
      mesures et préparatoires réversibles admises ; délai public et
      contrôle du retard.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: ZONE-INTERMEDIAIRE
    objet: "La charge dans la zone intermédiaire — réglée par A47"
    statut: arbitre
    tranche_par: corpus
    lie_a: [A47]
    decision: >
      CONSÉQUENCE DE A47, NON UN ARBITRAGE DISTINCT DE L'AUTEUR — tranchée
      par le corpus le 2026-09-09. A47 dispose « zone intermédiaire :
      charge partagée, autorisation limitée par tranches, surveillance et
      capacité d'arrêt ». « Grave mais réversible » et « irréversible mais
      peu plausible » y appartiennent. Le modèle les rendait sans charge :
      erreur de traduction, corrigée. Le contrôle R1 vérifie qu'aucun
      dossier évalué ne reste sans régime.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: VETO-SCIENTIFIQUE-PLURALISTE
    objet: "Le constat des contraintes physiques : contraignant sans être souverain"
    statut: oriente
    tranche_par: non-tranche
    lie_a: [A46, VETO-AGREGATION, MESURE-EXTERIEURE, REGLE-D-EMISSION, A47]
    decision: >
      FORMULE PROPOSÉE LE 2026-09-09, NON ADOPTÉE PAR L'AUTEUR : la réalité
      physique demeure contraignante, son constat institutionnel reste
      motivé, documenté, pluraliste, révisable et attaquable. MESURE
      CORRIGÉE, le recours ayant d'abord eu la valeur VRAIE par
      construction : unique, 1 capture ; médiane, 3 ; prudente, 5 mais 3
      refus à tort sur 5 ; MÉDIANE AVEC RECOURS, 2 SEULEMENT — un organisme
      puis l'instrument saisi. Pluraliser le recours porte à 3. AUCUNE
      RÈGLE N'EST GRATUITEMENT SUPÉRIEURE.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: DEPARTAGE-ESSENTIELS
    objet: "Comment trancher entre deux besoins essentiels"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [REGLE-D-EMISSION]
    decision: >
      OUVERT LE 2026-09-09 PAR LE CAS 3. Quatre départages plausibles, DEUX
      gagnants : choisir le départage EST la décision, et elle est
      politique. VERSION 2 : le mécanisme ne rend plus un silence mais UNE
      SAISINE — instance nommée, motif publié, recours devant un organe
      DISTINCT de celui qui tranche, réexamen daté du perdant. LA PROCÉDURE
      NE DIT PAS QUI GAGNE et ne le doit pas. RESTENT : la majorité requise
      et le délai de recours.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: VETO-AGREGATION
    objet: "Le veto physique peut-il comparer une limite à une autre"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [REGLE-D-EMISSION, F13, VETO-SCIENTIFIQUE-PLURALISTE]
    decision: >
      OUVERT LE 2026-09-09 PAR LE CAS 2, ET RETOURNÉ PAR LA VERSION 2 DU
      MODÈLE. Le veto projet par projet n'est pas seulement trop strict :
      IL EST TROP PERMISSIF. Trois usages admis isolément demandent 105 de
      lithium pour 100 disponible — aucun ne franchit seul ce que les trois
      franchissent ensemble. L'ARBITRAGE DE PORTEFEUILLE borne à six lots
      faisables, le meilleur soulageant 260. RESTE ENTIER : les classer
      exigerait de pondérer carbone contre biodiversité.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: CORRECTION-D-ERREUR
    objet: "Ce qu'on fait d'une émission versée sur une qualification fausse"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [REGLE-D-EMISSION, A45]
    decision: >
      OUVERT LE 2026-09-09 PAR LE CAS 4, REDRESSÉ LE JOUR MÊME PAR
      L'AUTEUR. NON REMBOURSABLE NE VEUT PAS DIRE IRRÉVOCABLE : A45 protège
      le bénéficiaire CONFORME contre l'endettement, il ne crée aucune
      irrévocabilité au profit d'un bénéficiaire INDU. CINQ NOTIONS À
      SÉPARER : absence de remboursement normal ; récupération des sommes
      INUTILISÉES ; gel des tranches FUTURES ; restitution pour ERREUR
      MANIFESTE ; recouvrement en cas de FRAUDE, jusqu'à la responsabilité
      personnelle des dirigeants.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: REVISION-SCIENTIFIQUE
    objet: "Le sort des programmes engagés quand une limite est révisée"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [REGLE-D-EMISSION, A44]
    decision: >
      OUVERT LE 2026-09-09 PAR LE CAS 5. Un programme RÉGULIÈREMENT ADMIS,
      puis la limite est révisée. VERSION 2, RÉEXAMEN PÉRIODIQUE DES
      AUTORISATIONS : à −40 % le dépassement tombe de 120 à ZÉRO, à −60 %
      de 200 à 80. L'AUTORISATION DEVIENT RÉVOCABLE. CE QUI RÉSISTE : la
      pression déjà émise — le réexamen borne le dommage futur, il ne
      répare pas le passé. SON PAS EST UN ARBITRAGE : trop court, il
      finance mal un ouvrage long. A44 vaut À LA DATE DE LA DÉCISION.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: PLAFOND-D-URGENCE
    objet: "Ce qui contourne la procédure quand l'urgence ne peut pas attendre"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [REGLE-D-EMISSION]
    decision: >
      OUVERT LE 2026-09-09 PAR LE CAS 6. VERSION 2 : réserve PRÉDÉFINIE,
      EXPIRATION AUTOMATIQUE, contrôle rapide a posteriori. Sur 540 révélés
      inadmissibles, 65 % sont sauvés — gel des tranches non versées,
      restitution des sommes non employées. TROIS PROPRIÉTÉS NON
      FACULTATIVES : prédéfinie, sinon elle se redéfinit à chaque urgence ;
      expirante, sinon elle devient un guichet permanent sans veto ;
      contrôlée VITE. LE PLAFOND RESTE UN NOMBRE POLITIQUE.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: MESURE-EXTERIEURE
    objet: "Ce qui pourrait détecter la capture de l'autorité de qualification"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [REGLE-D-EMISSION, F3, A44, MODELE-ADVERSAIRE, A46, VETO-SCIENTIFIQUE-PLURALISTE, QUALIFICATION-DU-RISQUE]
    decision: >
      OUVERT LE 2026-09-09 PAR LE CAS 7, PRÉCISÉ LE MÊME JOUR. Un contrôle
      qui ne porte que sur des DÉCLARATIONS ne détecte pas leur
      falsification : la mesure doit être extérieure. TROIS NIVEAUX :
      contrôle interne immédiat avec SUSPENSION CONSERVATOIRE ; contrôle
      INDÉPENDANT de conformité ; audit externe et RECOURS. Formes :
      satellite, mesures indépendantes, traçabilité, audits aléatoires,
      pluralité des experts, publication, alerte, recours. La capture se
      DÉTECTE et se RÉDUIT, jamais ne s'élimine.
    texte: protocoles/passe-2.md
    maj: 2026-09-09

  - id: RECALIBRAGE
    objet: "La règle de recalibrage du dispositif"
    statut: oriente
    tranche_par: non-tranche
    decision: >
      Il en faut TROIS et non une, selon le type de boucle. Le TYPE B est une
      ÉCHÉANCE ANNUELLE documentée, non un risque : le cadre publie chaque année
      ce qui a changé, et il a déjà RESSERRÉ une limite. Le TYPE C ne se calibre
      pas à l'avance et appelle une règle de MESURE APRÈS COUP. Le CINQUIÈME
      POINT — le sort des allocations prises sous l'ancien calibrage — se pose
      dès le premier exercice. PRIORITÉ : à régler avant toute mise en œuvre.
    texte: protocoles/passe-2.md
    chapitres: [L11.C30, L13.C01, L18.C19, L24.C06, L24.C07]
    maj: 2026-09-09
    acquisition_bloquante: >
      La révision des tarifs d'achat de l'électricité renouvelable en Europe et
      le sort des engagements pris sous l'ancien tarif. ET la version PUBLIÉE de
      2018 du modèle dont est tirée l'occurrence n° 4.

  - id: CRITERE-L25
    objet: "Qui sélectionne, selon quel critère, par quelle autorité"
    statut: oriente
    tranche_par: auteur
    lie_a: [F13]
    decision: >
      ARBITRÉ LE 2026-09-09 DANS SON PRINCIPE : la pondération est déclarée
      POLITIQUE, participative et contestable, et plusieurs seuils non
      compensables remplacent le score unique. RESTENT OUVERTS : l'autorité
      concrète — des candidats existent, du consentement préalable aux droits
      territoriaux — et l'arbitrage binaire ignorer ou borner le coût
      d'opportunité. FACE POLITIQUE du problème dont F13 est la face
      MÉTROLOGIQUE.
    texte: protocoles/passe-2.md
    chapitres: [L25.C07, L18.C21, L18.C24, L18.C25, L18.C30, L18.C31, L24.C06]
    maj: 2026-09-09
    acquisition_bloquante: >
      Le tableau 6.10 de l'évaluation IPBES, qui donne les actions matérialisant
      chaque ligne directrice. Sur le disque, non extractible par la couche de
      texte.

  - id: PARTAGE-SOURCE-PUITS
    objet: "De quel côté de l'économie la qualification régénérative mord-elle"
    statut: arbitre
    tranche_par: auteur
    decision: >
      ARBITRÉ : les DEUX côtés, en COMPTES SÉPARÉS. Les PUITS portent des
      plafonds physiques NON COMPENSABLES. Les SOURCES portent les dommages
      d'extraction, la dépendance matérielle et la justice distributive, SANS
      invoquer une rareté générale — que L18.C20 établit non fondée. L'ABSENCE DE
      COMPENSATION ÉVITE UNE PARTIE DE F13 ; ELLE NE LE RÉSOUT PAS : il reste à
      passer de plusieurs contraintes à une décision d'éligibilité, puis à un
      montant.
    texte: protocoles/passe-2.md
    chapitres: [L18.C18, L18.C20, L18.C21]
    maj: 2026-09-09

  - id: DESCENTE-D-ECHELLE
    objet: "La qualification régénérative est-elle une descente d'échelle des limites planétaires"
    statut: ouvert
    tranche_par: non-tranche
    decision: >
      Le cadre déclare n'avoir PAS ÉTÉ CONÇU pour être désagrégé. Or un barème
      qui qualifie un acte est la descente la plus raide : ni au pays ni à la
      région, mais À LA TRANSACTION. Cette descente existe dans la littérature,
      elle est massive, et l'allocation du droit d'usage y est déclarée non
      résolue.
    texte: protocoles/passe-2.md
    chapitres: [L24.C06, L24.C07, L18.C19]
    maj: 2026-09-09
    acquisition_bloquante: >
      Les méthodes couplant limites planétaires et analyse de cycle de vie, et
      la consommation matérielle pondérée par l'impact environnemental. TROIS
      chapitres réclament la même littérature.

  - id: REGLE-D-EMISSION
    objet: "Qui émet, combien, pour quoi, et avec quel pouvoir d'arrêt"
    statut: oriente
    tranche_par: non-tranche
    lie_a: [A44, DEPARTAGE-ESSENTIELS, VETO-AGREGATION, CORRECTION-D-ERREUR, REVISION-SCIENTIFIQUE, PLAFOND-D-URGENCE, MESURE-EXTERIEURE, A46, VETO-SCIENTIFIQUE-PLURALISTE, A47]
    decision: >
      OUVERT ET INSTRUIT LE 2026-09-09 ; VERSION 2 LE MÊME JOUR, après
      quatre corrections de l'auteur. CINQ POUVOIRS SÉPARÉS (A46), NEUF
      ÉTATS, deux contrôles : S1 voit le cumul des pouvoirs, S2 voit un
      passage exercé par le mauvais. SEPT MÉCANISMES rejouent les sept cas.
      RÉSULTATS : détection précoce 89 % récupérés contre 54 % tardive ;
      réexamen ramenant un dépassement de 120 à 0 ; VETO ISOLÉ TROP
      PERMISSIF. RESTENT : collusion, plafond d'urgence, critère de
      départage.
    texte: protocoles/passe-2.md
    chapitres: [L1.C17, L1.C31]
    maj: 2026-09-09

  - id: COMPENSATION-SYMETRIQUE
    objet: "Traitement des déséquilibres courants persistants"
    statut: oriente
    tranche_par: auteur
    lie_a: [A43, CONTROLE-DES-CAPITAUX, A45, PROCEDURE-STRUCTURELLE, DEPENDANCE-ESSENTIELLE]
    decision: >
      RÉFÉRENCE DU 2026-09-09, RÉVISÉE PAR L'AUTEUR LE 2026-09-17 :
      comptes des banques centrales à l'institution, corridor des deux côtés,
      facilité, parités administrées. OBLIGATIONS DES EXCÉDENTAIRES
      AUTOMATIQUES, sans vote : réévaluation (D69) ; au-delà du plafond,
      recyclage EN PRÊT, puis reliquat sans destinataire ANNULÉ (D77). AUCUNE
      CHARGE GRADUÉE SUR LES POSITIONS ; démurrage hors compensation (D76,
      D78). Le plafond est une PROCÉDURE. Perte durable d'un débouché :
      PROCEDURE-STRUCTURELLE.
    texte: protocoles/passe-2.md
    chapitres: [L1.C25, L1.C26]
    maj: 2026-09-17

  - id: PROCEDURE-STRUCTURELLE
    objet: "Perte durable d'un débouché — condition (5) d'A43 (3b)"
    statut: arbitre
    tranche_par: auteur
    lie_a: [A43, COMPENSATION-SYMETRIQUE, A45, DEPENDANCE-ESSENTIELLE]
    decision: >
      ARBITRÉE PAR L'AUTEUR LE 2026-09-17. Ouverte sur déficit persistant ET
      perte mesurée d'au moins 30 % des exportations. Reconversion financée
      par l'émission, non remboursable, quatre périodes ; réussite NON
      supposée. Clôture à l'échéance : la dette de recyclage qui correspond à
      la perte reconnue pendant l'ouverture est annulée, le reste est dû. PRIX
      PUBLIÉ : si la reconversion échoue, la dette du déficitaire dépasse son
      quota, et la suite n'est pas écrite.
    texte: protocoles/passe-2.md
    chapitres: [L1.C26]
    maj: 2026-09-17

  - id: DEPENDANCE-ESSENTIELLE
    objet: "Dépendance durable à une importation essentielle — procédure côté importateur"
    statut: oriente
    tranche_par: auteur
    lie_a: [A45, COMPENSATION-SYMETRIQUE, PROCEDURE-STRUCTURELLE]
    decision: >
      PRINCIPE RETENU PAR L'AUTEUR LE 2026-09-17 (D79) : une procédure
      structurelle côté importateur réduit la dépendance durable à une
      importation essentielle, comme PROCEDURE-STRUCTURELLE traite la perte
      durable d'un débouché ; réussite NON supposée. MOTIF MESURÉ : hors une
      spirale de réévaluations, seule une baisse de la dépendance arrête
      l'émission de l'allocation. À INSTRUIRE : ouverture, seuils,
      financement, revue.
    texte: protocoles/passe-2.md
    chapitres: [L1.C26]
    maj: 2026-09-17

  - id: CONTROLE-DES-CAPITAUX
    objet: "Conception opérationnelle du compte de capital réglementé"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [A32, COMPENSATION-SYMETRIQUE, REGIME-NEGATIF]
    decision: >
      OUVERT LE 2026-09-09 (A32). PRINCIPE VALIDÉ DE NOUVEAU PAR L'AUTEUR LE
      2026-09-11 : abandon de la libre circulation des capitaux, compte de
      capital réglementé ; aucune modalité tranchée. À concevoir : ligne entre
      paiements courants et compte de capital ; investissements directs
      (transparence, durée, traçabilité) ; anti-contournement ; autorité ;
      recours ; mesures de crise symétriques. Mouvements internationaux,
      fuites, stabilité ; distinct de REGIME-NEGATIF, lié sans fusion.
    texte: protocoles/passe-2.md
    chapitres: [L1.C21, L1.C26]
    maj: 2026-09-11

  - id: OPERATIONNALISATION-INSOLVABLE
    objet: "Comment éprouver le concept d'essentiel insolvable"
    statut: oriente
    tranche_par: auteur
    lie_a: [F10, PORTEFEUILLE-COMPARAISON, CRITERE-ESSENTIALITE, OPERATIONNALISATION-BULLSHITNOVATION]
    decision: >
      COMMANDE DE CONCEPTION OUVERTE : L'INSCRIPTION NE VAUT PAS VALIDATION.
      Cinq critères arrêtés le 2026-09-09 : non-circularité, démarcation,
      non-redondance élargie, transférabilité, quatre conditions de vacuité. Un
      financement par l'impôt, le don ou le bénévolat NE RÉFUTE PAS le concept.
      L'ÉPREUVE EMPIRIQUE EST CONSERVÉE, son ordre fixé : définir, constituer
      des cas, faire classer par des tiers, documenter les désaccords, PUIS
      mesurer. La mesure décide de F10.
    texte: protocoles/validation-essentiel-insolvable.md
    chapitres: [L1.C06, L1.C15, L1.C31]
    maj: 2026-09-09

  - id: PORTEFEUILLE-COMPARAISON
    objet: "Construction des portefeuilles concurrents de NEMO IMS"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [TEST-APPORT-PROPRE, F10, OPERATIONNALISATION-INSOLVABLE]
    decision: >
      PRINCIPE DE COMPARAISON ARRÊTÉ, CONSTRUCTION OUVERTE. Produire séparément
      le meilleur portefeuille institutionnellement réalisable et le meilleur
      portefeuille techniquement possible. Le premier peut décider du test ;
      le second est exploratoire. Aucun portefeuille n'est encore construit.
    texte: protocoles/architecture-L1-C31.md
    chapitres: [L1.C31]
    maj: 2026-09-12
    acquisition_bloquante: >
      Données comparables sur capacités mobilisées, délais, coût social total,
      risques macroéconomiques et financiers et gouvernance pour chaque famille
      d'instruments, sur un même résultat écologique et social.

  - id: MODELE-ADVERSAIRE
    objet: "Qui gagne quoi à falsifier une qualification régénérative"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [MESURE-EXTERIEURE, OPERATIONNALISATION-BULLSHITNOVATION]
    decision: >
      TROIS familles de défaillance et non une. La FRAUDE — quatre architectures
      documentées, aucune n'attaquant la grandeur écologique. Le PASSAGER
      CLANDESTIN — des acteurs honnêtes qui attendent que l'autre paie. Et
      l'EFFET INSTITUTIONNEL CONTRAIRE — un instrument d'allocation a
      recentralisé la gouvernance qu'il devait ouvrir. Le corpus n'a instruit
      que la première.
    texte: protocoles/passe-2.md
    chapitres: [L15.C01, L15.C02, L15.C03, L15.C04, L18.C21, L18.C29, L18.C30]
    maj: 2026-09-09
    acquisition_bloquante: >
      Une architecture documentée de CAPTURE DU RÉGULATEUR, distincte du conflit
      d'intérêts du certificateur, qui lui est tenu.

  - id: REGIME-NEGATIF
    objet: "Limitation des financements dégénératifs par les circuits autres que NEMO IMS"
    statut: oriente
    tranche_par: auteur
    lie_a: [A44, CONTROLE-DES-CAPITAUX]
    decision: >
      PRINCIPE VALIDÉ PAR L'AUTEUR LE 11 SEPTEMBRE 2026 : le canal positif
      ne suffit pas si les autres circuits financent sans limite
      l'incompatible ; NEMO IMS y joint un régime limitant les
      financements dégénératifs, quel que soit leur circuit. Le choix et la
      combinaison des instruments (prix, plafonnement quantitatif, exclusion)
      restent non tranchés ; grille : flux nouveaux avant le stock, cohérence
      entre acteurs, décision démocratique. Distinct de CONTROLE-DES-CAPITAUX,
      lié sans fusion.
    texte: protocoles/architecture-L1-C08.md
    chapitres: [L1.C08, L1.C12, L1.C21, L2.C06, L2.C13, L2.C20, L11.C03]
    maj: 2026-09-11
    acquisition_bloquante: >
      Une évaluation de l'efficacité des encadrements du crédit (Banque de
      France, Monnet 2018 ; Banque populaire de Chine), que Deyris cite sans
      mesurer ; et une mesure des flux de financement dégénératifs hors carbone.
  - id: ARGUMENT-CONTRE-UN-CHOIX
    objet: "L'argument qui manque contre un choix de normalisation délibéré"
    statut: ouvert
    tranche_par: non-tranche
    decision: >
      OUVERT LE 2026-09-14. En octobre 2008, l'organisme de normalisation
      comptable a écarté la soutenabilité de long terme après consultation, une
      large majorité de répondants convenant que les états financiers ne peuvent
      pas porter cette information. Sur ce point, l'invisibilité résulte d'un
      CHOIX et non d'une incapacité. Une objection contre une incapacité se
      traite par une méthode ; une objection contre un choix se traite par un
      ARGUMENT, et le corpus n'en a produit aucun.
    texte: protocoles/arbitrage-auteur-L1-C09-2026-09-14.md
    chapitres: [L1.C09, L18.C01, L18.C03]
    maj: 2026-09-14
    acquisition_bloquante: >
      Aucune acquisition documentaire. Les cinq documents de cet organisme ne
      doivent pas être ouverts. Le fait est rapporté par L18.C01 et L18.C03,
      tous deux brouillon : il ne vaut pas comme acquis tant qu'ils ne sont pas
      vérifiés.

  - id: OPERATIONNALISATION-BULLSHITNOVATION
    objet: "Le gabarit de la bullshitnovation n'est ni calibré ni éprouvé"
    statut: ouvert
    tranche_par: non-tranche
    lie_a: [OPERATIONNALISATION-INSOLVABLE, MODELE-ADVERSAIRE]
    decision: >
      OUVERT LE 2026-09-15 PAR L'AUTEUR (L1.C16 à verifie). Le gabarit ne rend
      aucun verdict tant que six paramètres ne sont pas fixés — unité, problème de
      référence, résultat attendu, seuil d'effet, horizon, contrefactuel — ni tant
      que des évaluateurs indépendants n'ont pas classé des cas de façon
      concordante. DEUX TÂCHES : CONCEPTION, fixer les paramètres ; ENQUÊTE,
      constituer des cas et appliquer la grille indépendamment avant toute
      estimation d'ampleur. La catégorie est définie, non appliquée.
    texte: protocoles/verifications-soldees-L1-C16.md
    chapitres: [L1.C16, L1.C31]
    maj: 2026-09-15
    acquisition_bloquante: >
      Aucune acquisition documentaire : un protocole de classement et des cas
      constitués, à produire. Le coût d'un gabarit à six paramètres par dossier, à
      l'échelle d'un système d'allocation du crédit, n'est pas établi (L1.C16 §
      8).
