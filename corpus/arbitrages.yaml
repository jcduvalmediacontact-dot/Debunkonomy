  - id: F10
    objet: "La superfluité"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      L18.C15 établit qu'une cible internationale visant le même diagnostic a
      échoué ; le motif de l'échec décide de ce que F10 devient, et il n'est pas
      instruit.
      F10 EST AGGRAVÉ LE 2026-09-08 PAR L18.C19, ET SUR UN TERRAIN NOUVEAU : un
      BARÈME de soutenabilité forte existe déjà — l'indice de soutenabilité
      environnementale forte — enraciné dans le paradigme, doté d'une règle
      d'agrégation choisie pour limiter la compensation, appliqué à vingt-huit
      pays, et jugé par le traité de référence supérieur à l'empreinte
      écologique, aux flux de matières, à l'indice de Yale et aux objectifs de
      développement durable. LE CORPUS CONSTRUISAIT SA QUALIFICATION SANS SAVOIR
      QUE LE PROBLÈME AVAIT ÉTÉ TRAITÉ. Ce qui reste à établir n'est plus que la
      mesure est possible, mais CE QU'UN INSTRUMENT MONÉTAIRE AJOUTE À UN INDICE
      QUI EXISTE.
      TROISIÈME DÉPLACEMENT LE 2026-09-08 PAR L24.C07, ET C'EST LE PLUS SÉRIEUX.
      La descente jusqu'au PRODUIT et à l'ENTREPRISE est faite, outillée et
      adoptée : une famille de méthodes fondées sur l'analyse de cycle de vie
      « translate Planetary Boundaries to the scale of specific products,
      services, and systems » et permet d'évaluer « whether their impacts fall
      within their allocated share of each boundary ». C'EST UNE QUALIFICATION
      RÉGÉNÉRATIVE À LA MONNAIE PRÈS. S'y ajoutent des variables essentielles
      d'impact environnemental, un score d'impact sur le système terrestre tenant
      compte des interactions entre limites, un réseau de cibles fondées sur la
      science étendu au-delà du climat, et une architecture de déclaration
      financière liée à la nature.
      CE QUE LE DISPOSITIF DOIT DÉSORMAIS JUSTIFIER N'EST PLUS LA MESURE : C'EST
      L'AJOUT MONÉTAIRE. Aucun des dispositifs recensés n'ÉMET — ils mesurent,
      déclarent et se fixent des cibles. La différence entre qualifier un acte et
      créer de la monnaie contre lui est le seul terrain que le corpus tienne
      encore en propre, ET SON ARGUMENT N'EST ÉCRIT NULLE PART.
      DEUX FAITS BORNENT CE DÉPLACEMENT. Les cibles d'entreprise sont courantes
      pour le carbone et rares pour les autres limites ; et la source rapportant
      cette adoption est un article invité signé de deux chercheurs dont l'un
      dirige scientifiquement la commission qui porte le cadre.
      F10 EST RESSERRÉ LE 2026-09-09 PAR L18.C25, ET DANS UN SENS FAVORABLE AU
      DISPOSITIF. Sur la littérature de valorisation, 61 % des valorisations
      fournissent purement de l'information, 32 % aident à choisir entre des
      actions, et 7 % SEULEMENT servent à concevoir un instrument ou une
      intervention ; 72 % ont lieu à une échelle inférieure à la nation.
      LES DEUX CONSTATS SE COMPLÈTENT : l'outillage existe pour MESURER, et il
      n'existe presque pas pour ALLOUER. Ce que le dispositif doit justifier est
      donc l'ajout monétaire, et il opère sur un terrain que la littérature a
      peu couvert — ce qui est un argument POUR sa nécessité et non contre.
      MAIS UNE OBLIGATION D'EXAMEN NOUVELLE ET PLUS LOURDE EST OUVERTE LE
      2026-09-09 PAR L18.C27, ET ELLE VA DANS L'AUTRE SENS. L'évaluation
      intergouvernementale de 2022 énonce avec la cote « well established » que
      les instruments SOCIOCULTURELS et de DROITS COUTUMIERS « show higher
      potential to operationalize diverse values than economic and legal
      instruments », et qu'ils sont peu employés. LA FAMILLE D'INSTRUMENTS À
      LAQUELLE LE DISPOSITIF APPARTIENT EST DONC CLASSÉE EN DESSOUS D'UNE AUTRE,
      POUR L'OBJET MÊME QU'IL VISE. La recommandation de la source est un DOSAGE
      de politiques, non une substitution.
      ET AUCUN DES QUATRE INSTRUMENTS MIS EN AVANT N'APPARTIENT À SA FAMILLE :
      parmi treize instruments économiques et financiers évalués, ce qui est
      retenu est un changement de MODÈLE économique et un changement de MESURE,
      non un mécanisme d'allocation monétaire.
      CE QUE LE CORPUS DOIT FAIRE, ET IL NE L'A JAMAIS FAIT : examiner les
      instruments de DROITS COUTUMIERS et les RÉGIMES DE COGESTION, dire ce
      qu'ils font, ce qu'ils ne font pas, et pourquoi ils ne suffisent pas à
      l'objet du dispositif. TANT QUE CE N'EST PAS ÉCRIT, LE CORPUS NE PEUT PAS
      SOUTENIR QUE SON INSTRUMENT EST NÉCESSAIRE.
      DEUX BORNES, ET ELLES NE RENVERSENT PAS LE RÉSULTAT : le classement porte
      sur l'aptitude à OPÉRATIONNALISER DES VALEURS DIVERSES et non sur
      l'efficacité écologique ; et les pourcentages mesurent la fréquence dans
      une littérature de soixante et une études, non l'usage dans le monde.
      RÉSERVE PRINCIPALE : aucun des trente-sept instruments n'est nommé dans ce
      qui est lu, hors les quatre mis en avant. LE CORPUS IGNORE SI UN
      INSTRUMENT DE LA FAMILLE DU DISPOSITIF FIGURAIT PARMI LES TREIZE. C'est la
      question la plus décisive et elle n'est pas répondue.
      LA RÉSERVE EST FERMÉE LE 2026-09-09 PAR L18.C29 : les instruments
      d'allocation ÉTAIENT parmi les treize — paiements pour services
      écosystémiques, transferts fiscaux écologiques, subventions, comptabilité
      du capital naturel, REDD+, taxes sur la consommation, permis échangeables
      et compensations. AUCUN N'EST RETENU. Le verdict sur le groupe orienté
      marché : ces instruments « do not offer stimulus for institutional change
      or adaptive governance » et sont « insufficient to shift the current
      economic paradigm ».
      DÉFENSE DISPONIBLE ET ÉTROITE : tous ces instruments ALLOUENT des
      ressources existantes ; le dispositif prétend CRÉER de la monnaie contre un
      acte qualifié. Ce n'est pas la même opération — ce qui le sort du verdict
      direct ET LE PRIVE DE TOUT PRÉCÉDENT.
      ARGUMENT DIRECT CONTRE LUI : les transferts fiscaux écologiques sont jugés
      moins coûteux en transaction que les paiements pour services écosystémiques
      « as the existing fiscal system can be used [...] i.e., NO NEW ALLOCATION
      SYSTEM IS GENERATED ». Le dispositif EST un système d'allocation nouveau :
      il doit établir que ce qu'il apporte excède ce que son existence coûte, et
      le corpus n'a jamais chiffré ce coût.
      CHIFFRE POUR LE DIMENSIONNEMENT : les subventions dommageables dépassent
      d'un FACTEUR DIX les subventions favorables à la biodiversité.
      L'OBLIGATION D'EXAMEN EST DÉCHARGÉE LE 2026-09-09 PAR L18.C30, ET LE
      RÉSULTAT EST UN ÉQUILIBRE. Les deux familles mieux classées portent sur
      l'AUTORITÉ et la LÉGITIMITÉ — droits territoriaux, savoirs, codes de
      conduite, consentement préalable — NON SUR L'ALLOCATION. Et la mieux placée
      des instruments socioculturels, la COGESTION, est déclarée difficile à
      monter en échelle, les contextes culturels et écologiques particuliers y
      étant déterminants. LE DISPOSITIF GARDE DONC UN OBJET PROPRE.
      MAIS IL HÉRITE DE DEUX CHOSES. UNE : le verdict commun — toutes familles
      confondues, le potentiel est « more incremental than transformative ».
      DEUX : un avertissement qui le vise en propre — combiner les instruments
      coutumiers avec d'autres types « might have adverse effects especially if
      integration happens in a TOP-DOWN fashion », et un dispositif monétaire
      défini globalement appliqué à des actes qualifiés localement EST une
      intégration par le haut.
      ACQUISITION QUI RESTE, RANG 1 ET SUR LE DISQUE : la section 6.5, guide
      d'opérationnalisation. ET SI L'AUTEUR VEUT UNE COMPARAISON QUI DÉCIDE : la
      littérature de la cogestion elle-même, non l'évaluation qui la classe.
    acquisition_bloquante: >
      Le MOTIF de l'échec de la cible visant à supprimer les incitations
      dommageables. ORIENTÉ, NON LEVÉ, LE 2026-09-09 PAR L18.C26.
      L'évaluation intergouvernementale de 2022 établit deux faits dont la
      conjonction pointe dans une direction, avec la cote « well established ».
      UN : le progrès a été plus élevé pour les cibles relevant du mandat et des
      ressources d'un ministère de l'environnement que pour celles exigeant une
      coopération et un coïnvestissement INTERSECTORIELS — ces dernières portant
      précisément la réduction des subventions dommageables, le contrôle de la
      pollution et la réorientation des projets de développement. DEUX : « Compliance
      mechanisms beyond good intentions are still lacking », et les incitations
      perverses « still provide mixed messages » malgré la cible qui devait les
      abolir.
      SI L'ÉCHEC TIENT AU DÉFAUT DE CONTRAINTE ET AU PÉRIMÈTRE DU MANDAT, IL NE
      TIENT PAS À CE QUE L'IDÉE DE CORRIGER LES INCITATIONS SOIT FAUSSE. Un
      instrument monétaire opère par l'économie et non par un ministère, et porte
      sa contrainte dans son mécanisme plutôt que dans un engagement : il est
      dirigé sur le mode d'échec constaté. CE N'EST PAS UNE RÉFUTATION DE F10,
      c'est le déplacement que F10 attendait pour être instruit.
      CORRECTION DE FORME À PORTER À L'AUTEUR : les trois branches ne sont PAS
      mutuellement exclusives, et le corpus les avait posées comme si elles
      l'étaient. La lecture en soutient deux et n'écarte pas la troisième, que
      l'évaluation aborde par les asymétries de pouvoir sans la chiffrer.
      RESTE À OUVRIR, SUR LE DISQUE ET DE RANG 1 : les sections 4.6.3 et
      suivantes du même chapitre, qui portent une revue systématique de la
      REPRISE effective des valorisations dans la décision.
  - id: F11
    objet: "La contrainte physique"
    statut: conditionnel
    tranche_par: non-tranche
    note: >
      Branche matérielle écartée comme impossibilité (L26.C01). Branche
      énergétique seule en charge et chiffrable. Ne se déclenche pas sur le
      rendement du service final — c'est un coût, non une impossibilité —
      mais perd sa réfutation la plus commode. Les auteurs de L26.C12 posent
      le falsifieur dans sa forme exacte sans le trancher.
    acquisition_bloquante: "Série de rendements exergétiques agrégés postérieure à 2010."
  - id: F12
    objet: "L'indiscernabilité"
    statut: ouvert
    tranche_par: non-tranche
  - id: F13
    objet: "L'incommensurabilité — la soutenabilité faible"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      NE PAS FERMER (auteur, 2026-09-08). L'accusation de dissimulation échoue
      QUATRE fois, et la quatrième n'est pas de même nature : le traité de
      référence du débat déclare les DEUX paradigmes NON FALSIFIABLES et le
      débat indécidable même sous accord sur l'objet et la méthode (L18.C18).
      L'accusation perd son objet, ET LA MÊME DÉCLARATION FRAPPE LE CORPUS :
      la non-substituabilité qu'il suppose est aussi peu falsifiable que la
      substituabilité qu'il conteste.
      F13 SORT RENFORCÉ DE CETTE LECTURE. Le même auteur tient que la
      soutenabilité forte exige une mesure SÉPARÉE par forme critique de
      capital naturel, que ces mesures « defy aggregation », et qu'une mesure
      globale unique est trompeuse et inutile — confirmation INDÉPENDANTE de
      F13, venue de l'économie et non des sciences du système terrestre. La
      réserve « un cadre, pas un consensus » est levée pour partie. BORNE :
      l'auteur conclut d'un EXAMEN DES INDICATEURS EXISTANTS, il ne démontre
      pas une impossibilité formelle.
      Les trois autres occurrences subsistent : l'adversaire déclare
      l'hypothèse (L18.C11, L18.C14, L18.C16).
      Solow nomme la condition, la qualifie de conjecture et publie son
      alternative — en dessous de l'unité, consommation soutenable NULLE.
      Une mesure adjacente existe (L18.C17) : 0,64 à court terme, intervalle
      entièrement sous le seuil. UNE REFORMULATION EST PROPOSÉE PAR LE CORPUS
      ET N'EST PAS ARBITRÉE.
    acquisition_bloquante: >
      L'ACQUISITION QUE LA RÉSERVE DE F13 RÉCLAMAIT DEPUIS LE 2026-09-07 EST
      NOMMÉE ET FAITE LE 2026-09-08 : Biermann et Kim, 2020, revue de synthèse,
      OUVERTE ET LUE (L24.C06). LA RÉSERVE « UN CADRE, PAS UN CONSENSUS » EST
      LEVÉE DANS SA FORME — le corpus tient un état du débat — MAIS CE QU'IL
      TIENT EST L'EXISTENCE DES CRITIQUES, NON LEUR VALIDITÉ PRÉSENTE : la revue
      est de 2020, le cadre a été révisé en 2023, et le corpus possède sans
      l'avoir ouverte l'édition 2025 de la mise à jour annuelle.
      CE QUE LA CRITIQUE ÉTABLIT ET QUI TOUCHE F13 : une limite n'est PAS un
      seuil — la mise à jour de 2015 l'écrit — et plusieurs processus retenus
      sont sous-globaux, non systémiques et agrégés, sans comportement à seuil
      démontré. Les variables de la biosphère sont déclarées PROVISOIRES par le
      cadre lui-même. La valeur d'une limite incorpore donc un DEGRÉ DE PRUDENCE
      qui est une décision, non une mesure.
      ET UN RÉSULTAT CITÉ SERT À LA FOIS LA THÈSE ET LE FALSIFIEUR : le mélange
      énergétique de moindre coût atteignant deux degrés aux États-Unis franchit
      cinq limites sur huit. Réussir sur le carbone n'est pas réussir — ce qui
      soutient la multidimensionnalité du dispositif ET renforce F13, puisque la
      raison d'exiger plusieurs dimensions est qu'elles ne se compensent pas.
      TROISIÈME CONFIRMATION, LA PLUS AUTORISÉE, LE 2026-09-09 PAR L18.C25.
      L'évaluation intergouvernementale de 2022 sur les valeurs de la nature
      énonce, AVEC SA COTE DE CONFIANCE LA PLUS FORTE, qu'« aucun consensus
      n'existe sur la meilleure pratique en matière de procédures d'agrégation ».
      Elle ajoute que les approches délibératives « ne fournissent pas de
      solution générale au problème de l'agrégation », et que l'incommensurabilité
      des résultats est INÉVITABLE dès que plusieurs méthodes sont employées, les
      valeurs n'étant « ni pleinement séparables ni pleinement comparables ».
      LE CORPUS TIENT DONC TROIS CONFIRMATIONS INDÉPENDANTES, venues de trois
      disciplines et de trois régimes de production : sciences du système
      terrestre, économie de la soutenabilité, évaluation intergouvernementale.
      ET LA PRATIQUE EST CHIFFRÉE, CE QUI DONNE LEURS POIDS AUX TROIS VOIES DE
      F13 : 56 % des valorisations ne cherchent pas à réunir des valeurs
      différentes ; moins de 1 % les tiennent séparées dans un processus
      délibératif ; environ la moitié de celles qui les réunissent les rend
      directement comparables. LA PRATIQUE DOMINANTE EST DE NE PAS AGRÉGER — et
      un dispositif monétaire n'a pas ce luxe, puisqu'il faut qu'un montant
      sorte.
      LA CHARGE DE LA PREUVE EST DÉPLACÉE : un dispositif qui agrège doit
      désormais expliquer pourquoi il fait ce qu'une évaluation
      intergouvernementale déclare sans procédure consensuelle.
      UN PRINCIPE D'AGRÉGATION EST TROUVÉ LE 2026-09-09 PAR L18.C28, ET C'EST LE
      PREMIER. Quand on agrège des dimensions de substituabilité inégale, LA
      MOINS SUBSTITUABLE DOMINE, et le motif est mécanique : c'est elle dont la
      part dans l'utilité croît. « The relevant aggregate number is likely not
      going to be the average of those elasticities. The goods or services with
      low elasticities will dominate the calculation. »
      ET IL CONVERGE AVEC UNE AUTRE LITTÉRATURE : l'indice de soutenabilité
      environnementale forte agrège par MOYENNE GÉOMÉTRIQUE, choisie pour que les
      indicateurs faibles pèsent davantage (L18.C19). Deux littératures
      indépendantes arrivent au même principe.
      ISSUE PARTIELLE, ET IL FAUT DIRE EN QUOI : le principe fournit une
      PONDÉRATION NON ARBITRAIRE — pondérer par la rareté de substitution — mais
      PAS LES VALEURS, les élasticités par dimension n'étant pas mesurées. Et
      l'indice existant qui a adopté ce principe a dû le NEUTRALISER par un
      plancher pour ne pas s'effondrer. LE PRINCIPE EST DISPONIBLE ; SON
      APPLICATION BUTE EXACTEMENT LÀ OÙ F13 ATTEND.
      ET UNE MISE À JOUR ANNUELLE EXISTE, QUE LE CORPUS IGNORAIT : le PLANETARY
      HEALTH CHECK, initiative conduite par l'institut de Potsdam et l'auteur
      principal du cadre d'origine, dont l'édition INAUGURALE de 2024 confirme
      six limites franchies sur neuf. Un barème qui doit se recalibrer a besoin
      d'une source annuelle : en voici une.
      Estimation de l'élasticité de substitution portant sur LES RESSOURCES en
      général, spécification comparable à Solow, postérieure à 2006 — VALEUR DE
      MESURE, AUCUNE VALEUR DE TRANCHE (voir ci-dessus).
      NEUMAYER EST ACQUIS ET OUVERT (L18.C18), fourni par l'auteur en Open
      Access. HARTWICK 1977 et PEARCE & ATKINSON 1993 sont DÉCLARÉS
      INACCESSIBLES par l'auteur le 2026-09-08 — le premier introuvable, les
      seconds payants. Le corpus tient donc l'EXPOSÉ du camp adverse par un de
      ses analystes, NON SES TEXTES FONDATEURS : l'acquisition n'est pas levée,
      elle est contournée, et cela doit être déclaré partout.
      LE CHAPITRE 6 EST OUVERT ET LU INTÉGRALEMENT LE 2026-09-08 (L18.C19).
      IL DÉPLACE F13 : l'impossibilité d'agréger est ANALYTIQUE, elle découle de
      la DÉFINITION de la soutenabilité forte comme préservation de chaque forme
      critique, et non d'un constat sur les mesures. ELLE EST DONC CONDITIONNELLE
      À CETTE DÉFINITION, et le traité en donne deux. LE CORPUS N'A JAMAIS
      DÉCLARÉ LAQUELLE IL RETIENT : ce choix décide de la possibilité même du
      barème, et il appartient à l'auteur.
      LE CHAPITRE 3 EST OUVERT LE 2026-09-08 (L18.C20), ET IL CHANGE CE QU'UNE
      ACQUISITION PEUT PROMETTRE. La non-falsifiabilité n'est pas une lacune de
      connaissance mais une impossibilité de principe : l'optimisme des
      ressources tient en QUATRE propositions dont il suffit qu'UNE SEULE vaille
      à un moment quelconque de l'avenir, et l'objet du litige porte sur des
      techniques NON ENCORE INVENTÉES. L'auteur écrit qu'il serait « a mistake to
      believe that more research could solve the dispute ». CONSÉQUENCE POUR CE
      REGISTRE : aucune acquisition ne lèvera ce point, et le corpus doit cesser
      d'en inscrire dans cet espoir. L'estimation d'élasticité ci-dessous garde
      sa valeur de MESURE ; elle n'a aucune valeur de TRANCHE.
      ET LES DEUX NON-FALSIFIABILITÉS NE SONT PAS DE MÊME NATURE. Celle du camp
      adverse tient à une conjecture invérifiable sur l'avenir. Celle du corpus
      tient à ce que sa position est NORMATIVE — un droit des générations
      futures — et l'auteur écrit qu'« as a normative position, it is
      non-refutable ». Un énoncé normatif n'a pas à être falsifiable pour être
      légitime : il a à être ASSUMÉ comme normatif. C'EST LA TROISIÈME FOIS QUE
      CETTE ISSUE SE PRÉSENTE, ET ELLE N'EST PAS PRISE.
      RÉSERVE QUI BORNE : l'auteur écrit que les preuves de préférences
      quasi lexicographiques envers le capital naturel sont « rather shaky » et
      que la majorité des individus a des préférences compatibles avec la
      substitution. LE CORPUS NE PEUT PAS INVOQUER LES PRÉFÉRENCES OBSERVÉES.
      ACQUISITIONS NOUVELLES, INSCRITES PAR L18.C19 : Usubiaga-Liaño et Ekins
      2021a, qui porte la construction de l'indice de soutenabilité
      environnementale forte — le barème existant le plus proche ; et van der
      Voet et al. 2003 et 2005 avec Best et al. 2008, qui portent la
      consommation matérielle pondérée par l'impact environnemental, méthode
      construite puis délaissée qui outille exactement la sélectivité d'A42.
  - id: F14
    objet: "L'additivité structurelle"
    statut: ouvert
    tranche_par: non-tranche
    note: "Une EXTENSION de son objet est proposée le 2026-09-08 par L17.C04. NON ARBITRÉE."

pieces_de_conception_manquantes:
  - id: RECALIBRAGE
    objet: "La règle de recalibrage du dispositif"
    statut: oriente
    tranche_par: non-tranche
    note: >
      Structurée par L11.C30 : il en faut TROIS et non une, selon le type de
      boucle — érosion d'assiette, dérive de convention, réponse à l'instrument.
      Le TYPE C ne se calibre pas à l'avance et appelle une mesure ex post.
      VERROUILLÉ LE 2026-09-09 PAR L18.C26 : l'évaluation intergouvernementale de
      2022 porte les effets d'éviction des motivations par l'incitation économique,
      dans les deux sens — « crowding in » et « crowding out » — avec la mention
      expresse que la littérature actuelle a une CAPACITÉ PRÉDICTIVE LIMITÉE. LE
      CORPUS N'A DONC PAS À CHERCHER UNE RÈGLE DE CALIBRAGE POUR CE TYPE : il doit
      écrire une règle de MESURE APRÈS COUP, ce qui est une pièce différente.
      CLAUSE FAVORABLE À PORTER AUSSI : l'incorporation des valeurs des parties
      prenantes dans la conception peut RENFORCER plutôt que saper les
      motivations. L'éviction n'est pas une fatalité de l'incitation, c'est une
      conséquence possible d'une conception qui ignore ces valeurs.
      CINQUIÈME POINT NON TRANCHÉ, ET IL EST DE DROIT : le sort des engagements
      pris sous l'ancien calibrage. Quatre branches exclusives, dont celle que
      le FMI pratique — rien ne change sans le consentement de l'intéressé.
    acquisition_bloquante: >
      La révision des tarifs d'achat de l'électricité renouvelable en Europe et
      le sort des engagements pris sous l'ancien tarif — précédent le plus
      proche du cinquième point. ET la version PUBLIÉE de 2018 du modèle dont
      est tirée l'occurrence n° 4 : tant qu'elle n'est pas comparée, le
      décompte de six occurrences n'est pas démontré.
      CONTRAINTE AJOUTÉE LE 2026-09-08 PAR L18.C19, ET ELLE EST DE FORME : le
      seul chiffrage du coût de la soutenabilité forte que le corpus tienne
      donne une COURBE FORTEMENT CONVEXE — atteindre moins de 70 % des normes
      coûte environ 10 % du revenu national, au-delà le coût explose, et le
      total est de l'ordre de la moitié du revenu. Si le coût est ainsi, LA
      POSITION DU COULOIR DÉCIDE DE SON COÛT DE FAÇON NON LINÉAIRE, et une règle
      de recalibrage procédant par petits pas ne produit pas des effets
      proportionnels. Chiffrage daté (1990), local (Pays-Bas), borné par sa
      source comme une BORNE SUPÉRIEURE.
      LE TYPE B EST DOCUMENTÉ PAR AVANCE LE 2026-09-08 PAR L24.C06, ET PAR LA
      SOURCE ELLE-MÊME. Les variables de contrôle de la biosphère sont déclarées
      « interim control variables until more appropriate ones are developed » par
      la mise à jour de 2015 du cadre. Un barème ne peut pas être plus ferme que
      sa variable : la dérive de convention de mesure n'est donc pas un risque à
      anticiper, c'est une échéance annoncée. La règle de recalibrage du type B
      doit être écrite AVANT que la variable change, et non après.
      ET L'ÉCHÉANCE EST ANNUELLE, ÉTABLI LE 2026-09-08 PAR L24.C07. Le bilan
      annuel du cadre publie chaque année ce qui a changé, limite par limite :
      en un an, nouvelle ligne de base ET LIMITE RESSERRÉE pour l'acidification
      des océans, nouvelle base de référence et seuils actualisés pour l'eau
      douce, proposition de changer de variable de contrôle pour les flux
      biogéochimiques, indicateurs nouveaux ou recommandés ailleurs. LE TYPE B
      N'EST PAS UN RISQUE À ANTICIPER : C'EST LE RÉGIME NORMAL DE LA SOURCE.
      LE CAS LE PLUS GÊNANT EST DÉJÀ ARRIVÉ : la limite d'acidification a été
      resserrée et le franchissement constaté dans le même mouvement. Le corpus
      ne peut pas démêler la part du monde et la part de la convention. Pour un
      dispositif qui alloue contre le respect d'une limite, cette distinction
      décide si un acte qualifié l'an dernier l'est encore — donc le cinquième
      point se pose DÈS LE PREMIER EXERCICE.

  - id: DESCENTE-D-ECHELLE
    objet: "La qualification régénérative est-elle une descente d'échelle des limites planétaires"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      OUVERTE LE 2026-09-08 PAR L24.C06, ET ELLE VISE LA CONSTRUCTION MÊME DU
      DISPOSITIF. La mise à jour de 2015 du cadre écrit qu'il n'a PAS ÉTÉ CONÇU
      pour être « downscaled » ni « disaggregated to smaller levels », en raison
      de l'interdépendance des processus. Une tentative pionnière de partage de
      charge conclut qu'un tel partage est « neither feasible nor desirable ».
      Une application régionale a dû LAISSER LE CLIMAT DE CÔTÉ, faute de pouvoir
      le gérer à cette échelle.
      OR UN BARÈME QUI QUALIFIE UN ACTE, UN ACTEUR OU UN PRODUIT EST UNE
      DESCENTE D'ÉCHELLE, ET C'EST LA PLUS RAIDE : le corpus ne descend ni au
      pays ni à la région, mais À LA TRANSACTION.
      CETTE DESCENTE EXISTE DANS LA LITTÉRATURE, ELLE EST MASSIVE, ET ELLE EST
      DÉCLARÉE NON RÉSOLUE. Les travaux couplant limites planétaires et analyse
      de cycle de vie — cosmétiques, habillement, entreprises, pêche — forment
      une part importante de toute la littérature du domaine, mais « technical
      and theoretical challenges are still large », et il est appelé plus de
      recherche « if we want to model the impact on ALLOCATION OF AND
      ENTITLEMENT TO the safe operating space ». CETTE PHRASE DÉCRIT LE
      DISPOSITIF, ET ELLE LE DÉCRIT COMME UN PROBLÈME OUVERT.
      À TRANCHER PAR L'AUTEUR : le dispositif est-il une telle descente, et si
      oui, que répond-il à ce que la littérature déclare ouvert ?
    acquisition_bloquante: >
      Les méthodes couplant limites planétaires et analyse de cycle de vie, à
      commencer par celle que Ryberg et al. discutent pour l'allocation de
      l'espace de fonctionnement sûr. À rapprocher de la consommation matérielle
      pondérée par l'impact environnemental (van der Voet, Best), inscrite par
      L18.C19 : les deux littératures visent le même objet et le corpus n'en a
      ouvert aucune.

  - id: CRITERE-L25
    objet: "Qui sélectionne, selon quel critère, par quelle autorité"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      Neuf voies indépendantes y mènent (L25.C07), et cinq mécanismes désignent
      le même perdant : celui dont la pratique n'entre pas dans la grille.
      Le corridor est chiffrable en agrégat et VIDE EN COMPOSITION.
      RÉPONSE PARTIELLE VERSÉE LE 2026-09-08 PAR L18.C18, ET ELLE PORTE SUR LA
      NATURE DU CRITÈRE, NON SUR SON CONTENU : le seuil de coût acceptable
      « is not a scientific, but an ethical and political question ». C'est une
      CONTRAINTE — elle interdit de présenter le seuil comme un résultat de
      mesure — et non une solution. Trois candidats institutionnels sont
      nommés par la source : démocratie délibérative, référendums fictifs,
      assemblées citoyennes. AUCUN N'EST INSTRUIT PAR LE CORPUS.
      ARBITRAGE BINAIRE POSÉ LE 2026-09-08 PAR L18.C21, ET IL COMMANDE LE
      CORRIDOR. La source pose deux options exclusives et n'en laisse pas de
      troisième. (1) IGNORER le coût d'opportunité : préserver la totalité,
      interdire les activités dommageables « regardless of the cost », règle de
      « constancy of total natural capital ». (2) LE BORNER : préserver sauf si
      les coûts sont « unacceptably high », coûts entendus NETS des bénéfices
      attendus. L'auteur du traité choisit la seconde, au motif qu'ignorer le
      coût revient à résoudre les arbitrages en les évitant, et il en déclare le
      prix — pas d'assurance contre la mauvaise surprise ex post.
      UN CORRIDOR QUI SE FERME QUEL QUE SOIT LE COÛT RELÈVE DE LA PREMIÈRE
      OPTION ; UN CORRIDOR QUI S'ÉLARGIT QUAND LA FERMETURE COÛTE TROP RELÈVE DE
      LA SECONDE. Ce sont deux dispositifs différents, pas deux réglages du même.
      LE CORPUS N'A JAMAIS DIT LEQUEL. C'est un arbitrage de l'auteur.
      CONTRAINTE AJOUTÉE, ET ELLE GÊNE : le seuil n'a pas même de réponse
      GÉNÉRALE, la source le déclarant « highly context-specific ». Un barème
      universel fixant un seuil unique pour toutes activités, tous territoires et
      toutes périodes contredirait cette conclusion, même en déclarant son seuil
      politique.
      LES DEUX DIFFICULTÉS QUE LA SOURCE ASSIGNE AUX TENANTS DE LA SOUTENABILITÉ
      FORTE SONT EXACTEMENT LE CONTENU DE CETTE PIÈCE : savoir QUELLES formes
      sont critiques, et COMBIEN de prélèvement avant qu'une forme le devienne.
      Le corpus n'a ni l'une ni l'autre.
      ISSUE FORMULÉE, NON ARBITRÉE : une position de droit assortie d'un seuil de
      conséquence — « avoid deliberate harm except where there are overwhelming
      beneficial outcomes which go beyond a consequential threshold » — ne
      s'oppose pas à l'analyse économique, elle la borne. QUATRIÈME PRÉSENTATION
      DE LA MÊME ISSUE, PREMIÈRE AVEC UNE FORMULATION.
      CONVERGENCE ÉTABLIE LE 2026-09-08 PAR L24.C06 : la littérature de
      gouvernance du système terrestre pose la MÊME question dans les MÊMES
      termes — « who is deciding on the precise values of boundaries that are to
      be protected ? » — et identifie l'enjeu comme un déplacement de
      responsabilité et de pouvoir politique DU DÉCIDEUR VERS L'EXPERT. Le degré
      d'aversion au risque qu'une limite incorpore ne relève pas, selon ces
      critiques, des sciences de la nature ; le terme employé est « global
      expertocracy ». DEUX LITTÉRATURES INDÉPENDANTES DISENT DONC QUE LE SEUIL
      N'EST PAS SCIENTIFIQUE. Le corpus ne peut plus présenter son barème comme
      la traduction d'un fait naturel, quelle que soit la qualité de la science
      qu'il cite.
      DÉFAUT DE LÉGITIMITÉ DOCUMENTÉ : pas un seul chercheur du Sud parmi les
      auteurs de 2009 ; la forme institutionnelle récente n'est légitimée ni par
      les Nations unies ni par les pays en développement, et son réseau de
      soutien comprend une facilité liée à la Banque mondiale et le forum
      économique mondial. À porter partout où le corpus invoque ce cadre.
      NON LU, RANG 2 : la section « Implications for Governance » de la même
      revue, la plus longue, qui porte les propositions institutionnelles.
      TROISIÈME VOIE VERSÉE LE 2026-09-08 PAR L18.C24, ET ELLE N'EXIGE PAS LA
      NON-SUBSTITUABILITÉ. L'approche Krutilla-Fisher fait CROÎTRE la valeur
      relative des biens environnementaux avec le revenu et DÉPRÉCIER celle des
      bénéfices tirés de leur destruction ; formellement le même taux est
      appliqué à tout, ce sont les valeurs qui s'apprécient ou se déprécient
      avant actualisation. Cela relie la valorisation des communs à une grandeur
      observable — l'élasticité-revenu de la demande d'aménités — plutôt qu'à une
      convention. SON PRIX : elle suppose encore une substituabilité, seulement
      décroissante.
      ET L'ÉTAT DU CHAMP EST CHIFFRÉ LE 2026-09-09 PAR L18.C25 : sur quatre
      décennies de littérature de valorisation, LA JUSTICE A ÉTÉ CONSIDÉRÉE DANS
      4 % DES CAS et la manière dont l'asymétrie de POUVOIR est prise en compte
      n'est documentée que dans 1 %. Le corpus ne trouvera donc pas dans cette
      littérature la réponse qu'il cherche : elle n'y a presque pas été
      cherchée. Ce n'est pas un défaut du corpus, c'est l'état du champ, ET IL
      FAUT LE DÉCLARER.
      LE CHAPITRE 4 EST OUVERT LE 2026-09-09 DANS SON RÉSUMÉ EXÉCUTIF (L18.C26),
      ET IL DONNE UNE DIRECTION ET UN PIÈGE. LA DIRECTION : les processus
      participatifs conduisent plus probablement à des résultats plus soutenables
      et plus justes, et dans les aires protégées l'implication communautaire
      profonde s'accompagne de réduction de la pauvreté, de hausse du couvert
      forestier, d'amélioration des stocks halieutiques et de plus grande
      biodiversité — le gain est donc mesuré sur des résultats ÉCOLOGIQUES, non
      seulement sur l'acceptabilité. LE PIÈGE : accroître ce qui a l'apparence
      d'une participation par une implication superficielle ou coercitive « is not
      sufficient and may even be detrimental ». Un dispositif qui organiserait une
      consultation sans pouvoir de décision tomberait dedans.
      CONTRAINTE AJOUTÉE, ET ELLE EST DE COÛT : le coût des mécanismes de
      certification et de transparence pèse particulièrement sur les PETITS
      producteurs, et une conception internationale non adaptée localement peut
      exclure des pratiques de gestion et accroître les inégalités. UN DISPOSITIF
      DONT LA QUALIFICATION COÛTE CHER À OBTENIR SÉLECTIONNE PAR LE COÛT DE LA
      PREUVE AVANT DE SÉLECTIONNER PAR LA PRATIQUE. Le corpus n'a jamais chiffré
      ce coût ni dit qui le porte.
      LES CANDIDATS SONT NOMMÉS LE 2026-09-09 PAR L18.C30, ET LE CORPUS LES
      IGNORAIT. Quatre instruments de droits coutumiers répondent précisément à
      la question de cette pièce : les mesures de conservation efficaces par zone
      (aires et territoires conservés par les peuples autochtones et les
      communautés, sites naturels sacrés) ; les politiques de revitalisation des
      connaissances autochtones et locales ; les codes de conduite éthique
      élaborés par ces peuples ; et le CONSENTEMENT PRÉALABLE, LIBRE ET ÉCLAIRÉ.
      Tous reposent sur des valeurs relationnelles et intrinsèques, et
      l'évaluation les juge LES PLUS CAPABLES de traiter les valeurs diverses.
      CE QUE CELA CHANGE : le corpus doit cesser de chercher son autorité de
      qualification dans le vide. Elle a des candidats nommés, développés
      ailleurs et depuis longtemps. Ces instruments déterminent QUI DÉCIDE et
      SELON QUELLE LÉGITIMITÉ ; ils ne déterminent pas COMBIEN EST VERSÉ À QUI —
      ce qui laisse au dispositif un objet propre et lui donne un point
      d'articulation.
      AVERTISSEMENT JOINT, ET IL EST DE CONCEPTION : l'intégration PAR LE HAUT de
      ces instruments avec d'autres types peut avoir des effets défavorables.
      Trois sources indépendantes disent désormais la même chose — REDD+ a
      recentralisé la gouvernance forestière (L18.C29), une participation
      superficielle peut être préjudiciable (L18.C26), et l'intégration
      descendante nuit (L18.C30). LE CORPUS DOIT ÉTABLIR CE QUI, DANS SON
      DISPOSITIF, L'EN EMPÊCHERAIT.
      LE GUIDE EST OUVERT LE 2026-09-09 (L18.C31), ET IL ÉTABLIT QUE CETTE PIÈCE
      ET F13 NE FONT QU'UNE. La troisième étape du guide rencontre
      l'incommensurabilité et NE LA RÉSOUT PAS : elle demande qu'elle soit
      RECONNUE, et que soient traités « the unequal power relations among those
      holding conflicting and incommensurable values ». LE PROBLÈME EST DÉPLACÉ
      DE LA MÉTROLOGIE VERS LA POLITIQUE, explicitement et par la source la plus
      autorisée. Si l'incommensurabilité se reconnaît au lieu de se résoudre,
      alors la pondération d'un barème est une DÉCISION, et la question devient
      qui la prend et selon quelle légitimité. LE CORPUS TENAIT CES DEUX PIÈCES
      SÉPARÉES ; ELLES N'EN FONT QU'UNE.
      CE QUE LE GUIDE DONNE : six lignes directrices transversales —
      contextualiser ; concevoir des processus tenant compte des capacités et
      perspectives ; assurer une REPRÉSENTATION ÉQUITABLE des visions du monde, y
      compris des détenteurs de DROITS et de SAVOIRS ; engager de manière
      interactive ; RECHERCHER LA LÉGITIMITÉ EN INSTILLANT UN SENTIMENT DE
      COPROPRIÉTÉ des résultats chez tous les participants ; réfléchir et
      apprendre. Et huit étapes, dont la quatrième pose textuellement « who wins
      and who loses ».
      LA CINQUIÈME LIGNE DIRECTRICE EST CELLE QUE LE DISPOSITIF AURA LE PLUS DE
      MAL À SATISFAIRE : un sentiment de copropriété suppose que la
      qualification soit produite AVEC ceux qu'elle qualifie. Un barème conçu
      centralement et appliqué à des actes ne produit pas de copropriété : il
      produit un verdict.
      OÙ LE DISPOSITIF SE RANGE, ET C'EST LA PREMIÈRE FOIS QUE LE CORPUS PEUT LE
      SITUER : la sixième étape nomme comme POINTS DE LEVIER PROFONDS
      l'établissement de nouvelles institutions et les réformes fiscales
      écologiques. Le dispositif fait les deux. Et la mention de la SUBSIDIARITÉ
      dans le dosage de politiques lui donne le cadre où répondre à
      l'avertissement sur l'intégration par le haut : ce n'est pas l'échelle
      globale qui est reprochée, c'est l'absence de subsidiarité.
      ET UNE DÉCEPTION QU'IL FAUT PORTER : la septième étape, celle qui fait
      passer de l'analyse à l'agenda politique, est déclarée SANS STRUCTURE NI
      PROCESSUS CLAIRS. Le corpus ne trouvera nulle part une procédure qui
      garantisse l'adoption, et une thèse qui reposerait sur l'existence d'une
      telle procédure repose sur rien.
      CE QUE LE GUIDE NE DONNE PAS : il est un guide de VALORISATION, non de
      conception d'instrument, et il ne dit nulle part comment CALCULER UN
      MONTANT. L'écart entre une décision et un montant reste entier — c'est le
      pas que L18.C29 a nommé comme le lieu de F13.
      ACQUISITION QUI RESTE, RANG 1 ET SUR LE DISQUE : le TABLEAU 6.10, qui donne
      les actions matérialisant chaque ligne directrice. Il n'est pas extractible
      par la couche de texte et demande un autre mode d'ouverture.

  - id: PARTAGE-SOURCE-PUITS
    objet: "De quel côté de l'économie la qualification régénérative mord-elle"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      DÉCOUVERTE LE 2026-09-08 PAR L18.C18, ET ELLE COMMANDE QUI, DANS LA
      LITTÉRATURE, SE TROUVE D'ACCORD AVEC LE DISPOSITIF. Le traité de
      référence du débat ne conclut pas pour un camp : il conclut PAR CÔTÉ DE
      L'ÉCONOMIE. La substituabilité est mieux soutenue pour le capital naturel
      pris comme ENTRÉE DE PRODUCTION (côté SOURCE) ; la non-substituabilité
      est mieux soutenue pour la CAPACITÉ D'ABSORPTION DES POLLUTIONS et
      l'agrément direct (côté PUITS).
      CONSÉQUENCE POUR LE DISPOSITIF : il n'est du côté soutenu que si la
      grandeur qu'il qualifie est une grandeur de PUITS. Si elle porte sur des
      prélèvements de matières et de ressources non renouvelables, le même
      auteur écrit qu'AUCUNE politique explicite de préservation ne se
      justifie.
      LE CORPUS N'A JAMAIS TRANCHÉ CE PARTAGE. Il a construit une
      qualification régénérative sans dire de quel côté elle mord. À trancher
      avec A42 et CRITERE-L25.
      LE CHAMP EST RÉDUIT LE 2026-09-08 PAR L18.C20, ET LA BRANCHE SOURCE EST
      RÉPONDUE — CONTRE LA POSITION QUE LE DISPOSITIF SUPPOSE. « All the
      available evidence so far therefore seems to strongly support the
      substitutability assumption of WS with respect to natural capital as an
      input to the production of goods and services. » Dix-sept matières non
      énergétiques recensées : rapport ressources sur production supérieur au
      siècle pour la plupart, supérieur au millénaire pour plusieurs. Sur les
      hydrocarbures, la conclusion est retournée — le danger cité est qu'il y en
      ait « far too much [...] for the climate to tolerate », non qu'il en
      manque. Sur l'alimentation, la question est déplacée vers la répartition
      intra-générationnelle.
      CE POINT EST DÉSORMAIS LE PLUS URGENT DU CORPUS. Si la qualification mord
      du côté SOURCE, le dispositif contredit l'état des preuves que
      l'adversaire ET son examinateur tiennent pour établies. Si elle mord du
      côté PUITS, le même examinateur le soutient.
      RÉSERVE : les réserves sont une grandeur ÉCONOMIQUE, non physique, et la
      source le déclare — surdéclaration des exportateurs, et rapport réserves
      sur production supposant à tort une extraction constante jusqu'à
      épuisement. Ce qui est établi est que les réserves ont plus que suivi la
      production JUSQU'ICI. L'abondance établie est une abondance de STOCK, non
      une innocuité de PRÉLÈVEMENT : l'auteur écarte explicitement de son champ
      les dommages causés par l'extraction.

  - id: MODELE-ADVERSAIRE
    objet: "Qui gagne quoi à falsifier une qualification régénérative"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      Réclamé par L15.C01. Quatre architectures documentées (L15.C01 à C04) et
      AUCUNE n'attaque la grandeur écologique elle-même. Reste sans source :
      la capture du régulateur, seule limite de L1.C18 § 5 que le corpus n'a
      documentée d'aucune manière.
    acquisition_bloquante: >
      Une architecture documentée de CAPTURE DU RÉGULATEUR — distincte du
      conflit d'intérêts du certificateur, qui lui est tenu (L15.C04). Un
      certificateur payé par ceux qu'il note est en conflit ; un régulateur
      capturé est retourné.
      SECONDE FAMILLE DE DÉFAILLANCE OUVERTE LE 2026-09-08 PAR L18.C21, ET ELLE
      NE SUPPOSE AUCUNE FRAUDE. La préservation a pour partie le caractère d'un
      bien public mondial : les coûts sont certains, présents et réels, les
      bénéfices incertains, futurs et partiellement captés par d'autres pays.
      « Since every potential protector has the incentive to free ride, none may
      have sufficient impetus to protect. » CE SONT DES ACTEURS HONNÊTES QUI,
      CHACUN RATIONNELLEMENT, ATTENDENT QUE L'AUTRE PAIE. Le dispositif doit
      répondre à DEUX familles — la fraude (L15.C01 à C04) et le passager
      clandestin — et il n'en a instruit qu'une.
      RÉPONSE DISPONIBLE ET NON ACQUISE : un instrument qui RÉMUNÈRE la
      préservation modifie le calcul du passager clandestin, le protecteur
      captant une contrepartie. Le corpus n'a pas montré que la contrepartie
      couvre l'écart, et l'ampleur de cet écart n'est pas chiffrée.
