  - id: F13
    objet: "L'incommensurabilité — la soutenabilité faible"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      NE PAS FERMER (auteur, 2026-09-08). L'accusation de dissimulation échoue
      QUATRE fois, et la quatrième n'est pas de même nature : le traité de
      référence du débat déclare les DEUX paradigmes NON FALSIFIABLES et le
      débat indécidable même sous accord sur l'objet et la méthode (L18.C18).
      L'accusation perd son objet, ET LA MÊME DÉCLARATION FRAPPE LE CORPUS :
      la non-substituabilité qu'il suppose est aussi peu falsifiable que la
      substituabilité qu'il conteste.
      F13 SORT RENFORCÉ DE CETTE LECTURE. Le même auteur tient que la
      soutenabilité forte exige une mesure SÉPARÉE par forme critique de
      capital naturel, que ces mesures « defy aggregation », et qu'une mesure
      globale unique est trompeuse et inutile — confirmation INDÉPENDANTE de
      F13, venue de l'économie et non des sciences du système terrestre. La
      réserve « un cadre, pas un consensus » est levée pour partie. BORNE :
      l'auteur conclut d'un EXAMEN DES INDICATEURS EXISTANTS, il ne démontre
      pas une impossibilité formelle.
      Les trois autres occurrences subsistent : l'adversaire déclare
      l'hypothèse (L18.C11, L18.C14, L18.C16).
      Solow nomme la condition, la qualifie de conjecture et publie son
      alternative — en dessous de l'unité, consommation soutenable NULLE.
      Une mesure adjacente existe (L18.C17) : 0,64 à court terme, intervalle
      entièrement sous le seuil. UNE REFORMULATION EST PROPOSÉE PAR LE CORPUS
      ET N'EST PAS ARBITRÉE.
    acquisition_bloquante: >
      Estimation de l'élasticité de substitution portant sur LES RESSOURCES en
      général, spécification comparable à Solow, postérieure à 2006. SEULE
      ACQUISITION ENCORE BLOQUANTE POUR F13 AU 2026-09-08.
      NEUMAYER EST ACQUIS ET OUVERT (L18.C18), fourni par l'auteur en Open
      Access. HARTWICK 1977 et PEARCE & ATKINSON 1993 sont DÉCLARÉS
      INACCESSIBLES par l'auteur le 2026-09-08 — le premier introuvable, les
      seconds payants. Le corpus tient donc l'EXPOSÉ du camp adverse par un de
      ses analystes, NON SES TEXTES FONDATEURS : l'acquisition n'est pas levée,
      elle est contournée, et cela doit être déclaré partout.
      À OUVRIR, ET DÉJÀ SUR LE DISQUE : les chapitres 3 et 6 de Neumayer, qui
      portent respectivement l'argument de non-falsifiabilité et le refus de
      l'agrégation. Le corpus tient les conclusions sans leurs démonstrations.
