# Registre des arbitrages et des falsifieurs — état lisible par le contrôle
#
# CRÉÉ LE 2026-09-08 SUR DEMANDE DE L'AUTEUR. Motif : le contrôle annonçait
# « zéro décision en attente » alors que le corpus comptait des points arbitrés
# et des points ouverts. Cette indication était exacte et trompeuse : elle ne
# porte que sur les empreintes éditoriales, et ne voit pas les décisions
# écrites en prose.
#
# RAMENÉ À UNE PROJECTION COURTE LE 2026-09-09 SUR DEMANDE DE L'AUTEUR. Motif :
# le registre avait atteint 833 lignes et recommençait à porter les
# RAISONNEMENTS qui appartiennent aux chapitres et aux protocoles. Un registre
# qui argumente finit par diverger des textes qu'il projette.
#
# CE FICHIER EST UNE PROJECTION, comme livres.yaml l'est du plan directeur.
# LES TEXTES FONT FOI. EN CAS D'ÉCART, LE TEXTE TRANCHE ET CE REGISTRE EST
# CORRIGÉ, JAMAIS L'INVERSE.
#
# LE COMPTE FAIT FOI DANS LE RAPPORT DU CONTRÔLE, PAS DANS CET EN-TÊTE : ne
# pas recopier ici un chiffre qui se périmera au premier arbitrage.
#
# CHAMPS
#   id                     identifiant permanent, jamais réattribué
#   objet                  ce qui est en jeu, en une ligne
#   statut                 ouvert | oriente | arbitre | conditionnel
#   tranche_par            auteur | corpus | non-tranche
#   decision               ce qui est tranché ou la direction prise, en une
#                          phrase. JAMAIS le raisonnement : il est au texte.
#   texte                  le protocole qui fait foi pour ce point
#   chapitres              les chapitres du corpus où le raisonnement vit
#   maj                    date de la dernière mise à jour de cette entrée
#   lie_a                  autres entrées formant un même problème
#   acquisition_bloquante  ce qui manque, en une ou deux lignes
#
# statut : ouvert | oriente | arbitre | conditionnel
#   ouvert       — posé, aucune réponse retenue
#   oriente      — une direction est arrêtée, des termes restent à trancher
#   arbitre      — tranché par l'auteur ; la date et la teneur sont dans le texte
#   conditionnel — ne se déclenche que sous une condition qui n'est pas établie
#
# tranche_par : auteur | corpus | non-tranche
#   RÈGLE : le corpus PROPOSE, l'auteur TRANCHE. Une reformulation écrite par
#   le corpus reste `non-tranche` tant que l'auteur ne l'a pas reprise.

