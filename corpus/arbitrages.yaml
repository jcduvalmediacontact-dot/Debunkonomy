pieces_de_conception_manquantes:
  - id: RECALIBRAGE
    objet: "La règle de recalibrage du dispositif"
    statut: oriente
    tranche_par: non-tranche
    note: >
      Structurée par L11.C30 : il en faut TROIS et non une, selon le type de
      boucle — érosion d'assiette, dérive de convention, réponse à l'instrument.
      Le TYPE C ne se calibre pas à l'avance et appelle une mesure ex post.
      CINQUIÈME POINT NON TRANCHÉ, ET IL EST DE DROIT : le sort des engagements
      pris sous l'ancien calibrage. Quatre branches exclusives, dont celle que
      le FMI pratique — rien ne change sans le consentement de l'intéressé.
    acquisition_bloquante: >
      La révision des tarifs d'achat de l'électricité renouvelable en Europe et
      le sort des engagements pris sous l'ancien tarif — précédent le plus
      proche du cinquième point. ET la version PUBLIÉE de 2018 du modèle dont
      est tirée l'occurrence n° 4 : tant qu'elle n'est pas comparée, le
      décompte de six occurrences n'est pas démontré.

  - id: CRITERE-L25
    objet: "Qui sélectionne, selon quel critère, par quelle autorité"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      Neuf voies indépendantes y mènent (L25.C07), et cinq mécanismes désignent
      le même perdant : celui dont la pratique n'entre pas dans la grille.
      Le corridor est chiffrable en agrégat et VIDE EN COMPOSITION.
      RÉPONSE PARTIELLE VERSÉE LE 2026-09-08 PAR L18.C18, ET ELLE PORTE SUR LA
      NATURE DU CRITÈRE, NON SUR SON CONTENU : le seuil de coût acceptable
      « is not a scientific, but an ethical and political question ». C'est une
      CONTRAINTE — elle interdit de présenter le seuil comme un résultat de
      mesure — et non une solution. Trois candidats institutionnels sont
      nommés par la source : démocratie délibérative, référendums fictifs,
      assemblées citoyennes. AUCUN N'EST INSTRUIT PAR LE CORPUS.

  - id: PARTAGE-SOURCE-PUITS
    objet: "De quel côté de l'économie la qualification régénérative mord-elle"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      DÉCOUVERTE LE 2026-09-08 PAR L18.C18, ET ELLE COMMANDE QUI, DANS LA
      LITTÉRATURE, SE TROUVE D'ACCORD AVEC LE DISPOSITIF. Le traité de
      référence du débat ne conclut pas pour un camp : il conclut PAR CÔTÉ DE
      L'ÉCONOMIE. La substituabilité est mieux soutenue pour le capital naturel
      pris comme ENTRÉE DE PRODUCTION (côté SOURCE) ; la non-substituabilité
      est mieux soutenue pour la CAPACITÉ D'ABSORPTION DES POLLUTIONS et
      l'agrément direct (côté PUITS).
      CONSÉQUENCE POUR LE DISPOSITIF : il n'est du côté soutenu que si la
      grandeur qu'il qualifie est une grandeur de PUITS. Si elle porte sur des
      prélèvements de matières et de ressources non renouvelables, le même
      auteur écrit qu'AUCUNE politique explicite de préservation ne se
      justifie.
      LE CORPUS N'A JAMAIS TRANCHÉ CE PARTAGE. Il a construit une
      qualification régénérative sans dire de quel côté elle mord. À trancher
      avec A42 et CRITERE-L25.

  - id: MODELE-ADVERSAIRE
    objet: "Qui gagne quoi à falsifier une qualification régénérative"
    statut: ouvert
    tranche_par: non-tranche
    note: >
      Réclamé par L15.C01. Quatre architectures documentées (L15.C01 à C04) et
      AUCUNE n'attaque la grandeur écologique elle-même. Reste sans source :
      la capture du régulateur, seule limite de L1.C18 § 5 que le corpus n'a
      documentée d'aucune manière.
    acquisition_bloquante: >
      Une architecture documentée de CAPTURE DU RÉGULATEUR — distincte du
      conflit d'intérêts du certificateur, qui lui est tenu (L15.C04). Un
      certificateur payé par ceux qu'il note est en conflit ; un régulateur
      capturé est retourné.
