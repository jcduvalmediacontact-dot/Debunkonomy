      précédent des droits de tirage spéciaux. La forme reste un PARAMÈTRE du
      modèle, non une hypothèse figée.
    texte: protocoles/passe-2.md
    chapitres: [L20.C24, L20.C25, L20.C26, L13.C01]
    maj: 2026-09-09
    acquisition_bloquante: >
      L'ANNEXE J des statuts du Fonds — voies automatisées épuisées, récupération
      manuelle. ET les articles du COMPTE DE TIRAGES SPÉCIAUX en vigueur,
      devenus référence de modélisation : le texte de 1944 que le corpus tient ne
      les contient pas, ces droits n'existant pas encore.

