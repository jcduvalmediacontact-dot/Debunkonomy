# Vocabulaire contrôlé du corpus
# À déposer à la racine du corpus.
#
# Un concept employé dans l'en-tête d'un chapitre sans figurer ici bloque la
# publication. Le déblocage passe par l'écriture de l'entrée, définition
# comprise : c'est en rédigeant la définition qu'on s'aperçoit qu'on vient de
# rebaptiser un concept existant.
#
# Ce fichier sert également de glossaire publié.

- terme: polycrise
  libelle: "Polycrise"
  definition: "Coexistence de crises interdépendantes dont l'analyse du corpus
               cherche à identifier les mécanismes communs."
  premiere_occurrence: L1.C01

- terme: neutralite_monetaire
  libelle: "Neutralité de la monnaie"
  definition: "Hypothèse selon laquelle la monnaie n'affecte pas durablement
               l'organisation réelle de l'économie et facilite principalement
               les échanges."
  premiere_occurrence: L1.C01

- terme: systeme_monetaire_et_financier
  libelle: "Système monétaire et financier"
  definition: "Ensemble des institutions et règles qui organisent l'émission de
               la monnaie, l'allocation du crédit et la rémunération financière."
  premiere_occurrence: L1.C01

- terme: economie_de_lequilibre
  libelle: "Économie de l'équilibre"
  definition: "Orientation économique visant un rapport soutenable entre les
               capacités de charge de la planète et les besoins des sociétés
               humaines."
  premiere_occurrence: L1.C01

- terme: fausse_richesse
  libelle: "Fausse richesse"
  definition: "Valeur financière enregistrée dont une part de la contrepartie physique est une dégradation ou un coût transféré hors du compte de l'activité."
  premiere_occurrence: L1.C02

- terme: externalisation
  libelle: "Externalisation"
  definition: "Transfert d'un coût ou d'un dommage d'une activité vers un tiers, un territoire, une période ou la collectivité, sans qu'il soit intégralement imputé à son prix ou à son résultat."
  premiere_occurrence: L1.C02

- terme: decouplage
  libelle: "Découplage"
  definition: "Évolution dans laquelle la production économique et une pression physique ne progressent plus au même rythme ; le découplage absolu implique que la pression diminue malgré la croissance de la production."
  premiere_occurrence: L1.C03

- terme: effet_rebond
  libelle: "Effet rebond"
  definition: "Augmentation de l'usage ou de la demande qui récupère une partie du gain physique attendu d'une amélioration d'efficacité ; lorsque cette augmentation le dépasse, on parle de rebond supérieur à 100 %."
  premiere_occurrence: L1.C03

- terme: entropie
  libelle: "Entropie"
  definition: "Grandeur thermodynamique qui décrit la dispersion de l'énergie et dont la production est non négative dans les transformations réelles d'un système isolé.
               CONDITIONS D'EMPLOI, arbitrage A41 du 2026-09-08, PRÉCISÉ
               LE MÊME JOUR. Elles s'appliquent AUX SEULS EMPLOIS QUI
               SERVENT UNE CONCLUSION causale, institutionnelle ou
               normative. Un tel emploi doit préciser la grandeur
               étudiée, son unité ou son indicateur, la frontière du
               système, la méthode de mesure ou de calcul, et le
               résultat empirique susceptible de réfuter l'affirmation.
               À défaut, le terme doit être explicitement qualifié de
               MÉTAPHORE et ne peut alors soutenir aucune déduction ;
               s'il n'est ni mesuré ni déclaré métaphorique, il est
               supprimé ou remplacé par un terme autonome : flux
               matériel, dissipation, exergie, énergie utile,
               irréversibilité, dégradation, perte.
               SONT DISPENSÉS DES CINQ CONDITIONS les énoncés
               explicatifs ou de portée qui NE SOUTIENNENT AUCUNE
               DÉDUCTION — exposé d'un principe, restriction d'une
               inférence, réfutation d'un argument — ainsi que les
               mentions rapportant la position d'un tiers. Ces emplois
               restent tenus de NOMMER LA FRONTIÈRE DU SYSTÈME quand
               elle porte l'argument."
  premiere_occurrence: L1.C03

- terme: sobriete
  libelle: "Sobriété"
  definition: "Réduction délibérée des consommations matérielles et énergétiques par la transformation des usages, des besoins satisfaits et des volumes produits."
  premiere_occurrence: L1.C03

- terme: limites_planetaires
  libelle: "Limites planétaires"
  definition: "Cadre de neuf variables biophysiques, employé dans le corpus pour décrire le plafond écologique et les conditions de stabilité du système Terre."
  premiere_occurrence: L1.C04

- terme: plafond_ecologique
  libelle: "Plafond écologique"
  definition: "Borne supérieure de l'espace dans lequel une économie peut se déployer sans dégrader les conditions biophysiques dont elle dépend."
  premiere_occurrence: L1.C04

- terme: plancher_social
  libelle: "Plancher social"
  definition: "Ensemble des conditions sociales minimales que l'organisation économique doit permettre à chacun de satisfaire."
  premiere_occurrence: L1.C04

- terme: robustesse
  libelle: "Robustesse"
  definition: "Capacité d'un système à continuer de fonctionner sous perturbation grâce à des réserves, des redondances et des marges, plutôt qu'en maximisant seulement son efficacité immédiate."
  premiere_occurrence: L1.C04

- terme: monnaie_comme_registre
  libelle: "Monnaie comme registre"
  definition: "Caractérisation de la monnaie non par son support matériel mais
               par la tenue d'un registre de créances et de dettes auquel une
               collectivité se fie. Le support enregistre ; la tenue du registre
               fait monnaie."
  premiere_occurrence: L1.C05

- terme: creation_monetaire
  libelle: "Création monétaire"
  definition: "Opération par laquelle une nouvelle unité de compte est inscrite
               au registre, et ensemble des règles qui déterminent qui peut y
               procéder et en échange de quoi. Distincte de la circulation de la
               monnaie déjà émise."
  premiere_occurrence: L1.C05


- terme: monnaie_endogene
  libelle: "Monnaie endogène"
  definition: "Conception selon laquelle la monnaie est créée à l'intérieur du
               système économique, par les banques commerciales en réponse à la
               demande de crédit ; la Banque centrale en règle les conditions
               en aval sans en piloter la quantité. Par opposition à la thèse
               exogène, où l'offre de monnaie serait fixée par la Banque
               centrale."
  premiere_occurrence: L1.C07

- terme: solvabilite_anticipee
  libelle: "Solvabilité anticipée"
  definition: "Critère d'octroi du crédit bancaire : probabilité estimée que
               l'emprunteur dégage les revenus monétaires futurs nécessaires
               au service du capital et de l'intérêt. Les risques climatiques
               et environnementaux n'y entrent que comme facteurs de risque,
               non comme finalité."
  premiere_occurrence: L1.C07

- terme: reflux_monetaire
  libelle: "Reflux monétaire"
  definition: "Retrait de la monnaie de la circulation après sa création.
               Dans le régime actuel, le reflux est particulier et il détruit
               la monnaie : chaque unité est détruite par le remboursement
               individuel du crédit qui l'a créée. Le corpus lui oppose un
               reflux collectif — reflux transactionnel ou prélèvement
               pondéré sur les transactions selon l'impact des activités —
               qui permet une monnaie émise sans dette ; ce reflux retire la
               monnaie de la circulation sans la détruire : elle est retenue
               par l'institution émettrice, non annulée (arbitrage du
               2026-09-05), et le sort de ce qu'elle accumule relève de la
               formule d'affectation. Ses mécanismes sont établis au Livre 2
               (Cahier technique)."
  premiere_occurrence: L1.C08

- terme: malediction_monetaire
  libelle: "Malédiction monétaire"
  definition: "Mécanisme structurel du régime monétaire qui produit un
               résultat collectif dégradant sans intention ni faute des
               acteurs, chacun agissant rationnellement dans son cadre. Le
               corpus en distingue trois : la sélection par la solvabilité au
               point de création, l'impossibilité du découplage monétaire, le
               nœud entre dette financière et dette écologique."
  premiere_occurrence: L1.C11

- terme: bullshitnovation
  libelle: "Bullshitnovation"
  definition: "Nom public retenu par l'auteur pour une activité dénuée de sens
               réel, si ce n'est celui de générer du profit financier. Cette
               définition normative est distincte du gabarit opérationnel du
               corpus, qui ne devient applicable qu'après calibrage. Dans ce
               sous-cas conservateur, le verdict dedans exige que l'offreur
               tire un avantage économique de la non-résolution du problème par
               sa prestation, au-delà de la seule récurrence d'un besoin, et
               que cette prestation soit établie comme n'atteignant pas le
               résultat minimal attendu, ou comme aggravant le problème, à
               horizon et contrefactuel fixés. Une preuve insuffisante produit
               le verdict indéterminé ; une condition réfutée produit dehors.
               La catégorie reste distincte de la fraude, de l'échec sincère et
               d'un simple sentiment d'inutilité."
  premiere_occurrence: L1.C16

- terme: sisyphe_economique
  libelle: "Sisyphe économique"
  definition: "Nom provisoire (celui du livre), à confirmer en passe 2.
               Figure de la trajectoire que produit le régime d'émission
               actuel par la composition de ses règles : un effort renouvelé
               sans terme — croître pour tenir, courir pour rester en place,
               compromettre pour gouverner — dont chaque cycle ramène au point
               de départ, vécu par des acteurs lucides, impuissants à sortir
               seuls et qui ne sont coupables de rien. À la différence du
               mythe, la contrainte est architecturale, donc modifiable."
  premiere_occurrence: L1.C14

- terme: dette_ecologique
  libelle: "Dette écologique"
  definition: "Stock des dégradations infligées aux fonds naturels — climat,
               sols, eaux, diversité biologique — qui n'ont pas été
               compensées par une régénération équivalente et qui devront
               l'être, par restauration ou par catastrophe. Physique, non
               monétaire ; distincte de la valeur des services écosystémiques,
               qui mesure un flux."
  premiere_occurrence: L1.C13

- terme: noeud_gordien
  libelle: "Nœud gordien"
  definition: "Nom provisoire (celui du livre), à confirmer en passe 2.
               Troisième malédiction monétaire : dans le régime actuel, servir
               la dette financière exige une croissance de l'activité qui
               creuse la dette écologique, et réparer la dette écologique
               exige des dépenses que le régime ne finance que par de
               nouvelles dettes ou par les recettes de cette même activité —
               parce que les issues qui ne passent pas par l'activité (défaut,
               restructuration, érosion par l'inflation, répression
               financière) sont transitoires, coûteuses et combattues par le
               régime lui-même, et que la fiscalité écologique desserre le
               nœud sans le défaire."
  premiere_occurrence: L1.C13

- terme: jevons_monetaire
  libelle: "Jevons monétaire"
  definition: "Nom provisoire (celui du livre), à confirmer en passe 2.
               Conjonction de deux faits : la contrainte de croissance de
               l'encours porte sur le volume total de l'activité solvable,
               indifféremment à sa composition ; et le crédit orienté vers des
               activités moins dégradantes s'ajoute au crédit existant au lieu
               de le remplacer. Il en résulte que la réorientation du crédit
               produit des découplages sectoriels ou nationaux sans découplage
               mondial absolu. Ne désigne pas l'argument quantitatif « plus de
               monnaie, plus d'extraction », que les séries monétaires
               réfutent."
  premiere_occurrence: L1.C12

- terme: degeneratif
  libelle: "Dégénératif"
  definition: "Se dit d'un système qui, en fonctionnant, diminue l'état ou la
               capacité de renouvellement des fonds naturels dont il dépend.
               Contraire de régénératif, au sens défini en L1.C01."
  premiere_occurrence: L1.C11

- terme: monnaie_fondante
  libelle: "Monnaie fondante"
  definition: "Monnaie qui perd une fraction de sa valeur nominale à intervalle
               régulier si elle n'est pas dépensée, sauf paiement d'un droit de
               conservation ; proposée par Gesell pour donner à la monnaie la
               périssabilité des biens qu'elle échange et en accélérer la
               circulation. Expérimentée à Wörgl en 1932-1933."
  premiere_occurrence: L1.C08

- terme: architecture_invisible
  libelle: "Architecture invisible"
  definition: "Ensemble des règles implicites, jamais énoncées et apprises sans
               conscience de l'apprendre, par lesquelles le régime monétaire
               détermine ce qui est finançable, ce qui est nommable dans les
               comptes, à quel horizon les valeurs sont pesées et quelles
               actions comptent. Quatre règles : autorité d'octroi du crédit,
               lexique comptable, actualisation, verbes de valeur."
  premiere_occurrence: L1.C09

- terme: essentiel_insolvable
  libelle: "Essentiel insolvable"
  definition: "Catégorie analytique prospective désignant une activité qualifiée
               comme réponse à un besoin essentiel, mais dont le financement
               autonome remboursé par ses flux propres échoue à au moins une des
               quatre conditions suivantes : production d’un flux monétaire,
               captation de ce flux par celui qui finance, compatibilité avec
               l’horizon du crédit, valeur suffisante après actualisation et prise
               en compte du risque. « Insolvable » désigne cette solvabilité
               interne, non l'absence de tout crédit ou financement ; la réunion
               des quatre conditions ne garantit pas l'octroi. Le critère
               d’essentialité est provisoire et ses seuils sectoriels ne sont pas
               encore fixés."
  premiere_occurrence: L1.C06

- terme: qualification_regenerative
  libelle: "Qualification régénérative"
  definition: "Nom provisoire (celui du corpus), à confirmer en passe 2.
               Décision par laquelle une instance reconnaît qu'une activité
               satisfait les critères d'un cahier des charges définissant ce
               qu'elle entretient ou reconstitue, et lui ouvre de ce fait
               l'accès à un financement qui ne passe pas par le filtre de la
               solvabilité. Décide de l'éligibilité, non du volume émis :
               qualifier une activité ne dit pas combien de monnaie créer
               pour elle."
  premiere_occurrence: L1.C18

- terme: reflux_transactionnel
  libelle: "Reflux transactionnel"
  definition: "Prélèvement appliqué à une transaction et modulé selon
               l'empreinte écologique et sociale cumulée du bien ou de l'actif
               acquis : nul pour les activités régénératives, léger pour les
               activités neutres, lourd pour les activités dégénératives. Son
               produit ne finance aucune dépense de celui qui le perçoit :
               il reflue vers la banque centrale nationale puis vers
               l'institution émettrice. ARBITRAGE DU 2026-09-05 : ce reflux
               n'est PAS une annulation — l'institution peut accumuler des
               avoirs au-delà de ce qu'elle a émis (L11.C01 § 4). La monnaie
               quitte donc la circulation sans être détruite.
               À ne pas confondre avec la monnaie fondante de Gesell, qui
               frappe la détention et non l'échange : une taxe sur l'échange
               freine l'échange, une taxe sur la détention l'accélère. Le
               corpus emploie « fonte transactionnelle » pour la première et
               « demurrage » pour la seconde."
  premiere_occurrence: L1.C21

- terme: demurrage
  libelle: "Demurrage"
  definition: "Prélèvement périodique sur les encaisses monétaires inactives,
               au-delà d'un seuil d'exemption indexé, destiné à décourager la
               thésaurisation stérile et à accélérer la circulation. Mise en
               œuvre contemporaine de la monnaie fondante de Gesell, dont il
               reprend le principe et le nom — emprunté au droit maritime, où
               le demurrage désigne l'indemnité due pour l'immobilisation d'un
               navire à quai. Instrument distinct et de sens opposé à la
               reflux transactionnel."
  premiere_occurrence: L1.C21

- terme: communs
  libelle: "Communs"
  definition: "Ressources et services dont l'entretien conditionne la
               continuation de la vie sociale et biophysique, et dont le
               régime n'est ni l'appropriation exclusive ni l'absence de
               règle. Le corpus distingue trois catégories que l'usage
               courant réunit sous un même mot : les biens de consommation
               collective, non rivaux et non exclusifs ; les ressources
               communes, rivales mais difficilement exclusives ; et les
               services rivaux et exclusifs tenus pour essentiels, dont
               l'accès est soustrait à la capacité de payer par décision et
               non par impossibilité technique. Chacune appelle un remède
               distinct, et les confondre masque cette distinction."
  premiere_occurrence: L1.C22

- terme: additionnalite
  libelle: "Additionnalité"
  definition: "Part d'un effet qui n'aurait pas eu lieu sans le financement
               examiné. Le corpus tient séparées deux acceptions que la
               discussion confond : l'additionnalité contrefactuelle, qui
               compare un état constaté à un futur alternatif inobservable —
               écartée au niveau du paiement en L1.C18 § 5, sur l'écart entre
               le scénario de référence déclaré et le contrefactuel observé,
               le mot « invérifiable » étant celui du livre et non celui de la
               pièce — et l'additionnalité budgétaire, qui compare un
               financement nouveau aux moyens que son bénéficiaire consacrait
               déjà au même objet, et qui est mesurable. L'additionnalité en
               RESSOURCES RÉELLES demeure exigée au niveau de l'instrument
               (L1.C31)."
  premiere_occurrence: L1.C22

- terme: resilience
  libelle: "Résilience"
  definition: "Capacité d'un système à absorber une perturbation et à se
               réorganiser en conservant ses fonctions, sa structure et son
               identité — sans qu'un retour à l'état antérieur soit impliqué.
               À distinguer de la stabilité, qui désigne la vitesse de retour
               à un état d'équilibre : les deux propriétés peuvent être
               inversement corrélées, un système optimisé pour un état donné
               revenant vite à cet état tout en étant fragile devant une
               perturbation non prévue. La robustesse ajoute à la résilience
               l'absorption de perturbations non anticipées."
  premiere_occurrence: L1.C23

- terme: devise_cle
  libelle: "Devise clé"
  definition: "Monnaie nationale qui assure la fonction de liquidité dans le
               commerce et le financement internationaux — libellé des
               contrats, règlement des soldes, composition des réserves de
               change. Ses déterminants documentés sont la taille et la
               croissance de l'économie émettrice, la stabilité du souverain,
               et la profondeur des marchés de capitaux qui en assurent la
               liquidité. Une unité qui permet de libeller un prix sans
               permettre d'éteindre une dette n'en est pas une : la capacité
               de règlement est le critère qui sépare un référentiel de
               comparaison d'une devise clé."
  premiere_occurrence: L1.C24

- terme: hierarchie_monetaire
  libelle: "Hiérarchie monétaire"
  definition: "Ordonnancement des instruments monétaires selon leur capacité
               à éteindre définitivement une obligation, des moyens de
               paiement les plus dérivés vers l'actif de règlement ultime.
               Cette hiérarchie existe à l'intérieur d'un espace monétaire et
               entre espaces monétaires, et les deux ne se recouvrent pas :
               la monnaie publique occupe le sommet du premier, tandis que le
               sommet du second reste occupé par de la monnaie de banque
               privée. Le corpus emploie ce terme pour décrire une structure
               constatée, non pour la justifier."
  premiere_occurrence: L1.C24

- terme: etalon_de_change_or
  libelle: "Étalon de change-or"
  definition: "Régime monétaire international dans lequel une seule
               monnaie nationale est convertible en or, les autres étant
               convertibles en cette monnaie et non dans le métal. Il se
               distingue de l'étalon-or, où chaque monnaie est définie par
               un poids de métal et directement convertible. Le corpus
               retient la distinction parce qu'elle commande la position de
               l'émetteur pivot, qui est le seul à devoir régler en or et le
               seul à pouvoir mettre fin à cette obligation."
  premiere_occurrence: L1.C25

- terme: fenetre_de_reforme
  libelle: "Fenêtre de réforme"
  definition: "Moment où les règles d'un régime monétaire peuvent être
               réécrites parce que le régime existant a manifestement cessé
               de fonctionner. Le corpus emploie ce terme de façon
               descriptive et non programmatique : l'ouverture d'une telle
               fenêtre ne détermine pas son issue, laquelle dépend de la
               position des créanciers au moment où elle s'ouvre plutôt que
               de la qualité des projets disponibles."
  premiere_occurrence: L1.C25

- terme: regle_contre_discretion
  libelle: "Règle contre discrétion"
  definition: "Opposition entre deux modes de fixation des paramètres d'un
               dispositif : une formule annoncée d'avance, qui s'applique
               sans délibération, ou une décision périodique prise au vu de
               l'état observé. Le corpus emploie ce couple pour le pilotage
               des taux de reflux, où les deux formes n'ont pas la même
               exposition aux délais de réaction et aux comportements
               d'anticipation. L'opposition ne porte pas sur la qualité de
               l'estimation mais sur la forme de la décision."
  premiere_occurrence: L1.C21

- terme: referentiel_de_change
  libelle: "Référentiel de change"
  definition: "Unité de compte qui sert de pivot de conversion entre monnaies
               nationales sans être elle-même détenue, échangée ni acceptée en
               règlement. Elle se distingue d'une monnaie internationale, qui
               éteint des dettes, et d'un panier de devises, dont la valeur
               dérive de ses composantes. Le corpus emploie ce terme pour
               décrire une fonction, sans préjuger de ce qui fixe les taux
               reliés au pivot ni de la procédure qui les révise."
  premiere_occurrence: L1.C26

- terme: seuil_d_activation
  libelle: "Seuil d'activation"
  definition: "Taille minimale en deçà de laquelle un dispositif d'adhésion
               volontaire ne produit pas les effets qui rendent l'adhésion
               avantageuse. Le corpus emploie ce terme pour un dispositif de
               club dont les leviers — accès réservé à un bien, exclusion
               d'une infrastructure, prélèvement aux frontières — ne mordent
               qu'au-delà d'une part de marché suffisante. Le seuil porte sur
               un poids économique, donc sur la composition de la coalition
               et non seulement sur le nombre de ses membres."
  premiere_occurrence: L1.C27

- terme: indicateur_de_progres
  libelle: "Indicateur de progrès"
  definition: "Grandeur destinée à rendre compte de l'état d'une société
               autrement que par le volume de sa production. Le corpus
               distingue trois formes qui n'ont ni la même nature ni la même
               fonction : la boussole normative, qui indique où se tenir sans
               mesurer ; l'indice composite, qui agrège et permet de classer
               au prix de pondérations explicitement normatives ; et le
               tableau de bord, qui juxtapose des familles d'indicateurs sans
               les agréger, et qui ne tranche donc pas lorsqu'elles divergent."
  premiere_occurrence: L1.C28

- terme: contrepartie_comptable
  libelle: "Contrepartie comptable"
  definition: "Actif inscrit face à une émission monétaire portée au passif,
               que la tenue en partie double impose de nommer. Dans le régime
               de crédit, cette contrepartie est une créance sur un débiteur
               identifié. Le corpus emploie ce terme pour la question, restée
               ouverte, de ce qui figure à l'actif lorsque l'émission ne crée
               aucune dette. CORRIGÉ LE 2026-09-07, APRÈS OUVERTURE DU CADRE
               CONCEPTUEL IPSASB (édition 2023) : la définition antérieure —
               « un actif doit être une ressource contrôlée par l'émetteur dont
               des avantages futurs sont attendus POUR LUI, condition qu'une
               prestation déjà rendue à un tiers ne remplit pas » — APPLIQUAIT
               LE TEST DU SECTEUR PRIVÉ À UNE ENTITÉ PUBLIQUE, et le référentiel
               public le rejette expressément. § 5.6 : « An asset is a resource
               presently controlled by the entity as a result of past events » ;
               § 5.6A : « A resource is a right to either SERVICE POTENTIAL or
               the capability to generate economic benefits, or a right to
               both » ; § 5.8 : « Service potential [...] enables an entity to
               achieve its objectives WITHOUT NECESSARILY GENERATING NET CASH
               INFLOWS ». Le test applicable comporte donc DEUX conditions et
               non celle qu'employait le corpus : un DROIT, et un CONTRÔLE
               PRÉSENT résultant d'événements passés. La production
               d'avantages économiques pour l'entité n'en est pas une."
  premiere_occurrence: L1.C29

- terme: reflux_collectif
  libelle: "Reflux collectif"
  definition: "Genre auquel appartiennent les deux instruments par lesquels
               le dispositif retire de la monnaie de la circulation : les
               dispositifs de reflux transactionnels, qui frappent l'échange,
               et le demurrage, qui frappe la détention. Il s'oppose au
               reflux PARTICULIER du régime de crédit, où la monnaie
               s'éteint par le remboursement d'un débiteur identifié. La
               distinction est celle de la promesse P3 : ici le retrait ne
               dépend d'aucun débiteur nommé mais de l'ensemble des agents
               dont les transactions restent dégradantes."
  premiere_occurrence: L1.C08

- terme: bareme
  libelle: "Barème"
  definition: "Table de taux ou de pondérations arrêtée par décision et non par
               un marché, qui affecte à chaque objet une valeur numérique
               servant à calculer un prélèvement, une qualification, une parité
               ou une valorisation. Le dispositif en emploie cinq, que
               l'arbitrage A8 traite comme un chantier unique : qualification
               des activités, taux de reflux, parités du référentiel de change,
               valorisation des communs certifiés, pondération du tableau de
               bord. Le Cahier Technique ne prononce jamais ce mot."
  premiere_occurrence: L1.C18

- terme: affectation_des_instruments
  libelle: "Affectation des instruments"
  definition: "Principe de politique économique selon lequel le nombre
               d'objectifs indépendants poursuivis ne peut excéder le nombre
               d'instruments indépendants disponibles, et selon lequel chaque
               instrument doit être affecté à l'objectif sur lequel il agit le
               plus directement. Deux objectifs qui varient toujours ensemble
               n'en font qu'un ; deux instruments aux effets proportionnels non
               plus. En sous-nombre, la politique n'atteint pas tous ses
               objectifs, et le sacrifice se fait — écrit ou non."
  premiere_occurrence: L11.C03

- terme: effet_veblen
  libelle: "Effet Veblen"
  definition: "Comportement de demande dans lequel un prix élevé n'est pas un
               obstacle à l'achat mais l'attribut recherché, parce qu'il porte
               un signal de position sociale. Le corpus l'emploie comme
               objection au barème différencié : sur les biens concernés, le
               signe de l'effet d'un renchérissement n'est pas établi, et ces
               biens sont vraisemblablement ceux dont l'empreinte par unité de
               dépense est la plus élevée."
  premiere_occurrence: L11.C03

- terme: valorisation_des_communs
  libelle: "Valorisation des communs"
  definition: "Décision qui fixe combien un acte régénératif certifié vaut en
               allocations émises. Distincte de la qualification, qui décide de
               l'éligibilité sans dire combien de monnaie créer. Le corpus la
               tient pour la décision D2 au sens de L11.C11, domicile de la
               promesse bloquante P52, et établit qu'elle se décompose en deux
               grandeurs de statut opposé : le NIVEAU, contraint par la
               condition de bouclage et donc décidé par personne, et la
               STRUCTURE — la valeur relative des actes entre eux —, qui est
               l'objet du barème et, à enveloppe plafonnée, un partage."
  premiere_occurrence: L11.C16

- terme: polycentricite
  libelle: "Polycentricité"
  definition: "Organisation dans laquelle une décision collective est prise
               simultanément à plusieurs échelles emboîtées plutôt que par une
               unité unique. Le corpus l'emploie comme la seule réponse
               constituée à l'objection de la connaissance dispersée, et retient
               d'Ostrom deux arguments indépendants : une politique adoptée à la
               seule échelle mondiale engendre difficilement la confiance
               nécessaire à l'action collective, et recommander une unité
               gouvernementale unique pour résoudre un problème d'action
               collective mondiale est intrinsèquement faible en raison même des
               comportements de passager clandestin. L11.C16 établit qu'elle
               s'applique au constat et non à la fixation des valeurs, où le
               résultat de Mundell l'interdit."
  premiere_occurrence: L11.C16

- terme: monnaie_regenerative_contrepartie_collective
  libelle: "Monnaie régénérative à contrepartie collective"
  definition: "Monnaie émise pour financer ou rémunérer une prestation
               régénérative, inscrite au passif de l'émetteur, dont la
               contrepartie et le reflux sont organisés collectivement plutôt que
               par une créance individualisée contre son bénéficiaire.
               NOM CANONIQUE ARRÊTÉ PAR L'AUTEUR LE 2026-09-20. Il désigne
               l'UNITÉ ; l'acte de l'émettre se nomme
               `emission_contrepartie_collective`. Le corpus ne les confond pas.
               Ce nom remplace « monnaie sans dette » et « argent sans dette »,
               qui ne s'emploient plus en voix propre. TROIS PLANS À NE PAS
               CONFONDRE, et c'est ce que l'ancien nom écrasait : l'unité EST au
               passif de l'émetteur ; elle ne fait naître AUCUNE créance
               bilatérale individualisée contre son bénéficiaire ; sa
               contrepartie et son reflux sont COLLECTIFS. Une formule absolue du
               type « aucune dette » est fausse sur le premier plan et vraie sur
               le deuxième. RÉSERVE CONSERVÉE : les écritures précises et la
               répartition institutionnelle du prélèvement restent à spécifier
               avant déploiement — ce n'est pas un blocage conceptuel."
  premiere_occurrence: L1.C20

- terme: emission_contrepartie_collective
  libelle: "Émission à contrepartie collective"
  definition: "Acte par lequel une monnaie régénérative à contrepartie
               collective est émise : création monétaire au bénéfice d'une
               activité qualifiée, sans créance bilatérale contre le
               bénéficiaire, dont l'extinction est organisée par un reflux
               collectif et non par un remboursement individuel.
               FORME COURTE ARRÊTÉE PAR L'AUTEUR LE 2026-09-20, en remplacement
               d'« émission sans dette » et de « création monétaire sans dette ».
               ELLE N'EST ATTESTÉE DANS AUCUNE SOURCE, et c'est assumé : c'est le
               vocabulaire canonique du corpus, non une reprise. Distinguer de
               l'unité, `monnaie_regenerative_contrepartie_collective` : l'une
               est l'acte, l'autre est ce qui est émis."
  premiere_occurrence: L1.C20
